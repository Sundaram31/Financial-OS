<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insurance Tracker — Financial OS</title>
<style>
  :root{
    --bg:#0B0E11; --panel:#12161B; --panel-2:#171C22; --line:#242A31;
    --text:#E8E6E0; --muted:#9BA0A8; --gold:#C9A227; --gold-dim:#8f7419;
    --green:#4A9B6E; --rust:#B5533C;
    --mono: 'IBM Plex Mono', 'Courier New', monospace;
    --serif: 'Source Serif 4', Georgia, serif;
  }
  body[data-theme="light"]{
    --bg:#F7F5F0; --panel:#FFFFFF; --panel-2:#F1EEE7; --line:#DCD7CC;
    --text:#242220; --muted:#6B6660; --gold:#96741A; --gold-dim:#7a5f15;
    --green:#2F7A50; --rust:#9B3F2A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:var(--mono); font-size:15.5px; line-height:1.6; min-height:100vh; }
  a{color:var(--gold);}
  .app{ display:flex; min-height:100vh; flex-direction:column; }
  header.topbar{ display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; gap:10px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .seal{ width:28px; height:28px; border:1.5px solid var(--gold); border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-size:13px; color:var(--gold); font-weight:600; }
  .brand h1{ font-family:var(--serif); font-size:17px; font-weight:600; }
  .brand .sub{ font-size:11px; color:var(--muted); }
  .topbar-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  main.content{ flex:1; overflow-y:auto; padding:26px 32px; max-width:900px; margin:0 auto; width:100%; }
  .panel-header{ margin-bottom:22px; }
  .panel-header .eyebrow{ font-size:11px; color:var(--gold); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:4px;}
  .panel-header h2{ font-family:var(--serif); font-size:24px; font-weight:600; }
  .panel-header p.desc{ color:var(--muted); font-size:14px; margin-top:6px; max-width:640px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:18px 20px; margin-bottom:16px; }
  .card h3{ font-family:var(--serif); font-size:16px; margin-bottom:12px; }
  .field-row{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
  .field{ flex:1; min-width:160px; }
  .field label{ display:block; font-size:11px; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.6px;}
  .field input, .field select, textarea{ width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:8px 10px; border-radius:4px; font-family:var(--mono); font-size:14px; }
  .field input:focus, textarea:focus{ outline:none; border-color:var(--gold-dim); }
  .btn{ background:transparent; border:1px solid var(--gold-dim); color:var(--gold); padding:8px 16px; border-radius:4px; font-family:var(--mono); font-size:12px; cursor:pointer; }
  .btn:hover{ background:rgba(201,162,39,0.08); border-color:var(--gold); }
  .btn.primary{ background:var(--gold); color:#141414; font-weight:600; border-color:var(--gold); }
  .btn.primary:hover{ background:#dab63a; }
  .btn.ghost{ border-color:var(--line); color:var(--muted); }
  .btn.small{ padding:5px 10px; font-size:11px; }
  table.day-table{ width:100%; border-collapse:collapse; margin-top:8px; font-size:13.5px; }
  table.day-table th{ text-align:left; color:var(--muted); font-weight:500; font-size:11.5px; text-transform:uppercase; padding:6px 8px; border-bottom:1px solid var(--line); }
  table.day-table td{ padding:7px 8px; border-bottom:1px solid var(--line); }
  table.day-table tr:last-child td{ border-bottom:none; }
  .result-box{ border:1px solid var(--gold-dim); border-radius:6px; padding:18px 20px; background:linear-gradient(180deg, rgba(201,162,39,0.05), transparent); margin-top:12px; }
  .result-box .verdict{ font-family:var(--serif); font-size:19px; color:var(--gold); margin-bottom:4px; }
  .result-box .verdict-detail{ font-size:13px; color:var(--muted); }
  .helptext{ font-size:12.5px; color:var(--muted); margin-top:4px; }
  .tag{ display:inline-block; font-size:10px; padding:2px 8px; border-radius:10px; text-transform:uppercase; font-weight:600; margin-left:8px; }
  .tag.green{ background:rgba(74,155,110,0.15); color:var(--green); }
  .tag.rust{ background:rgba(181,83,60,0.15); color:var(--rust); }
  .tag.gold{ background:rgba(201,162,39,0.15); color:var(--gold); }
  .policy-card{ border-left:3px solid var(--line); }
  .policy-card.flagged{ border-left:3px solid var(--rust); }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  @media (max-width:760px){ main.content{ padding:18px; } }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="seal">🛡</div>
      <div>
        <h1>Insurance Tracker</h1>
        <div class="sub">Financial OS · coverage adequacy, not just a policy list</div>
      </div>
    </div>
    <div class="topbar-actions">
      <a class="btn small ghost" href="../">← Financial OS</a>
      <button class="btn small ghost" id="themeToggleBtn">☀ Light mode</button>
      <button class="btn small ghost" id="exportBtn">Export</button>
      <button class="btn small ghost" id="importBtn">Import</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </div>
  </header>
  <main class="content" id="content"></main>
</div>

<script>
const STORAGE_KEY = 'insurance_data_v1';
function loadData(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : {policies:[], annualIncome:'', dependents:'', existingLoans:''}; }
  catch(e){ return {policies:[], annualIncome:'', dependents:'', existingLoans:''}; }
}
let data = loadData();
function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function newId(){ return 'ins_' + Date.now() + '_' + Math.floor(Math.random()*1000); }

// Mis-selling / mismatch checks -- the actual point of this module, not just a list.
// Each check is a plain-language rule, not a black-box score, so the reasoning is visible.
function evaluatePolicy(p, ctx){
  const flags = [];
  const type = p.type;
  if(type === 'ULIP' || type === 'Endowment'){
    flags.push({level:'gold', text:'Investment-linked insurance (ULIP/Endowment) bundles insurance and investment together — both usually done worse than buying them separately (a cheap term plan + a low-cost index fund). Worth checking the actual returns you\'re getting against a plain equity fund over the same period before assuming this was a good product.'});
  }
  if(type === 'Term Life'){
    const income = +ctx.annualIncome || 0;
    const cover = +p.coverAmount || 0;
    if(income>0 && cover>0 && cover < income*10){
      flags.push({level:'rust', text:`Cover (₹${cover.toLocaleString('en-IN')}) is less than 10x annual income (₹${income.toLocaleString('en-IN')}) — the usual rule-of-thumb floor for a primary earner with dependents. Worth reviewing whether this was sized to your actual needs or to a round-number premium the agent found convenient.`});
    }
  }
  if(p.hasRiders === 'unsure'){
    flags.push({level:'gold', text:'Not sure what riders are attached — riders quietly add cost and sometimes duplicate cover you already have elsewhere (e.g. accidental death rider when you already have adequate term cover). Worth pulling the actual policy document to check.'});
  }
  if(p.commissionAware === 'no'){
    flags.push({level:'gold', text:'Not sure how the agent/advisor was compensated on this — commission-driven products (especially ULIPs/endowment) often correlate with recommendations that suit the seller\'s incentive more than your needs. Doesn\'t mean this policy is wrong, just worth knowing.'});
  }
  return flags;
}

function parsePastedRows(text){
  return text.split('\n').map(l=>l.trim()).filter(l=>l.length>0)
    .map(line=>{ const sep = line.includes('\t') ? '\t' : ','; return line.split(sep).map(c=>c.trim()); });
}
function wireFileUpload(fileInputEl, textareaEl, parseBtnEl){
  fileInputEl.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{ textareaEl.value = ev.target.result; parseBtnEl.click(); fileInputEl.value=''; };
    reader.readAsText(file);
  };
}

function render(){
  const content = document.getElementById('content');
  content.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'panel-header';
  header.innerHTML = `
    <div class="eyebrow">Financial OS · checks coverage adequacy and common mis-selling patterns, not just a policy list</div>
    <h2>Insurance Tracker</h2>
    <p class="desc">Every policy gets checked against the patterns that most commonly cost people money: cover sized wrong, ULIPs sold as investments, riders nobody explained, commission-driven recommendations.</p>
  `;
  content.appendChild(header);

  const ctxCard = document.createElement('div');
  ctxCard.className = 'card';
  ctxCard.innerHTML = `
    <h3>Context — needed to judge if cover is adequate</h3>
    <div class="field-row">
      <div class="field"><label>Annual income (₹)</label><input id="ctx_income" type="number" value="${data.annualIncome}"></div>
      <div class="field"><label>Dependents (count)</label><input id="ctx_dep" type="number" value="${data.dependents}"></div>
      <div class="field"><label>Outstanding loans (₹, total)</label><input id="ctx_loans" type="number" value="${data.existingLoans}"></div>
    </div>
  `;
  content.appendChild(ctxCard);
  ['ctx_income','ctx_dep','ctx_loans'].forEach(id=>{
    ctxCard.querySelector('#'+id).onchange = (e)=>{
      const map = {ctx_income:'annualIncome', ctx_dep:'dependents', ctx_loans:'existingLoans'};
      data[map[id]] = e.target.value; saveData(); render();
    };
  });

  const addCard = document.createElement('div');
  addCard.className = 'card';
  addCard.innerHTML = `<button class="btn primary" id="add_policy_btn">+ Add a policy</button>`;
  content.appendChild(addCard);
  addCard.querySelector('#add_policy_btn').onclick = ()=>{
    data.policies.push({id:newId(), type:'Term Life', insurer:'', premium:'', coverAmount:'', hasRiders:'unsure', commissionAware:'no', notes:''});
    saveData(); render();
  };

  if(data.policies.length===0){
    const empty = document.createElement('div');
    empty.className = 'card';
    empty.innerHTML = `<div class="helptext">No policies added yet.</div>`;
    content.appendChild(empty);
  }

  data.policies.forEach((p)=>{
    const flags = evaluatePolicy(p, data);
    const card = document.createElement('div');
    card.className = 'card policy-card' + (flags.some(f=>f.level==='rust')?' flagged':'');
    card.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
        <h3>${p.insurer || 'Unnamed insurer'} — ${p.type}${flags.length>0 ? `<span class="tag ${flags.some(f=>f.level==='rust')?'rust':'gold'}">${flags.length} flag${flags.length>1?'s':''}</span>` : `<span class="tag green">No flags</span>`}</h3>
        <button class="btn small ghost" data-del="${p.id}">✕</button>
      </div>
      <div class="field-row">
        <div class="field"><label>Type</label>
          <select data-f="type" data-id="${p.id}">
            ${['Term Life','ULIP','Endowment','Health','Critical Illness','Vehicle','Home','Other'].map(t=>`<option value="${t}" ${p.type===t?'selected':''}>${t}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Insurer</label><input data-f="insurer" data-id="${p.id}" value="${p.insurer}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Annual premium (₹)</label><input data-f="premium" data-id="${p.id}" type="number" value="${p.premium}"></div>
        <div class="field"><label>Cover / sum assured (₹)</label><input data-f="coverAmount" data-id="${p.id}" type="number" value="${p.coverAmount}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Know what riders are attached?</label>
          <select data-f="hasRiders" data-id="${p.id}">
            <option value="yes" ${p.hasRiders==='yes'?'selected':''}>Yes, checked</option>
            <option value="none" ${p.hasRiders==='none'?'selected':''}>No riders</option>
            <option value="unsure" ${p.hasRiders==='unsure'?'selected':''}>Not sure</option>
          </select>
        </div>
        <div class="field"><label>Know how the agent was paid?</label>
          <select data-f="commissionAware" data-id="${p.id}">
            <option value="yes" ${p.commissionAware==='yes'?'selected':''}>Yes</option>
            <option value="no" ${p.commissionAware==='no'?'selected':''}>No / not sure</option>
          </select>
        </div>
      </div>
      <div id="flags_${p.id}"></div>
    `;
    content.appendChild(card);

    card.querySelectorAll('[data-f]').forEach(el=>{
      el.onchange = (e)=>{
        const pol = data.policies.find(x=>x.id===e.target.dataset.id);
        pol[e.target.dataset.f] = e.target.value;
        saveData(); render();
      };
    });
    card.querySelector('[data-del]').onclick = ()=>{
      data.policies = data.policies.filter(x=>x.id!==p.id);
      saveData(); render();
    };

    const flagsEl = card.querySelector(`#flags_${p.id}`);
    if(flags.length>0){
      flagsEl.innerHTML = flags.map(f=>`<div class="result-box" style="border-color:${f.level==='rust'?'var(--rust)':'var(--gold)'}; margin-top:10px;"><div class="verdict-detail" style="color:var(--text);">${f.text}</div></div>`).join('');
    }
  });

  // Overall coverage summary
  const totalTermCover = data.policies.filter(p=>p.type==='Term Life').reduce((s,p)=>s+(+p.coverAmount||0),0);
  const income = +data.annualIncome||0;
  if(data.policies.length>0){
    const summaryCard = document.createElement('div');
    summaryCard.className = 'card';
    summaryCard.innerHTML = `
      <h3>Coverage summary</h3>
      <p class="helptext">Total term life cover: ₹${totalTermCover.toLocaleString('en-IN')}${income>0 ? ` (${(totalTermCover/income).toFixed(1)}x annual income)` : ''}</p>
      ${income>0 && totalTermCover < income*10 ? `<p class="helptext" style="color:var(--rust);">Below the usual 10x-income floor for a primary earner — worth a deliberate decision, not a default gap.</p>` : ''}
    `;
    content.appendChild(summaryCard);
  }
}

const THEME_KEY = 'itrgenie_theme';
function applyTheme(theme){
  document.body.dataset.theme = theme;
  document.getElementById('themeToggleBtn').textContent = theme==='light' ? '● Dark mode' : '☀ Light mode';
  localStorage.setItem(THEME_KEY, theme);
}
document.getElementById('themeToggleBtn').onclick = ()=>{
  const current = document.body.dataset.theme === 'light' ? 'light' : 'dark';
  applyTheme(current==='light' ? 'dark' : 'light');
};
applyTheme(localStorage.getItem(THEME_KEY) || 'dark');

document.getElementById('exportBtn').onclick = ()=>{
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `insurance-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
};
document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();
document.getElementById('importFile').onchange = (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{ data = JSON.parse(ev.target.result); saveData(); render(); }
    catch(err){ alert('Could not read that file — not valid JSON.'); }
  };
  reader.readAsText(file);
};

render();
</script>
</body>
</html>
