<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Tracker — Financial OS</title>
<style>
  :root{
    --bg:#0B0E11; --panel:#12161B; --panel-2:#171C22; --line:#242A31;
    --text:#E8E6E0; --muted:#9BA0A8; --gold:#C9A227; --gold-dim:#8f7419;
    --green:#4A9B6E; --rust:#B5533C;
    --mono: 'IBM Plex Mono', 'Courier New', monospace;
    --serif: 'Source Serif 4', Georgia, serif;
  }
  body[data-theme="light"]{
    --bg:#F7F5F0; --panel:#FFFFFF; --panel-2:#F1EEE7; --line:#DCD7CC;
    --text:#242220; --muted:#6B6660; --gold:#96741A; --gold-dim:#7a5f15;
    --green:#2F7A50; --rust:#9B3F2A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:var(--mono); font-size:15.5px; line-height:1.6; min-height:100vh; }
  a{color:var(--gold);}
  .app{ display:flex; min-height:100vh; flex-direction:column; }
  header.topbar{ display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; gap:10px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .seal{ width:28px; height:28px; border:1.5px solid var(--gold); border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-size:13px; color:var(--gold); font-weight:600; }
  .brand h1{ font-family:var(--serif); font-size:17px; font-weight:600; }
  .brand .sub{ font-size:11px; color:var(--muted); }
  .topbar-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  main.content{ flex:1; overflow-y:auto; padding:26px 32px; max-width:1000px; margin:0 auto; width:100%; }
  .panel-header{ margin-bottom:22px; }
  .panel-header .eyebrow{ font-size:11px; color:var(--gold); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:4px;}
  .panel-header h2{ font-family:var(--serif); font-size:24px; font-weight:600; }
  .panel-header p.desc{ color:var(--muted); font-size:14px; margin-top:6px; max-width:680px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:18px 20px; margin-bottom:16px; }
  .card h3{ font-family:var(--serif); font-size:16px; margin-bottom:12px; }
  .field-row{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
  .field{ flex:1; min-width:160px; }
  .field label{ display:block; font-size:11px; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.6px;}
  .field input, .field select, textarea{ width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:8px 10px; border-radius:4px; font-family:var(--mono); font-size:14px; }
  .field input:focus, textarea:focus{ outline:none; border-color:var(--gold-dim); }
  .btn{ background:transparent; border:1px solid var(--gold-dim); color:var(--gold); padding:8px 16px; border-radius:4px; font-family:var(--mono); font-size:12px; cursor:pointer; }
  .btn:hover{ background:rgba(201,162,39,0.08); border-color:var(--gold); }
  .btn.primary{ background:var(--gold); color:#141414; font-weight:600; border-color:var(--gold); }
  .btn.primary:hover{ background:#dab63a; }
  .btn.ghost{ border-color:var(--line); color:var(--muted); }
  .btn.small{ padding:5px 10px; font-size:11px; }
  .table-scroll{ overflow-x:auto; }
  table.day-table{ width:100%; border-collapse:collapse; margin-top:8px; font-size:13px; min-width:760px; }
  table.day-table th{ text-align:left; color:var(--muted); font-weight:500; font-size:11px; text-transform:uppercase; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.day-table td{ padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.day-table tr:last-child td{ border-bottom:none; }
  table.day-table input[type="number"], table.day-table input[type="date"]{ width:100px; padding:4px 6px; font-size:12.5px; }
  .sortable-th{ cursor:pointer; user-select:none; }
  .sortable-th:hover{ color:var(--gold); }
  .cell-muted{ color:var(--muted); font-size:12.5px; }
  .cell-strong{ font-weight:600; }
  .result-box{ border:1px solid var(--gold-dim); border-radius:6px; padding:18px 20px; background:linear-gradient(180deg, rgba(201,162,39,0.05), transparent); margin-top:16px; }
  .result-box .verdict{ font-family:var(--serif); font-size:22px; color:var(--gold); margin-bottom:4px; }
  .result-box .verdict-detail{ font-size:13.5px; color:var(--muted); }
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:12px; margin-bottom:14px; }
  .stat-tile{ background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:16px 18px; }
  .stat-tile.accent{ border-color:var(--gold-dim); background:linear-gradient(180deg, rgba(201,162,39,0.06), transparent); }
  .stat-tile .stat-label{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
  .stat-tile .stat-value{ font-family:var(--serif); font-size:25px; font-weight:600; }
  .helptext{ font-size:12.5px; color:var(--muted); margin-top:4px; }
  .breakdown-bar{ display:flex; height:28px; border-radius:4px; overflow:hidden; margin:12px 0; border:1px solid var(--line); }
  .breakdown-bar .seg{ display:flex; align-items:center; justify-content:center; font-size:10px; color:#141414; font-weight:600; overflow:hidden; white-space:nowrap; }
  .legend{ display:flex; flex-wrap:wrap; gap:14px; margin-top:8px; }
  .legend .item{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
  .legend .dot{ width:9px; height:9px; border-radius:2px; }
  .tag{ display:inline-block; font-size:10px; padding:2px 8px; border-radius:10px; text-transform:uppercase; font-weight:600; margin-left:6px; }
  .tag.green{ background:rgba(74,155,110,0.15); color:var(--green); }
  .tag.rust{ background:rgba(181,83,60,0.15); color:var(--rust); }
  .tag.muted{ background:rgba(154,160,168,0.15); color:var(--muted); }
  .gap-card{ border-color:var(--gold-dim); }
  .gap-card h3{ color:var(--gold); }
  .gap-card ol{ margin:8px 0 0 18px; font-size:13px; color:var(--text); }
  .gap-card li{ margin-bottom:10px; }
  .acct-chip{ display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:20px; padding:6px 12px; margin:0 8px 8px 0; font-size:12.5px; }
  .acct-chip .cur{ font-size:10px; color:var(--muted); }
  .btn.tiny{ padding:2px 7px; font-size:10px; }
  .tag.gold{ background:rgba(201,162,39,0.15); color:var(--gold); }
  .notice{ border:1px solid var(--gold-dim); background:rgba(201,162,39,0.08); border-radius:6px; padding:10px 14px; font-size:12.5px; color:var(--text); margin-bottom:12px; line-height:1.55; }
  .notice strong{ color:var(--gold); }
  .live-status{ display:block; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:3px; }
  details.collapsible{ background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:14px 20px; margin-bottom:16px; }
  details.collapsible summary{ cursor:pointer; font-family:var(--serif); font-size:16px; list-style:none; }
  details.collapsible summary::-webkit-details-marker{ display:none; }
  details.collapsible summary::before{ content:'▸ '; color:var(--gold); font-family:var(--mono); }
  details.collapsible[open] summary::before{ content:'▾ '; }
  details.collapsible .details-body{ margin-top:14px; }
  details.collapsible summary .summary-hint{ font-family:var(--mono); font-size:12px; color:var(--muted); font-weight:400; margin-left:4px; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  @media (max-width:760px){
    main.content{ padding:16px; }
    .card{ padding:14px 16px; }
    body{ font-size:16px; }
    .panel-header h2{ font-size:21px; }
    .panel-header p.desc{ font-size:14.5px; }
    .panel-header .eyebrow{ font-size:11.5px; }
    .brand h1{ font-size:16px; }
    .brand .sub{ font-size:12px; }
    .field label{ font-size:12.5px; }
    .field input, .field select, textarea{ font-size:16px; padding:9px 10px; } /* 16px also avoids iOS auto-zoom-on-focus */
    .btn{ font-size:14px; padding:10px 16px; }
    .btn.small{ font-size:13px; padding:9px 13px; }
    .btn.tiny{ font-size:12px; padding:6px 10px; }
    .helptext{ font-size:13.5px; }
    .result-box .verdict{ font-size:24px; }
    .result-box .verdict-detail{ font-size:14px; }
    .stat-tile .stat-value{ font-size:22px; }
    .stat-tile .stat-label{ font-size:11.5px; }
    .legend .item{ font-size:13px; }
    .acct-chip{ font-size:13.5px; }
    .acct-chip .cur{ font-size:11px; }
    .tag{ font-size:11px; }
    .cell-muted{ font-size:13px; }
    details.collapsible summary{ font-size:15px; }
    details.collapsible summary .summary-hint{ display:block; margin-left:0; margin-top:3px; }
    .notice{ font-size:13px; }
    .live-status{ max-width:none; white-space:normal; }
    /* Holdings-style tables become stacked label/value cards instead of a horizontally
       scrolling table on phone widths -- avoids horizontal scroll entirely rather than
       just shrinking text further. */
    .table-scroll{ overflow-x:visible; }
    table.day-table{ min-width:0; font-size:14px; }
    table.day-table thead{ display:none; }
    table.day-table, table.day-table tbody, table.day-table tr{ display:block; width:100%; }
    table.day-table tr{ border:1px solid var(--line); border-radius:6px; padding:6px 10px; margin-bottom:10px; background:var(--panel-2); }
    table.day-table tr:last-child{ margin-bottom:0; }
    table.day-table td{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); white-space:normal; text-align:right; }
    table.day-table tr td:last-child{ border-bottom:none; }
    table.day-table td[data-label]::before{ content:attr(data-label); font-size:11.5px; text-transform:uppercase; letter-spacing:0.4px; color:var(--muted); font-weight:600; text-align:left; flex-shrink:0; }
    table.day-table td[data-label=""]::before{ content:none; }
    table.day-table td[data-label=""]{ justify-content:flex-end; }
    table.day-table input[type="number"], table.day-table input[type="date"]{ width:110px; font-size:14px; }
    .cp-cell{ display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="seal">📈</div>
      <div>
        <h1>Portfolio Tracker</h1>
        <div class="sub">Financial OS · holdings, allocation, performance — 4 accounts, one view</div>
      </div>
    </div>
    <div class="topbar-actions">
      <a class="btn small ghost" href="../">← Financial OS</a>
      <a class="btn small ghost" href="../networth/">Net Worth</a>
      <button class="btn small ghost" id="themeToggleBtn">☀ Light mode</button>
      <button class="btn small ghost" id="exportBtn">Export</button>
      <button class="btn small ghost" id="importBtn">Import</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </div>
  </header>
  <main class="content" id="content"></main>
</div>

<script>
const STORAGE_KEY = 'portfolio_data_v1';
function defaultData(){
  return {
    accounts: [
      {id:'axis_direct', name:'Axis Direct', country:'IN', currency:'INR'},
      {id:'tradejini',   name:'Tradejini',    country:'IN', currency:'INR'},
      {id:'angel_one',   name:'Angel One',    country:'IN', currency:'INR'},
      {id:'vested_us',   name:'Vested (US)',  country:'US', currency:'USD'},
    ],
    holdings: [], // {id, symbol, broker(account id), assetType, qty, buyPrice, buyDate, currentPrice, asOf}
    fx: { usdInr: '', asOf: '' }, // manual USD->INR rate, entered by user -- no live feed (see Known gaps)
  };
}
function loadData(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : defaultData(); }
  catch(e){ return defaultData(); }
}
let data = loadData();
// Backfill in case an older/imported file predates a field.
if(!Array.isArray(data.accounts) || data.accounts.length===0) data.accounts = defaultData().accounts;
if(!Array.isArray(data.holdings)) data.holdings = [];
if(!data.fx) data.fx = { usdInr:'', asOf:'' };
function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function newId(prefix){ return prefix + '_' + Date.now() + '_' + Math.floor(Math.random()*1000); }

let brokerFilter = 'all';
let liveSettingsOpen = false; // persists the collapsible "Live prices" panel's open/closed state across render() rebuilds
let bulkAddOpen = false;      // same, for the collapsible bulk-add/advanced entry panel
let holdingsSort = { key: null, dir: 1 }; // click-to-sort state for the holdings table (Symbol/Qty/Value/Gain-Loss)

// Guided "Add a holding" form's transient state -- last-used broker/asset type are remembered
// (not persisted to storage) so adding several holdings in a row doesn't require re-picking the
// same broker every time; feedback text is a module-level var, not set on a stale detached DOM
// node, so it actually survives the render() rebuild that happens right after adding.
let addFormLastBroker = null;
let addFormLastType = 'Stock';
let addFormFeedbackMsg = { text: '', isError: false };
let bulkAddFeedbackMsg = ''; // same fix applied to the bulk-paste entry panel below

// ---------- shared paste/file helpers, same pattern as every other module ----------
function parsePastedRows(text){
  return text.split('\n').map(l=>l.trim()).filter(l=>l.length>0)
    .map(line=>{ const sep = line.includes('\t') ? '\t' : ','; return line.split(sep).map(c=>c.trim()); });
}
function wireFileUpload(fileInputEl, textareaEl, parseBtnEl){
  fileInputEl.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{ textareaEl.value = ev.target.result; parseBtnEl.click(); fileInputEl.value=''; };
    reader.readAsText(file);
  };
}

// ---------- account resolution ----------
// Matches pasted broker text against the 4 known accounts (and any custom ones already
// added); if nothing matches, auto-creates a new account rather than silently dropping the
// row -- real data over guesses, but doesn't force the user to pre-register every account name.
function resolveBrokerId(text){
  const t = (text||'').trim().toLowerCase();
  if(!t) return null;
  const aliases = {
    axis_direct: ['axis direct','axisdirect','axis'],
    tradejini:   ['tradejini','trade jini'],
    angel_one:   ['angel one','angelone','angel'],
    vested_us:   ['vested-us','vested us','vestedus','vested'],
  };
  for(const [id, names] of Object.entries(aliases)){
    if(names.includes(t)) return id;
  }
  const exact = data.accounts.find(a=>a.id.toLowerCase()===t || a.name.toLowerCase()===t);
  if(exact) return exact.id;
  const isUSD = /usd|\$|us[- ]?listed/i.test(text);
  const id = newId('acct');
  data.accounts.push({id, name: text.trim(), country: isUSD?'US':'IN', currency: isUSD?'USD':'INR'});
  return id;
}
function accountOf(brokerId){
  return data.accounts.find(a=>a.id===brokerId) || {id:brokerId, name:brokerId, country:'IN', currency:'INR'};
}

// ---------- money formatting ----------
function formatMoney(amount, currency){
  if(amount===null || amount===undefined || isNaN(amount)) return '—';
  const symbol = currency==='USD' ? '$' : '₹';
  const locale = currency==='USD' ? 'en-US' : 'en-IN';
  return symbol + amount.toLocaleString(locale, {maximumFractionDigits:2});
}
// Manual FX conversion only -- see Known gaps card. Returns null (not 0) when a USD
// amount can't be converted, so callers can distinguish "zero" from "unknown".
function toINR(amount, currency){
  if(currency==='INR') return amount;
  const rate = parseFloat(data.fx.usdInr);
  if(!rate || rate<=0) return null;
  return amount*rate;
}

// ---------- live prices (Tier 1: Yahoo · Tier 1b: Stooq · Tier 2: Twelve Data, optional key) ----------
// Twelve Data key is stored in its OWN localStorage key, deliberately separate from
// portfolio_data_v1 -- so it never gets bundled into the Export JSON backup file and
// accidentally shared. Never hardcoded, never committed.
const LIVE_KEY_STORAGE = 'portfolio_livekey_v1';
function getTwelveDataKey(){ try{ return (localStorage.getItem(LIVE_KEY_STORAGE) || '').trim(); }catch(e){ return ''; } }
function setTwelveDataKey(k){ try{ if(k) localStorage.setItem(LIVE_KEY_STORAGE, k); else localStorage.removeItem(LIVE_KEY_STORAGE); }catch(e){} }

// Transient, in-memory only (not saved to storage or exported) -- per-holding result of the
// last live-fetch attempt, so the table can show "live ✓" / a clear failure message without
// polluting the persisted data model.
let liveStatusById = {};

function delay(ms){ return new Promise(res=>setTimeout(res, ms)); }

// Live refresh is scoped to holdings whose AssetType is a tradeable ticker -- individual
// stocks/equities and ETFs. "Equity" is treated as a synonym for "Stock" because that's this
// module's own default/example AssetType for individual stock holdings (see the Holdings entry
// card's paste format) -- restricting the match to the literal word "Stock" would have left the
// module's own example data unrefreshable. Mutual Fund and everything else stays manual-only,
// visibly marked "manual only (<type>)" in the table rather than silently no-op'd -- fund NAVs
// need AMFI scheme codes, not ticker quotes, and guessing at that mapping would be exactly the
// kind of unverified claim this project's conventions warn against.
function isRefreshable(h){
  const t = (h.assetType || '').trim().toLowerCase();
  return t === 'stock' || t === 'equity' || t === 'etf';
}

// Yahoo needs an exchange suffix for NSE-listed symbols (RELIANCE -> RELIANCE.NS); Vested-US
// (or any USD account) uses the plain ticker. If the symbol already looks like it has a suffix
// (e.g. user already typed RELIANCE.NS or TCS.BO), leave it alone rather than double-suffixing.
function yahooSymbolFor(h){
  const acc = accountOf(h.broker);
  let sym = (h.symbol || '').trim().toUpperCase();
  if(acc.currency === 'INR' && !/\.[A-Z]{1,4}$/.test(sym)) sym = sym + '.NS';
  return sym;
}
// Twelve Data takes the exchange as a separate query param instead of a symbol suffix -- do
// NOT reuse the Yahoo-suffixed symbol here, that's a different provider's convention.
function twelveDataParamsFor(h){
  const acc = accountOf(h.broker);
  const symbol = (h.symbol || '').trim().toUpperCase();
  const exchange = acc.currency === 'INR' ? 'NSE' : '';
  return { symbol, exchange };
}
// Stooq needs its own suffix convention, separate from Yahoo's -- lowercase symbol + '.us' is
// Stooq's documented, confirmed-working format for US tickers (e.g. 'aapl.us'). Its NSE/Indian
// coverage and the exact suffix it expects for NSE symbols is NOT confirmed -- '.in' below is a
// best-effort guess based on Stooq's general country-suffix convention, not verified against
// real NSE data (see portfolio/PROGRESS.md). If the symbol already looks suffixed, leave it alone.
function stooqSymbolFor(h){
  const acc = accountOf(h.broker);
  let sym = (h.symbol || '').trim().toLowerCase();
  if(!sym) return sym;
  if(/\.[a-z]{1,4}$/i.test(sym)) return sym;
  return acc.currency === 'INR' ? sym + '.in' : sym + '.us';
}

// ---- Tier 1: Yahoo Finance public chart endpoint, no API key ----
// Built defensively: tries query1 then query2 (Yahoo runs both as redundant hosts), validates the
// response shape before trusting it, and always throws a descriptive error rather than
// returning a bad/NaN price on any failure (CORS block, HTTP error, endpoint change, garbage
// JSON, missing field). Confirmed broken in at least one real browser (user report, 2026-08-09)
// -- see portfolio/PROGRESS.md -- which is why Stooq (Tier 1b, below) and the failure-message
// pointer to Twelve Data exist.
async function fetchQuoteYahoo(symbol){
  const hosts = ['query1.finance.yahoo.com', 'query2.finance.yahoo.com'];
  let lastErr = new Error('Yahoo fetch failed');
  for(const host of hosts){
    try{
      const url = `https://${host}/v8/finance/chart/${encodeURIComponent(symbol)}`;
      const res = await fetch(url);
      if(!res.ok) throw new Error(`HTTP ${res.status} from ${host}`);
      const json = await res.json();
      if(json && json.chart && json.chart.error) throw new Error(json.chart.error.description || 'Yahoo returned an error');
      const result = json && json.chart && json.chart.result && json.chart.result[0];
      const price = result && result.meta && result.meta.regularMarketPrice;
      if(price === undefined || price === null || typeof price !== 'number' || isNaN(price) || price <= 0){
        throw new Error('No usable price field in Yahoo response');
      }
      return { price, source: 'Yahoo Finance' };
    }catch(e){ lastErr = e; }
  }
  throw new Error(`Yahoo: ${lastErr.message}`);
}

// ---- Tier 1b: Stooq, second no-key attempt before pointing the user at Twelve Data ----
// A real, commonly used free/no-key CSV quote source. Built in the same defensive style as
// fetchQuoteYahoo: validate the CSV shape and the price field before trusting it, throw rather
// than return a garbage/"N/D" price. UNVERIFIED against real NSE data (see stooqSymbolFor above
// and portfolio/PROGRESS.md) -- treat this as a second best-effort attempt, not a guarantee.
async function fetchQuoteStooq(symbol){
  const url = `https://stooq.com/q/l/?s=${encodeURIComponent(symbol)}&f=sd2t2ohlcv&h&e=csv`;
  const res = await fetch(url);
  if(!res.ok) throw new Error(`HTTP ${res.status} from Stooq`);
  const text = (await res.text()).trim();
  if(!text) throw new Error('Empty response from Stooq');
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  // f=sd2t2ohlcv with the 'h' header flag prepends a "Symbol,Date,Time,Open,High,Low,Close,Volume"
  // header row -- skip it and use the actual data row.
  const dataLine = lines.find(l=> !/^symbol,/i.test(l)) || lines[lines.length-1];
  const cols = dataLine.split(',');
  if(cols.length < 7) throw new Error('Unexpected response shape from Stooq');
  const closeRaw = (cols[6] || '').trim();
  const price = parseFloat(closeRaw);
  if(!closeRaw || closeRaw.toUpperCase() === 'N/D' || isNaN(price) || price <= 0){
    throw new Error('No usable price in Stooq response (symbol likely unsupported)');
  }
  return { price, source: 'Stooq' };
}

// ---- Tier 2: Twelve Data, optional bring-your-own-key ----
// Same safe pattern as the earlier prototype: fetch, parse, treat any error/status field or
// unusable price as a failure rather than trusting the payload blindly.
async function fetchQuoteTwelveData(symbol, exchange, apiKey){
  if(!apiKey) throw new Error('No Twelve Data API key set');
  const params = new URLSearchParams({ symbol, apikey: apiKey });
  if(exchange) params.set('exchange', exchange);
  const url = `https://api.twelvedata.com/quote?${params.toString()}`;
  const res = await fetch(url);
  const json = await res.json();
  if(json.status === 'error' || json.code) throw new Error(json.message || 'Twelve Data quote failed');
  const price = parseFloat(json.close);
  if(isNaN(price) || price <= 0) throw new Error('No usable price in Twelve Data response');
  return { price, source: 'Twelve Data' };
}

// One small isolated function per provider above (fetchQuoteYahoo, fetchQuoteStooq,
// fetchQuoteTwelveData) so a future fourth provider is a contained addition here, not a rewrite
// of this orchestrator. If a Twelve Data key is set, it's tried first (the user opted into the
// "more reliable" tier on purpose); Yahoo and then Stooq (both no-setup, no key) are tried either
// way. Never let a bad response from any provider reach the caller -- always throw, never return
// a garbage price. When every attempt fails, the thrown error is written to point the user
// straight at the one path confirmed to work (Twelve Data) instead of leaving them with an
// opaque error string -- see the "suggestTwelveData" flag consumed by the UI below.
async function fetchLivePrice(h){
  const key = getTwelveDataKey();
  const attempts = [];
  if(key) attempts.push({ name:'Twelve Data', run: ()=>{
    const { symbol, exchange } = twelveDataParamsFor(h);
    return fetchQuoteTwelveData(symbol, exchange, key);
  }});
  attempts.push({ name:'Yahoo', run: ()=> fetchQuoteYahoo(yahooSymbolFor(h)) });
  attempts.push({ name:'Stooq', run: ()=> fetchQuoteStooq(stooqSymbolFor(h)) });

  const errors = [];
  for(const attempt of attempts){
    try{ return await attempt.run(); }
    catch(e){ errors.push(`${attempt.name}: ${e.message}`); }
  }
  const detail = errors.join(' | ');
  const err = key
    ? new Error(`All live sources failed (${detail}). Check your Twelve Data key in Live Prices settings, or enter the price manually.`)
    : new Error(`Free live sources aren't working right now (${detail}).`);
  err.suggestTwelveData = true; // consumed by liveStatusHtml() / refreshAllLive() to render a direct link to Live Prices settings
  throw err;
}

// Refresh a single holding. Never writes a bad value into currentPrice -- on any failure the
// existing manually-entered price is left completely untouched, only liveStatusById records
// the failure so it's visible, not silent.
async function refreshOneLive(h){
  try{
    const r = await fetchLivePrice(h);
    h.currentPrice = r.price;
    h.asOf = new Date().toISOString().slice(0,10);
    liveStatusById[h.id] = { state:'ok', message:`live via ${r.source}`, at: new Date() };
  }catch(e){
    liveStatusById[h.id] = { state:'error', message: e.message || 'fetch failed', suggestTD: !!e.suggestTwelveData, at: new Date() };
  }
}

// Persisted (in-memory, not storage) across the full DOM rebuild render() does at the end --
// without this, the final "Done — X updated, Y failed" message would be overwritten by the
// rebuild in the same synchronous tick and the user would never actually see it.
let refreshAllStatusMsg = '';

// Refresh every eligible holding, staggered ~350ms apart (same pacing as the earlier prototype)
// so a "refresh all" doesn't hammer either provider or trip a rate limit instantly.
async function refreshAllLive(feedbackEl){
  const refreshable = data.holdings.filter(isRefreshable);
  if(refreshable.length === 0){
    refreshAllStatusMsg = 'No Stock/ETF holdings to refresh — Mutual Fund and other types stay manual-entry only.';
    feedbackEl.textContent = refreshAllStatusMsg;
    return;
  }
  let ok = 0, failed = 0, anySuggestTD = false;
  for(let i=0; i<refreshable.length; i++){
    const h = refreshable[i];
    feedbackEl.textContent = `Refreshing ${i+1} of ${refreshable.length}: ${h.symbol}…`;
    await refreshOneLive(h);
    const s = liveStatusById[h.id];
    if(s && s.state === 'ok'){ ok++; } else { failed++; if(s && s.suggestTD) anySuggestTD = true; }
    if(i < refreshable.length - 1) await delay(350);
  }
  saveData();
  refreshAllStatusMsg = `Done — ${ok} updated, ${failed} failed${failed>0 ? ' (existing manually-entered prices kept for the failed ones).' : '.'}`;
  if(failed>0 && anySuggestTD){
    refreshAllStatusMsg += ` <a href="#live-settings-panel" onclick="openLiveSettings(event)">Free live sources aren't working — add a Twelve Data key ↗</a>`;
  }
  render();
}

// ---------- per-holding and portfolio-level math ----------
// Current value/gain is always computed from currentPrice as it sits in the data model --
// whether that got there by manual entry/re-import or by a successful live refresh (see the
// "live prices" section above) makes no difference to this math; a failed live refresh simply
// never touches currentPrice, so this function never needs to know the difference.
function computeHoldingMetrics(h){
  const acc = accountOf(h.broker);
  const currency = acc.currency;
  const qty = +h.qty || 0;
  const buyPrice = +h.buyPrice || 0;
  const hasCurrentPrice = h.currentPrice !== '' && h.currentPrice !== null && h.currentPrice !== undefined && !isNaN(+h.currentPrice);
  const currentPrice = hasCurrentPrice ? +h.currentPrice : buyPrice;
  const costBasis = qty * buyPrice;
  const currentValue = qty * currentPrice;
  const gainAbs = currentValue - costBasis;
  const gainPct = costBasis > 0 ? (gainAbs / costBasis * 100) : 0;
  return { currency, accountName: acc.name, qty, buyPrice, currentPrice, costBasis, currentValue, gainAbs, gainPct, isStale: !hasCurrentPrice };
}

function computePortfolio(){
  let totalCostINR = 0, totalValueINR = 0;
  let unconvertedCount = 0;
  const byBroker = {};   // brokerId -> {name, currency, costNative, valueNative, count}
  const byAssetType = {}; // assetType -> valueINR (only counts holdings that could be converted)

  data.holdings.forEach(h=>{
    const m = computeHoldingMetrics(h);
    if(!byBroker[h.broker]) byBroker[h.broker] = { name: m.accountName, currency: m.currency, costNative:0, valueNative:0, count:0 };
    byBroker[h.broker].costNative += m.costBasis;
    byBroker[h.broker].valueNative += m.currentValue;
    byBroker[h.broker].count++;

    const costINR = toINR(m.costBasis, m.currency);
    const valINR = toINR(m.currentValue, m.currency);
    if(costINR===null || valINR===null){ unconvertedCount++; return; }
    totalCostINR += costINR;
    totalValueINR += valINR;
    byAssetType[h.assetType || 'Other'] = (byAssetType[h.assetType || 'Other'] || 0) + valINR;
  });

  const gainINR = totalValueINR - totalCostINR;
  const gainPct = totalCostINR > 0 ? (gainINR / totalCostINR * 100) : 0;
  return { totalCostINR, totalValueINR, gainINR, gainPct, byBroker, byAssetType, unconvertedCount };
}

// ---------- holdings table (front and center) ----------
function sortIndicator(key){
  if(holdingsSort.key !== key) return '';
  return holdingsSort.dir === 1 ? ' ▲' : ' ▼';
}
function liveStatusHtml(h){
  const s = liveStatusById[h.id];
  if(!s) return '';
  const time = s.at instanceof Date ? s.at.toTimeString().slice(0,5) : '';
  if(s.state === 'pending') return `<span class="live-status helptext" style="color:var(--gold);">fetching…</span>`;
  if(s.state === 'ok') return `<span class="live-status helptext" style="color:var(--green);" title="${s.message}">✓ ${time} · ${s.message}</span>`;
  const link = s.suggestTD ? ` <a href="#live-settings-panel" onclick="openLiveSettings(event)">add Twelve Data key ↗</a>` : '';
  return `<span class="live-status helptext" style="color:var(--rust);" title="${s.message}">✕ Live fetch failed.${link}</span>`;
}

             <button class="btn tiny ghost" data-live="${h.id}" title="Fetch a live price for this holding">↻ live</button>
             ${liveStatusHtml(h)}
           </div></div>`
      : `<div class="cp-cell"><input type="number" step="0.01" data-cp="${h.id}" value="${h.currentPrice}" placeholder="${m.buyPrice}">
           <div class="helptext" style="margin-top:4px; font-size:10.5px;">manual only (${h.assetType||'—'})</div></div>`;
    tr.innerHTML = `
      <td data-label="Symbol"><strong>${h.symbol}</strong></td>
      <td data-label="Broker" class="cell-muted">${m.accountName}</td>
      <td data-label="Type" class="cell-muted">${h.assetType}</td>
      <td data-label="Qty">${m.qty}</td>
      <td data-label="Avg Price">${formatMoney(m.buyPrice, m.currency)}</td>
      <td data-label="Buy Date" class="cell-muted">${h.buyDate}</td>
      <td data-label="Current Price">${cpCell}</td>
      <td data-label="As Of"><input type="date" data-asof="${h.id}" value="${h.asOf||''}"></td>
      <td data-label="Value" class="cell-strong">${formatMoney(m.currentValue, m.currency)}${m.isStale?' <span class="tag muted">stale</span>':''}</td>
      <td data-label="Gain/Loss" class="cell-strong" style="color:${gainColor};">${formatMoney(m.gainAbs, m.currency)} (${m.gainPct.toFixed(1)}%)</td>
      <td data-label=""><button class="btn small ghost" data-rm="${h.id}">✕</button></td>
    `;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.innerHTML = '';
  wrap.appendChild(table);

  table.querySelectorAll('th[data-sort]').forEach(th=>{
    th.onclick = ()=>{
      const key = th.dataset.sort;
      if(holdingsSort.key === key) holdingsSort.dir *= -1; else { holdingsSort.key = key; holdingsSort.dir = 1; }
      render();
    };
  });
  wrap.querySelectorAll('[data-cp]').forEach(inp=>{
    inp.onchange = (e)=>{
      const h = data.holdings.find(x=>x.id===e.target.dataset.cp);
      if(!h) return;
      h.currentPrice = e.target.value === '' ? '' : +e.target.value;
      if(!h.asOf) h.asOf = new Date().toISOString().slice(0,10);
      saveData(); render();
    };
  });
  wrap.querySelectorAll('[data-asof]').forEach(inp=>{
    inp.onchange = (e)=>{
      const h = data.holdings.find(x=>x.id===e.target.dataset.asof);
      if(!h) return;
      h.asOf = e.target.value;
      saveData(); render();
    };
  });
  wrap.querySelectorAll('[data-rm]').forEach(btn=>{
    btn.onclick = (e)=>{
      data.holdings = data.holdings.filter(x=>x.id!==e.target.dataset.rm);
      saveData(); render();
    };
  });
  wrap.querySelectorAll('[data-live]').forEach(btn=>{
    btn.onclick = async (e)=>{
      const id = e.currentTarget.dataset.live;
      const h = data.holdings.find(x=>x.id===id);
      if(!h) return;
      e.currentTarget.disabled = true;
      e.currentTarget.textContent = '…';
      liveStatusById[h.id] = { state:'pending' };
      await refreshOneLive(h);
      saveData();
      render();
    };
  });
}

    </div>
  `;
  container.appendChild(card);

  const chips = card.querySelector('#acct_chips');
  chips.innerHTML = data.accounts.map(a=>{
    const n = countsByAcct[a.id] || 0;
    return `<span class="acct-chip">${a.name} <span class="cur">${a.currency}</span> <span class="cur">· ${n} holding${n===1?'':'s'}</span></span>`;
  }).join('');

  card.querySelector('#acct_new_btn').onclick = ()=>{
    const nameEl = card.querySelector('#acct_new_name');
    const name = nameEl.value.trim();
    if(!name) return;
    const currency = card.querySelector('#acct_new_cur').value;
    data.accounts.push({id:newId('acct'), name, country: currency==='USD'?'US':'IN', currency});
    saveData(); render();
  };
}

// ---------- allocation + broker breakdown ----------
function renderAllocationCard(container){
  const p = computePortfolio();
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h3>Asset allocation</h3><p class="helptext" style="margin-bottom:6px;">By asset type, based on current INR-convertible value.</p>`;
  container.appendChild(card);

  const catColors = ['#C9A227','#4A9B6E','#7EA8C9','#B5533C','#9B7EC9','#5FA3A3'];
  const segs = Object.entries(p.byAssetType).filter(([k,v])=>v>0);
  if(segs.length===0){
    card.innerHTML += `<div class="helptext">Nothing to show yet.</div>`;
    return;
  }
  const total = segs.reduce((s,[,v])=>s+v,0);
  const barHtml = segs.map(([k,v],i)=>{
    const pct = (v/total*100).toFixed(1);
    return `<div class="seg" style="width:${pct}%; background:${catColors[i%catColors.length]};" title="${k}: ${formatMoney(v,'INR')}">${pct>8?pct+'%':''}</div>`;
  }).join('');
  const legendHtml = segs.map(([k,v],i)=>`<div class="item"><span class="dot" style="background:${catColors[i%catColors.length]};"></span>${k}: ${formatMoney(v,'INR')} (${(v/total*100).toFixed(1)}%)</div>`).join('');
  card.innerHTML += `<div class="breakdown-bar">${barHtml}</div><div class="legend">${legendHtml}</div>`;
}

function renderBrokerBreakdown(container){
  const p = computePortfolio();
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h3>By account</h3><p class="helptext" style="margin-bottom:6px;">Native-currency totals per broker/demat account.</p>`;
  container.appendChild(card);
  const entries = Object.entries(p.byBroker);
  if(entries.length===0){ card.innerHTML += `<div class="helptext">Nothing to show yet.</div>`; return; }
  const wrap = document.createElement('div');
  wrap.className = 'table-scroll';
  const table = document.createElement('table');
  table.className = 'day-table';
  table.innerHTML = `<thead><tr><th>Account</th><th>Holdings</th><th>Cost Basis</th><th>Current Value</th><th>Gain/Loss</th></tr></thead>`;
  const tbody = document.createElement('tbody');
  entries.forEach(([id,b])=>{
    const gain = b.valueNative - b.costNative;
    const gainPct = b.costNative>0 ? gain/b.costNative*100 : 0;
    const gainColor = gain>=0 ? 'var(--green)' : 'var(--rust)';
    const tr = document.createElement('tr');
    tr.innerHTML = `<td data-label="Account">${b.name} <span class="tag muted">${b.currency}</span></td><td data-label="Holdings">${b.count}</td><td data-label="Cost Basis">${formatMoney(b.costNative,b.currency)}</td><td data-label="Current Value">${formatMoney(b.valueNative,b.currency)}</td><td data-label="Gain/Loss" style="color:${gainColor};">${formatMoney(gain,b.currency)} (${gainPct.toFixed(1)}%)</td>`;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  card.appendChild(wrap);
}

// ---------- Live prices settings (collapsible, dismissible by default) ----------
// Global (not closure-scoped) on purpose -- referenced from inline onclick="" attributes rendered
// by liveStatusHtml()/refreshAllLive() elsewhere in the page, which resolve function names in the
// top-level script scope, not inside another function's closure.
function openLiveSettings(e){
  if(e) e.preventDefault();
  liveSettingsOpen = true;
  render();
  requestAnimationFrame(()=>{
    const panel = document.getElementById('live-settings-panel');
    if(panel){
      panel.scrollIntoView({behavior:'smooth', block:'start'});
      const inp = document.getElementById('live_key_input');
      if(inp) inp.focus({preventScroll:true});
    }
  });
}

  const key = getTwelveDataKey();

    <div class="details-body">

// ---------- Net Worth feed ----------
// Builds the cross-module contract array documented in MASTER_ROADMAP.md:
// {category, label, value, asOf}[]. Net Worth Dashboard's own Import detects and merges this
// feed shape directly -- see the dated PROGRESS.md entry for the auto-import wiring.
function buildNetWorthFeed(){
  const p = computePortfolio();
  const today = new Date().toISOString().slice(0,10);
  return Object.entries(p.byBroker).map(([id,b])=>{
    const valueINR = toINR(b.valueNative, b.currency);
    return {
      category: 'investments',
      label: `${b.name} (Portfolio Tracker)`,
      value: valueINR!==null ? Math.round(valueINR) : Math.round(b.valueNative), // native value if unconverted -- flagged in note below
      asOf: today,
      _currency: valueINR!==null ? 'INR' : b.currency, // not part of the formal contract; kept so an unconverted USD row isn't silently mistaken for INR
    };
  });
}
function renderNetWorthFeedCard(container){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h3>Feed Net Worth's Investments category</h3>
    <p class="helptext" style="margin-bottom:8px;">Exports one row per account in the shared <code>{category, label, value, asOf}[]</code> contract. Download the JSON below and feed it straight into Net Worth Dashboard's own Import button — it detects this feed shape and merges it into the Investments category (upserting by account label, so re-importing after these numbers change updates rather than duplicates). USD accounts without an FX rate set above are skipped on that end rather than imported as rupees. Prefer copy-pasting instead? The paste-ready lines button below matches Net Worth's "Label, Value" format for manual entry into its Investments card.</p>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn small" id="nw_export_json">Download Net Worth feed (JSON)</button>
      <button class="btn small ghost" id="nw_copy_lines">Copy paste-ready lines for Net Worth</button>
    </div>
    <div id="nw_feed_fb" class="helptext" style="margin-top:8px;"></div>
  `;
  container.appendChild(card);

  card.querySelector('#nw_export_json').onclick = ()=>{
    const feed = buildNetWorthFeed();
    const blob = new Blob([JSON.stringify(feed, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `portfolio-networth-feed-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };
  card.querySelector('#nw_copy_lines').onclick = async ()=>{
    const feed = buildNetWorthFeed();
    const lines = feed.map(r=> `${r.label}, ${r.value}`).join('\n');
    const fb = card.querySelector('#nw_feed_fb');
    try{
      await navigator.clipboard.writeText(lines);
      fb.textContent = 'Copied — paste directly into Net Worth Dashboard\'s Investments box.';
    }catch(e){
      fb.textContent = 'Could not access clipboard; here it is to copy manually:\n' + lines;
    }
  };
}

const THEME_KEY = 'itrgenie_theme'; // deliberately shared with every other module so theme choice is consistent site-wide
function applyTheme(theme){
  document.body.dataset.theme = theme;
  document.getElementById('themeToggleBtn').textContent = theme==='light' ? '● Dark mode' : '☀ Light mode';
  localStorage.setItem(THEME_KEY, theme);
}
document.getElementById('themeToggleBtn').onclick = ()=>{
  const current = document.body.dataset.theme === 'light' ? 'light' : 'dark';
  applyTheme(current==='light' ? 'dark' : 'light');
};
applyTheme(localStorage.getItem(THEME_KEY) || 'dark');

document.getElementById('exportBtn').onclick = ()=>{
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `portfolio-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
};
document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();
document.getElementById('importFile').onchange = (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const parsed = JSON.parse(ev.target.result);
      if(!Array.isArray(parsed.accounts) || parsed.accounts.length===0) parsed.accounts = defaultData().accounts;
      if(!Array.isArray(parsed.holdings)) parsed.holdings = [];
      if(!parsed.fx) parsed.fx = { usdInr:'', asOf:'' };
      data = parsed;
      saveData(); render();
    }
    catch(err){ alert('Could not read that file — not valid JSON.'); }
  };
  reader.readAsText(file);
};

render();
</script>
