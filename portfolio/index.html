      </label>
      <div style="display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap;">
        <button class="btn small primary" id="h_btn">Parse &amp; add</button>
        <span class="helptext" style="margin:0;">or</span>
        <button class="btn small ghost" id="h_file_btn">Choose CSV/TXT/Excel file</button>
        <input type="file" id="h_file" accept=".csv,.txt,.xlsx,.xls" style="display:none">
        ${xlsxLoadState==='loading' ? `<span class="helptext" style="margin:0;">(loading Excel support…)</span>` : ''}
        ${xlsxLoadState==='error' ? `<span class="helptext" style="margin:0; color:var(--rust);">Couldn't preload Excel support (${xlsxLoadErrorMsg}) — choosing an .xlsx file will try again.</span>` : ''}
      </div>
      <p class="helptext" style="margin-top:6px;">Excel (.xlsx/.xls) files from a real broker export are read directly — columns like "Instrument", "Avg. cost", "Qty." are auto-detected even if they don't match the format above; you'll see exactly what was matched before anything is imported.</p>
      <div id="h_feedback" class="helptext" style="margin:6px 0;">${bulkAddFeedbackMsg}</div>
      <div id="xlsx_preview_wrap"></div>
    </div>
  `;
  container.appendChild(el);
  el.querySelector('#h_file_btn').onclick = ()=> el.querySelector('#h_file').click();
  wireFileUpload(el.querySelector('#h_file'), el.querySelector('#h_paste'), el.querySelector('#h_btn'));
  el.querySelector('#h_skip_dupes').onchange = (e)=>{ bulkPasteSkipDuplicates = e.target.checked; };
  if(xlsxImport) renderXlsxImportPreview(el.querySelector('#xlsx_preview_wrap'));

  el.querySelector('#h_btn').onclick = ()=>{
    const raw = el.querySelector('#h_paste').value;
    const rows = parsePastedRows(raw, 8, 6); // Symbol, Broker, AssetType, Qty, BuyPrice, BuyDate, CurrentPrice, AsOf (last 2 optional)
    let added=0, skipped=0, dupSkipped=0;
    rows.forEach(cols=>{
      if(cols.length<6){ skipped++; return; }
      const [symbol, brokerTxt, assetType, qty, buyPrice, buyDate, currentPrice, asOf] = cols;
      const qtyN = parseNumericCell(qty), buyPriceN = parseNumericCell(buyPrice);
      if(!symbol || !brokerTxt || isNaN(qtyN) || qtyN<=0 || isNaN(buyPriceN) || buyPriceN<0 || !buyDate){ skipped++; return; }
      const brokerId = resolveBrokerId(brokerTxt);
      if(bulkPasteSkipDuplicates && findDuplicateHoldingIndex({ symbol, broker: brokerId }) >= 0){ dupSkipped++; return; }
      const currentPriceN = parseNumericCell(currentPrice);
      // Defense in depth, round 4: currentPrice had no >=0 guard next to it even though its
      // siblings qty/buyPrice both do, just above -- a negative stock price isn't a realistic
      // real-world input the way a capital loss is, but there's no reason to leave it unguarded.
      if(currentPriceN < 0){ skipped++; return; }
      const hasCurrentPrice = currentPrice!==undefined && currentPrice!=='' && !isNaN(currentPriceN);
      data.holdings.push({
        id: newId('h'),
        symbol: symbol.toUpperCase(),
        broker: brokerId,
        assetType: assetType || 'Equity',
        qty: qtyN,
        buyPrice: buyPriceN,
        buyDate: buyDate,
        currentPrice: hasCurrentPrice ? currentPriceN : '',
        asOf: (asOf && asOf.trim()) ? asOf.trim() : (hasCurrentPrice ? new Date().toISOString().slice(0,10) : ''),
      });
      added++;
    });
    bulkAddOpen = true; // keep the panel open after adding so the feedback message below is actually visible
    bulkAddFeedbackMsg = `Added ${added}`
      + `${skipped>0?`, skipped ${skipped} (missing/invalid Symbol, Broker, AssetType, Qty, BuyPrice or BuyDate)${skipNote(rows)}`:''}`
      + `${dupSkipped>0?`, skipped ${dupSkipped} duplicate(s) already in your holdings (matched by broker+symbol)`:''}.`;
    saveData(); render();
  };
}

// ---------- allocation + broker breakdown ----------
// ---------- Concentration / diversification flag (Dashboard, near Allocation) ----------
// Two independent, threshold-based checks -- deliberately descriptive, not prescriptive, matching
// this module's existing "not a recommendation" pattern (see the what-if simulator's own disclosure
// text). Neither threshold is an arbitrary round number:
//   - Top-2-holdings share of total INR-convertible value >= 50%: half your invested value resting
//     on just two positions means either one's decline meaningfully swings your whole portfolio --
//     50% is a deliberately blunt "literally half" line, easy to justify without pretending to more
//     precision than a rule of thumb deserves. Only evaluated once there are at least 3 priced
//     holdings -- with only 1 or 2 holdings total, "most of your portfolio is in your top 2" is true
//     by construction, not a genuine concentration signal worth flagging.
//   - More than 20 direct stock/equity positions: the commonly cited practitioner rule of thumb
//     (going back to Evans & Archer's 1968 diversification study) is that the marginal diversification
//     benefit of adding another individual stock is mostly gone by roughly 15-20 names -- beyond that,
//     more positions mainly add tracking effort, not real diversification. Note (2026-08-11 review):
//     the 1968 study's own original figure was actually 8-10 stocks; later replications revised that
//     upward to the 15-20+ range commonly cited today, and some go higher still -- so 20 sits at the
//     LOW end of what's now considered adequate, not a deliberately generous cushion above it. Left at
//     20 anyway since this is an explicitly descriptive, non-prescriptive rule of thumb either way, not
//     a hard line -- just correcting the "generous" framing, not the number itself.
// Only ever shown when actually true for the current data -- no flag, or a clean "well diversified"
// note, when neither threshold is crossed. Never a fabricated concern.
const CONCENTRATION_TOP2_PCT_THRESHOLD = 50;
const CONCENTRATION_STOCK_COUNT_THRESHOLD = 20;

function computeConcentration(){
  let unconvertedCount = 0;
  const priced = data.holdings.map(h=>{
    const m = computeHoldingMetrics(h);
    const valueINR = toINR(m.currentValue, m.currency);
    if(valueINR===null) unconvertedCount++;
    return { h, m, valueINR };
  }).filter(x=>x.valueINR!==null && x.valueINR>0);
  const totalINR = priced.reduce((s,x)=>s+x.valueINR, 0);
  const sorted = [...priced].sort((a,b)=>b.valueINR-a.valueINR);
  const top2 = sorted.slice(0,2);
  const top2SumINR = top2.reduce((s,x)=>s+x.valueINR, 0);
  const top2Pct = totalINR>0 ? (top2SumINR/totalINR*100) : 0;
  const stockCount = data.holdings.filter(h=>{
    const t = (h.assetType || '').trim().toLowerCase();
    return t === 'stock' || t === 'equity';
  }).length;
  return { priced, totalINR, top2, top2Pct, stockCount, unconvertedCount };
}

function renderConcentrationCard(container){
  const c = computeConcentration();
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h3>Diversification check</h3>`;
  container.appendChild(card);

  if(c.priced.length===0){
    card.innerHTML += `<div class="helptext">Add a holding with a current value to see a diversification check here.</div>`;
    return;
  }

  const flags = [];
  if(c.priced.length>=3 && c.top2Pct>=CONCENTRATION_TOP2_PCT_THRESHOLD){
    const names = c.top2.map(x=>x.h.symbol).join(' and ');
    flags.push(`<div class="notice warn"><strong>${c.top2Pct.toFixed(0)}%</strong> of your INR-convertible holdings (by current value) is in your top 2 — ${names}. A large move in either would meaningfully swing that total.</div>`);
  }
  if(c.stockCount > CONCENTRATION_STOCK_COUNT_THRESHOLD){
    flags.push(`<div class="notice">You hold <strong>${c.stockCount}</strong> direct stock positions — beyond roughly 15-20 names, that typically adds tracking effort without much extra diversification benefit.</div>`);
  }

  if(flags.length===0){
    card.innerHTML += `<div class="helptext" style="color:var(--green);">No concentration flags right now — your top holdings and stock count are both in a reasonable range.</div>`;
  } else {
    card.innerHTML += flags.join('');
  }
  // Reviewer-found gap (2026-08-11): this check silently excluded unconverted-USD holdings from its
  // top-2 denominator, same as the totals elsewhere in this file -- but unlike those, it said "your
  // portfolio" with no note, which could read as a clean bill of health for a portfolio actually
  // dominated by an unpriced foreign stake. Now says "INR-convertible holdings" (above) and discloses
  // the excluded count explicitly here, matching the exact pattern already used for the performance
  // summary and realized-gains totals.
  if(c.unconvertedCount>0){
    card.innerHTML += `<div class="helptext" style="margin-top:6px;">${c.unconvertedCount} USD holding(s) not included in this check — set the USD → INR rate further down to fold Vested-US in.</div>`;
  }
  card.innerHTML += `<div class="helptext" style="margin-top:6px;">Descriptive only, based on your current holdings — not investment advice, and not a recommendation to buy, sell, or rebalance anything.</div>`;
}

function renderAllocationCard(container){
  const p = computePortfolio();
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h3>Asset allocation</h3><p class="helptext" style="margin-bottom:6px;">By asset type, based on current INR-convertible value.</p>`;
  container.appendChild(card);

  const catColors = ['#C9A227','#4A9B6E','#7EA8C9','#B5533C','#9B7EC9','#5FA3A3'];
  const segs = Object.entries(p.byAssetType).filter(([k,v])=>v>0);
  if(segs.length===0){
    card.innerHTML += `<div class="helptext">Nothing to show yet.</div>`;
    return;
  }
  const total = segs.reduce((s,[,v])=>s+v,0);
  const barHtml = segs.map(([k,v],i)=>{
    const pct = (v/total*100).toFixed(1);
    return `<div class="seg" style="width:${pct}%; background:${catColors[i%catColors.length]};" title="${k}: ${formatMoney(v,'INR')}">${pct>8?pct+'%':''}</div>`;
  }).join('');
  const legendHtml = segs.map(([k,v],i)=>`<div class="item"><span class="dot" style="background:${catColors[i%catColors.length]};"></span>${k}: ${formatMoney(v,'INR')} (${(v/total*100).toFixed(1)}%)</div>`).join('');
  card.innerHTML += `<div class="breakdown-bar">${barHtml}</div><div class="legend">${legendHtml}</div>`;
}

function renderBrokerBreakdown(container){
  const p = computePortfolio();
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h3>By account</h3><p class="helptext" style="margin-bottom:6px;">Native-currency totals per broker/demat account. Current Value covers every holding; Cost Basis and Gain/Loss cover only holdings with a Buy Price set (see note below rows with any missing).</p>`;
  container.appendChild(card);
  const entries = Object.entries(p.byBroker);
  if(entries.length===0){ card.innerHTML += `<div class="helptext">Nothing to show yet.</div>`; return; }
  const wrap = document.createElement('div');
  wrap.className = 'table-scroll';
  const table = document.createElement('table');
  table.className = 'day-table';
  table.innerHTML = `<thead><tr><th>Account</th><th>Holdings</th><th>Cost Basis</th><th>Current Value</th><th>Gain/Loss</th></tr></thead>`;
  const tbody = document.createElement('tbody');
  entries.forEach(([id,b])=>{
    // Gain/Loss is computed from the priced-only subset (costNativePriced / valueNativePriced),
    // not the account's full Current Value -- otherwise any holding missing a Buy Price (e.g. a
    // CAS import awaiting manual entry) would silently show its whole value as "gain". See
    // computePortfolio() above for why.
    const gain = b.valueNativePriced - b.costNativePriced;
    const gainPct = b.costNativePriced>0 ? gain/b.costNativePriced*100 : 0;
    const gainColor = gain>=0 ? 'var(--green)' : 'var(--rust)';
    const asterisk = b.unpricedCount>0 ? ' *' : '';
    const tr = document.createElement('tr');
    tr.innerHTML = `<td data-label="Account">${b.name} <span class="tag muted">${b.currency}</span></td><td data-label="Holdings">${b.count}</td><td data-label="Cost Basis">${formatMoney(b.costNativePriced,b.currency)}</td><td data-label="Current Value">${formatMoney(b.valueNative,b.currency)}</td><td data-label="Gain/Loss" style="color:${gainColor};">${formatMoney(gain,b.currency)} (${gainPct.toFixed(1)}%)${asterisk}</td>`;
    tbody.appendChild(tr);
    if(b.unpricedCount>0){
      const noteTr = document.createElement('tr');
      noteTr.innerHTML = `<td colspan="5" data-label="" class="helptext" style="color:var(--gold); border-bottom:1px solid var(--line);">* ${b.unpricedCount} holding(s) in this account have no Buy Price yet — excluded from Cost Basis/Gain-Loss above until filled in.</td>`;
      tbody.appendChild(noteTr);
    }
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  card.appendChild(wrap);
}

// ---------- Net Worth feed ----------
// Builds the cross-module contract array documented in MASTER_ROADMAP.md:
// {category, label, value, asOf}[]. Net Worth Dashboard's own Import detects and merges this
// feed shape directly -- see the dated PROGRESS.md entry for the auto-import wiring.
function buildNetWorthFeed(){
  const p = computePortfolio();
  const today = new Date().toISOString().slice(0,10);
  return Object.entries(p.byBroker).map(([id,b])=>{
    const valueINR = toINR(b.valueNative, b.currency);
    return {
      category: 'investments',
      label: `${b.name} (Portfolio Tracker)`,
      value: valueINR!==null ? Math.round(valueINR) : Math.round(b.valueNative), // native value if unconverted -- flagged in note below
      asOf: today,
      _currency: valueINR!==null ? 'INR' : b.currency, // not part of the formal contract; kept so an unconverted USD row isn't silently mistaken for INR
    };
  });
}
function renderNetWorthFeedCard(container){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h3>Feed Net Worth's Investments category</h3>
    <p class="helptext" style="margin-bottom:8px;">Exports one row per account in the shared <code>{category, label, value, asOf}[]</code> contract. Download the JSON below and feed it straight into Net Worth Dashboard's own Import button — it detects this feed shape and merges it into the Investments category (upserting by account label, so re-importing after these numbers change updates rather than duplicates). USD accounts without an FX rate set above are skipped on that end rather than imported as rupees. Prefer copy-pasting instead? The paste-ready lines button below matches Net Worth's "Label, Value" format for manual entry into its Investments card.</p>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn small" id="nw_export_json">Download Net Worth feed (JSON)</button>
      <button class="btn small ghost" id="nw_copy_lines">Copy paste-ready lines for Net Worth</button>
    </div>
    <div id="nw_feed_fb" class="helptext" style="margin-top:8px;"></div>
  `;
  container.appendChild(card);

  card.querySelector('#nw_export_json').onclick = ()=>{
    const feed = buildNetWorthFeed();
    const blob = new Blob([JSON.stringify(feed, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `portfolio-networth-feed-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };
  card.querySelector('#nw_copy_lines').onclick = async ()=>{
    const feed = buildNetWorthFeed();
    const lines = feed.map(r=> `${r.label}, ${r.value}`).join('\n');
    const fb = card.querySelector('#nw_feed_fb');
    try{
      await navigator.clipboard.writeText(lines);
      fb.textContent = 'Copied — paste directly into Net Worth Dashboard\'s Investments box.';
    }catch(e){
      fb.textContent = 'Could not access clipboard; here it is to copy manually:\n' + lines;
    }
  };
}

const THEME_KEY = 'itrgenie_theme'; // deliberately shared with every other module so theme choice is consistent site-wide
function applyTheme(theme){
  document.body.dataset.theme = theme;
  document.getElementById('themeToggleBtn').textContent = theme==='light' ? '● Dark mode' : '☀ Light mode';
  localStorage.setItem(THEME_KEY, theme);
}
document.getElementById('themeToggleBtn').onclick = ()=>{
  const current = document.body.dataset.theme === 'light' ? 'light' : 'dark';
  applyTheme(current==='light' ? 'dark' : 'light');
};
applyTheme(localStorage.getItem(THEME_KEY) || 'dark');

document.getElementById('exportBtn').onclick = ()=>{
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `portfolio-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
};
document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();
document.getElementById('importFile').onchange = (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const parsed = JSON.parse(ev.target.result);
      if(!Array.isArray(parsed.accounts) || parsed.accounts.length===0) parsed.accounts = defaultData().accounts;
      if(!Array.isArray(parsed.holdings)) parsed.holdings = [];
      if(!parsed.fx) parsed.fx = { usdInr:'', asOf:'' };
      if(!Array.isArray(parsed.soldLots)) parsed.soldLots = [];
      data = parsed;
      saveData(); render();
    }
    catch(err){ alert('Could not read that file — not valid JSON.'); }
  };
  reader.readAsText(file);
};

render();
</script>
