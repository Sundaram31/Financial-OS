<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Tracker — Financial OS</title>
<style>
  :root{
    --bg:#0B0E11; --panel:#12161B; --panel-2:#171C22; --line:#242A31;
    --text:#E8E6E0; --muted:#9BA0A8; --gold:#C9A227; --gold-dim:#8f7419;
    --green:#4A9B6E; --rust:#CE6C53;
    --mono: 'IBM Plex Mono', 'Courier New', monospace;
    --serif: 'Source Serif 4', Georgia, serif;
  }
  body[data-theme="light"]{
    --bg:#F7F5F0; --panel:#FFFFFF; --panel-2:#F1EEE7; --line:#DCD7CC;
    --text:#242220; --muted:#6B6660; --gold:#96741A; --gold-dim:#7a5f15;
    --green:#2F7A50; --rust:#9B3F2A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:var(--mono); font-size:15.5px; line-height:1.6; min-height:100vh; }
  a{color:var(--gold);}
  .app{ display:flex; min-height:100vh; flex-direction:column; }
  header.topbar{ display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; gap:10px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .seal{ width:28px; height:28px; border:1.5px solid var(--gold); border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-size:13px; color:var(--gold); font-weight:600; }
  .brand h1{ font-family:var(--serif); font-size:17px; font-weight:600; }
  .brand .sub{ font-size:13px; color:var(--muted); }
  .topbar-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  main.content{ flex:1; overflow-y:auto; padding:26px 32px; max-width:1000px; margin:0 auto; width:100%; }
  .panel-header{ margin-bottom:22px; }
  .panel-header .eyebrow{ font-size:13px; color:var(--gold); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:4px;}
  .panel-header h2{ font-family:var(--serif); font-size:24px; font-weight:600; }
  .panel-header p.desc{ color:var(--muted); font-size:14px; margin-top:6px; max-width:680px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:18px 20px; margin-bottom:16px; }
  .card h3{ font-family:var(--serif); font-size:16px; margin-bottom:12px; }
  .field-row{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
  .field{ flex:1; min-width:160px; }
  .field label{ display:block; font-size:13px; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.6px;}
  .field input, .field select, textarea{ width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:8px 10px; border-radius:4px; font-family:var(--mono); font-size:14px; }
  .field input:focus, textarea:focus{ outline:none; border-color:var(--gold-dim); }
  .btn{ background:transparent; border:1px solid var(--gold-dim); color:var(--gold); padding:8px 16px; border-radius:4px; font-family:var(--mono); font-size:13px; cursor:pointer; }
  .btn:hover{ background:rgba(201,162,39,0.08); border-color:var(--gold); }
  .btn.primary{ background:var(--gold); color:#141414; font-weight:600; border-color:var(--gold); }
  .btn.primary:hover{ background:#dab63a; }
  .btn.ghost{ border-color:var(--line); color:var(--muted); }
  .btn.small{ padding:5px 10px; font-size:13px; }
  .table-scroll{ overflow-x:auto; }
  table.day-table{ width:100%; border-collapse:collapse; margin-top:8px; font-size:13px; min-width:760px; }
  table.day-table th{ text-align:left; color:var(--muted); font-weight:500; font-size:13px; text-transform:uppercase; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.day-table td{ padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.day-table tr:last-child td{ border-bottom:none; }
  table.day-table input[type="number"], table.day-table input[type="date"]{ width:100px; padding:4px 6px; font-size:13px; }
  .sortable-th{ cursor:pointer; user-select:none; }
  .sortable-th:hover{ color:var(--gold); }
  .cell-muted{ color:var(--muted); font-size:13px; }
  .cell-strong{ font-weight:600; }
  .result-box{ border:1px solid var(--gold-dim); border-radius:6px; padding:18px 20px; background:linear-gradient(180deg, rgba(201,162,39,0.05), transparent); margin-top:16px; }
  .result-box .verdict{ font-family:var(--serif); font-size:22px; color:var(--gold); margin-bottom:4px; }
  .result-box .verdict-detail{ font-size:13.5px; color:var(--muted); }
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:12px; margin-bottom:14px; }
  .stat-tile{ background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:16px 18px; }
  .stat-tile.accent{ border-color:var(--gold-dim); background:linear-gradient(180deg, rgba(201,162,39,0.06), transparent); }
  .stat-tile .stat-label{ font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
  .stat-tile .stat-value{ font-family:var(--serif); font-size:25px; font-weight:600; }
  .helptext{ font-size:13px; color:var(--muted); margin-top:4px; }
  .breakdown-bar{ display:flex; height:28px; border-radius:4px; overflow:hidden; margin:12px 0; border:1px solid var(--line); }
  .breakdown-bar .seg{ display:flex; align-items:center; justify-content:center; font-size:13px; color:#141414; font-weight:600; overflow:hidden; white-space:nowrap; }
  .legend{ display:flex; flex-wrap:wrap; gap:14px; margin-top:8px; }
  .legend .item{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); }
  .legend .dot{ width:9px; height:9px; border-radius:2px; }
  .tag{ display:inline-block; font-size:13px; padding:2px 8px; border-radius:10px; text-transform:uppercase; font-weight:600; margin-left:6px; }
  .tag.green{ background:rgba(74,155,110,0.15); color:var(--green); }
  .tag.rust{ background:rgba(181,83,60,0.15); color:var(--rust); }
  .tag.muted{ background:rgba(154,160,168,0.15); color:var(--muted); }
  .gap-card{ border-color:var(--gold-dim); }
  .gap-card h3{ color:var(--gold); }
  .gap-card ol{ margin:8px 0 0 18px; font-size:13px; color:var(--text); }
  .gap-card li{ margin-bottom:10px; }
  .acct-chip{ display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:20px; padding:6px 12px; margin:0 8px 8px 0; font-size:13px; }
  .acct-chip .cur{ font-size:13px; color:var(--muted); }
  .btn.tiny{ padding:2px 7px; font-size:13px; }
  .tag.gold{ background:rgba(201,162,39,0.15); color:var(--gold); }
  .notice{ border:1px solid var(--gold-dim); background:rgba(201,162,39,0.08); border-radius:6px; padding:10px 14px; font-size:13px; color:var(--text); margin-bottom:12px; line-height:1.55; }
  .notice strong{ color:var(--gold); }
  .notice.warn{ border-color:var(--rust); background:rgba(181,83,60,0.09); }
  .notice.warn strong{ color:var(--rust); }
  .match-tag{ display:inline-block; font-size:13px; padding:1px 7px; border-radius:9px; text-transform:uppercase; letter-spacing:0.3px; font-weight:600; background:rgba(74,155,110,0.15); color:var(--green); margin-left:6px; }
  .match-tag.isin{ background:rgba(126,168,201,0.18); color:#7EA8C9; }
  .import-group{ border:1px solid var(--line); border-radius:6px; padding:12px 14px; margin-top:12px; background:var(--panel-2); }
  .import-group h4{ font-family:var(--serif); font-size:14px; margin-bottom:8px; }
  .pw-row{ display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; margin-top:10px; }
  .live-status{ display:block; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:3px; }
  details.collapsible{ background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:14px 20px; margin-bottom:16px; }
  details.collapsible summary{ cursor:pointer; font-family:var(--serif); font-size:16px; list-style:none; }
  details.collapsible summary::-webkit-details-marker{ display:none; }
  details.collapsible summary::before{ content:'▸ '; color:var(--gold); font-family:var(--mono); }
  details.collapsible[open] summary::before{ content:'▾ '; }
  details.collapsible .details-body{ margin-top:14px; }
  details.collapsible summary .summary-hint{ font-family:var(--mono); font-size:13px; color:var(--muted); font-weight:400; margin-left:4px; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  /* Tab sub-navigation (added 2026-08-11) -- mirrors this module's existing hairline/gold-accent
     language rather than a generic pill-tab component. Horizontally scrollable so it stays usable
     at 375px without wrapping or overflowing off-screen. */
  /* Reviewer-found gap (2026-08-11): at 375px the tab bar overflows (Export & Settings was 0%
     visible) with nothing hinting more tabs exist beyond a mid-word cut. .tab-bar-wrap's ::after is a
     right-edge fade shown only while the bar actually overflows (JS toggles .has-overflow), so wide
     screens where every tab already fits show no fade at all. */
  .tab-bar-wrap{ position:relative; margin-bottom:22px; }
  /* var(--bg) is the actual page background in both themes (body's own background, which
     main.content never overrides) -- not var(--panel), which is only for cards. */
  .tab-bar-wrap.has-overflow::after{ content:''; position:absolute; top:0; right:0; bottom:1px; width:28px; background:linear-gradient(to right, transparent, var(--bg) 85%); pointer-events:none; }
  .tab-bar{ display:flex; gap:4px; overflow-x:auto; border-bottom:1px solid var(--line); -webkit-overflow-scrolling:touch; scrollbar-width:thin; }
  .tab-btn{ flex:0 0 auto; background:transparent; border:none; border-bottom:2px solid transparent; color:var(--muted); font-family:var(--mono); font-size:13px; padding:10px 16px; cursor:pointer; white-space:nowrap; transition:color .12s, border-color .12s; }
  .tab-btn:hover{ color:var(--text); }
  .tab-btn.active{ color:var(--gold); border-bottom-color:var(--gold); font-weight:600; }
  @media (max-width:760px){
    main.content{ padding:16px; }
    .card{ padding:14px 16px; }
    body{ font-size:16px; }
    .panel-header h2{ font-size:21px; }
    .panel-header p.desc{ font-size:14.5px; }
    .panel-header .eyebrow{ font-size:13px; }
    .brand h1{ font-size:16px; }
    .brand .sub{ font-size:13px; }
    .field label{ font-size:13px; }
    .field input, .field select, textarea{ font-size:16px; padding:9px 10px; } /* 16px also avoids iOS auto-zoom-on-focus */
    .btn{ font-size:14px; padding:10px 16px; }
    .btn.small{ font-size:13px; padding:9px 13px; }
    .btn.tiny{ font-size:13px; padding:6px 10px; }
    .helptext{ font-size:13.5px; }
    .result-box .verdict{ font-size:24px; }
    .result-box .verdict-detail{ font-size:14px; }
    .stat-tile .stat-value{ font-size:22px; }
    .stat-tile .stat-label{ font-size:13px; }
    .legend .item{ font-size:13px; }
    .acct-chip{ font-size:13.5px; }
    .acct-chip .cur{ font-size:13px; }
    .tag{ font-size:13px; }
    .cell-muted{ font-size:13px; }
    details.collapsible summary{ font-size:15px; }
    details.collapsible summary .summary-hint{ display:block; margin-left:0; margin-top:3px; }
    .notice{ font-size:13px; }
    .live-status{ max-width:none; white-space:normal; }
    /* Holdings-style tables become stacked label/value cards instead of a horizontally
       scrolling table on phone widths -- avoids horizontal scroll entirely rather than
       just shrinking text further. */
    .table-scroll{ overflow-x:visible; }
    table.day-table{ min-width:0; font-size:14px; }
    table.day-table thead{ display:none; }
    table.day-table, table.day-table tbody, table.day-table tr{ display:block; width:100%; }
    table.day-table tr{ border:1px solid var(--line); border-radius:6px; padding:6px 10px; margin-bottom:10px; background:var(--panel-2); }
    table.day-table tr:last-child{ margin-bottom:0; }
    table.day-table td{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); white-space:normal; text-align:right; }
    table.day-table tr td:last-child{ border-bottom:none; }
    table.day-table td[data-label]::before{ content:attr(data-label); font-size:13px; text-transform:uppercase; letter-spacing:0.4px; color:var(--muted); font-weight:600; text-align:left; flex-shrink:0; }
    table.day-table td[data-label=""]::before{ content:none; }
    table.day-table td[data-label=""]{ justify-content:flex-end; }
    table.day-table input[type="number"], table.day-table input[type="date"]{ width:110px; font-size:14px; }
    .cp-cell{ display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
    .tab-btn{ font-size:14px; padding:11px 14px; }
  }
</style>
<!-- SheetJS (Excel import) and PDF.js (CAS PDF import) are self-hosted under ./lib/ but are
     deliberately NOT loaded here -- 814KB combined, and most page views never touch either
     feature. They're lazy-loaded on demand (see ensureXlsxLoaded/ensurePdfJsLoaded below),
     triggered the first time the relevant panel is opened. -->
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="seal">📈</div>
      <div>
        <h1>Portfolio Tracker</h1>
        <div class="sub">Financial OS · holdings, allocation, performance — 4 accounts, one view</div>
      </div>
    </div>
    <div class="topbar-actions">
      <a class="btn small ghost" href="../">← Financial OS</a>
      <a class="btn small ghost" href="../networth/">Net Worth</a>
      <button class="btn small ghost" id="themeToggleBtn">☀ Light mode</button>
      <button class="btn small ghost" id="exportBtn">Export</button>
      <button class="btn small ghost" id="importBtn">Import</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </div>
  </header>
  <main class="content" id="content"></main>
</div>

<script>
const STORAGE_KEY = 'portfolio_data_v1';
function defaultData(){
  return {
    accounts: [
      {id:'axis_direct', name:'Axis Direct', country:'IN', currency:'INR'},
      {id:'tradejini',   name:'Tradejini',    country:'IN', currency:'INR'},
      {id:'angel_one',   name:'Angel One',    country:'IN', currency:'INR'},
      {id:'vested_us',   name:'Vested (US)',  country:'US', currency:'USD'},
    ],
    holdings: [], // {id, symbol, broker(account id), assetType, qty, buyPrice, buyDate, currentPrice, asOf}
    fx: { usdInr: '', asOf: '' }, // manual USD->INR rate, entered by user -- no live feed (see Known gaps)
    // Realized/sold-position records (added 2026-08-10, roadmap item 4's stated prerequisite).
    // {id, symbol, broker(account id), assetType, isin, qty, buyPrice(|null -- unknown cost basis,
    // e.g. a CAS-imported holding that was sold before its Buy Price was ever filled in), buyDate(|''),
    // sellDate, sellPrice, soldAt}. A partial sale reduces the source holding's qty and pushes one of
    // these; a full sale removes the holding from data.holdings entirely and pushes one of these
    // carrying the holding's full original qty. Cost basis is always the source holding's single
    // Avg Price at the moment of sale (this module doesn't track multiple buy-lots per holding --
    // same limitation the holdings table's "Avg Price" naming already documents), not a true FIFO
    // per-lot cost basis.
    soldLots: [],
  };
}
function loadData(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : defaultData(); }
  catch(e){ return defaultData(); }
}
let data = loadData();
// Backfill in case an older/imported file predates a field.
if(!Array.isArray(data.accounts) || data.accounts.length===0) data.accounts = defaultData().accounts;
if(!Array.isArray(data.holdings)) data.holdings = [];
if(!data.fx) data.fx = { usdInr:'', asOf:'' };
if(!Array.isArray(data.soldLots)) data.soldLots = [];
function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function newId(prefix){ return prefix + '_' + Date.now() + '_' + Math.floor(Math.random()*1000); }

// ---------- Tab sub-navigation (added 2026-08-11) ----------
// The page grew to 17 stacked sections over several sessions; this groups them into tabs the way
// Value Research's "My Investments" (and every other mature portfolio manager) does, instead of one
// long scroll. Reorganization only -- no render function's internal markup/math changed, only which
// container each one gets appended into and whether that container is currently visible.
//
// Switching tabs deliberately does NOT call the full render() (which does content.innerHTML='' and
// rebuilds everything from scratch) -- it only toggles CSS display on already-built panes via
// applyTabVisibility(). All 4 panes are always fully built on every render() (data-mutation-driven,
// same as before this change), just hidden/shown -- so merely clicking between tabs can never wipe
// an in-progress "Add a holding" / "Record a sale" / what-if form the way a fresh render() would
// (the same class of bug found and fixed in goals/index.html). A real state change (adding a
// holding, recording a sale, etc.) still calls the full render() exactly as it always did, and still
// resets any *other* section's unsubmitted input -- that's pre-existing behavior across sections on
// this page (see Known gaps #6) and out of scope for this reorganization to fix.
let activeTab = 'dashboard';
const TABS = [
  { id:'dashboard', label:'Dashboard' },
  { id:'holdings',  label:'Holdings' },
  { id:'gains',     label:'Gains & What-If' },
  { id:'accounts',  label:'Accounts & Settings' },
];
function renderTabBar(container){
  const wrap = document.createElement('div');
  wrap.className = 'tab-bar-wrap';
  const bar = document.createElement('div');
  bar.className = 'tab-bar';
  bar.setAttribute('role','tablist');
  TABS.forEach(t=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tab-btn' + (activeTab===t.id ? ' active' : '');
    btn.textContent = t.label;
    btn.dataset.tabId = t.id;
    btn.setAttribute('role','tab');
    btn.setAttribute('aria-selected', activeTab===t.id ? 'true' : 'false');
    btn.onclick = ()=> switchTab(t.id);
    bar.appendChild(btn);
  });
  wrap.appendChild(bar);
  container.appendChild(wrap);
  updateTabBarOverflow(wrap, bar);
  // Re-check on resize (rotating a phone, or a desktop window shrinking) rather than only at
  // first render -- an overflow state computed once could go stale.
  window.addEventListener('resize', ()=> updateTabBarOverflow(wrap, bar));
}
function updateTabBarOverflow(wrap, bar){
  const overflowing = bar.scrollWidth > bar.clientWidth + 1;
  wrap.classList.toggle('has-overflow', overflowing);
}
function switchTab(tabId){
  if(tabId === activeTab) return;
  activeTab = tabId;
  applyTabVisibility();
}
function applyTabVisibility(){
  document.querySelectorAll('.tab-pane').forEach(pane=>{
    pane.style.display = (pane.dataset.tab === activeTab) ? '' : 'none';
  });
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    const isActive = btn.dataset.tabId === activeTab;
    btn.classList.toggle('active', isActive);
    btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
  });
}

let brokerFilter = 'all';
let liveSettingsOpen = false; // persists the collapsible "Live prices" panel's open/closed state across render() rebuilds
let bulkAddOpen = false;      // same, for the collapsible bulk-add/advanced entry panel
let casImportOpen = false;    // same, for the collapsible CAS PDF import panel
let holdingsSort = { key: null, dir: 1 }; // click-to-sort state for the holdings table (Symbol/Qty/Value/Gain-Loss)
// Sold-lots table (Realized Gains & What-If tab) defaults to showing only the most recent
// SOLD_LOTS_COLLAPSE_THRESHOLD lots once there are enough to be worth collapsing -- see the
// "sold-hidden-by-default toggle" reasoning in portfolio/PROGRESS.md's 2026-08-11 entry. Unlike
// Value Research's reference (whose open-holdings table can contain fully-exited positions inline),
// this module already structurally removes a fully-sold holding from data.holdings, so the only
// remaining place a "declutter historical data" toggle genuinely helps is here, once someone has
// recorded many sales over time.
let soldLotsShowAll = false;
const SOLD_LOTS_COLLAPSE_THRESHOLD = 10;

// Guided "Add a holding" form's transient state -- last-used broker/asset type are remembered
// (not persisted to storage) so adding several holdings in a row doesn't require re-picking the
// same broker every time; feedback text is a module-level var, not set on a stale detached DOM
// node, so it actually survives the render() rebuild that happens right after adding.
let addFormLastBroker = null;
let addFormLastType = 'Stock';
let addFormFeedbackMsg = { text: '', isError: false };
let bulkAddFeedbackMsg = ''; // same fix applied to the bulk-paste entry panel below

// "Record a sale" guided form's transient state -- which holding is currently selected (module
// var, not persisted) and the feedback message, same fix pattern as addFormFeedbackMsg above
// (set on a module-level var, read back in on the next render(), never written onto a DOM node
// that render()'s content.innerHTML='' is about to detach).
let saleFormHoldingId = null;
let saleFormFeedbackMsg = { text: '', isError: false };

// "Simulate a sale" what-if tax calculator's transient state -- purely computational, never
// mutates data.holdings/data.soldLots (see renderWhatIfSaleSection below). whatIfHoldingId starts
// `null` so the first render can seed sensible defaults for whichever holding ends up selected;
// whatIfPoolOverride is `null` when the user hasn't overridden the auto-computed "already realized
// Sec 112A LTCG this FY" figure, else the number they typed. whatIfNote is a free-text scratch
// field ("Considering switching to: ___") for the user's own reference only -- deliberately never
// saved to data/localStorage and never computed against, since this tool doesn't evaluate switch
// destinations, only the tax cost of exiting the current holding.
let whatIfHoldingId = null;
let whatIfQty = '';
let whatIfSellPrice = '';
let whatIfSellDate = '';
let whatIfPoolOverride = null;
let whatIfNote = '';

// Excel (.xlsx/.xls) import: transient, in-memory only -- holds the detected column mapping and
// parsed rows for a chosen file, awaiting user confirmation before anything is committed to
// data.holdings. null when no file is being previewed. See handleExcelFileSelected() below.
let xlsxImport = null;

// CAS (NSDL/CDSL demat statement) PDF import: transient, in-memory only. See casImport-related
// functions below (handleCasFileSelected, submitCasPassword, parseCasPdfText) -- kept in one
// clearly isolated section since the CAS text-parsing logic is UNVERIFIED against a real
// statement and is the first thing to revise once a real CAS is available (see PROGRESS.md).
let casImport = null;
function resetCasImport(){ casImport = { stage:'idle', fileName:'', pdfPasswordUpdate:null, incorrectAttempt:false, errorMsg:'', groups:null, parseFailReason:'' }; }
resetCasImport();

// ---------- lazy-loaded heavy libraries (SheetJS for Excel, PDF.js for CAS PDF import) ----------
// These self-hosted files are 437KB (xlsx.core.min.js) and 377KB (pdf.min.js) -- 814KB combined --
// and previously loaded unconditionally via blocking <script> tags in <head> on EVERY page view,
// even for the majority of visits that never touch Excel or CAS import (measured ~10s to
// interactive on a throttled connection, almost entirely attributable to these two files). Now
// injected on demand via a dynamic <script> tag, cached so a second call is a no-op, and triggered
// as soon as the relevant collapsible panel is opened (not only once a file is actually picked) so
// the library is usually already warm by the time the user gets to choosing a file. pdf.worker.min.js
// is unaffected -- it was already lazy (PDF.js only fetches it once getDocument() actually runs).
const libLoadPromises = {};
function loadScriptOnce(src){
  if(libLoadPromises[src]) return libLoadPromises[src];
  libLoadPromises[src] = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = src;
    s.onload = ()=> resolve();
    s.onerror = ()=> { delete libLoadPromises[src]; reject(new Error(`Failed to load ${src}`)); };
    document.head.appendChild(s);
  });
  return libLoadPromises[src];
}
let xlsxLoadState = 'idle'; // 'idle' | 'loading' | 'ready' | 'error' -- read by renderXlsxImportPreview
let xlsxLoadErrorMsg = '';
async function ensureXlsxLoaded(){
  if(typeof XLSX !== 'undefined'){ xlsxLoadState = 'ready'; return true; }
  if(xlsxLoadState !== 'loading' && xlsxLoadState !== 'ready'){ xlsxLoadState = 'loading'; xlsxLoadErrorMsg = ''; render(); }
  try{ await loadScriptOnce('./lib/xlsx.core.min.js'); xlsxLoadState = 'ready'; }
  catch(err){ xlsxLoadState = 'error'; xlsxLoadErrorMsg = err && err.message ? err.message : String(err); }
  render();
  return xlsxLoadState === 'ready';
}
let pdfjsLoadState = 'idle'; // same states, for pdf.min.js -- read by renderCasBody
let pdfjsLoadErrorMsg = '';
async function ensurePdfJsLoaded(){
  if(typeof pdfjsLib !== 'undefined'){ pdfjsLoadState = 'ready'; return true; }
  if(pdfjsLoadState !== 'loading' && pdfjsLoadState !== 'ready'){ pdfjsLoadState = 'loading'; pdfjsLoadErrorMsg = ''; render(); }
  try{
    await loadScriptOnce('./lib/pdf.min.js');
    // One-time setup PDF.js needs right after it becomes available -- previously ran as a
    // synchronous top-level check at page load, which only worked because the <script> tag was
    // blocking. Now it must run right after THIS load resolves instead, not at page-init time.
    pdfjsLib.GlobalWorkerOptions.workerSrc = './lib/pdf.worker.min.js';
    pdfjsLoadState = 'ready';
  }catch(err){ pdfjsLoadState = 'error'; pdfjsLoadErrorMsg = err && err.message ? err.message : String(err); }
  render();
  return pdfjsLoadState === 'ready';
}

// ---------- duplicate-holding detection, shared by every import path ----------
// A holding already in the portfolio is treated as a match for an incoming one if either:
//   - both carry an ISIN and the ISINs match (case-insensitive) -- ISIN is the one
//     broker-independent identifier a CAS always carries, so it's the strongest signal available.
//   - one or both sides lack a usable ISIN, in which case broker + symbol match
//     case-insensitively -- the fallback for Excel/paste imports, which usually don't carry an
//     ISIN at all.
// Returns the matching holding's index in data.holdings, or -1 if nothing matches. Used by the CAS
// import (update-in-place refresh, see renderCasBody), Excel import and bulk paste (skip-duplicates,
// default on) commit paths -- so importing the same document twice doesn't silently double the
// portfolio's value/gain totals.
function normalizeSymbolForMatch(s){
  // .trim() alone still leaves "RELIANCE  INDUSTRIES" (double space) failing to match
  // "RELIANCE INDUSTRIES" (single space) -- collapse internal whitespace runs too.
  return (s || '').trim().replace(/\s+/g, ' ').toUpperCase();
}
function findDuplicateHoldingIndex(candidate){
  const candIsin = (candidate.isin || '').trim().toUpperCase();
  const candSymbol = normalizeSymbolForMatch(candidate.symbol);
  for(let i=0;i<data.holdings.length;i++){
    const h = data.holdings[i];
    const hIsin = (h.isin || '').trim().toUpperCase();
    if(candIsin && hIsin){
      if(candIsin === hIsin) return i;
      continue; // both sides have an ISIN and they differ -- definitely not the same holding
    }
    if(h.broker === candidate.broker && normalizeSymbolForMatch(h.symbol) === candSymbol) return i;
  }
  return -1;
}

// ---------- shared paste/file helpers, same pattern as every other module ----------
// 2026-08-11, THIRD ROUND (safe-by-construction rewrite). Two prior same-day fixes each patched
// one reported failure shape while leaving the same class of silent corruption possible -- see
// itrgenie/index.html's shared paste helpers for the full writeup (round 1's unconditional
// whole-line regex collapse, round 2's "validated fallback" that still had no upper-bound check
// and could fuse across a real column separator, live-reproduced on
// "RELIANCE,Zerodha,Equity,10,2,450,01/01/2024,2600,10/08/2026" -- Qty/BuyPrice/BuyDate/etc all
// shift once the collapse crosses the boundary between "10" and the thousands-grouped "2,450").
// parseNumericCell() (already defined below for the Excel fuzzy importer) is reused for the plain
// paste box's own numeric columns too, so "₹1,450" and "1450" both work there, not just Excel.
//
// Rewrite: naive comma-split first; if it already matches what the box expects
// (8: Symbol,Broker,AssetType,Qty,BuyPrice,BuyDate,CurrentPrice,AsOf -- last two optional, minCols
// 6), done, no merge attempted. If it overshoots, resolveThousandsMerge() enumerates every way to
// merge ADJACENT pieces into a span that is a COMPLETE, correctly-shaped grouped number
// end-to-end (Indian: 1-2 digits then 2-digit groups then one 3-digit group; Western: 1-3 digits
// then 3-digit groups) -- never a loose "both sides look short" guess. A merge is only applied if
// EXACTLY ONE combination lands the column count on expectedCols or minCols -- zero or multiple
// valid combinations both mean "don't guess", and the row is returned empty so the caller's own
// `cols.length < N` check honestly skips it (see itrgenie/index.html for the full design, same
// shared helper shape kept identical across modules per this repo's self-contained-module
// convention).
// 2026-08-11, ROUND 4: one fix applied, one investigated and REVERTED, on top of the round-3
// mechanism above -- see itrgenie/index.html's shared paste helpers for the full writeup (this is
// the same shared helper shape kept identical across modules per this repo's self-contained-module
// convention). (1) APPLIED: a genuinely negative grouped number (e.g. a real capital LOSS) was
// never recognized as a merge candidate at all -- GROUPED_WESTERN/GROUPED_INDIAN/spanValid() now
// accept an optional leading "-" the same way they already accept ₹/$. (2) INVESTIGATED, NOT
// applied: a fix that made resolveThousandsMerge() prefer an ordinary "complete" naive reading
// outright (naive split already lands on the box's full expected shape) was built and fuzz-tested
// at 60,000 trials -- it produced real silently-wrong results whenever an optional trailing field is
// genuinely omitted AND the remaining value is itself thousands-grouped (a naive-preferring shortcut
// can't structurally tell that apart from a merely-coincidental pairwise collision, e.g. qty "10"
// next to price "200" also reading as grouped "10,200"). Reverted rather than shipped
// partially-safe; resolveThousandsMerge() still ends in the same strict "unique.length !== 1 --
// don't guess" rule round 3 shipped with, unchanged -- an ordinary complete row with a coincidental
// mergeable pair is still honestly skipped as ambiguous, a known open gap, not a new regression,
// same as round 3's own confirmed-ambiguous "RELIANCE,Zerodha,Equity,10,2,450,01/01/2024" case.
const GROUPED_WESTERN = /^-?(₹|\$)?\d{1,3}(,\d{3})+(\.\d+)?$/;        // 1,234,567 or -1,234,567.50
const GROUPED_INDIAN  = /^-?(₹|\$)?\d{1,2}(,\d{2})*,\d{3}(\.\d+)?$/;  // 12,00,000 or -4,50,000.25
function resolveThousandsMerge(naive, targets){
  const n = naive.length;
  function spanValid(i, j){
    if(i===j) return true;
    for(let k=i;k<j;k++){ if(!/^-?(₹|\$)?\d{1,3}$/.test(naive[k])) return false; }
    if(!/^\d{1,3}(\.\d+)?$/.test(naive[j])) return false;
    const joined = naive.slice(i, j+1).join(',');
    return GROUPED_WESTERN.test(joined) || GROUPED_INDIAN.test(joined);
  }
  const spanEnds = [];
  for(let i=0;i<n;i++){
    spanEnds[i] = [];
    for(let j=i;j<n;j++){ if(spanValid(i,j)) spanEnds[i].push(j); }
  }
  const targetSet = new Set(targets);
  const maxTarget = Math.max(...targets);
  const results = [];
  let explored = 0;
  const EXPLORE_CAP = 5000;
  let capped = false;
  (function dfs(i, acc){
    if(capped) return;
    if(++explored > EXPLORE_CAP){ capped = true; return; }
    if(acc.length > maxTarget) return;
    if(i===n){ if(targetSet.has(acc.length)) results.push(acc.slice()); return; }
    for(const j of spanEnds[i]){
      acc.push(naive.slice(i, j+1).join(','));
      dfs(j+1, acc);
      acc.pop();
    }
  })(0, []);
  if(capped) return null;
  const unique = Array.from(new Set(results.map(r=>JSON.stringify(r)))).map(s=>JSON.parse(s));
  // ROUND 4, finding 2 -- investigated, NOT applied: see itrgenie/index.html's resolveThousandsMerge()
  // for the full writeup. A "prefer the untouched reading when it already reaches a valid target"
  // shortcut was tried (two versions) and re-verified with a 60,000-trial fuzz across every
  // optional-trailing-field box in this app -- both produced real silently-wrong results (not rare
  // edge cases) whenever an optional field is genuinely omitted and the remaining value is itself a
  // thousands-grouped number. No purely structural rule can safely tell "coincidental collision"
  // apart from "genuine field omission" here, so the shortcut was reverted rather than shipped
  // partially-safe -- flagged for a properly-scoped future fix needing per-field type awareness.
  if(unique.length !== 1) return null;
  return unique[0].map(s=>s.replace(/,/g,''));
}
// Every whole count from minCols up to expectedCols is offered as a valid target, not just the
// two endpoints -- a box with more than one independently-optional trailing field can legitimately
// land on a count in between.
//
// IMPORTANT: this always runs the merge search, even when the naive split's raw piece count
// already sits inside [minCols, expectedCols] and looks plausible on its own -- a thousands-
// grouped number can coincidentally split a row down to a count that still lands in range while
// fusing the wrong two fields together (see itrgenie/index.html's splitPastedLine for the
// live-reproduced example: a genuinely grouped price landing an 8-col Portfolio row at 7 pieces,
// "in range" for its 6-8 window, while actually misreading BuyPrice/BuyDate/CurrentPrice).
// resolveThousandsMerge() always includes the untouched naive split itself as one candidate
// reading, so a row with nothing to merge still resolves to the same naive result as before.
function splitPastedLine(line, expectedCols, minCols){
  const naive = line.split(',').map(c=>c.trim());
  if(!expectedCols) return naive;
  const floor = minCols || expectedCols;
  const targets = [];
  for(let t=floor; t<=expectedCols; t++) targets.push(t);
  const resolved = resolveThousandsMerge(naive, targets);
  return resolved || [];
}
function parsePastedRows(text, expectedCols, minCols){
  const rows = text.split('\n').map(l=>l.trim()).filter(l=>l.length>0)
    .map(line=>{
      const hasTab = line.includes('\t');
      return hasTab ? line.split('\t').map(c=>c.trim()) : splitPastedLine(line, expectedCols, minCols);
    });
  rows.ambiguousCount = rows.filter(r=>r.length===0).length;
  return rows;
}
function skipNote(rows){
  const n = rows && rows.ambiguousCount;
  return n>0 ? ` (${n} of those: couldn't tell where the columns split -- try a tab-separated paste copied straight from a spreadsheet, or add a space after each comma)` : '';
}
// CSV/TXT still flow through the textarea + Parse&Add pipeline exactly as before (unchanged).
// .xlsx/.xls are real binary Excel files -- readAsText on those produces garbage, so they're
// routed to handleExcelFileSelected() instead, which does real SheetJS parsing + fuzzy column
// detection and shows a mapping preview before anything is committed (see below).
function wireFileUpload(fileInputEl, textareaEl, parseBtnEl){
  fileInputEl.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const name = file.name.toLowerCase();
    if(name.endsWith('.xlsx') || name.endsWith('.xls')){
      handleExcelFileSelected(file);
      fileInputEl.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = (ev)=>{ textareaEl.value = ev.target.result; parseBtnEl.click(); fileInputEl.value=''; };
    reader.readAsText(file);
  };
}

// ---------- account resolution ----------
// Matches pasted broker text against the 4 known accounts (and any custom ones already
// added); if nothing matches, auto-creates a new account rather than silently dropping the
// row -- real data over guesses, but doesn't force the user to pre-register every account name.
function resolveBrokerId(text){
  const t = (text||'').trim().toLowerCase();
  if(!t) return null;
  const aliases = {
    axis_direct: ['axis direct','axisdirect','axis'],
    tradejini:   ['tradejini','trade jini'],
    angel_one:   ['angel one','angelone','angel'],
    vested_us:   ['vested-us','vested us','vestedus','vested'],
  };
  for(const [id, names] of Object.entries(aliases)){
    if(names.includes(t)) return id;
  }
  const exact = data.accounts.find(a=>a.id.toLowerCase()===t || a.name.toLowerCase()===t);
  if(exact) return exact.id;
  const isUSD = /usd|\$|us[- ]?listed/i.test(text);
  const id = newId('acct');
  data.accounts.push({id, name: text.trim(), country: isUSD?'US':'IN', currency: isUSD?'USD':'INR'});
  return id;
}
function accountOf(brokerId){
  return data.accounts.find(a=>a.id===brokerId) || {id:brokerId, name:brokerId, country:'IN', currency:'INR'};
}
// Normalizes free text (from a paste, not a strict dropdown value) to one of the 4 asset types
// this module actually models. Returns null -- never a guess -- if nothing recognizable matches,
// so a caller like the "Add a holding" quick-fill leaves the dropdown at its existing value
// instead of silently picking the wrong type.
function guessAssetTypeFromText(text){
  const t = (text||'').trim().toLowerCase();
  if(!t) return null;
  if(/mutual|^mf$|\bmf\b/.test(t)) return 'Mutual Fund';
  if(/etf/.test(t)) return 'ETF';
  if(/stock|equity|share/.test(t)) return 'Stock';
  if(/other/.test(t)) return 'Other';
  return null;
}

// ---------- money formatting ----------
function formatMoney(amount, currency){
  if(amount===null || amount===undefined || isNaN(amount)) return '—';
  const symbol = currency==='USD' ? '$' : '₹';
  const locale = currency==='USD' ? 'en-US' : 'en-IN';
  return symbol + amount.toLocaleString(locale, {maximumFractionDigits:2});
}
// Manual FX conversion only -- see Known gaps card. Returns null (not 0) when a USD
// amount can't be converted, so callers can distinguish "zero" from "unknown".
function toINR(amount, currency){
  if(currency==='INR') return amount;
  const rate = parseFloat(data.fx.usdInr);
  if(!rate || rate<=0) return null;
  return amount*rate;
}

// ---------- live prices (Tier 1: Yahoo · Tier 1b: Stooq · Tier 2: Twelve Data, optional key) ----------
// Twelve Data key is stored in its OWN localStorage key, deliberately separate from
// portfolio_data_v1 -- so it never gets bundled into the Export JSON backup file and
// accidentally shared. Never hardcoded, never committed.
const LIVE_KEY_STORAGE = 'portfolio_livekey_v1';
function getTwelveDataKey(){ try{ return (localStorage.getItem(LIVE_KEY_STORAGE) || '').trim(); }catch(e){ return ''; } }
function setTwelveDataKey(k){ try{ if(k) localStorage.setItem(LIVE_KEY_STORAGE, k); else localStorage.removeItem(LIVE_KEY_STORAGE); }catch(e){} }

// Transient, in-memory only (not saved to storage or exported) -- per-holding result of the
// last live-fetch attempt, so the table can show "live ✓" / a clear failure message without
// polluting the persisted data model.
let liveStatusById = {};

function delay(ms){ return new Promise(res=>setTimeout(res, ms)); }

// Live refresh is scoped to holdings whose AssetType is a tradeable ticker -- individual
// stocks/equities and ETFs. "Equity" is treated as a synonym for "Stock" because that's this
// module's own default/example AssetType for individual stock holdings (see the Holdings entry
// card's paste format) -- restricting the match to the literal word "Stock" would have left the
// module's own example data unrefreshable. Mutual Fund and everything else stays manual-only,
// visibly marked "manual only (<type>)" in the table rather than silently no-op'd -- fund NAVs
// need AMFI scheme codes, not ticker quotes, and guessing at that mapping would be exactly the
// kind of unverified claim this project's conventions warn against.
function isRefreshable(h){
  const t = (h.assetType || '').trim().toLowerCase();
  return t === 'stock' || t === 'equity' || t === 'etf';
}

// Yahoo needs an exchange suffix for NSE-listed symbols (RELIANCE -> RELIANCE.NS); Vested-US
// (or any USD account) uses the plain ticker. If the symbol already looks like it has a suffix
// (e.g. user already typed RELIANCE.NS or TCS.BO), leave it alone rather than double-suffixing.
function yahooSymbolFor(h){
  const acc = accountOf(h.broker);
  let sym = (h.symbol || '').trim().toUpperCase();
  if(acc.currency === 'INR' && !/\.[A-Z]{1,4}$/.test(sym)) sym = sym + '.NS';
  return sym;
}
// Twelve Data takes the exchange as a separate query param instead of a symbol suffix -- do
// NOT reuse the Yahoo-suffixed symbol here, that's a different provider's convention.
function twelveDataParamsFor(h){
  const acc = accountOf(h.broker);
  const symbol = (h.symbol || '').trim().toUpperCase();
  const exchange = acc.currency === 'INR' ? 'NSE' : '';
  return { symbol, exchange };
}
// Stooq needs its own suffix convention, separate from Yahoo's -- lowercase symbol + '.us' is
// Stooq's documented, confirmed-working format for US tickers (e.g. 'aapl.us'). Its NSE/Indian
// coverage and the exact suffix it expects for NSE symbols is NOT confirmed -- '.in' below is a
// best-effort guess based on Stooq's general country-suffix convention, not verified against
// real NSE data (see portfolio/PROGRESS.md). If the symbol already looks suffixed, leave it alone.
function stooqSymbolFor(h){
  const acc = accountOf(h.broker);
  let sym = (h.symbol || '').trim().toLowerCase();
  if(!sym) return sym;
  if(/\.[a-z]{1,4}$/i.test(sym)) return sym;
  return acc.currency === 'INR' ? sym + '.in' : sym + '.us';
}

// ---- Tier 1: Yahoo Finance public chart endpoint, no API key ----
// Built defensively: tries query1 then query2 (Yahoo runs both as redundant hosts), validates the
// response shape before trusting it, and always throws a descriptive error rather than
// returning a bad/NaN price on any failure (CORS block, HTTP error, endpoint change, garbage
// JSON, missing field). Confirmed broken in at least one real browser (user report, 2026-08-09)
// -- see portfolio/PROGRESS.md -- which is why Stooq (Tier 1b, below) and the failure-message
// pointer to Twelve Data exist.
async function fetchQuoteYahoo(symbol){
  const hosts = ['query1.finance.yahoo.com', 'query2.finance.yahoo.com'];
  let lastErr = new Error('Yahoo fetch failed');
  for(const host of hosts){
    try{
      const url = `https://${host}/v8/finance/chart/${encodeURIComponent(symbol)}`;
      const res = await fetch(url);
      if(!res.ok) throw new Error(`HTTP ${res.status} from ${host}`);
      const json = await res.json();
      if(json && json.chart && json.chart.error) throw new Error(json.chart.error.description || 'Yahoo returned an error');
      const result = json && json.chart && json.chart.result && json.chart.result[0];
      const price = result && result.meta && result.meta.regularMarketPrice;
      if(price === undefined || price === null || typeof price !== 'number' || isNaN(price) || price <= 0){
        throw new Error('No usable price field in Yahoo response');
      }
      return { price, source: 'Yahoo Finance' };
    }catch(e){ lastErr = e; }
  }
  throw new Error(`Yahoo: ${lastErr.message}`);
}

// ---- Tier 1b: Stooq, second no-key attempt before pointing the user at Twelve Data ----
// A real, commonly used free/no-key CSV quote source. Built in the same defensive style as
// fetchQuoteYahoo: validate the CSV shape and the price field before trusting it, throw rather
// than return a garbage/"N/D" price. UNVERIFIED against real NSE data (see stooqSymbolFor above
// and portfolio/PROGRESS.md) -- treat this as a second best-effort attempt, not a guarantee.
async function fetchQuoteStooq(symbol){
  const url = `https://stooq.com/q/l/?s=${encodeURIComponent(symbol)}&f=sd2t2ohlcv&h&e=csv`;
  const res = await fetch(url);
  if(!res.ok) throw new Error(`HTTP ${res.status} from Stooq`);
  const text = (await res.text()).trim();
  if(!text) throw new Error('Empty response from Stooq');
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  // f=sd2t2ohlcv with the 'h' header flag prepends a "Symbol,Date,Time,Open,High,Low,Close,Volume"
  // header row -- skip it and use the actual data row.
  const dataLine = lines.find(l=> !/^symbol,/i.test(l)) || lines[lines.length-1];
  const cols = dataLine.split(',');
  if(cols.length < 7) throw new Error('Unexpected response shape from Stooq');
  const closeRaw = (cols[6] || '').trim();
  const price = parseFloat(closeRaw);
  if(!closeRaw || closeRaw.toUpperCase() === 'N/D' || isNaN(price) || price <= 0){
    throw new Error('No usable price in Stooq response (symbol likely unsupported)');
  }
  return { price, source: 'Stooq' };
}

// ---- Tier 2: Twelve Data, optional bring-your-own-key ----
// Same safe pattern as the earlier prototype: fetch, parse, treat any error/status field or
// unusable price as a failure rather than trusting the payload blindly.
async function fetchQuoteTwelveData(symbol, exchange, apiKey){
  if(!apiKey) throw new Error('No Twelve Data API key set');
  const params = new URLSearchParams({ symbol, apikey: apiKey });
  if(exchange) params.set('exchange', exchange);
  const url = `https://api.twelvedata.com/quote?${params.toString()}`;
  const res = await fetch(url);
  const json = await res.json();
  if(json.status === 'error' || json.code) throw new Error(json.message || 'Twelve Data quote failed');
  const price = parseFloat(json.close);
  if(isNaN(price) || price <= 0) throw new Error('No usable price in Twelve Data response');
  return { price, source: 'Twelve Data' };
}

// One small isolated function per provider above (fetchQuoteYahoo, fetchQuoteStooq,
// fetchQuoteTwelveData) so a future fourth provider is a contained addition here, not a rewrite
// of this orchestrator. If a Twelve Data key is set, it's tried first (the user opted into the
// "more reliable" tier on purpose); Yahoo and then Stooq (both no-setup, no key) are tried either
// way. Never let a bad response from any provider reach the caller -- always throw, never return
// a garbage price. When every attempt fails, the thrown error is written to point the user
// straight at the one path confirmed to work (Twelve Data) instead of leaving them with an
// opaque error string -- see the "suggestTwelveData" flag consumed by the UI below.
async function fetchLivePrice(h){
  const key = getTwelveDataKey();
  const attempts = [];
  if(key) attempts.push({ name:'Twelve Data', run: ()=>{
    const { symbol, exchange } = twelveDataParamsFor(h);
    return fetchQuoteTwelveData(symbol, exchange, key);
  }});
  attempts.push({ name:'Yahoo', run: ()=> fetchQuoteYahoo(yahooSymbolFor(h)) });
  attempts.push({ name:'Stooq', run: ()=> fetchQuoteStooq(stooqSymbolFor(h)) });

  const errors = [];
  for(const attempt of attempts){
    try{ return await attempt.run(); }
    catch(e){ errors.push(`${attempt.name}: ${e.message}`); }
  }
  const detail = errors.join(' | ');
  const err = key
    ? new Error(`All live sources failed (${detail}). Check your Twelve Data key in Live Prices settings, or enter the price manually.`)
    : new Error(`Free live sources aren't working right now (${detail}).`);
  err.suggestTwelveData = true; // consumed by liveStatusHtml() / refreshAllLive() to render a direct link to Live Prices settings
  throw err;
}

// Refresh a single holding. Never writes a bad value into currentPrice -- on any failure the
// existing manually-entered price is left completely untouched, only liveStatusById records
// the failure so it's visible, not silent.
async function refreshOneLive(h){
  try{
    const r = await fetchLivePrice(h);
    h.currentPrice = r.price;
    h.asOf = new Date().toISOString().slice(0,10);
    liveStatusById[h.id] = { state:'ok', message:`live via ${r.source}`, at: new Date() };
  }catch(e){
    liveStatusById[h.id] = { state:'error', message: e.message || 'fetch failed', suggestTD: !!e.suggestTwelveData, at: new Date() };
  }
}

// Persisted (in-memory, not storage) across the full DOM rebuild render() does at the end --
// without this, the final "Done — X updated, Y failed" message would be overwritten by the
// rebuild in the same synchronous tick and the user would never actually see it.
let refreshAllStatusMsg = '';

// Refresh every eligible holding, staggered ~350ms apart (same pacing as the earlier prototype)
// so a "refresh all" doesn't hammer either provider or trip a rate limit instantly.
async function refreshAllLive(feedbackEl){
  const refreshable = data.holdings.filter(isRefreshable);
  if(refreshable.length === 0){
    refreshAllStatusMsg = 'No Stock/ETF holdings to refresh — Mutual Fund and other types stay manual-entry only.';
    feedbackEl.textContent = refreshAllStatusMsg;
    return;
  }
  let ok = 0, failed = 0, anySuggestTD = false;
  for(let i=0; i<refreshable.length; i++){
    const h = refreshable[i];
    feedbackEl.textContent = `Refreshing ${i+1} of ${refreshable.length}: ${h.symbol}…`;
    await refreshOneLive(h);
    const s = liveStatusById[h.id];
    if(s && s.state === 'ok'){ ok++; } else { failed++; if(s && s.suggestTD) anySuggestTD = true; }
    if(i < refreshable.length - 1) await delay(350);
  }
  saveData();
  refreshAllStatusMsg = `Done — ${ok} updated, ${failed} failed${failed>0 ? ' (existing manually-entered prices kept for the failed ones).' : '.'}`;
  if(failed>0 && anySuggestTD){
    refreshAllStatusMsg += ` <a href="#live-settings-panel" onclick="openLiveSettings(event)">Free live sources aren't working — add a Twelve Data key ↗</a>`;
  }
  render();
}

// ---------- per-holding and portfolio-level math ----------
// Current value/gain is always computed from currentPrice as it sits in the data model --
// whether that got there by manual entry/re-import or by a successful live refresh (see the
// "live prices" section above) makes no difference to this math; a failed live refresh simply
// never touches currentPrice, so this function never needs to know the difference.
//
// hasBuyPrice matters as of the CAS import path (see above): a CAS gives current qty/value but
// NOT a purchase price, so a CAS-imported holding can genuinely have no buyPrice at all -- unlike
// every other entry path (guided form, paste, Excel), which all require one. Treating a missing
// buyPrice as "0" would silently show that holding's entire current value as "gain", which is a
// real correctness bug (misrepresenting "no cost data" as "free money"), not just a display nit --
// so costBasis/gainAbs/gainPct are `null` (not 0) whenever buyPrice is genuinely unset, and every
// caller below must check hasBuyPrice before summing/displaying gain figures.
function computeHoldingMetrics(h){
  const acc = accountOf(h.broker);
  const currency = acc.currency;
  const qty = +h.qty || 0;
  const hasBuyPrice = h.buyPrice !== '' && h.buyPrice !== null && h.buyPrice !== undefined && !isNaN(+h.buyPrice);
  const buyPrice = hasBuyPrice ? +h.buyPrice : null;
  const hasCurrentPrice = h.currentPrice !== '' && h.currentPrice !== null && h.currentPrice !== undefined && !isNaN(+h.currentPrice);
  const currentPrice = hasCurrentPrice ? +h.currentPrice : (buyPrice !== null ? buyPrice : 0);
  const costBasis = hasBuyPrice ? qty * buyPrice : null;
  const currentValue = qty * currentPrice;
  const gainAbs = hasBuyPrice ? currentValue - costBasis : null;
  const gainPct = hasBuyPrice ? (costBasis > 0 ? (gainAbs / costBasis * 100) : 0) : null;
  return { currency, accountName: acc.name, qty, buyPrice, hasBuyPrice, currentPrice, costBasis, currentValue, gainAbs, gainPct, isStale: !hasCurrentPrice };
}

function computePortfolio(){
  let totalValueINR = 0;       // full current value of every convertible holding -- real, unconditional on buyPrice
  let costForGainINR = 0;      // cost basis, summed ONLY over holdings with a known buy price
  let valueForGainINR = 0;     // current value of that SAME subset -- keeps the gain calc apples-to-apples
  let unconvertedCount = 0;
  let unknownCostCount = 0;    // holdings (e.g. CAS-imported) with no buy price yet -- excluded from cost/gain math
  const byBroker = {};   // brokerId -> {name, currency, valueNative (all), costNativePriced, valueNativePriced, unpricedCount, count}
  const byAssetType = {}; // assetType -> valueINR (only counts holdings that could be converted)

  data.holdings.forEach(h=>{
    const m = computeHoldingMetrics(h);
    if(!byBroker[h.broker]) byBroker[h.broker] = { name: m.accountName, currency: m.currency, valueNative:0, costNativePriced:0, valueNativePriced:0, unpricedCount:0, count:0 };
    const b = byBroker[h.broker];
    b.valueNative += m.currentValue;
    b.count++;
    if(m.hasBuyPrice){ b.costNativePriced += m.costBasis; b.valueNativePriced += m.currentValue; }
    else { b.unpricedCount++; }

    const valINR = toINR(m.currentValue, m.currency);
    if(valINR===null){ unconvertedCount++; return; }
    totalValueINR += valINR;
    byAssetType[h.assetType || 'Other'] = (byAssetType[h.assetType || 'Other'] || 0) + valINR;
    if(m.hasBuyPrice){
      const costINR = toINR(m.costBasis, m.currency);
      if(costINR!==null){ costForGainINR += costINR; valueForGainINR += valINR; }
    } else {
      unknownCostCount++;
    }
  });

  const gainINR = valueForGainINR - costForGainINR;
  const gainPct = costForGainINR > 0 ? (gainINR / costForGainINR * 100) : 0;
  return { totalCostINR: costForGainINR, totalValueINR, gainINR, gainPct, byBroker, byAssetType, unconvertedCount, unknownCostCount };
}

// ---------- realized gains (sold lots) ----------
// Ported/copied deliberately, not referenced cross-module, from itrgenie/index.html's
// holdingPeriodDays() (~line 1556) and computeRowGain() (~line 2485-2496) -- per this repo's
// per-module self-containment convention, and per explicit instruction to match the exact
// boundary behavior rather than re-derive it from general knowledge.
//
// Sec 2(42A) requires an asset be held for MORE than 365 days to qualify long-term -- exactly 365
// days is still short-term. This must be a raw calendar-day difference with NO +1 (unlike the
// inclusive day-counting some other modules use for travel/presence-day counts): a purchase on
// 13-Mar-2025 sold on 13-Mar-2026 is exactly 365 days later, which is NOT "more than 365" and
// must classify short-term.
function holdingPeriodDays(d1, d2){
  const a = new Date(d1), b = new Date(d2);
  return Math.round((b - a) / (1000 * 60 * 60 * 24));
}
const LTCG_HOLDING_DAYS = 365; // Sec 2(42A) boundary -- see holdingPeriodDays() above; keep in sync with itrgenie's ruleSet.ltcgHoldingDays

// A sold lot whose source holding never had a Buy Price (e.g. arrived via CAS import, which never
// carries cost basis -- see the CAS import section above) cannot compute a real gain. Matches
// ITRGenie's computeRowGain() exactly: unknown cost basis returns {gain:null, term:null} for BOTH
// fields, not just gain -- classifying a term without a trustworthy gain figure would be a
// half-honest result, so this deliberately withholds both rather than fabricating either.
function computeSoldLotGain(lot){
  if(lot.buyPrice === null || lot.buyPrice === undefined || lot.buyPrice === '') return { gain: null, term: null };
  const gain = (lot.sellPrice - lot.buyPrice) * lot.qty;
  let term = null;
  if(lot.buyDate && lot.sellDate){
    const days = holdingPeriodDays(lot.buyDate, lot.sellDate);
    term = days > LTCG_HOLDING_DAYS ? 'LongTerm' : 'ShortTerm'; // exactly 365 days -> ShortTerm, per the boundary note above
  }
  return { gain, term };
}

// Aggregates realized gains into INR (same toINR()/unconvertible-USD handling as computePortfolio()
// above -- a sold lot's gain is in its account's native currency, so summing raw numbers across
// INR and USD lots without converting would silently mix currencies). Only classification totals
// (STCG/LTCG) -- no Section 112A exemption, no slab-rate tax, no loss carry-forward: that's
// ITRGenie's domain, this module supplies raw transaction facts only.
function computeRealizedGains(){
  let stcg = 0, ltcg = 0, totalKnownINR = 0, unknownGainCount = 0, unknownTermCount = 0, unconvertedCount = 0;
  data.soldLots.forEach(lot=>{
    const calc = computeSoldLotGain(lot);
    if(calc.gain === null){ unknownGainCount++; return; }
    const currency = accountOf(lot.broker).currency;
    const gainINR = toINR(calc.gain, currency);
    if(gainINR === null){ unconvertedCount++; return; }
    totalKnownINR += gainINR;
    if(calc.term === 'LongTerm') ltcg += gainINR;
    else if(calc.term === 'ShortTerm') stcg += gainINR;
    else unknownTermCount++; // known gain, but no buy date to classify -- excluded from ST/LT split, not guessed as short-term
  });
  return { stcg, ltcg, total: totalKnownINR, unknownGainCount, unknownTermCount, unconvertedCount };
}

// ---------- capital gains feed (Portfolio -> ITRGenie) ----------
// Builds the exact cross-module contract array documented in MASTER_ROADMAP.md:
// {symbol, buydate, selldate, buyprice, sellprice, qty, assetType}[]. buyprice/buydate are left
// `null`/`''`-derived-to-null when the source holding's cost basis was never filled in -- never a
// fabricated 0, matching this module's existing "flag it, don't fabricate it" convention.
function buildCapitalGainsFeed(){
  return data.soldLots.map(lot => ({
    symbol: lot.symbol,
    buydate: lot.buyDate || null,
    selldate: lot.sellDate,
    buyprice: (lot.buyPrice === null || lot.buyPrice === undefined || lot.buyPrice === '') ? null : lot.buyPrice,
    sellprice: lot.sellPrice,
    qty: lot.qty,
    assetType: lot.assetType || 'Other',
  }));
}
// True only for Mutual Fund rows -- everything else (Stock/ETF/Equity/Other/anything else a user
// typed via bulk paste) is treated as equity-like and safe for ITRGenie's Equity module paste
// format. Mutual Fund sales need a separate Sec 112A-vs-112 classification (equity-oriented vs.
// debt-oriented fund) that this module has no basis to know -- pasting one into the Equity module
// would make ITRGenie confidently compute a wrong tax number for that row, so the paste-ready-lines
// shortcut below must never include one, matching this module's existing "exclude it and say why"
// pattern used for unconverted USD lots / unknown-cost lots / unknown-term lots elsewhere.
function isMutualFundAssetType(assetType){
  return (assetType || '').trim().toLowerCase() === 'mutual fund';
}

// ---------- what-if sale simulator (roadmap item 4 -- "what's the tax cost if I sold this today") ----------
// Purely computational -- never records a sold lot, never mutates data.holdings/data.soldLots.
// Scoped to domestic (INR) Stock/ETF/Equity/Other open holdings only. Two deliberate exclusions,
// each with an honest explanation shown in-UI rather than a fabricated number:
//   1. Mutual Fund holdings -- a real MF redemption gain depends on the actual CAS/CAMS statement
//      at the time of redemption (post-2023 debt-fund rules, indexation grandfathering, etc. are
//      too fragile to derive from a formula); this is exactly why itrgenie/index.html's
//      CapitalGainsMFModule (~line 2510) requires the user to type in the real gain figure rather
//      than computing it -- a hypothetical future sale has no such statement to read from.
//   2. Foreign-currency holdings (Vested-US / any non-INR account) -- verified directly against
//      itrgenie/index.html's ForeignAssetsModule and its use in the tax computation (~line
//      4809-4818): foreign LTCG is added to the SEPARATE `ltcg112` bucket (still 12.5%, but with NO
//      pooled ₹1,25,000 exemption -- it never joins `ltcg112a`), and foreign STCG is taxed at the
//      person's income SLAB rate (folded into `slabIncomeBase`), not the flat 20% Sec 111A `stcg`
//      bucket. Sec 111A/112A's concessional rates require STT paid on a recognized Indian stock
//      exchange, which a foreign-listed holding doesn't have by definition -- applying this
//      simulator's flat-rate math to one would produce a confidently wrong number, so it's excluded
//      the same honest way Mutual Funds are, pointing at ITRGenie's Foreign Assets (Schedule FA)
//      module instead of guessing at the real foreign-asset holding-period/rate rules.

// Indian financial year: April 1 -- March 31. Returns the FY range containing refDate (a Date or
// ISO date string) as ISO date strings, so it can be string-compared against other ISO dates
// directly (lexicographic comparison on YYYY-MM-DD strings matches chronological order).
function getFinancialYearRange(refDate){
  const d = refDate instanceof Date ? refDate : new Date(refDate);
  const year = d.getFullYear();
  const month = d.getMonth(); // 0 = Jan ... 3 = Apr
  const fyStartYear = month >= 3 ? year : year - 1; // Jan/Feb/Mar belong to the FY that started the PREVIOUS April
  const start = `${fyStartYear}-04-01`;
  const end = `${fyStartYear + 1}-03-31`;
  return { start, end, label: `FY ${fyStartYear}-${String(fyStartYear + 1).slice(2)}` };
}
function isDateInFY(dateStr, fyRange){
  if(!dateStr) return false;
  return dateStr >= fyRange.start && dateStr <= fyRange.end;
}

// A holding is eligible for this simulator's Sec 111A/112A math only if it's not a Mutual Fund AND
// its account is confirmed INR (not foreign/USD) -- see the two-exclusion comment block above.
// Deliberately does NOT go through accountOf(brokerId).currency alone: that helper falls back to
// {currency:'INR'} for a broker id matching no real account (e.g. a hand-edited Export/Import JSON
// with a typo'd broker id), which would silently apply domestic Sec 111A/112A tax to what might
// actually be a foreign holding -- exactly the confidently-wrong-number failure mode this module
// exists to avoid everywhere else. Checking the account genuinely exists first closes that gap.
function isSec112AEligibleHolding(h){
  if(isMutualFundAssetType(h.assetType)) return false;
  if(!data.accounts.some(a=>a.id===h.broker)) return false;
  return accountOf(h.broker).currency === 'INR';
}
// Same eligibility rule, applied to an already-sold lot (used to build the "already realized this
// FY" exemption pool below) -- kept as a separate small function rather than reused verbatim
// because a sold lot and an open holding are different shapes, even though the underlying rule
// (not MF, confirmed INR account) is identical.
function isSec112AEligibleSoldLot(lot){
  if(isMutualFundAssetType(lot.assetType)) return false;
  if(!data.accounts.some(a=>a.id===lot.broker)) return false;
  return accountOf(lot.broker).currency === 'INR';
}

// "Already realized Sec 112A LTCG this FY" -- the shared exemption pool needed to compute the
// MARGINAL tax on a new hypothetical sale, since the ₹1,25,000 exemption is a per-FY pool, not a
// per-transaction allowance. Sums existing data.soldLots that are Sec-112A-eligible (not MF, INR
// account -- see isSec112AEligibleSoldLot above) and classify LongTerm, whose sell date falls
// within the given FY. Deliberately a straight sum, not clamped to >=0 per lot -- this mirrors
// ITRGenie's own `ltcg112a = eqLT + mf112A` aggregation (a plain sum, clamped to >=0 only once,
// right before applying the exemption in `Math.max(0, ltcg112a - 125000)`), so a loss lot within
// the same FY's LTCG bucket correctly nets against a gain lot rather than being silently ignored.
function computeAlreadyRealizedLTCG112AThisFY(fyRange){
  let total = 0, includedCount = 0;
  data.soldLots.forEach(lot=>{
    if(!isSec112AEligibleSoldLot(lot)) return;
    if(!isDateInFY(lot.sellDate, fyRange)) return;
    const calc = computeSoldLotGain(lot);
    if(calc.gain === null || calc.term !== 'LongTerm') return;
    total += calc.gain; // native currency -- always INR here, isSec112AEligibleSoldLot guarantees it
    includedCount++;
  });
  return { total, includedCount };
}

// Core what-if tax computation -- a pure function of the numbers passed in, so it's reusable for
// both the real UI and tests without touching data.holdings/data.soldLots at all. Caller must
// already have confirmed the holding is Sec 112A-eligible (isSec112AEligibleHolding) -- this
// function doesn't re-check that, it just computes the flat-rate capital-gains tax given the
// classification. `alreadyRealizedLTCGThisFY` is the shared exemption-pool figure (the editable
// "already realized this FY" number in the UI), not any property of this specific hypothetical sale.
function computeWhatIfTax({ buyPrice, buyDate, sellPrice, sellDate, qty, alreadyRealizedLTCGThisFY }){
  const gain = (sellPrice - buyPrice) * qty;
  let term = null;
  if(buyDate && sellDate){
    const days = holdingPeriodDays(buyDate, sellDate);
    term = days > LTCG_HOLDING_DAYS ? 'LongTerm' : 'ShortTerm'; // exactly 365 days -> ShortTerm, same boundary as sold lots
  }
  if(term === null) return { gain, term: null, tax: null };
  if(gain <= 0) return { gain, term, tax: 0 }; // a loss (or exactly break-even) sale owes no capital-gains tax
  if(term === 'ShortTerm') return { gain, term, tax: gain * 0.20 }; // Sec 111A, flat, no exemption
  // LongTerm (Sec 112A) -- marginal tax against the shared FY exemption pool.
  const pool = +alreadyRealizedLTCGThisFY || 0;
  const taxableBefore = Math.max(0, pool - 125000);
  const taxableAfter = Math.max(0, pool + gain - 125000);
  const tax = (taxableAfter - taxableBefore) * 0.125;
  return { gain, term, tax, taxableBefore, taxableAfter };
}

// Default sell price shown in the what-if form: the holding's live/last-known Current Price if
// set (this is the same field the live-price-feed feature and manual refresh already write into,
// so "live price if this holding has one" and "last-known/manual price" are the same field, not
// two separate things to track), else its own Buy Price as a fallback, else blank.
function whatIfDefaultSellPrice(h){
  const hasCP = h.currentPrice !== '' && h.currentPrice !== null && h.currentPrice !== undefined && !isNaN(+h.currentPrice);
  if(hasCP) return +h.currentPrice;
  const hasBP = h.buyPrice !== '' && h.buyPrice !== null && h.buyPrice !== undefined && !isNaN(+h.buyPrice);
  return hasBP ? +h.buyPrice : '';
}

function renderPerformanceSummary(container){
  const p = computePortfolio();
  const wrap = document.createElement('div');
  wrap.className = 'stat-grid';

  const gainSign = p.gainINR >= 0 ? '+' : '';
  wrap.innerHTML = `
    <div class="stat-tile accent">
      <div class="stat-label">Current value</div>
      <div class="stat-value">${formatMoney(p.totalValueINR, 'INR')}</div>
    </div>
    <div class="stat-tile">
      <div class="stat-label">Invested (cost basis)</div>
      <div class="stat-value">${formatMoney(p.totalCostINR, 'INR')}</div>
      ${p.unknownCostCount>0 ? `<div class="helptext" style="margin-top:2px;">of holdings with a Buy Price set</div>` : ''}
    </div>
    <div class="stat-tile">
      <div class="stat-label">Total gain / loss</div>
      <div class="stat-value" style="color:${gainColor};">${gainSign}${formatMoney(p.gainINR, 'INR')}</div>
      <div class="helptext" style="margin-top:2px; color:${gainColor};">${gainSign}${p.gainPct.toFixed(1)}%</div>
    </div>
  `;
  container.appendChild(wrap);
  if(p.unconvertedCount>0){
    const note = document.createElement('div');

    note.textContent = `${p.unconvertedCount} USD holding(s) not included above — set the USD → INR rate further down to fold Vested-US in.`;
    container.appendChild(note);
  }
  if(p.unknownCostCount>0){
    const note = document.createElement('div');
    note.className = 'helptext';
    note.style.cssText = 'margin:-8px 0 14px; color:var(--gold);';
    note.textContent = `${p.unknownCostCount} holding(s) (likely CAS-imported) have no Buy Price yet — their current value is counted above, but they're left out of Invested/Gain-Loss until you fill in Buy Price in the table below.`;
    container.appendChild(note);
  }
}

// ---------- Top gainers & losers (Dashboard) ----------
// Ranked by unrealized % return, the standard "performance" metric for a top-movers widget -- not
// by absolute ₹ gain, which would let a single large position crowd out both lists regardless of
// how well anything else actually did. Both the ₹ figure and the % are shown per row (per the task
// spec), the % is just not the sort key.
//
// Honesty gate, same as the rest of this file: a holding with no Buy Price (e.g. CAS-imported,
// cost basis unknown) can't have a gain computed -- computeHoldingMetrics()'s existing hasBuyPrice
// flag excludes it here rather than showing a fabricated number. If that leaves fewer than 3
// gainers or losers to show, this renders fewer -- never padded with placeholders. A holding priced
// exactly flat (₹0 gain) shows in neither list; it's not a "gainer" or a "loser".
function renderGainersLosersCard(container){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h3>Top gainers &amp; losers</h3><p class="helptext" style="margin-bottom:10px;">Open holdings ranked by unrealized % return. Holdings with no Buy Price set yet aren't included here — a gain can't be computed for them.</p>`;
  container.appendChild(card);

  const priced = data.holdings
    .map(h=>({ h, m: computeHoldingMetrics(h) }))
    .filter(x=>x.m.hasBuyPrice);
  const noCostCount = data.holdings.length - priced.length;

  if(priced.length===0){
    const msg = data.holdings.length===0
      ? 'No holdings yet — add one in the Holdings tab.'
      : 'None of your holdings have a Buy Price set yet, so no gain/loss can be shown here.';
    card.innerHTML += `<div class="helptext">${msg}</div>`;
    return;
  }

  const gainers = priced.filter(x=>x.m.gainAbs>0).sort((a,b)=>b.m.gainPct-a.m.gainPct).slice(0,3);
  const losers = priced.filter(x=>x.m.gainAbs<0).sort((a,b)=>a.m.gainPct-b.m.gainPct).slice(0,3);

  const row = (x)=>{
    const { h, m } = x;
    const color = m.gainAbs>=0 ? 'var(--green)' : 'var(--rust)';
    const sign = m.gainAbs>=0 ? '+' : '';
    return `<div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--line);">
      <div><span class="cell-strong">${h.symbol}</span><br><span class="cell-muted">${accountOf(h.broker).name}</span></div>
      <div style="text-align:right; color:${color}; flex-shrink:0;">
        <div style="font-weight:600;">${sign}${formatMoney(m.gainAbs, m.currency)}</div>
        <div class="helptext" style="color:${color};">${sign}${m.gainPct.toFixed(1)}%</div>
      </div>
    </div>`;
  };
  const column = (title, list, emptyMsg)=>`
    <div style="flex:1; min-width:200px;">
      <div style="font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:6px;">${title}</div>
      ${list.length ? list.map(row).join('') : `<div class="helptext">${emptyMsg}</div>`}
    </div>`;

  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex; gap:24px; flex-wrap:wrap;';
  wrap.innerHTML =
    column('Gainers', gainers, 'No holdings currently showing a gain.') +
    column('Losers', losers, 'No holdings currently at a loss.');
  card.appendChild(wrap);

  if(noCostCount>0){
    const note = document.createElement('div');
    note.className = 'helptext';
    note.style.cssText = 'margin-top:10px; color:var(--gold);';
    note.textContent = `${noCostCount} holding(s) with no Buy Price yet excluded — fill in Buy Price in the Holdings tab to include them here.`;
    card.appendChild(note);
  }
}
