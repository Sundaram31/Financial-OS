    refreshAllLive(card.querySelector('#refresh_all_fb'));
  };

  const wrap = card.querySelector('#h_table_wrap');
  const rows = data.holdings.filter(h=> brokerFilter==='all' || h.broker===brokerFilter);
  if(rows.length===0){
    wrap.innerHTML = `<div class="helptext" style="padding:6px 0;">No holdings yet — add one below.</div>`;
    return;
  }
  const withMetrics = rows.map(h=>({ h, m: computeHoldingMetrics(h) }));
  withMetrics.sort((a,b)=>{
    const key = holdingsSort.key;
    if(!key) return (a.h.broker+a.h.symbol).localeCompare(b.h.broker+b.h.symbol);
    if(key === 'symbol') return holdingsSort.dir * a.h.symbol.localeCompare(b.h.symbol);
    const av = key==='qty' ? a.m.qty : key==='value' ? a.m.currentValue : a.m.gainAbs;
    const bv = key==='qty' ? b.m.qty : key==='value' ? b.m.currentValue : b.m.gainAbs;
    return holdingsSort.dir * (av - bv);
  });

  const table = document.createElement('table');
  table.className = 'day-table';
  table.innerHTML = `<thead><tr>
    <th class="sortable-th" data-sort="symbol">Symbol${sortIndicator('symbol')}</th>
    <th>Broker</th><th>Type</th>
    <th class="sortable-th" data-sort="qty">Qty${sortIndicator('qty')}</th>
    <th>Avg Price</th><th>Buy Date</th>
    <th>Current Price</th><th>As Of</th>
    <th class="sortable-th" data-sort="value">Value${sortIndicator('value')}</th>
    <th class="sortable-th" data-sort="gain">Gain/Loss${sortIndicator('gain')}</th>
    <th></th>
  </tr></thead>`;
  const tbody = document.createElement('tbody');
  withMetrics.forEach(({h, m})=>{
    const tr = document.createElement('tr');
    // A holding can have no Buy Price at all if it came from a CAS import (see the CAS import
    // section above) -- gainAbs/gainPct are `null` in that case, not 0, so this must not fall
    // back to a fake "green, zero gain" row; show a plain hint pointing at the now-editable Avg
    // Price input instead of a number.
    const hasGain = m.gainAbs !== null;
    const gainColor = hasGain ? (m.gainAbs >= 0 ? 'var(--green)' : 'var(--rust)') : 'var(--gold)';
    const gainCellHtml = hasGain
      ? `${formatMoney(m.gainAbs, m.currency)} (${m.gainPct.toFixed(1)}%)`
      : `<span title="No Buy Price yet -- enter one in the Avg Price column to the left">— set Buy Price</span>`;
    const refreshable = isRefreshable(h);
    const cpCell = refreshable
      ? `<div class="cp-cell"><input type="number" step="0.01" data-cp="${h.id}" value="${h.currentPrice}" placeholder="${m.buyPrice!==null?m.buyPrice:''}">
           <div style="margin-top:4px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
             <button class="btn tiny ghost" data-live="${h.id}" title="Fetch a live price for this holding">↻ live</button>
             ${liveStatusHtml(h)}
           </div></div>`
      : `<div class="cp-cell"><input type="number" step="0.01" data-cp="${h.id}" value="${h.currentPrice}" placeholder="${m.buyPrice!==null?m.buyPrice:''}">
           <div class="helptext" style="margin-top:4px; font-size:13px;">manual only (${h.assetType||'—'})</div></div>`;
    tr.innerHTML = `
      <td data-label="Symbol"><strong>${h.symbol}</strong></td>
      <td data-label="Broker" class="cell-muted">${m.accountName}</td>
      <td data-label="Type" class="cell-muted">${h.assetType}</td>
      <td data-label="Qty">${m.qty}</td>
      <td data-label="Avg Price"><input type="number" step="0.01" min="0" data-bp="${h.id}" value="${m.buyPrice!==null?m.buyPrice:''}" placeholder="e.g. ${m.currentPrice||''}"></td>
      <td data-label="Buy Date" class="cell-muted">${h.buyDate}</td>
      <td data-label="Current Price">${cpCell}</td>
      <td data-label="As Of"><input type="date" data-asof="${h.id}" value="${h.asOf||''}"></td>
      <td data-label="Value" class="cell-strong">${formatMoney(m.currentValue, m.currency)}${m.isStale?' <span class="tag muted">stale</span>':''}</td>
      <td data-label="Gain/Loss" class="cell-strong" style="color:${gainColor};">${gainCellHtml}</td>
      <td data-label=""><div style="display:flex; gap:6px; justify-content:flex-end; flex-wrap:wrap;"><button class="btn small ghost" data-whatif="${h.id}" title="Simulate the tax cost of selling this holding — doesn't create a sale">What-if</button><button class="btn small ghost" data-sell="${h.id}" title="Record a sale against this holding">Sell</button><button class="btn small ghost" data-rm="${h.id}">✕</button></div></td>
    `;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.innerHTML = '';
  wrap.appendChild(table);

  table.querySelectorAll('th[data-sort]').forEach(th=>{
    th.onclick = ()=>{
      const key = th.dataset.sort;
      if(holdingsSort.key === key) holdingsSort.dir *= -1; else { holdingsSort.key = key; holdingsSort.dir = 1; }
      render();
    };
  });
  // Avg Price (Buy Price) inline edit -- this is the "already-existing inline-editable table"
  // path a CAS-imported holding's blank Buy Price is meant to be filled in through (see the CAS
  // import section above and its in-UI notice); works the same for any holding, not just
  // CAS-imported ones.
  wrap.querySelectorAll('[data-bp]').forEach(inp=>{
    inp.onchange = (e)=>{
      const h = data.holdings.find(x=>x.id===e.target.dataset.bp);
      if(!h) return;
      h.buyPrice = e.target.value === '' ? '' : +e.target.value;
      saveData(); render();
    };
  });
  wrap.querySelectorAll('[data-cp]').forEach(inp=>{
    inp.onchange = (e)=>{
      const h = data.holdings.find(x=>x.id===e.target.dataset.cp);
      if(!h) return;
      h.currentPrice = e.target.value === '' ? '' : +e.target.value;
      if(!h.asOf) h.asOf = new Date().toISOString().slice(0,10);
      saveData(); render();
    };
  });
  wrap.querySelectorAll('[data-asof]').forEach(inp=>{
    inp.onchange = (e)=>{
      const h = data.holdings.find(x=>x.id===e.target.dataset.asof);
      if(!h) return;
      h.asOf = e.target.value;
      saveData(); render();
    };
  });
  wrap.querySelectorAll('[data-rm]').forEach(btn=>{
    btn.onclick = (e)=>{
      data.holdings = data.holdings.filter(x=>x.id!==e.target.dataset.rm);
      saveData(); render();
    };
  });
  wrap.querySelectorAll('[data-sell]').forEach(btn=>{
    btn.onclick = (e)=> openSaleForm(e.currentTarget.dataset.sell);
  });
  wrap.querySelectorAll('[data-whatif]').forEach(btn=>{
    btn.onclick = (e)=> openWhatIfSale(e.currentTarget.dataset.whatif);
  });
  wrap.querySelectorAll('[data-live]').forEach(btn=>{
    btn.onclick = async (e)=>{
      const id = e.currentTarget.dataset.live;
      const h = data.holdings.find(x=>x.id===id);
      if(!h) return;
      e.currentTarget.disabled = true;
      e.currentTarget.textContent = '…';
      liveStatusById[h.id] = { state:'pending' };
      await refreshOneLive(h);
      saveData();
      render();
    };
  });
}

// ---------- "Record a sale" -- guided form, the only entry path for sold-lot data ----------
// Unlike adding a holding (which needs paste/CSV/Excel bulk paths too, per this repo's
// data-entry convention), recording a sale is inherently relational -- it must reference an
// existing open holding by id, which is a small closed set best picked from a dropdown, not
// typed. A guided form is genuinely the right (and sufficient) shape here, not a shortcut.
function openSaleForm(holdingId){
  saleFormHoldingId = holdingId;
  saleFormFeedbackMsg = { text: '', isError: false };
  activeTab = 'gains'; // the sale form now lives in the Realized Gains & What-If tab, not Holdings
  render();
  requestAnimationFrame(()=>{
    const panel = document.getElementById('sale-form-panel');
    if(panel){
      panel.scrollIntoView({behavior:'smooth', block:'start'});
      const inp = document.getElementById('rs_qty');
      if(inp) inp.focus({preventScroll:true});
    }
  });
}

// Opens the "Simulate a sale" what-if panel pre-selected on a specific holding, seeding the qty/
// sell-price defaults for it (mirrors openSaleForm above). Never touches data.holdings/data.soldLots.
function openWhatIfSale(holdingId){
  const h = data.holdings.find(x=>x.id===holdingId);
  whatIfHoldingId = holdingId;
  whatIfQty = h ? String(h.qty) : '';
  whatIfSellPrice = h ? String(whatIfDefaultSellPrice(h)) : '';
  whatIfSellDate = new Date().toISOString().slice(0,10);
  activeTab = 'gains'; // the what-if panel now lives in the Realized Gains & What-If tab, not Holdings
  render();
  requestAnimationFrame(()=>{
    const panel = document.getElementById('whatif-panel');
    if(panel) panel.scrollIntoView({behavior:'smooth', block:'start'});
  });
}

function renderRecordSaleForm(container){
  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'sale-form-panel';
  const openHoldings = data.holdings.filter(h => (+h.qty || 0) > 0);
  if(openHoldings.length === 0){
    card.innerHTML = `
      <h3>Record a sale</h3>
      <p class="helptext">No open holdings yet — add one above, then come back here to record a full or partial sale against it.</p>
    `;
    container.appendChild(card);
    return;
  }
  const selectedId = (saleFormHoldingId && openHoldings.some(h=>h.id===saleFormHoldingId)) ? saleFormHoldingId : openHoldings[0].id;
  const holding = openHoldings.find(h=>h.id===selectedId);
  const acc = accountOf(holding.broker);
  const hasBuyPrice = holding.buyPrice !== '' && holding.buyPrice !== null && holding.buyPrice !== undefined && !isNaN(+holding.buyPrice);
  card.innerHTML = `
    <h3>Record a sale</h3>
    <p class="helptext" style="margin-bottom:10px;">Sell all or part of an existing holding. Selling the full quantity removes it from Holdings above and moves it to Realized gains below; a partial sale reduces the open holding's quantity and adds a separate sold-lot record for the sold portion. Cost basis for the sold lot is this holding's single Avg Price (not a true per-lot FIFO cost basis — this module tracks one buy price per holding, same as the Holdings table above).</p>
    <div class="field-row">
      <div class="field"><label>Holding</label>
        <select id="rs_holding">${openHoldings.map(h=>{
          const a = accountOf(h.broker);
          return `<option value="${h.id}" ${h.id===selectedId?'selected':''}>${h.symbol} — ${a.name} (${h.qty} available)</option>`;
        }).join('')}</select>
      </div>
      <div class="field"><label>Qty to sell</label><input id="rs_qty" type="number" step="any" min="0" max="${holding.qty}" value="${holding.qty}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Sell date</label><input id="rs_selldate" type="date"></div>
      <div class="field"><label>Sell price</label><input id="rs_sellprice" type="number" step="0.01" min="0" placeholder="per unit"></div>
      <div class="field" style="display:flex; align-items:flex-end;"><button class="btn primary small" id="rs_add_btn" style="width:100%;">Record sale</button></div>
    </div>
    <p class="helptext">${hasBuyPrice
      ? `Cost basis on file: ${formatMoney(+holding.buyPrice, acc.currency)}, bought ${holding.buyDate || '(buy date unknown)'}.`
      : `<span style="color:var(--gold);">No Buy Price on file for this holding</span> (likely CAS-imported) — the sold lot's gain will show as unknown in Realized gains below until you fill in a Buy Price there.`}</p>
    <div id="rs_feedback" class="helptext" style="margin-top:2px; ${saleFormFeedbackMsg.isError ? 'color:var(--rust);' : ''}">${saleFormFeedbackMsg.text}</div>
  `;
  container.appendChild(card);

  card.querySelector('#rs_holding').onchange = (e)=>{
    saleFormHoldingId = e.target.value;
    saleFormFeedbackMsg = { text: '', isError: false };
    render();
  };

  // Validation-failure path updates only the feedback message node in place, rather than calling
  // the full render() -- render() rebuilds this whole card from scratch with fresh default
  // `value="${holding.qty}"` / blank attributes, which was silently discarding whatever the user
  // had actually typed into the *other* fields (e.g. Qty/Sell price survive a "Sell date is
  // required" error, instead of reverting to holding.qty / clearing to blank). Success still calls
  // the full render() below -- that's a genuine state change (holding qty/removal, new sold lot),
  // so resetting the form to fresh defaults there is correct.
  const showSaleError = (text)=>{
    saleFormFeedbackMsg = { text, isError: true };
    const fb = card.querySelector('#rs_feedback');
    if(fb){ fb.textContent = text; fb.style.color = 'var(--rust)'; }
  };

  card.querySelector('#rs_add_btn').onclick = ()=>{
    const h = data.holdings.find(x=>x.id===selectedId);
    if(!h){ showSaleError('That holding no longer exists — pick another.'); return; }
    const qtyRaw = card.querySelector('#rs_qty').value;
    const sellDate = card.querySelector('#rs_selldate').value;
    const sellPriceRaw = card.querySelector('#rs_sellprice').value;
    const qty = +qtyRaw;
    const sellPrice = +sellPriceRaw;
    const available = +h.qty || 0;

    if(qtyRaw === '' || isNaN(qty) || qty <= 0){ showSaleError('Enter a quantity greater than 0.'); return; }
    if(qty > available + 1e-9){ showSaleError(`Can't sell ${qty} — only ${available} of ${h.symbol} currently held.`); return; }
    if(!sellDate){ showSaleError('Sell date is required.'); return; }
    if(sellPriceRaw === '' || isNaN(sellPrice) || sellPrice < 0){ showSaleError('Enter a valid sell price (0 or more).'); return; }
    if(h.buyDate && new Date(sellDate) < new Date(h.buyDate)){ showSaleError("Sell date can't be before the buy date."); return; }

    const lotHasBuyPrice = h.buyPrice !== '' && h.buyPrice !== null && h.buyPrice !== undefined && !isNaN(+h.buyPrice);
    const soldLot = {
      id: newId('sl'),
      symbol: h.symbol,
      broker: h.broker,
      assetType: h.assetType,
      isin: h.isin || '',
      qty,
      buyPrice: lotHasBuyPrice ? +h.buyPrice : null,
      buyDate: h.buyDate || '',
      sellDate,
      sellPrice,
      soldAt: new Date().toISOString(),
    };
    data.soldLots.push(soldLot);

    const remaining = available - qty;
    const closedFully = remaining <= 1e-9;
    if(closedFully){
      data.holdings = data.holdings.filter(x=>x.id!==h.id);
    } else {
      h.qty = remaining;
    }
    saleFormFeedbackMsg = {
      text: `Recorded sale of ${qty} ${h.symbol}${closedFully ? ' — full position closed.' : ` — ${remaining} remaining open.`} See Realized gains below.`,
      isError: false,
    };
    saleFormHoldingId = null; // back to default (first open holding) selection after a successful sale
    saveData(); render();
  };
}

// ---------- realized gains -- raw sold-lot facts, classification only, no tax computation ----------
function renderRealizedGainsSection(container){
  const header = document.createElement('div');
  header.className = 'panel-header';
  header.style.marginTop = '28px';
  header.innerHTML = `
    <h2 style="font-size:18px;">Realized gains</h2>
    <p class="desc" style="margin-top:4px; max-width:none;">Raw sold-lot facts from the sales recorded above — short-term/long-term classification (Sec 2(42A): more than 365 days held is long-term, exactly 365 is still short-term) and gain/loss per lot. <strong>This is not a tax return</strong> — no Section 112A ₹1,25,000 exemption, no slab-rate tax, no loss carry-forward applied here. Full tax treatment happens in ITRGenie; export the feed below and paste it in there.</p>
  `;
  container.appendChild(header);

  const card = document.createElement('div');
  card.className = 'card';
  if(data.soldLots.length === 0){
    card.innerHTML = `<h3>Sold lots (0)</h3><p class="helptext">No sales recorded yet — use "Record a sale" above against any open holding.</p>`;
    container.appendChild(card);
    return;
  }

  const g = computeRealizedGains();
  const stcgColor = g.stcg >= 0 ? 'var(--green)' : 'var(--rust)';
  const ltcgColor = g.ltcg >= 0 ? 'var(--green)' : 'var(--rust)';
  const totalColor = g.total >= 0 ? 'var(--green)' : 'var(--rust)';
  const statGrid = document.createElement('div');
  statGrid.className = 'stat-grid';
  statGrid.innerHTML = `
    <div class="stat-tile"><div class="stat-label">Short-term (STCG)</div><div class="stat-value" style="color:${stcgColor};">${formatMoney(g.stcg,'INR')}</div></div>
    <div class="stat-tile"><div class="stat-label">Long-term (LTCG)</div><div class="stat-value" style="color:${ltcgColor};">${formatMoney(g.ltcg,'INR')}</div></div>
    <div class="stat-tile accent"><div class="stat-label">Total realized (known)</div><div class="stat-value" style="color:${totalColor};">${formatMoney(g.total,'INR')}</div></div>
  `;
  container.appendChild(statGrid);
  if(g.unknownGainCount > 0){
    const note = document.createElement('div');
    note.className = 'helptext';
    note.style.cssText = 'margin:-8px 0 14px; color:var(--gold);';
    note.textContent = `${g.unknownGainCount} sold lot(s) have unknown gain — the original holding had no Buy Price on file (likely CAS-imported). Fill in Buy Price in the table below to compute a real gain instead of leaving it a guess.`;
    container.appendChild(note);
  }
  if(g.unknownTermCount > 0){
    const note2 = document.createElement('div');
    note2.className = 'helptext';
    note2.style.cssText = 'margin:-8px 0 14px; color:var(--gold);';
    note2.textContent = `${g.unknownTermCount} sold lot(s) have a known cost but no Buy Date — included in "Total realized" but excluded from the ST/LT split above (not guessed as short-term) until Buy Date is filled in below.`;
    container.appendChild(note2);
  }
  if(g.unconvertedCount > 0){
    const note3 = document.createElement('div');
    note3.className = 'helptext';
    note3.style.cssText = 'margin:-8px 0 14px; color:var(--rust);';
    note3.textContent = `${g.unconvertedCount} USD sold lot(s) not included in the totals above — set the USD → INR rate further down to fold Vested-US sales in.`;
    container.appendChild(note3);
  }

  // Most-recently-recorded first (this module doesn't guarantee sellDate ordering on entry, so
  // recording order is the same reasonable recency proxy this table already used before this
  // toggle existed). Once there are more than SOLD_LOTS_COLLAPSE_THRESHOLD lots, default to showing
  // only the most recent ones -- a genuine remaining case for a "declutter historical/closed data"
  // toggle in this module (see portfolio/PROGRESS.md's 2026-08-11 entry on why this, not a Holdings-
  // table sold-position toggle, is where that idea actually still applies here).
  const sortedLots = data.soldLots.slice().reverse();
  const totalLots = sortedLots.length;
  const isCollapsed = !soldLotsShowAll && totalLots > SOLD_LOTS_COLLAPSE_THRESHOLD;
  const visibleLots = isCollapsed ? sortedLots.slice(0, SOLD_LOTS_COLLAPSE_THRESHOLD) : sortedLots;
  const toggleHtml = totalLots > SOLD_LOTS_COLLAPSE_THRESHOLD
    ? `<button class="btn small ghost" id="sl_toggle_show_all">${soldLotsShowAll ? 'Show recent only' : `Show all ${totalLots}`}</button>`
    : '';
  card.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <h3 style="margin-bottom:0;">Sold lots (${data.soldLots.length})</h3>
      ${toggleHtml}
    </div>
    ${isCollapsed ? `<p class="helptext" style="margin:8px 0;">Showing the ${SOLD_LOTS_COLLAPSE_THRESHOLD} most recently recorded of ${totalLots} sold lots.</p>` : ''}
    <div class="table-scroll" id="sl_table_wrap"></div>
  `;
  container.appendChild(card);
  if(toggleHtml){
    card.querySelector('#sl_toggle_show_all').onclick = ()=>{ soldLotsShowAll = !soldLotsShowAll; render(); };
  }
  const wrap = card.querySelector('#sl_table_wrap');
  const table = document.createElement('table');
  table.className = 'day-table';
  table.innerHTML = `<thead><tr>
    <th>Symbol</th><th>Broker</th><th>Qty</th><th>Buy</th><th>Sell</th><th>Term</th><th>Gain/Loss</th><th></th>
  </tr></thead>`;
  const tbody = document.createElement('tbody');
  visibleLots.forEach(lot=>{
    const acc = accountOf(lot.broker);
    const calc = computeSoldLotGain(lot);
    const hasGain = calc.gain !== null;
    const gainColor = hasGain ? (calc.gain >= 0 ? 'var(--green)' : 'var(--rust)') : 'var(--gold)';
    const gainCellHtml = hasGain
      ? formatMoney(calc.gain, acc.currency)
      : `<span title="No Buy Price on file -- fill it in to the left to compute a real gain">— unknown</span>`;
    const termTag = calc.term === 'LongTerm' ? `<span class="tag green">LTCG</span>`
      : calc.term === 'ShortTerm' ? `<span class="tag rust">STCG</span>`
      : `<span class="tag muted">unclassified</span>`;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td data-label="Symbol"><strong>${lot.symbol}</strong></td>
      <td data-label="Broker" class="cell-muted">${acc.name}</td>
      <td data-label="Qty">${lot.qty}</td>
      <td data-label="Buy"><div class="cp-cell">
          <input type="number" step="0.01" min="0" data-slbp="${lot.id}" value="${lot.buyPrice!==null?lot.buyPrice:''}" placeholder="unknown" style="width:100px;">
          <input type="date" data-slbd="${lot.id}" value="${lot.buyDate||''}" style="width:130px;">
        </div></td>
      <td data-label="Sell">${lot.sellDate} @ ${formatMoney(lot.sellPrice, acc.currency)}</td>
      <td data-label="Term">${termTag}</td>
      <td data-label="Gain/Loss" class="cell-strong" style="color:${gainColor};">${gainCellHtml}</td>
      <td data-label=""><button class="btn small ghost" data-slrm="${lot.id}">✕</button></td>
    `;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.innerHTML = '';
  wrap.appendChild(table);

  wrap.querySelectorAll('[data-slbp]').forEach(inp=>{
    inp.onchange = (e)=>{
      const lot = data.soldLots.find(x=>x.id===e.target.dataset.slbp);
      if(!lot) return;
      lot.buyPrice = e.target.value === '' ? null : +e.target.value;
      saveData(); render();
    };
  });
  wrap.querySelectorAll('[data-slbd]').forEach(inp=>{
    inp.onchange = (e)=>{
      const lot = data.soldLots.find(x=>x.id===e.target.dataset.slbd);
      if(!lot) return;
      lot.buyDate = e.target.value;
      saveData(); render();
    };
  });
  wrap.querySelectorAll('[data-slrm]').forEach(btn=>{
    btn.onclick = (e)=>{
      data.soldLots = data.soldLots.filter(x=>x.id!==e.target.dataset.slrm);
      saveData(); render();
    };
  });

  // ---- Capital gains feed export (Portfolio -> ITRGenie), same JSON + paste-ready-lines pattern
  // already used for the Net Worth feed below.
  const feedCard = document.createElement('div');
  feedCard.className = 'card';
  feedCard.innerHTML = `
    <h3>Capital gains feed → ITRGenie</h3>
    <p class="helptext" style="margin-bottom:8px;">Exports the shared <code>{symbol, buydate, selldate, buyprice, sellprice, qty, assetType}[]</code> contract for every sold lot above — including ones with an unknown Buy Price, left as <code>null</code> rather than guessed, and including Mutual Fund lots (unfiltered — a downstream consumer can filter by <code>assetType</code> itself). Download the JSON, or copy paste-ready lines matching ITRGenie's Capital Gains — Equity module's own paste format (<code>Stock, Qty, BuyDate, BuyPrice, SellDate, SellPrice</code> — leave BuyDate/BuyPrice blank where unknown, same as that module already expects) for a quick paste-in there. <strong>The paste-ready-lines button excludes Mutual Fund sold lots automatically</strong> (and says how many were excluded) — ITRGenie's Equity module taxes rows under Sec 111A/112A equity rules, and a mutual fund redemption needs its own Sec 112A-vs-112 classification that only ITRGenie's separate Capital Gains — Mutual Funds module asks for, which this module has no basis to guess at. Route those lots there by hand instead.</p>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn small" id="cg_export_json">Download Capital Gains feed (JSON)</button>
      <button class="btn small ghost" id="cg_copy_lines">Copy paste-ready lines (ITRGenie Equity format)</button>
    </div>
    <div id="cg_feed_fb" class="helptext" style="margin-top:8px;"></div>
  `;
  container.appendChild(feedCard);
  feedCard.querySelector('#cg_export_json').onclick = ()=>{
    const feed = buildCapitalGainsFeed();
    const blob = new Blob([JSON.stringify(feed, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `portfolio-capitalgains-feed-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };
  feedCard.querySelector('#cg_copy_lines').onclick = async ()=>{
    const feed = buildCapitalGainsFeed();
    // Only Stock/ETF/Equity/Other lots go into this button's output -- Mutual Fund lots are
    // excluded (see isMutualFundAssetType's comment above). The JSON export above is left
    // unfiltered on purpose: it already carries assetType per row, so a downstream consumer can
    // filter it itself; this button has no such safety net, so the filtering happens here.
    const equityLikeRows = feed.filter(r => !isMutualFundAssetType(r.assetType));
    const excludedCount = feed.length - equityLikeRows.length;
    const exclusionNote = excludedCount > 0
      ? ` ${excludedCount} mutual fund lot(s) excluded — route those to ITRGenie's own MF capital-gains module by hand.`
      : '';
    const fb = feedCard.querySelector('#cg_feed_fb');
    if(equityLikeRows.length === 0){
      fb.textContent = excludedCount > 0
        ? `Nothing to copy — all ${excludedCount} sold lot(s) are Mutual Fund.${exclusionNote}`
        : 'No sold lots to copy yet.';
      return;
    }
    const lines = equityLikeRows.map(r => `${r.symbol}, ${r.qty}, ${r.buydate||''}, ${r.buyprice!==null?r.buyprice:''}, ${r.selldate}, ${r.sellprice}`).join('\n');
    try{
      await navigator.clipboard.writeText(lines);
      fb.textContent = "Copied — paste directly into ITRGenie's Capital Gains — Equity module paste box." + exclusionNote;
    }catch(e){
      fb.textContent = 'Could not access clipboard; here it is to copy manually:\n' + lines + (exclusionNote ? '\n\n' + exclusionNote.trim() : '');
    }
  };
}

// ---------- "Simulate a sale" -- what-if tax calculator, purely computational ----------
// Sits right after Realized gains, per explicit placement. Never mutates data.holdings/
// data.soldLots -- every input here (qty/price/date/pool override/note) lives only in the
// module-level whatIf* state vars declared near the top of the file, read fresh on every render().
function renderWhatIfSaleSection(container){
  const header = document.createElement('div');
  header.className = 'panel-header';
  header.style.marginTop = '28px';
  header.innerHTML = `
    <h2 style="font-size:18px;">Simulate a sale</h2>
    <p class="desc" style="margin-top:4px; max-width:none;">"What would the tax cost be if I sold this today (or on some other date)?" — purely computational: unlike "Record a sale" above, this never creates a sold lot or changes a holding's quantity. Shows only the capital-gains-specific flat tax (Sec 111A short-term / Sec 112A long-term) — no surcharge, cess, or how this interacts with the rest of your income/tax regime. ITRGenie remains the source of truth for your actual return; this is for deciding whether (and when) to sell, not for filing. This also doesn't evaluate what the money would be switched into — only the tax cost of exiting the current holding.</p>
  `;
  container.appendChild(header);

  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'whatif-panel';

  const openHoldings = data.holdings.filter(h => (+h.qty || 0) > 0);
  if(openHoldings.length === 0){
    card.innerHTML = `<h3>Simulate a sale</h3><p class="helptext">No open holdings yet — add one above, then come back here to check the tax cost of a hypothetical sale.</p>`;
    container.appendChild(card);
    return;
  }

  const selectedId = (whatIfHoldingId && openHoldings.some(h=>h.id===whatIfHoldingId)) ? whatIfHoldingId : openHoldings[0].id;
  const holding = openHoldings.find(h=>h.id===selectedId);
  const acc = accountOf(holding.broker);

  // Seed sensible defaults the first time this holding becomes selected (fresh page load, or the
  // user switched holdings via the dropdown below) -- never re-runs on a plain re-render caused by
  // editing qty/price/date/pool, since whatIfHoldingId already equals selectedId by then, so it
  // never clobbers an in-progress edit.
  if(whatIfHoldingId !== selectedId){
    whatIfHoldingId = selectedId;
    whatIfQty = String(holding.qty);
    whatIfSellPrice = String(whatIfDefaultSellPrice(holding));
    whatIfSellDate = whatIfSellDate || new Date().toISOString().slice(0,10);
  }

  const isMF = isMutualFundAssetType(holding.assetType);
  // accountOf() falls back to {currency:'INR'} for a broker id matching no real account (reachable
  // via a hand-edited Export/Import JSON with a typo'd broker id) -- treat an unrecognized account
  // as NOT confirmed-domestic rather than defaulting to INR, so this never silently applies
  // domestic Sec 111A/112A tax to a holding whose actual currency isn't actually known.
  const accountKnown = data.accounts.some(a=>a.id===holding.broker);
  const isForeign = !isMF && (!accountKnown || acc.currency !== 'INR');
  const eligible = !isMF && !isForeign;

  const hasBuyPrice = holding.buyPrice !== '' && holding.buyPrice !== null && holding.buyPrice !== undefined && !isNaN(+holding.buyPrice);
  const qtyNum = +whatIfQty;
  const sellPriceNum = +whatIfSellPrice;
  const fyRange = getFinancialYearRange(new Date());
  const poolCalc = computeAlreadyRealizedLTCG112AThisFY(fyRange);
  const poolValue = whatIfPoolOverride !== null ? whatIfPoolOverride : poolCalc.total;

  const errors = [];
  if(eligible && hasBuyPrice){
    if(whatIfQty === '' || isNaN(qtyNum) || qtyNum <= 0) errors.push('Enter a quantity greater than 0.');
    else if(qtyNum > +holding.qty + 1e-9) errors.push(`Can't simulate selling ${qtyNum} — only ${holding.qty} of ${holding.symbol} currently held.`);
    if(whatIfSellPrice === '' || isNaN(sellPriceNum) || sellPriceNum < 0) errors.push('Enter a valid sell price (0 or more).');
    if(!whatIfSellDate) errors.push('Sell date is required.');
    else if(holding.buyDate && new Date(whatIfSellDate) < new Date(holding.buyDate)) errors.push("Sell date can't be before the buy date.");
  }

  let result = null;
  if(eligible && hasBuyPrice && errors.length === 0){
    result = computeWhatIfTax({
      buyPrice: +holding.buyPrice,
      buyDate: holding.buyDate || '',
      sellPrice: sellPriceNum,
      sellDate: whatIfSellDate,
      qty: qtyNum,
      alreadyRealizedLTCGThisFY: poolValue,
    });
  }

  let resultHtml = '';
  if(eligible && !hasBuyPrice){
    resultHtml = `<div class="helptext" style="color:var(--gold); margin-top:8px;">No Buy Price on file for this holding — fill it in via the Avg Price column in the Holdings table above, then come back here to simulate a sale.</div>`;
  } else if(eligible && errors.length){
    resultHtml = `<div class="helptext" style="color:var(--rust); margin-top:8px;">${errors.join(' ')}</div>`;
  } else if(eligible && result && result.term === null){
    resultHtml = `<div class="helptext" style="color:var(--gold); margin-top:8px;">No Buy Date on file for this holding — can't classify Short-term vs Long-term. Fill in Buy Date in the Holdings table above.</div>`;
  } else if(eligible && result){
    const gainColor = result.gain >= 0 ? 'var(--green)' : 'var(--rust)';
    const termTag = result.term === 'LongTerm' ? `<span class="tag green">LTCG</span>` : `<span class="tag rust">STCG</span>`;
    let detail = '';
    if(result.gain <= 0){
      detail = `<p class="helptext" style="margin-top:6px;">This would be a capital <strong>loss</strong> — ₹0 capital-gains tax on this sale. A loss can offset other gains (Sec 70 set-off rules) — see ITRGenie's Loss Set-off &amp; Carry Forward module for the complete picture; that ordering isn't modeled here.</p>`;
    } else if(result.term === 'ShortTerm'){
      detail = `<p class="helptext" style="margin-top:6px;">Held ≤365 days — Short-term (Sec 111A): flat 20% on the full gain, no exemption.</p>`;
    } else {
      const usedBefore = Math.min(Math.max(0,poolValue), 125000);
      const headroomBefore = Math.max(0, 125000 - poolValue);
      const taxablePortion = result.taxableAfter - result.taxableBefore;
      detail = `<p class="helptext" style="margin-top:6px;">Held &gt;365 days — Long-term (Sec 112A). Exemption headroom remaining before this sale: ${formatMoney(headroomBefore,'INR')} of the shared ₹1,25,000/FY pool (${formatMoney(usedBefore,'INR')} already used by the "already realized" figure below). Of this sale's ${formatMoney(result.gain,'INR')} gain, ${formatMoney(taxablePortion,'INR')} is taxable at 12.5%.</p>`;
    }
    resultHtml = `
      <div class="stat-grid" style="margin-top:10px;">
        <div class="stat-tile"><div class="stat-label">Hypothetical gain</div><div class="stat-value" style="color:${gainColor}; font-size:20px;">${formatMoney(result.gain,'INR')}</div><div class="helptext" style="margin-top:2px;">${termTag}</div></div>
        <div class="stat-tile accent"><div class="stat-label">Estimated capital-gains tax</div><div class="stat-value" style="font-size:20px;">${formatMoney(result.tax,'INR')}</div></div>
      </div>
      ${detail}
    `;
  }

  const bodyHtml = eligible ? `
    <div class="field-row">
      <div class="field"><label>Qty to sell</label><input id="wi_qty" type="number" step="any" min="0" max="${holding.qty}" value="${whatIfQty}"></div>
      <div class="field"><label>Sell price</label><input id="wi_sellprice" type="number" step="0.01" min="0" value="${whatIfSellPrice}" placeholder="per unit"></div>
      <div class="field"><label>Sell date</label><input id="wi_selldate" type="date" value="${whatIfSellDate}"></div>
    </div>
    <div class="field-row" style="margin-top:-2px;">
      <div class="field"><label>Already realized Sec 112A LTCG this FY (${fyRange.label})</label><input id="wi_pool" type="number" step="0.01" value="${poolValue}"></div>
      ${whatIfPoolOverride !== null ? `<div class="field" style="display:flex; align-items:flex-end;"><button class="btn small ghost" id="wi_pool_reset" type="button">↺ use tracked value (${formatMoney(poolCalc.total,'INR')})</button></div>` : ''}
    </div>
    <p class="helptext" style="margin:-4px 0 8px;">${whatIfPoolOverride !== null
      ? `Using your own override, not the auto-computed figure.`
      : `Pre-filled from ${poolCalc.includedCount} sold lot${poolCalc.includedCount===1?'':'s'} tracked in this Portfolio module this financial year — check it against your own records; sales made through a broker directly, or before you started using this tracker, aren't included here.`
    }</p>
    ${resultHtml}
  ` : `
    <div class="notice${isForeign?' warn':''}" style="margin-top:10px;">
      ${isMF
        ? `<strong>${holding.symbol} is a Mutual Fund</strong> — this simulator doesn't compute mutual fund capital-gains tax. A real MF redemption gain depends on the actual CAS/CAMS statement at the time of redemption (post-2023 debt-fund rules, indexation grandfathering, etc. make it too fragile to derive from a formula) — this is exactly why ITRGenie's own Capital Gains — Mutual Funds module asks you to type in the real gain figure rather than computing it, and a hypothetical future sale has no statement to read from yet. When you actually redeem, use that ITRGenie module with the real numbers from your statement.`
        : accountKnown
          ? `<strong>${holding.symbol} is held in a foreign-currency account</strong> (${acc.name}, ${acc.currency}) — India's Sec 111A/112A concessional equity rates modeled here (flat 20% short-term, flat 12.5% long-term with the shared ₹1,25,000 exemption) only apply to equity sold with STT paid on a recognized Indian stock exchange. Foreign shares are taxed differently — long-term gains fall under Sec 112 (still 12.5%, but with no pooled exemption) and short-term gains are taxed at your income slab rate, not a flat 20%. Getting that right needs your full income picture, which is out of scope here — use ITRGenie's Foreign Assets (Schedule FA) module for the real figure.`
          : `<strong>${holding.symbol}'s account (${holding.broker}) isn't recognized</strong> — its currency can't be confirmed, so this simulator won't guess at domestic vs. foreign tax treatment (this can happen after a hand-edited or corrupted Export/Import file). Re-check this holding's account under Holdings above before simulating a sale.`
      }
    </div>
  `;

  card.innerHTML = `
    <h3>Simulate a sale</h3>
    <div class="field-row">
      <div class="field"><label>Holding</label>
        <select id="wi_holding">${openHoldings.map(h=>{
          const a = accountOf(h.broker);
          return `<option value="${h.id}" ${h.id===selectedId?'selected':''}>${h.symbol} — ${a.name} (${h.qty} available)</option>`;
        }).join('')}</select>
      </div>
      <div class="field"><label>Considering switching to <span style="text-transform:none;">(optional note, your own reference — not computed)</span></label>
        <input id="wi_note" type="text" placeholder="e.g. an index fund" value="${whatIfNote.replace(/"/g,'&quot;')}"></div>
    </div>
    ${bodyHtml}
  `;
  container.appendChild(card);

  card.querySelector('#wi_holding').onchange = (e)=>{
    const h = openHoldings.find(x=>x.id===e.target.value);
    whatIfHoldingId = e.target.value;
    if(h){
      whatIfQty = String(h.qty);
      whatIfSellPrice = String(whatIfDefaultSellPrice(h));
    }
    render();
  };
  card.querySelector('#wi_note').onchange = (e)=>{ whatIfNote = e.target.value; };
  if(eligible){
    const qtyInp = card.querySelector('#wi_qty');
    if(qtyInp) qtyInp.onchange = (e)=>{ whatIfQty = e.target.value; render(); };
    const spInp = card.querySelector('#wi_sellprice');
    if(spInp) spInp.onchange = (e)=>{ whatIfSellPrice = e.target.value; render(); };
    const sdInp = card.querySelector('#wi_selldate');
    if(sdInp) sdInp.onchange = (e)=>{ whatIfSellDate = e.target.value; render(); };
    const poolInp = card.querySelector('#wi_pool');
    if(poolInp) poolInp.onchange = (e)=>{ whatIfPoolOverride = e.target.value === '' ? null : +e.target.value; render(); };
    const resetBtn = card.querySelector('#wi_pool_reset');
    if(resetBtn) resetBtn.onclick = ()=>{ whatIfPoolOverride = null; render(); };
  }
}

// ---------- guided "Add a holding" form -- the primary entry path ----------
// Produces the exact same holding object shape the bulk-paste parser below produces, so nothing
// downstream (live price fetch, Net Worth feed export, allocation/performance math) needs to
// know or care which path a holding came from.
function renderAddHoldingForm(container){
  const card = document.createElement('div');
  card.className = 'card';
  const defaultBroker = (addFormLastBroker && data.accounts.some(a=>a.id===addFormLastBroker))
    ? addFormLastBroker
    : (data.accounts[0] && data.accounts[0].id);
  card.innerHTML = `
    <h3>Add a holding</h3>
    <div class="field-row" style="margin-bottom:2px;">
      <div class="field" style="flex:3;"><label>Paste one line to fill in below <span style="text-transform:none;">(optional)</span></label><input id="af_quickpaste" placeholder="e.g. INFY, Axis Direct, Stock, 50, 1450, 2022-04-15 — from a trade confirmation, same order as the bulk-paste format further down"></div>
      <div class="field" style="max-width:140px; display:flex; align-items:flex-end;"><button class="btn small ghost" id="af_quickfill_btn" type="button" style="width:100%;">Fill fields</button></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Symbol</label><input id="af_symbol" placeholder="e.g. INFY"></div>
      <div class="field"><label>Broker</label>
        <select id="af_broker">${data.accounts.map(a=>`<option value="${a.id}" ${a.id===defaultBroker?'selected':''}>${a.name}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Asset type</label>
        <select id="af_type">${['Stock','ETF','Mutual Fund','Other'].map(t=>`<option value="${t}" ${t===addFormLastType?'selected':''}>${t}</option>`).join('')}</select>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>Qty</label><input id="af_qty" type="number" step="any" min="0" placeholder="e.g. 50"></div>
      <div class="field"><label>Buy price</label><input id="af_buyprice" type="number" step="0.01" min="0" placeholder="e.g. 1450"></div>
      <div class="field"><label>Buy date</label><input id="af_buydate" type="date"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Current price <span style="text-transform:none;">(optional)</span></label><input id="af_curprice" type="number" step="0.01" min="0" placeholder="leave blank if unknown"></div>
      <div class="field"><label>As of <span style="text-transform:none;">(optional)</span></label><input id="af_asof" type="date"></div>
      <div class="field" style="display:flex; align-items:flex-end;"><button class="btn primary small" id="af_add_btn" style="width:100%;">Add holding</button></div>
    </div>
    <div id="af_feedback" class="helptext" style="margin-top:2px; ${addFormFeedbackMsg.isError ? 'color:var(--rust);' : ''}">${addFormFeedbackMsg.text}</div>
  `;
  container.appendChild(card);

  // "Paste one line to fill in below" -- lets someone with a trade confirmation, broker SMS/email,
  // or a row already copied from a spreadsheet fill all 8 fields at once instead of tabbing
  // through them one at a time, while still landing in the same editable inputs as manual entry --
  // nothing is added to data.holdings until the existing "Add holding" click below, so every
  // filled-in value stays fully reviewable/correctable first. Reuses the exact same column order
  // as the bulk-paste box further down this page (Symbol, Broker, AssetType, Qty, BuyPrice,
  // BuyDate, CurrentPrice, AsOf) so one mental model covers both entry paths. Broker/AssetType are
  // matched against the real dropdown options (substring match, case-insensitive) and left
  // unchanged -- never guessed -- if nothing recognizable is found; dates reuse excelDateToISO(),
  // the same tolerant date parser already used for Excel import, rather than a third date-parsing
  // implementation in this file.
  card.querySelector('#af_quickfill_btn').onclick = ()=>{
    const raw = card.querySelector('#af_quickpaste').value.trim();
    if(!raw) return;
    const parsedRows = parsePastedRows(raw, 8, 6);
    const cols = parsedRows[0] || []; // Symbol, Broker, AssetType, Qty, BuyPrice, BuyDate, CurrentPrice, AsOf (last 2 optional)
    if(cols.length===0){
      // Never fills the form from a guess -- if the pasted line couldn't be split unambiguously
      // (see resolveThousandsMerge() above), say so instead of silently doing nothing.
      const fb = card.querySelector('#af_feedback');
      fb.textContent = parsedRows.ambiguousCount>0
        ? `Couldn't tell where the columns split -- try a tab-separated paste copied straight from a spreadsheet, or add a space after each comma.`
        : `Couldn't read that as Symbol, Broker, AssetType, Qty, BuyPrice, BuyDate[, CurrentPrice, AsOf] -- nothing was filled in.`;
      fb.style.color = 'var(--rust)';
      return;
    }
    const [symbol, brokerTxt, assetTypeTxt, qty, buyPrice, buyDate, currentPrice, asOf] = cols;
    if(symbol) card.querySelector('#af_symbol').value = symbol.trim();
    let brokerUnmatched = false;
    const brokerSelect = card.querySelector('#af_broker');
    brokerSelect.style.outline = '';
    if(brokerTxt){
      const t = brokerTxt.trim().toLowerCase();
      const match = data.accounts.find(a => a.name.toLowerCase()===t || a.id.toLowerCase()===t || a.name.toLowerCase().includes(t) || t.includes(a.name.toLowerCase()));
      if(match){ brokerSelect.value = match.id; }
      else { brokerUnmatched = true; }
    }
    // Visible flag, not just text feedback, when a pasted broker name didn't match any account --
    // the dropdown silently sitting at its prior/default value looked identical to a real match,
    // which relied on someone actually reading the helptext below. Clears itself the moment the
    // user touches the dropdown (they've now reviewed/corrected it).
    if(brokerUnmatched){
      brokerSelect.style.outline = '2px solid var(--rust)';
      brokerSelect.onchange = ()=>{ brokerSelect.style.outline = ''; };
    }
    if(assetTypeTxt){
      const guessed = guessAssetTypeFromText(assetTypeTxt);
      if(guessed) card.querySelector('#af_type').value = guessed;
    }
    if(qty!==undefined && qty!==''){
      const n = parseNumericCell(qty);
      if(!isNaN(n)) card.querySelector('#af_qty').value = n;
    }
    if(buyPrice!==undefined && buyPrice!==''){
      const n = parseNumericCell(buyPrice);
      if(!isNaN(n)) card.querySelector('#af_buyprice').value = n;
    }
    if(buyDate){
      const iso = excelDateToISO(buyDate);
      if(iso) card.querySelector('#af_buydate').value = iso;
    }
    if(currentPrice!==undefined && currentPrice!==''){
      const n = parseNumericCell(currentPrice);
      if(!isNaN(n)) card.querySelector('#af_curprice').value = n;
    }
    if(asOf){
      const iso = excelDateToISO(asOf);
      if(iso) card.querySelector('#af_asof').value = iso;
    }
    const fb = card.querySelector('#af_feedback');
    fb.textContent = 'Fields filled in below from the pasted line -- review (and complete Broker/Asset type if not recognized) before clicking Add holding.';
    fb.style.color = '';
  };

  card.querySelector('#af_add_btn').onclick = ()=>{
    const symbol = card.querySelector('#af_symbol').value.trim();
    const broker = card.querySelector('#af_broker').value;
    const assetType = card.querySelector('#af_type').value;
    const qty = card.querySelector('#af_qty').value;
    const buyPrice = card.querySelector('#af_buyprice').value;
    const buyDate = card.querySelector('#af_buydate').value;
    const currentPrice = card.querySelector('#af_curprice').value;
    const asOf = card.querySelector('#af_asof').value;

    if(!symbol || !broker || qty==='' || isNaN(+qty) || +qty<=0 || buyPrice==='' || isNaN(+buyPrice) || +buyPrice<0 || !buyDate || (currentPrice!=='' && !isNaN(+currentPrice) && +currentPrice<0)){
      addFormFeedbackMsg = { text: 'Fill in Symbol, Broker, Qty (greater than 0), Buy Price and Buy Date (Current Price, if given, can\'t be negative).', isError: true };
      render();
      return;
    }
    const hasCurrentPrice = currentPrice !== '' && !isNaN(+currentPrice);
    data.holdings.push({
      id: newId('h'),
      symbol: symbol.toUpperCase(),
      broker,
      assetType,
      qty: +qty,
      buyPrice: +buyPrice,
      buyDate,
      currentPrice: hasCurrentPrice ? +currentPrice : '',
      asOf: asOf ? asOf : (hasCurrentPrice ? new Date().toISOString().slice(0,10) : ''),
    });
    addFormLastBroker = broker;
    addFormLastType = assetType;
    addFormFeedbackMsg = { text: `Added ${symbol.toUpperCase()}.`, isError: false };
    saveData();
    render();
  };
}

// ---------- Excel (.xlsx/.xls) import -- fuzzy column detection ----------
// Real broker exports (Zerodha, Angel One, Groww, ...) don't share one exact column schema, so
// this matches headers by normalized substring against per-field alias lists rather than
// requiring an exact match -- e.g. "Avg. cost" and "Buy Avg" both resolve to the same "price"
// field. An ISIN found in a column's actual cell values is treated as an independent,
// broker-agnostic signal for the symbol/security column, used as a fallback when no header
// matches (some exports label that column just "Security" or leave it ambiguous).
const ISIN_REGEX = /^[A-Z]{2}[A-Z0-9]{9}[0-9]$/;
const XLSX_FIELD_ALIASES = {
  symbol:   ['instrument','symbol','scrip','ticker','stock name','trading symbol','security name','security'],
  quantity: ['qty','quantity','units','shares'],
  price:    ['avg cost','average price','buy avg','avg price','buy price','cost price','purchase price','buy rate'],
  date:     ['buy date','trade date','purchase date','date'], // "date" last -- most generic, so more specific aliases win first
};
// Lowercase, trim, strip punctuation to spaces, collapse whitespace -- "Avg. Cost" and "Qty."
// both normalize to a form the alias lists above can substring-match against.
function normalizeHeader(h){
  return String(h==null ? '' : h).toLowerCase().replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' ').trim();
}
function fieldForHeader(headerText){
  const norm = normalizeHeader(headerText);
  if(!norm) return null;
  for(const field of ['symbol','quantity','price','date']){
    if(XLSX_FIELD_ALIASES[field].some(alias => norm.includes(alias))) return field;
  }
  return null;
}
function parseNumericCell(v){
  if(v === '' || v === null || v === undefined) return NaN;
  if(typeof v === 'number') return v;
  const cleaned = String(v).replace(/[,₹$\s]/g, '');
  return cleaned === '' ? NaN : parseFloat(cleaned);
}
function excelDateToISO(v){
  if(v === '' || v === null || v === undefined) return '';
  if(v instanceof Date && !isNaN(v.getTime())) return v.toISOString().slice(0,10);
  const s = String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const d = new Date(s);
  return isNaN(d.getTime()) ? '' : d.toISOString().slice(0,10);
}
// Given a header row and the data rows beneath it, map each recognizable column to symbol /
// quantity / price / date. First column matching a field's alias list wins that field (left to
// right); a column already claimed by one field isn't reused for another. Returns the mapping
// plus how each match was made ("header" vs "isin"), so the preview UI can show its work.
function detectColumnMapping(headerRow, dataRows){
  const mapping = {}; // field -> column index
  const matchedBy = {}; // field -> 'header' | 'isin'
  headerRow.forEach((cell, idx) => {
    const field = fieldForHeader(cell);
    if(field && mapping[field] === undefined){ mapping[field] = idx; matchedBy[field] = 'header'; }
  });
  // ISIN content-scan fallback for symbol: only kicks in when no header matched a symbol column --
  // scans a sample of data rows for a column whose cells consistently look like ISINs (broker-
  // independent identifier, unlike a ticker convention that varies by exchange).
  if(mapping.symbol === undefined && dataRows.length){
    const sample = dataRows.slice(0, 15);
    const colCount = headerRow.length;
    let bestCol = -1, bestHits = 0;
    for(let c=0; c<colCount; c++){
      let hits = 0;
      sample.forEach(row => { if(row[c] !== undefined && ISIN_REGEX.test(String(row[c]).trim())) hits++; });
      if(hits > bestHits){ bestHits = hits; bestCol = c; }
    }
    if(bestCol >= 0 && bestHits >= Math.max(2, Math.ceil(sample.length * 0.5))){
      mapping.symbol = bestCol; matchedBy.symbol = 'isin';
    }
  }
  return { mapping, matchedBy };
}
// Scans the first several rows of the sheet for the best header row -- real exports often have
// a title/date row or two above the actual column headers (e.g. "Holdings as on ..."). Picks the
// earliest row (within the first 10) where symbol + quantity + price are all detected; if none
// qualifies, returns the best partial match found so the preview can explain what's missing.
function findHeaderRowAndMapping(rows){
  let best = null;
  const scanLimit = Math.min(rows.length, 10);
  for(let r=0; r<scanLimit; r++){
    const headerRow = rows[r].map(c => c==null ? '' : String(c));
    const dataRows = rows.slice(r+1, r+16);
    const { mapping, matchedBy } = detectColumnMapping(headerRow, dataRows);
    const score = ['symbol','quantity','price','date'].filter(f => mapping[f] !== undefined).length;
    const candidate = { headerRowIndex: r, headerRow, mapping, matchedBy, score };
    const required = mapping.symbol !== undefined && mapping.quantity !== undefined && mapping.price !== undefined;
    if(required) return candidate; // first fully-usable header row wins -- earliest is almost always correct
    if(!best || score > best.score) best = candidate;
  }
  return best;
}
async function handleExcelFileSelected(file){
  xlsxImport = { fileName: file.name, loading: true };
  render();
  const loaded = await ensureXlsxLoaded();
  if(!loaded){
    xlsxImport = { fileName: file.name, failed: true, reason: `Could not load Excel support: ${xlsxLoadErrorMsg}. Check your connection and try again, or use the paste/CSV format above.` };
    render(); return;
  }
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:true});
    const sheetName = wb.SheetNames[0];
    const sheet = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:'', raw:true});
    const nonEmptyRows = rows.filter(r => r.some(c => c!=='' && c!==null && c!==undefined));
    if(nonEmptyRows.length === 0){
      xlsxImport = { fileName: file.name, failed: true, reason: 'This file has no readable rows.' };
      render(); return;
    }
    const found = findHeaderRowAndMapping(nonEmptyRows);
    const requiredOk = found && found.mapping.symbol !== undefined && found.mapping.quantity !== undefined && found.mapping.price !== undefined;
    if(!requiredOk){
      const gotFields = found ? Object.keys(found.mapping) : [];
      xlsxImport = {
        fileName: file.name, failed: true,
        reason: `Could not confidently detect Symbol, Quantity and Price columns${gotFields.length ? ` (only recognized: ${gotFields.join(', ')})` : ''}. Try the paste format above instead, or check the file has a proper header row.`,
        headerRow: found ? found.headerRow : nonEmptyRows[0],
      };
      render(); return;
    }
    const dataRows = nonEmptyRows.slice(found.headerRowIndex + 1);
    const parsedRows = [];
    let skipped = 0;
    dataRows.forEach(row => {
      const symbolRaw = row[found.mapping.symbol];
      const symbol = symbolRaw==null ? '' : String(symbolRaw).trim();
      const qty = parseNumericCell(row[found.mapping.quantity]);
      const price = parseNumericCell(row[found.mapping.price]);
      const date = found.mapping.date !== undefined ? excelDateToISO(row[found.mapping.date]) : '';
      if(!symbol || !isFinite(qty) || qty<=0 || !isFinite(price) || price<0){ skipped++; return; }
      parsedRows.push({ symbol, qty, price, date });
    });
    if(parsedRows.length === 0){
      xlsxImport = { fileName: file.name, failed: true, reason: `Found the right columns, but no rows had usable Symbol/Qty/Price values (${skipped} row(s) skipped). Try the paste format above instead.` };
      render(); return;
    }
    xlsxImport = {
      fileName: file.name, failed: false,
      headerRow: found.headerRow, mapping: found.mapping, matchedBy: found.matchedBy,
      rows: parsedRows, skipped,
      broker: (data.accounts[0] && data.accounts[0].id) || null,
      assetType: 'Stock',
      skipDuplicates: true, // default: skip rows already in the portfolio rather than duplicate them
    };
    bulkAddOpen = true;
    render();
  }catch(err){
    xlsxImport = { fileName: file.name, failed: true, reason: 'Could not read this as an Excel file: ' + (err && err.message ? err.message : String(err)) };
    render();
  }
}

function fieldLabel(field){
  return { symbol:'Symbol', quantity:'Quantity', price:'Price (Buy)', date:'Date (Buy)' }[field] || field;
}

      if(skipDupes && findDuplicateHoldingIndex({ symbol: r.symbol, broker }) >= 0){ dupSkipped++; return; }

// ---------- CAS (NSDL/CDSL demat statement) PDF import ----------
// A Consolidated Account Statement aggregates holdings across ALL of a user's brokers/demat
// accounts into one document, unlike any single broker's own export -- genuinely broker-agnostic.
// Near-universally password-protected. Everything here runs client-side via the self-hosted
// PDF.js build; nothing is uploaded anywhere (see the notice rendered in the UI below).
//
// IMPORTANT / UNVERIFIED: the text-layout parsing in parseCasPdfText() below was built defensively
// against publicly documented NSDL/CDSL CAS structure and general technique (positional text
// extraction + ISIN-anchored regex, in the spirit of open-source tools like `casparser`), but this
// session had no real CAS file to test against -- it has NOT been verified against an actual
// statement's real text layout. It is deliberately kept in one isolated, easy-to-revise function
// (see portfolio/PROGRESS.md) so it can be corrected quickly once tried against a real document.
// CAMS/KFintech mutual-fund CAS (folio/AMC/scheme structure) is explicitly OUT of scope here --
// its layout is different enough from a demat CAS that a real half-built parser would be worse
// than a clear "not supported" message; NSDL/CDSL demat CAS is the primary, and only, target,
// since it maps directly onto this module's existing Stock/ETF holdings model.
// (pdf.min.js is lazy-loaded -- see ensurePdfJsLoaded above, which also sets
// GlobalWorkerOptions.workerSrc right after the library becomes available, since that can no
// longer run as a synchronous top-level check at page-init time.)

async function handleCasFileSelected(file){
  resetCasImport();
  casImport.fileName = file.name;
  casImport.stage = 'loading-lib';
  render();
  const loaded = await ensurePdfJsLoaded();
  if(!loaded){
    casImport.stage = 'error';
    casImport.errorMsg = `Could not load PDF support: ${pdfjsLoadErrorMsg}. Check your connection and try again.`;
    render(); return;
  }
  casImport.stage = 'reading';
  render();
  let buf;
  try{ buf = await file.arrayBuffer(); }
  catch(err){ casImport.stage='error'; casImport.errorMsg = 'Could not read this file: ' + err.message; render(); return; }
  startCasUnlock(buf);
}

// Kept separate from handleCasFileSelected so the same in-flight loadingTask.promise can be
// awaited once and resumed via updatePassword() without re-reading the file -- pdf.js calls
// onPassword again (with INCORRECT_PASSWORD) if a wrong password is submitted, and this same
// await simply continues until it either resolves or the user gives up.
async function startCasUnlock(buf){
  casImport.stage = 'unlocking-init';
  const loadingTask = pdfjsLib.getDocument({ data: new Uint8Array(buf.slice(0)) });
  loadingTask.onPassword = (updatePassword, reason) => {
    casImport.pdfPasswordUpdate = updatePassword;
    casImport.incorrectAttempt = (reason === pdfjsLib.PasswordResponses.INCORRECT_PASSWORD);
    casImport.stage = 'awaiting-password';
    render();
    requestAnimationFrame(()=>{ const inp = document.getElementById('cas_pw_input'); if(inp) inp.focus(); });
  };
  try{
    const pdf = await loadingTask.promise;
    casImport.stage = 'extracting';
    render();
    const { fullText, lines } = await extractPdfLines(pdf);
    if(!fullText.trim()){
      casImport.stage = 'parse-failed';
      casImport.parseFailReason = 'No text found in this PDF — it may be a scanned image rather than a real document, which this tool can\'t read. Try Excel import or manual/paste entry instead.';
      render(); return;
    }
    const result = parseCasPdfText(fullText, lines);
    if(!result.ok){
      casImport.stage = 'parse-failed';
      casImport.parseFailReason = result.reason;
      render(); return;
    }
    casImport.groups = result.groups.map(g => ({
      label: g.label, holdings: g.holdings,
      broker: guessBrokerForGroup(g),
      assetType: 'Stock',
    }));
    casImport.stage = 'parsed';
    render();
  }catch(err){
    casImport.stage = 'error';
    casImport.errorMsg = 'Could not open this PDF: ' + (err && err.message ? err.message : String(err));
    render();
  }
}

function submitCasPassword(pw){
  if(!casImport.pdfPasswordUpdate) return;
  const fn = casImport.pdfPasswordUpdate;
  casImport.pdfPasswordUpdate = null;
  casImport.stage = 'unlocking';
  render();
  fn(pw || '');
}

// Groups PDF.js text items into visual lines by rounded vertical position, sorted left-to-right
// within a line -- this reads real tabular PDF text far more reliably than a naive join of every
// item in extraction order, which often interleaves columns. Same general technique used for
// ITRGenie's PDF text extraction, extended here with line grouping because CAS parsing needs
// row structure, not just a prose blob.
async function extractPdfLines(pdf){
  const lines = [];
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const byY = new Map();
    content.items.forEach(it=>{
      if(!it.str || !it.str.trim()) return;
      const y = Math.round(it.transform[5]);
      const x = it.transform[4];
      if(!byY.has(y)) byY.set(y, []);
      byY.get(y).push({ x, str: it.str });
    });
    const ys = Array.from(byY.keys()).sort((a,b)=> b-a); // PDF y grows upward -- top of page first
    ys.forEach(y=>{
      const items = byY.get(y).sort((a,b)=>a.x-b.x);
      const line = items.map(i=>i.str).join(' ').replace(/\s+/g,' ').trim();
      if(line) lines.push(line);
    });
  }
  return { fullText: lines.join('\n'), lines };
}

// ---- Isolated, easy-to-revise CAS text parser -- UNVERIFIED against a real statement ----
// Anchors on ISIN (broker-independent, format-independent: [A-Z]{2}[A-Z0-9]{9}[0-9]) as the one
// reliable signal in an otherwise-inconsistent table layout. For each line containing an ISIN:
// the ISIN itself is stripped out FIRST (an ISIN like "INE009A01021" contains digit runs of its
// own -- "009", "01021" -- that would otherwise contaminate the numeric-token scan below and,
// depending on column order, corrupt the qty/value pick). The last two remaining numeric tokens
// on the line are then treated as quantity then market value, since NSDL/CDSL holding-statement
// tables near-universally end each row with a balance/quantity column followed by a value column
// -- this ordering is a best-effort assumption based on published CAS format documentation, NOT
// confirmed against a real file. The security name is whatever text is left once the ISIN and
// those numeric tokens are both removed -- this works regardless of whether a real CAS orders
// columns as ISIN-Name-Qty-Value or Name-ISIN-Qty-Value or something else, since it subtracts
// known tokens rather than assuming a fixed position. Lines mentioning DP ID / Client ID / BO ID /
// Depository Participant / CDSL / NSDL are used only to *label* groups of holdings (for the
// account-assignment dropdown in the preview UI) -- mislabeling a group doesn't affect parsing
// correctness, it just gives the user a worse hint for which of their accounts to assign it to.
function parseCasPdfText(fullText, lines){
  const isinLineRe = /\b[A-Z]{2}[A-Z0-9]{9}[0-9]\b/;
  const acctHeaderRe = /(DP\s*ID|Client\s*ID|BO\s*ID|Depository\s*Participant|CDSL|NSDL)/i;
  const groups = [];
  let currentGroup = null;
  function ensureGroup(){
    if(!currentGroup){ currentGroup = { label: 'Holdings', holdings: [] }; groups.push(currentGroup); }
    return currentGroup;
  }
  lines.forEach(line=>{
    const isinMatch = line.match(isinLineRe);
    if(isinMatch){
      const isin = isinMatch[0];
      const g = ensureGroup();
      const withoutIsin = line.replace(isin, ' '); // strip the ISIN's own digits out of the scan entirely
      const numTokens = (withoutIsin.match(/\d[\d,]*\.?\d*/g) || []).filter(t => t.replace(/[,\.]/g,'').length>0);
      let qty = null, marketValue = null;
      if(numTokens.length >= 2){
        qty = parseFloat(numTokens[numTokens.length-2].replace(/,/g,''));
        marketValue = parseFloat(numTokens[numTokens.length-1].replace(/,/g,''));
      } else if(numTokens.length === 1){
        qty = parseFloat(numTokens[0].replace(/,/g,''));
      }
      let namePart = withoutIsin;
      numTokens.forEach(tok => { namePart = namePart.replace(tok, ' '); });
      namePart = namePart.replace(/\s+/g,' ').trim().replace(/^[-.\s]+|[-.\s]+$/g,'');
      if(!namePart) namePart = isin;
      if(qty!==null && isFinite(qty) && qty>0){
        g.holdings.push({ isin, name: namePart, qty, marketValue: (marketValue!==null && isFinite(marketValue)) ? marketValue : null });
      }
      return;
    }
    if(acctHeaderRe.test(line)){
      // Start a fresh group only once the current one already has holdings, so a header line that
      // repeats on every page (common in real statements) doesn't fragment one account into many
      // empty groups -- it just re-labels the group still being filled.
      if(!currentGroup || currentGroup.holdings.length>0){ currentGroup = { label: line.slice(0,90), holdings: [] }; groups.push(currentGroup); }
      else currentGroup.label = line.slice(0,90);
    }
  });
  const nonEmpty = groups.filter(g=>g.holdings.length>0);
  if(nonEmpty.length===0){
    return { ok:false, reason: 'Unlocked the PDF, but couldn\'t recognize a demat CAS holdings table in its text (no ISIN + quantity pattern found). This parser targets NSDL/CDSL demat statements specifically — if this is a CAMS/KFintech mutual-fund CAS or a different document, use Excel import or the manual/paste entry above instead.' };
  }
  return { ok:true, groups: nonEmpty };
}
function guessBrokerForGroup(g){
  const t = (g.label||'').toLowerCase();
  const hit = data.accounts.find(a => t.includes(a.name.toLowerCase()));
  return (hit || data.accounts[0] || {}).id || null;
}

function renderCasImportCard(container){
  const el = document.createElement('details');
  el.className = 'collapsible';
  el.id = 'cas-import-panel';
  if(casImportOpen) el.open = true;
  // Only auto-load on the panel's first-ever open (state 'idle'). render() rebuilds this whole
  // <details> node on every state change, so `el.open = true` above fires a synthetic 'toggle'
  // event on the brand-new node even when no user interaction happened -- if this handler kept
  // calling ensurePdfJsLoaded() unconditionally, a load failure (state 'error') would get retried
  // by that synthetic toggle, whose render() recreates the node, whose open=true fires another
  // synthetic toggle... an unbounded retry loop with no user action involved. Once state is
  // 'error' or 'loading' or 'ready', this handler does nothing further; the real retry-on-error
  // path is the user picking a file, which calls ensurePdfJsLoaded() directly (see
  // handleCasFileSelected) and is allowed to retry because that call is genuinely user-triggered.
  el.ontoggle = ()=>{ casImportOpen = el.open; if(el.open && pdfjsLoadState==='idle') ensurePdfJsLoaded(); };
  const body = document.createElement('div');
  body.className = 'details-body';
  body.innerHTML = `
    <div class="notice">
      <strong>Client-side only — nothing is uploaded anywhere.</strong> The PDF you choose, the
      password you enter, and everything extracted from it stay in this browser tab; unlocking and
      reading happens entirely in your device's memory, the same as every other tool in Financial
      OS. This is the one document that aggregates ALL your brokers/demat accounts into one file,
      so it's usually the fastest way to get a full picture in here.
    </div>
    <div class="notice warn">
      <strong>A CAS shows what you hold today, not what you paid for it.</strong> It has current
      quantity and current market value, not your original purchase price/date — those aren't in
      this document at all. Imported holdings will have <strong>Buy Price left blank</strong> for
      you to fill in yourself (editable directly in the Holdings table above, per row).
    </div>
    <div id="cas_body"></div>
  `;
  el.innerHTML = `<summary>Import from CAS (NSDL/CDSL demat statement) <span class="summary-hint">— PDF, usually password-protected</span></summary>`;
  el.appendChild(body);
  container.appendChild(el);
  renderCasBody(body.querySelector('#cas_body'));
}

function renderCasBody(container){
  const st = casImport.stage;
  if(st === 'idle'){
    container.innerHTML = `
      <div class="field-row">
        <div class="field"><label>CAS PDF file</label>
          <button class="btn small ghost" id="cas_file_btn" type="button">${pdfjsLoadState==='loading' ? 'Loading PDF support…' : 'Choose PDF file'}</button>
          <input type="file" id="cas_file" accept=".pdf" style="display:none">
        </div>
      </div>
      ${pdfjsLoadState==='error' ? `<p class="helptext" style="color:var(--rust);">Couldn't preload PDF support (${pdfjsLoadErrorMsg}) — choosing a file will try again.</p>` : ''}
    `;
    container.querySelector('#cas_file_btn').onclick = ()=> container.querySelector('#cas_file').click();
    container.querySelector('#cas_file').onchange = (e)=>{
      const file = e.target.files[0];
      if(file) handleCasFileSelected(file);
    };
    return;
  }
  if(st === 'loading-lib' || st === 'reading' || st === 'unlocking-init' || st === 'unlocking' || st === 'extracting'){
    const msg = { 'loading-lib':'Loading PDF support…', reading:'Reading file…', 'unlocking-init':'Opening PDF…', unlocking:'Checking password…', extracting:'Extracting holdings…' }[st];
    container.innerHTML = `<p class="helptext">${msg}</p>`;
    return;
  }
  if(st === 'awaiting-password'){
    container.innerHTML = `
      <p class="helptext" style="margin-bottom:6px;"><strong style="color:var(--text);">${casImport.fileName}</strong> is password-protected.</p>
      ${casImport.incorrectAttempt ? `<p class="helptext" style="color:var(--rust); margin-bottom:6px;">Incorrect password — try again.</p>` : ''}
      <div class="pw-row">
        <div class="field" style="max-width:220px; margin-bottom:0;"><label>Password</label><input type="password" id="cas_pw_input" placeholder="CAS PDF password"></div>
        <button class="btn small primary" id="cas_pw_unlock">Unlock</button>
        <button class="btn small ghost" id="cas_pw_cancel">Choose a different file</button>
      </div>
    `;
    const submit = ()=> submitCasPassword(container.querySelector('#cas_pw_input').value);
    container.querySelector('#cas_pw_unlock').onclick = submit;
    container.querySelector('#cas_pw_input').onkeydown = (e)=>{ if(e.key==='Enter') submit(); };
    container.querySelector('#cas_pw_cancel').onclick = ()=>{ resetCasImport(); render(); };
    return;
  }
  if(st === 'error' || st === 'parse-failed'){
    const msg = st==='error' ? casImport.errorMsg : casImport.parseFailReason;
    container.innerHTML = `
      <div class="notice warn"><strong>${st==='error' ? 'Could not open this PDF.' : 'Could not read this as a CAS.'}</strong> ${msg}</div>
      <button class="btn small ghost" id="cas_retry">Choose a different file</button>
    `;
    container.querySelector('#cas_retry').onclick = ()=>{ resetCasImport(); render(); };
    return;
  }
  if(st === 'parsed'){
    const totalHoldings = casImport.groups.reduce((s,g)=>s+g.holdings.length, 0);
    // Pre-commit duplicate check, matched the exact same way the commit handler below will match
    // (ISIN first, falling back to broker+symbol) -- so this count is exactly what will happen on
    // import, not an estimate. Re-importing the same/a refreshed CAS is a common, expected use
    // (e.g. quarterly), so a match here is treated as a refresh-in-place (Qty/Current Price
    // updated on the existing holding) rather than a new duplicate row -- Buy Price is never
    // touched by a refresh, since a CAS never carries that data.
    let willUpdate = 0, willAdd = 0;
    casImport.groups.forEach(g=>{
      g.holdings.forEach(h=>{
        const idx = findDuplicateHoldingIndex({ isin: h.isin, symbol: (h.name||h.isin), broker: g.broker });
        if(idx >= 0) willUpdate++; else willAdd++;
      });
    });
    const groupsHtml = casImport.groups.map((g, gi)=>{
      const rows = g.holdings.map(h=>{
        const perShare = (h.marketValue!==null && h.qty>0) ? (h.marketValue/h.qty) : null;
        return `<tr>
          <td data-label="Security">${h.name}</td>
          <td data-label="ISIN" class="cell-muted">${h.isin}</td>
          <td data-label="Qty">${h.qty}</td>
          <td data-label="Market Value">${h.marketValue!==null ? formatMoney(h.marketValue,'INR') : '—'}</td>
          <td data-label="Current Price (from CAS)">${perShare!==null ? formatMoney(perShare,'INR') : '—'}</td>
        </tr>`;
      }).join('');
      return `
        <div class="import-group">
          <h4>${g.label} <span class="cell-muted" style="font-weight:400;">(${g.holdings.length} holding${g.holdings.length===1?'':'s'})</span></h4>
          <div class="field-row">
            <div class="field"><label>Import into account</label>
              <select data-cas-broker="${gi}">${data.accounts.map(a=>`<option value="${a.id}" ${a.id===g.broker?'selected':''}>${a.name}</option>`).join('')}</select>
            </div>
            <div class="field"><label>Asset type (applies to this group)</label>
              <select data-cas-type="${gi}">${['Stock','ETF','Mutual Fund','Other'].map(t=>`<option value="${t}" ${t===g.assetType?'selected':''}>${t}</option>`).join('')}</select>
            </div>
          </div>
          <div class="table-scroll"><table class="day-table"><thead><tr><th>Security</th><th>ISIN</th><th>Qty</th><th>Market Value</th><th>Current Price (from CAS)</th></tr></thead><tbody>${rows}</tbody></table></div>
        </div>
      `;
    }).join('');
    container.innerHTML = `
      <p class="helptext" style="margin-bottom:4px;"><strong style="color:var(--text);">${totalHoldings} holding(s) found in ${casImport.fileName}</strong>, grouped as detected below. Review the account assignment for each group, then import.</p>
      ${willUpdate>0 ? `
      <div class="notice">
        <strong>${willUpdate} of these already exist in your holdings</strong> (matched by ISIN/symbol) —
        importing will refresh their Qty and Current Price in place rather than create duplicate rows.
        Buy Price is never touched by a CAS refresh, since a CAS doesn't carry that data.
        ${willAdd>0 ? ` ${willAdd} new holding${willAdd===1?'':'s'} will be added.` : ''}
      </div>` : ''}
      ${groupsHtml}
      <div style="display:flex; gap:8px; margin-top:14px;">
        <button class="btn primary small" id="cas_confirm">${willUpdate>0 ? `Import ${willAdd} new / refresh ${willUpdate} existing` : `Import ${totalHoldings} holding${totalHoldings===1?'':'s'}`}</button>
        <button class="btn small ghost" id="cas_cancel">Cancel</button>
      </div>
    `;
    container.querySelectorAll('[data-cas-broker]').forEach(sel=>{
      sel.onchange = (e)=>{ casImport.groups[+e.target.dataset.casBroker].broker = e.target.value; render(); };
    });
    container.querySelectorAll('[data-cas-type]').forEach(sel=>{
      sel.onchange = (e)=>{ casImport.groups[+e.target.dataset.casType].assetType = e.target.value; };
    });
    container.querySelector('#cas_confirm').onclick = ()=>{
      const today = new Date().toISOString().slice(0,10);
      let added = 0, updated = 0;
      casImport.groups.forEach(g=>{
        g.holdings.forEach(h=>{
          const perShare = (h.marketValue!==null && h.qty>0) ? (h.marketValue/h.qty) : '';
          const symbol = (h.name||h.isin).toUpperCase().slice(0,60);
          const idx = findDuplicateHoldingIndex({ isin: h.isin, symbol, broker: g.broker });
          if(idx >= 0){
            // Update-in-place: a CAS reflects a point-in-time snapshot of qty/value, so a
            // re-import is treated as a refresh of the existing holding, not a new row. Buy
            // Price/Buy Date are deliberately left untouched -- a CAS never carries that data, so
            // overwriting a value the user already filled in manually would destroy real
            // information for no reason.
            const existing = data.holdings[idx];
            existing.qty = h.qty;
            existing.currentPrice = perShare;
            if(perShare !== '') existing.asOf = today;
            if(!existing.isin && h.isin) existing.isin = h.isin;
            updated++;
          } else {
            data.holdings.push({
              id: newId('h'), symbol, broker: g.broker, assetType: g.assetType,
              qty: h.qty, buyPrice: '', buyDate: '',
              currentPrice: perShare, asOf: perShare!=='' ? today : '',
              isin: h.isin, // provenance only -- also what future re-imports match against
            });
            added++;
          }
        });
      });
      const parts = [];
      if(added>0) parts.push(`${added} new holding${added===1?'':'s'} added`);
      if(updated>0) parts.push(`${updated} existing holding${updated===1?'':'s'} refreshed (Qty/Current Price updated by ISIN/symbol match, Buy Price untouched)`);
      bulkAddFeedbackMsg = `CAS import from "${casImport.fileName}": ${parts.join(', ') || 'no holdings found'}.`
        + (added>0 ? ' Buy Price left blank on new holdings — fill in per row in the Holdings table above.' : '');
      bulkAddOpen = true;
      resetCasImport();
      saveData(); render();
    };
    container.querySelector('#cas_cancel').onclick = ()=>{ resetCasImport(); render(); };
    return;
  }
}

  const el = document.createElement('details');

  // open (state 'idle'), not on every synthetic 'toggle' a re-render's `el.open = true` fires on
  // the freshly-rebuilt <details> node -- otherwise a load failure retries forever with no user
  // action involved. Real retry-on-error happens when the user picks a file (handleExcelFileSelected
  // calls ensureXlsxLoaded() directly).
  el.ontoggle = ()=>{ bulkAddOpen = el.open; if(el.open && xlsxLoadState==='idle') ensureXlsxLoaded(); };
  el.innerHTML = `
    <summary>Bulk add / advanced <span class="summary-hint">— paste multiple holdings, or upload a CSV/TXT file</span></summary>
    <div class="details-body">
      <p class="helptext" style="margin-bottom:8px;">One holding per line: <code>Symbol, Broker, AssetType, Qty, BuyPrice, BuyDate, CurrentPrice, AsOf</code> — CurrentPrice and AsOf are optional (leave blank if you don't have a current price yet; it'll be flagged "stale" and gain/loss shown as zero until you fill it in). Dates as YYYY-MM-DD; ₹/$ symbols and thousands commas in the price columns are fine.</p>
      <p class="helptext" style="margin-bottom:8px;">Examples:<br>
        <code>INFY, Axis Direct, Equity, 50, 1450, 2022-04-15, 1850, 2026-08-01</code><br>
        <code>VOO, Vested-US, ETF, 10, 380.25, 2023-01-10, 512.40, 2026-08-01</code></p>
      <textarea id="h_paste" rows="4" placeholder="Symbol, Broker, AssetType, Qty, BuyPrice, BuyDate, CurrentPrice, AsOf"></textarea>
      <label style="display:flex; align-items:center; gap:6px; margin-top:8px; font-size:13px; color:var(--muted);">
        <input type="checkbox" id="h_skip_dupes" ${bulkPasteSkipDuplicates ? 'checked' : ''}>
