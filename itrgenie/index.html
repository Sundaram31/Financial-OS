          <div class="field"><label>Gross receipts / turnover (₹)</label><input id="bi_bk_gross" type="number" value="${bk.gross||''}"></div>
          <div class="field"><label>Total expenses (₹)</label><input id="bi_bk_exp" type="number" value="${bk.expenses||''}"></div>
        </div>
        <div id="bi_bk_result" style="margin-top:12px;"></div>
      `;
      bodyWrap.appendChild(card);
      function renderResult(){
        const el = card.querySelector('#bi_bk_result');
        const gross = +bk.gross||0, exp = +bk.expenses||0;
        if(gross < 0){
          el.innerHTML = `<div class="result-box" style="border-color:var(--rust);"><div class="verdict" style="color:var(--rust);">Gross receipts can't be negative</div><div class="basis">Check the figure entered — turnover/gross receipts is never negative, even in a loss-making year (the loss shows up after expenses, not in turnover itself).</div></div>`;
          return;
        }
        if(exp < 0){
          el.innerHTML = `<div class="result-box" style="border-color:var(--rust);"><div class="verdict" style="color:var(--rust);">Expenses can't be negative</div><div class="basis">Check the figure entered.</div></div>`;
          return;
        }
        if(gross===0 && exp===0){ el.innerHTML=''; return; }
        const net = gross - exp;
        const rules = BusinessIncomeModule.ruleSet;
        const auditLikely = gross > rules.auditThresholdCash;
        el.innerHTML = `<div class="result-box"><div class="verdict">Net ${net>=0?'profit':'loss'}: ₹${Math.abs(net).toLocaleString('en-IN')}</div>
          ${auditLikely ? `<div class="basis" style="color:var(--rust);">⚠ Turnover exceeds ₹1 crore — tax audit may apply (extends to ₹10 crore under the cash-transaction conditions). Verify current thresholds.</div>` : ''}
        </div>`;
      }
      renderResult();
      card.querySelector('#bi_bk_gross').onchange = (e)=>{ bk.gross=e.target.value; save(); renderResult(); };
      card.querySelector('#bi_bk_exp').onchange = (e)=>{ bk.expenses=e.target.value; save(); renderResult(); };
    }

    renderBody();
  }
};
registerModule(BusinessIncomeModule);

/* =========================================================================
   MODULE: Foreign Assets & Income
   Applies to anyone with foreign brokerage/bank holdings (US stocks via
   Vested/DriveWealth/IBKR etc). Schedule FA + Form 67 are the two things
   people most often miss — mismatches here are a known scrutiny trigger.
   ========================================================================= */
const ForeignAssetsModule = {
  id: 'foreign_assets',
  label: 'Foreign assets & income',
  order: 3.3,
  ruleSet: {},
  isActive: (p) => !!p.hasForeignAssets,
  hasStarted: (p) => !!p.hasForeignAssets,
  isComplete: (p) => !!p.foreignAssetsChecked,
  requiredDocs: () => ([
    {id:'broker_annual_statement', name:'Foreign broker annual statement (e.g. Vested/DriveWealth combined statement)', note:'Source for holdings, dividends, gains — cross-check every figure before using it.'},
    {id:'form67_draft', name:'Form 67 (foreign tax credit) — broker-provided draft', note:'Verify each income line against the itemized dividend/interest lists in the same statement — templated Form 67s can carry stale totals.'},
    {id:'1042s', name:'Form 1042-S (US withholding certificate)', note:'Proof of US tax withheld, needed to support the Form 67 claim under Sec 90.'},
    {id:'schedule_fa_data', name:'Peak balance + closing balance per foreign holding (calendar year basis)', note:'Schedule FA uses calendar year, not FY — a common source of mismatch.'},
    {id:'bank_statements', name:'Foreign bank account statements (peak + closing balance)', note:'Schedule FA Table A1 — required even for a dormant or low-balance account.'}
  ]),
  fallbackDocs: () => ({
    'form67_draft': ['Manually reconcile from the itemized dividend/interest/SLIP income tables in the broker statement'],
    '1042s': ['Broker\'s tax document section (usually same portal as the annual statement)']
  }),
  render(container, p, save){
    const header = document.createElement('div');
    header.className = 'panel-header';
    header.innerHTML = `
      <div class="eyebrow">Module 03 · Schedule FA hub — equity, bank accounts, and cross-references to real estate/crypto</div>
      <h2>Foreign assets &amp; income</h2>
      <p class="desc">Covers foreign equity/ETF gains and foreign bank account disclosure here. Foreign real estate belongs in the Real Estate module (mark it "Foreign" there); foreign-held crypto belongs in the Crypto/VDA module — both still need to be listed here too, since Schedule FA disclosure is separate from where the income itself is computed.</p>
    `;
    container.appendChild(header);

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <h3>Do you hold foreign assets?</h3>
      <div class="field-row">
        <div class="field">
          <select id="fa_toggle">
            <option value="yes" ${p.hasForeignAssets?'selected':''}>Yes</option>
            <option value="no" ${!p.hasForeignAssets?'selected':''}>No</option>
          </select>
        </div>
      </div>
    `;
    container.appendChild(card);
    card.querySelector('#fa_toggle').onchange = (e)=>{ p.hasForeignAssets = e.target.value==='yes'; save(); renderRail(); renderContent(); };

    if(!p.hasForeignAssets) return;

    // Cross-reference note if real estate or VDA modules already have foreign items flagged
    const foreignRE = (p.realEstateTransactions||[]).filter(t=>t.isForeign);
    if(foreignRE.length>0 || p.hasVDA){
      const xref = document.createElement('div');
      xref.className = 'card';
      xref.style.borderColor = 'var(--gold-dim)';
      xref.innerHTML = `<h3>Already flagged elsewhere</h3>
        ${foreignRE.length>0 ? `<p class="helptext">${foreignRE.length} foreign propert${foreignRE.length===1?'y':'ies'} logged in the Real Estate module — make sure peak/closing value is included in Schedule FA Table A3 below.</p>` : ''}
        ${p.hasVDA ? `<p class="helptext">Crypto/VDA module is active — if any holdings sit on a foreign exchange, they need Schedule FA Table A2/A3 disclosure too, on top of the 30% VDA tax computed there.</p>` : ''}
      `;
      container.appendChild(xref);
    }

    // ---- Foreign bank accounts (Schedule FA Table A1) ----
    p.foreignBankAccounts = p.foreignBankAccounts || [];
    const bankCard = document.createElement('div');
    bankCard.className = 'card';
    bankCard.innerHTML = `
      <h3>Foreign bank accounts (Schedule FA Table A1)</h3>
      <p class="helptext" style="margin-bottom:8px;">One per line, calendar-year basis (Jan-Dec, not FY): <code>Bank, Country, PeakBalance, ClosingBalance</code></p>
      <textarea id="fa_bank_paste" rows="2" style="width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:8px; border-radius:4px; font-family:var(--mono); font-size:12px;" placeholder="Chase Bank, USA, 250000, 180000"></textarea>
      <button class="btn small" id="fa_bank_btn" style="margin-top:8px;">Parse &amp; add</button>
      <div id="fa_bank_feedback" class="helptext" style="margin:6px 0;"></div>
      <div id="fa_bank_rows"></div>
    `;
    container.appendChild(bankCard);
    function renderBankRows(){
      const el = bankCard.querySelector('#fa_bank_rows');
      if(p.foreignBankAccounts.length===0){
        el.innerHTML = `<div class="helptext" style="padding:8px 0;">None added yet — even a dormant/near-zero account needs disclosure if it existed during the calendar year.</div>`;
        return;
      }
      const table = document.createElement('table');
      table.className = 'day-table';
      table.innerHTML = `<tr><th>Bank</th><th>Country</th><th>Peak (₹)</th><th>Closing (₹)</th><th></th></tr>`;
      p.foreignBankAccounts.forEach((a,idx)=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${a.bank}</td><td>${a.country}</td><td>₹${(+a.peak).toLocaleString('en-IN')}</td><td>₹${(+a.closing).toLocaleString('en-IN')}</td><td><button class="btn small ghost" data-rm-bank="${idx}">✕</button></td>`;
        table.appendChild(tr);
      });
      el.innerHTML = '';
      el.appendChild(table);
      el.querySelectorAll('[data-rm-bank]').forEach(btn=>{
        btn.onclick = (e)=>{ p.foreignBankAccounts.splice(+e.target.dataset.rmBank,1); save(); renderBankRows(); };
      });
    }
    renderBankRows();
    bankCard.querySelector('#fa_bank_btn').onclick = ()=>{
      const raw = bankCard.querySelector('#fa_bank_paste').value;
      const rows = parsePastedRows(raw);
      let added=0, skipped=0;
      rows.forEach(cols=>{
        if(cols.length<4){ skipped++; return; }
        const [bank, country, peak, closing] = cols;
        if(!bank || !country || isNaN(+peak) || isNaN(+closing) || +peak<0 || +closing<0){ skipped++; return; }
        p.foreignBankAccounts.push({bank, country, peak:+peak, closing:+closing});
        added++;
      });
      save(); renderBankRows();
      bankCard.querySelector('#fa_bank_feedback').textContent = `Added ${added}${skipped>0?`, skipped ${skipped}`:''}.`;
      if(added>0) bankCard.querySelector('#fa_bank_paste').value='';
    };

    // ---- Equity gains + reconciliation checklist (existing functionality) ----
    const eqCard = document.createElement('div');
    eqCard.className = 'card';
    eqCard.innerHTML = `
      <h3>Foreign equity/ETF gains</h3>
      <div class="field-row">
        <div class="field"><label>Short-term capital gain (₹)</label><input id="fa_stcg" type="number" value="${p.foreignSTCG||0}"></div>
        <div class="field"><label>Long-term capital loss/gain (₹)</label><input id="fa_ltcg" type="number" value="${p.foreignLTCG||0}"></div>
      </div>
      <div class="divider"></div>
      <h3>Reconciliation checklist</h3>
      <div class="checklist-item">
        <div class="check-icon ${p.faReconChecks?.form67tie ? 'have':'missing'}">${p.faReconChecks?.form67tie?'✓':'○'}</div>
        <div class="check-body"><div class="doc-name">Form 67 total income tied to itemized dividend/interest list line-by-line</div></div>
        <div class="doc-toggle"><button class="btn small" id="chk_form67">${p.faReconChecks?.form67tie?'Checked':'Mark checked'}</button></div>
      </div>
      <div class="checklist-item">
        <div class="check-icon ${p.faReconChecks?.calendarYear ? 'have':'missing'}">${p.faReconChecks?.calendarYear?'✓':'○'}</div>
        <div class="check-body"><div class="doc-name">Schedule FA figures pulled on calendar-year basis (not FY)</div></div>
        <div class="doc-toggle"><button class="btn small" id="chk_cal">${p.faReconChecks?.calendarYear?'Checked':'Mark checked'}</button></div>
      </div>
    `;
    container.appendChild(eqCard);

    eqCard.querySelector('#fa_stcg').onchange = (e)=>{ p.foreignSTCG = +e.target.value||0; save(); };
    eqCard.querySelector('#fa_ltcg').onchange = (e)=>{ p.foreignLTCG = +e.target.value||0; save(); };
    p.faReconChecks = p.faReconChecks || {};
    eqCard.querySelector('#chk_form67').onclick = ()=>{
      p.faReconChecks.form67tie = !p.faReconChecks.form67tie;
      p.foreignAssetsChecked = p.faReconChecks.form67tie && p.faReconChecks.calendarYear;
      save(); renderContent();
    };
    eqCard.querySelector('#chk_cal').onclick = ()=>{
      p.faReconChecks.calendarYear = !p.faReconChecks.calendarYear;
      p.foreignAssetsChecked = p.faReconChecks.form67tie && p.faReconChecks.calendarYear;
      save(); renderContent();
    };
  }
};
registerModule(ForeignAssetsModule);

/* =========================================================================
   MODULE: House Property (Rental Income)
   Key design lesson baked in as a structural guardrail: GAV is NEVER a
   number you type directly. It's always built by summing itemised rent
   credits — this is what prevents the classic mistake of substituting an
   unrelated document's figure (e.g. a tenant's HRA-exemption cap) for
   actual rent received. Supports multiple properties.
   ========================================================================= */
const HousePropertyModule = {
  id: 'house_property',
  label: 'House Property',
  order: 4,
  ruleSet: {
    standardDeductionRate: 0.30
  },
  isActive: (p) => p.incomeSources.rental,
  hasStarted: (p) => p.properties && p.properties.length > 0,
  isComplete: (p) => (p.properties||[]).length > 0 && p.properties.every(pr => pr.selfOccupied || (pr.rentRows||[]).length > 0),
  requiredDocs: () => ([
    {id:'rent_agreement', name:'Rent agreement (current, signed)', note:'Establishes the tenancy and agreed rent — the reference point for whether bank credits look complete.'},
    {id:'bank_rent_credits', name:'Bank statement showing every rent credit for the FY', note:'This — not any third-party document — is what Gross Annual Value is built from.'},
    {id:'municipal_tax_receipt', name:'Municipal/property tax paid receipt', note:'Only municipal property tax is deductible under Sec 24 — water/sewerage charges generally are not.'},
    {id:'home_loan_cert', name:'Home loan interest certificate from the lender', note:'Needed for Sec 24(b) — EMI debits in a bank statement do NOT tell you the interest/principal split.'}
  ]),
  fallbackDocs: () => ({
    'rent_agreement': ['Bank credit history alone, cross-checked for a consistent monthly amount'],
    'municipal_tax_receipt': ['Corporation/municipality online portal payment history printout'],
  }),
  render(container, p, save){
    p.properties = p.properties || [];

    const header = document.createElement('div');
    header.className = 'panel-header';
    header.innerHTML = `
      <div class="eyebrow">Module 04 · Built from itemised rent, never a single typed number</div>
      <h2>House Property</h2>
      <p class="desc">Gross Annual Value is always the sum of actual rent credits you add below — never enter a GAV figure directly. This structurally rules out the most common mistake: substituting a different document's number (a tenant's HRA-exemption cap, an old year's figure, etc.) for real rent received.</p>
    `;
    container.appendChild(header);

    const listWrap = document.createElement('div');
    container.appendChild(listWrap);

    function renderProperties(){
      listWrap.innerHTML = '';
      if(p.properties.length === 0){
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'No properties added yet.';
        listWrap.appendChild(empty);
      }
      p.properties.forEach((prop, pIdx)=>{
        const card = document.createElement('div');
        card.className = 'card';

        const idFor = (s)=>`prop${pIdx}_${s}`;
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <h3 style="flex:1;">${prop.address || 'Property ' + (pIdx+1)}</h3>
            <button class="btn small ghost" data-remove-prop="${pIdx}">Remove</button>
          </div>
          <div class="field-row">
            <div class="field"><label>Address / label</label><input id="${idFor('addr')}" type="text" value="${prop.address||''}" placeholder="e.g. C-608, Jones Breeze"></div>
            <div class="field"><label>Tenant name</label><input id="${idFor('tenant')}" type="text" value="${prop.tenantName||''}"></div>
            <div class="field">
              <label>Status</label>
              <select id="${idFor('selfocc')}">
                <option value="letout" ${(!prop.selfOccupied && !prop.underConstruction)?'selected':''}>Let out</option>
                <option value="selfoccupied" ${prop.selfOccupied?'selected':''}>Self-occupied (incl. used rent-free by family — Nil ALV since AY25-26)</option>
                <option value="underconstruction" ${prop.underConstruction?'selected':''}>Under construction — no income yet</option>
              </select>
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label>Tenancy start date this FY (leave blank if let out the whole year)</label>
              <input id="${idFor('tenstart')}" type="date" value="${prop.tenancyStart||''}">
            </div>
            <div class="field">
              <label>Tenancy end date this FY (leave blank if ongoing)</label>
              <input id="${idFor('tenend')}" type="date" value="${prop.tenancyEnd||''}">
            </div>
          </div>
        `;
        listWrap.appendChild(card);

        card.querySelector(`#${idFor('addr')}`).onchange = e=>{ prop.address=e.target.value; save(); };
        card.querySelector(`#${idFor('tenant')}`).onchange = e=>{ prop.tenantName=e.target.value; save(); };
        card.querySelector(`#${idFor('selfocc')}`).onchange = e=>{
          const v = e.target.value;
          prop.selfOccupied = v==='selfoccupied';
          prop.underConstruction = v==='underconstruction';
          save(); renderProperties();
        };
        card.querySelector(`#${idFor('tenstart')}`).onchange = e=>{ prop.tenancyStart=e.target.value; save(); renderRentRows(); };
        card.querySelector(`#${idFor('tenend')}`).onchange = e=>{ prop.tenancyEnd=e.target.value; save(); renderRentRows(); };
        card.querySelector(`[data-remove-prop="${pIdx}"]`).onclick = ()=>{ p.properties.splice(pIdx,1); save(); renderProperties(); };

        if(prop.selfOccupied){
          const note = document.createElement('div');
          note.className = 'helptext';
          note.style.padding = '10px 0';
          note.textContent = 'Self-occupied (incl. used rent-free by family, e.g. parents/in-laws — Nil ALV under the current rule, no notional rent). Home loan interest across ALL self-occupied properties combined is capped at ₹2,00,000 total under Sec 24(b) — see the combined check below.';
          card.appendChild(note);
          const socard = document.createElement('div');
          socard.className = 'field-row';
          socard.innerHTML = `<div class="field"><label>Home loan interest this FY on THIS property (₹)</label><input id="${idFor('sohli')}" type="number" value="${prop.homeLoanInterest||0}"></div>`;
          card.appendChild(socard);
          socard.querySelector(`#${idFor('sohli')}`).onchange = (e)=>{ prop.homeLoanInterest = +e.target.value||0; save(); renderSelfOccupiedCapCheck(); };
          return;
        }

        if(prop.underConstruction){
          const note = document.createElement('div');
          note.className = 'helptext';
          note.style.padding = '10px 0';
          note.textContent = 'Under construction: no income to report, and interest paid during construction is NOT deductible yet. It accumulates as "pre-construction interest" and becomes deductible in 5 equal instalments starting the FY construction completes (Sec 24(b) proviso).';
          card.appendChild(note);
          const ucCard = document.createElement('div');
          ucCard.className = 'field-row';
          ucCard.innerHTML = `
            <div class="field"><label>Cumulative interest paid so far (all years, ₹)</label><input id="${idFor('ucint')}" type="number" value="${prop.preConstructionInterest||0}"></div>
            <div class="field"><label>Expected/actual construction completion FY (e.g. 2027-28)</label><input id="${idFor('uccomplete')}" type="text" value="${prop.completionFY||''}"></div>
          `;
          card.appendChild(ucCard);
          ucCard.querySelector(`#${idFor('ucint')}`).onchange = (e)=>{ prop.preConstructionInterest = +e.target.value||0; save(); renderUCNote(); };
          ucCard.querySelector(`#${idFor('uccomplete')}`).onchange = (e)=>{ prop.completionFY = e.target.value; save(); renderUCNote(); };
          const ucResult = document.createElement('div');
          card.appendChild(ucResult);
          function renderUCNote(){
            const total = +prop.preConstructionInterest||0;
            if(total>0){
              ucResult.innerHTML = `<div class="helptext" style="color:var(--gold); padding-top:6px;">Once construction completes${prop.completionFY?' (FY '+prop.completionFY+')':''}, this ₹${total.toLocaleString('en-IN')} becomes deductible at ₹${(total/5).toLocaleString('en-IN',{maximumFractionDigits:0})}/year for 5 years, on top of that year's regular interest. Log this figure in the Prior Years module too so it isn't lost by the time construction finishes.</div>`;
            } else { ucResult.innerHTML=''; }
          }
          renderUCNote();
          return;
        }

        // Rent rows sub-table
        const rentWrap = document.createElement('div');
        rentWrap.innerHTML = `<h3 style="margin-top:14px;">Rent credits (this builds GAV)</h3>
          <p class="helptext" style="margin-bottom:6px;">Paste from your bank statement, one credit per line: <code>Date, Amount, Label(optional)</code></p>
          <textarea id="${idFor('rentpaste')}" rows="3" style="width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:8px; border-radius:4px; font-family:var(--mono); font-size:12px;" placeholder="01/04/2025, 22000&#10;01/05/2025, 22000"></textarea>
          <button class="btn small" id="${idFor('rentpastebtn')}" style="margin-top:6px;">Parse &amp; add</button>
          <div id="${idFor('rentpastefeedback')}" class="helptext" style="margin:4px 0 10px;"></div>
          <div id="${idFor('rentrows')}"></div>
          <div class="field-row" style="margin-top:8px;">
            <div class="field"><label>Or add one manually — Date</label><input id="${idFor('newdate')}" type="date"></div>
            <div class="field"><label>Amount (₹)</label><input id="${idFor('newamt')}" type="number"></div>
            <div class="field"><label>Label (optional)</label><input id="${idFor('newlabel')}" type="text" placeholder="e.g. paid early"></div>
          </div>
          <button class="btn small" id="${idFor('addrent')}">+ Add rent credit</button>`;
        card.appendChild(rentWrap);

        function renderRentRows(){
          const el = rentWrap.querySelector(`#${idFor('rentrows')}`);
          prop.rentRows = prop.rentRows || [];
          if(prop.rentRows.length===0){
            el.innerHTML = `<div class="helptext" style="padding:8px 0;">No rent credits added yet.</div>`;
          } else {
            const table = document.createElement('table');
            table.className = 'day-table';
            table.innerHTML = `<tr><th>Date</th><th>Amount</th><th>Label</th><th></th></tr>`;
            prop.rentRows.forEach((rr, rIdx)=>{
              const tr = document.createElement('tr');
              tr.innerHTML = `<td>${rr.date}</td><td>₹${(+rr.amount).toLocaleString('en-IN')}</td><td>${rr.label||''}</td><td><button class="btn small ghost" data-rm-rent="${rIdx}">✕</button></td>`;
              table.appendChild(tr);
            });
            el.innerHTML = '';
            el.appendChild(table);
            el.querySelectorAll('[data-rm-rent]').forEach(btn=>{
              btn.onclick = (e)=>{ prop.rentRows.splice(+e.target.dataset.rmRent,1); save(); renderRentRows(); renderComputation(); };
            });
          }
          // Tenancy-aware count check — not a hardcoded 12
          const monthCount = prop.rentRows.length;
          if(monthCount > 0){
            const fyStart = new Date(2025, 3, 1); // FY 2025-26 default; profile.fy could refine this later
            const fyEnd = new Date(2026, 2, 31);
            const tStart = prop.tenancyStart ? new Date(prop.tenancyStart) : fyStart;
            const tEnd = prop.tenancyEnd ? new Date(prop.tenancyEnd) : fyEnd;
            const effStart = tStart > fyStart ? tStart : fyStart;
            const effEnd = tEnd < fyEnd ? tEnd : fyEnd;
            const monthsSpan = Math.max(1, Math.round((effEnd - effStart) / (1000*60*60*24*30.44)) + 1);
            if(monthCount !== monthsSpan){
              const warnEl = document.createElement('div');
              warnEl.className = 'helptext';
              warnEl.style.color = 'var(--gold)';
              warnEl.style.padding = '6px 0';
              warnEl.textContent = `⚠ ${monthCount} rent credit(s) recorded, but the tenancy period entered spans roughly ${monthsSpan} month(s). If this property was let out for the full period shown, check for a missing or duplicate month before treating the total as final.`;
              el.appendChild(warnEl);
            }
          }
        }
        renderRentRows();

        rentWrap.querySelector(`#${idFor('addrent')}`).onclick = ()=>{
          const d = rentWrap.querySelector(`#${idFor('newdate')}`).value;
          const a = rentWrap.querySelector(`#${idFor('newamt')}`).value;
          const l = rentWrap.querySelector(`#${idFor('newlabel')}`).value;
          if(!d || !a){ alert('Date and amount are required.'); return; }
          if(+a < 0){ alert('Rent amount can\'t be negative.'); return; }
          prop.rentRows = prop.rentRows || [];
          prop.rentRows.push({date:d, amount:+a, label:l});
          save();
          renderRentRows();
          renderComputation();
          rentWrap.querySelector(`#${idFor('newdate')}`).value='';
          rentWrap.querySelector(`#${idFor('newamt')}`).value='';
          rentWrap.querySelector(`#${idFor('newlabel')}`).value='';
        };

        rentWrap.querySelector(`#${idFor('rentpastebtn')}`).onclick = ()=>{
          const raw = rentWrap.querySelector(`#${idFor('rentpaste')}`).value;
          const rows = parsePastedRows(raw);
          let added = 0, skipped = 0;
          prop.rentRows = prop.rentRows || [];
          rows.forEach(cols=>{
            if(cols.length < 2){ skipped++; return; }
            const date = parseFlexDate(cols[0]);
            const amount = cols[1];
            const label = cols[2] || '';
            if(!date || amount==='' || isNaN(+amount)){ skipped++; return; }
            if(+amount < 0 || date.startsWith('INVALID:')){ skipped++; return; }
            prop.rentRows.push({date, amount:+amount, label});
            added++;
          });
          save();
          renderRentRows();
          renderComputation();
          rentWrap.querySelector(`#${idFor('rentpastefeedback')}`).textContent = `Added ${added} credit(s)${skipped>0 ? `, skipped ${skipped}` : ''}.`;
          if(added>0) rentWrap.querySelector(`#${idFor('rentpaste')}`).value = '';
        };

        // Deductions
        const dedWrap = document.createElement('div');
        dedWrap.innerHTML = `
          <div class="field-row" style="margin-top:14px;">
            <div class="field"><label>Municipal tax paid (₹) — property tax only, not water/sewerage</label><input id="${idFor('mtax')}" type="number" value="${prop.municipalTax||0}"></div>
            <div class="field"><label>Home loan interest, Sec 24(b) (₹) — from lender's certificate</label><input id="${idFor('hli')}" type="number" value="${prop.homeLoanInterest||0}"></div>
          </div>
        `;
        card.appendChild(dedWrap);
        dedWrap.querySelector(`#${idFor('mtax')}`).onchange = e=>{ prop.municipalTax = +e.target.value||0; save(); renderComputation(); };
        dedWrap.querySelector(`#${idFor('hli')}`).onchange = e=>{ prop.homeLoanInterest = +e.target.value||0; save(); renderComputation(); };

        const compWrap = document.createElement('div');
        card.appendChild(compWrap);

        function renderComputation(){
          const gav = (prop.rentRows||[]).reduce((s,r)=>s+(+r.amount||0),0);
          const mtax = prop.municipalTax||0;
          const nav = gav - mtax;
          const stdDed = nav * HousePropertyModule.ruleSet.standardDeductionRate;
          const hli = prop.homeLoanInterest||0;
          const income = nav - stdDed - hli;
          compWrap.innerHTML = `
            <div class="result-box" style="margin-top:14px;">
              <div class="verdict">Income from House Property: ₹${income.toLocaleString('en-IN',{maximumFractionDigits:2})}</div>
              <div class="basis">
                <div>Gross Annual Value (sum of rent credits): <code>₹${gav.toLocaleString('en-IN')}</code></div>
                <div>Less municipal tax: <code>₹${mtax.toLocaleString('en-IN')}</code></div>
                <div>Net Annual Value: <code>₹${nav.toLocaleString('en-IN')}</code></div>
                <div>Less standard deduction (30% of NAV): <code>₹${stdDed.toLocaleString('en-IN',{maximumFractionDigits:2})}</code></div>
                <div>Less home loan interest: <code>₹${hli.toLocaleString('en-IN')}</code></div>
              </div>
            </div>
          `;
        }
        renderComputation();
      });
    }
    renderProperties();

    const capCheckWrap = document.createElement('div');
    container.appendChild(capCheckWrap);
    function renderSelfOccupiedCapCheck(){
      const soProps = (p.properties||[]).filter(pr=>pr.selfOccupied);
      if(soProps.length===0){ capCheckWrap.innerHTML=''; return; }
      const totalSOInterest = soProps.reduce((s,pr)=>s+(+pr.homeLoanInterest||0),0);
      const cap = 200000;
      const over = totalSOInterest > cap;
      capCheckWrap.innerHTML = `
        <div class="card" style="border-color:${over?'var(--rust)':'var(--line)'};">
          <h3>Combined self-occupied interest cap (Sec 24(b))</h3>
          <p class="helptext">Total entered across ${soProps.length} self-occupied propert${soProps.length===1?'y':'ies'}: ₹${totalSOInterest.toLocaleString('en-IN')}. Cap: ₹${cap.toLocaleString('en-IN')} combined.</p>
          ${over ? `<p class="helptext" style="color:var(--rust);">⚠ Exceeds the cap by ₹${(totalSOInterest-cap).toLocaleString('en-IN')} — only ₹${cap.toLocaleString('en-IN')} is deductible this year regardless of how it's split between properties.</p>` : ''}
        </div>
      `;
    }
    renderSelfOccupiedCapCheck();
    // Re-render the cap check whenever properties change
    const _origRenderProperties = renderProperties;
    renderProperties = function(){ _origRenderProperties(); renderSelfOccupiedCapCheck(); };

    const addBtn = document.createElement('button');
    addBtn.className = 'btn primary';
    addBtn.style.marginTop = '10px';
    addBtn.textContent = '+ Add property';
    addBtn.onclick = ()=>{
      p.properties.push({address:'', tenantName:'', selfOccupied:false, underConstruction:false, rentRows:[], municipalTax:0, homeLoanInterest:0, preConstructionInterest:0, completionFY:''});
      save();
      renderProperties();
    };
    container.appendChild(addBtn);
  }
};
registerModule(HousePropertyModule);

/* =========================================================================
   MODULE: Schedule VIA — Chapter VI-A Deductions
   The regime toggle here matters a lot: the new tax regime (the default
   used elsewhere in this tool) disallows almost all of these deductions
   except 80CCD(2) employer NPS contribution. This module makes that
   explicit rather than silently computing a deduction total that
   wouldn't actually apply under the regime being used.
   ========================================================================= */
const DeductionsModule = {
  id: 'deductions_via',
  label: 'Deductions (Schedule VIA)',
  order: 4.5,
  ruleSet: {
    cap80C: 150000,
    cap80CCD1B: 50000,
    cap80DCheckup: 5000,
    cap80D_self_nonsenior: 25000,
    cap80D_self_senior: 50000,
    cap80D_parents_nonsenior: 25000,
    cap80D_parents_senior: 50000,
    cap80TTA: 10000,
    cap80TTB: 50000,
  },
  isActive: () => true,
  hasStarted: (p) => !!(p.deductions && p.deductions.regime),
  isComplete: (p) => !!(p.deductions && p.deductions.regime),
  requiredDocs: (p) => {
    if(p.deductions && p.deductions.regime === 'new'){
      return [{id:'nps_employer', name:'Employer NPS contribution proof (80CCD(2)), if applicable', note:'Almost the only Chapter VI-A deduction still available under the new regime.'}];
    }
    return [
      {id:'80c_proof', name:'80C investment proofs (PPF, ELSS, life insurance, home loan principal, etc.)', note:''},
      {id:'80d_proof', name:'Health insurance premium receipts (80D) — self and parents separately', note:''},
      {id:'80tta_ttb', name:'Savings/FD interest certificates for 80TTA/80TTB', note:'80TTB (senior citizens) covers FD interest too; 80TTA (others) only covers savings account interest.'},
    ];
  },
  fallbackDocs: () => ({}),
  render(container, p, save){
    p.deductions = p.deductions || {regime:null, c80:0, ccd1b:0,
      d80_self_premium:0, d80_self_checkup:0, d80_self_medexp:0,
      d80_parents_premium:0, d80_parents_checkup:0, d80_parents_medexp:0,
      parentsAreSenior:false, selfIsSenior:false, tta_ttb:0, g80:0, e80:0, ccd2:0};
    const d = p.deductions;

    const header = document.createElement('div');
    header.className = 'panel-header';
    header.innerHTML = `
      <div class="eyebrow">Module 04.5 · Which regime decides which deductions even apply</div>
      <h2>Deductions (Schedule VIA)</h2>
      <p class="desc">Pick your regime first — it changes almost everything below. The new regime disallows most Chapter VI-A deductions; only 80CCD(2) (employer NPS contribution) survives for most taxpayers.</p>
    `;
    container.appendChild(header);

    const regimeCard = document.createElement('div');
    regimeCard.className = 'card';
    regimeCard.innerHTML = `<h3>Tax regime</h3><div style="display:flex; gap:8px;" id="regime_choices"></div>`;
    container.appendChild(regimeCard);
    function renderRegimeChoices(){
      const el = regimeCard.querySelector('#regime_choices');
      el.innerHTML = '';
      [['new','New regime (default since FY23-24)'],['old','Old regime']].forEach(([val,label])=>{
        const btn = document.createElement('button');
        const selected = d.regime === val;
        btn.className = 'btn small' + (selected?' primary':' ghost');
        btn.textContent = label;
        btn.onclick = ()=>{ d.regime = val; save(); renderRegimeChoices(); renderBody(); };
        el.appendChild(btn);
      });
    }
    renderRegimeChoices();

    const bodyWrap = document.createElement('div');
    container.appendChild(bodyWrap);

    function field(label, key, note){
      return `<div class="field"><label>${label}</label><input id="ded_${key}" type="number" value="${d[key]||0}"></div>` + (note ? `<div class="helptext" style="width:100%;">${note}</div>` : '');
    }

    function renderBody(){
      bodyWrap.innerHTML = '';
      if(!d.regime) return;

      if(d.regime === 'new'){
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <h3>New regime — only 80CCD(2) generally applies</h3>
          <div class="field-row">${field('Employer NPS contribution — 80CCD(2) (₹)', 'ccd2')}</div>
          <p class="helptext">80C, 80D, 80TTA/TTB, 80G, and most others are NOT available under the new regime. If you were counting on these, compare against the old regime before assuming new-regime tax is lower — Schedule VIA below (old regime) will show what you'd be giving up.</p>
        `;
        bodyWrap.appendChild(card);
        card.querySelector('#ded_ccd2').onchange = (e)=>{ d.ccd2 = +e.target.value||0; save(); renderResult(); };
      } else {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <h3>Old regime — Chapter VI-A</h3>
          <div class="field-row">${field(`80C (cap ₹${DeductionsModule.ruleSet.cap80C.toLocaleString('en-IN')}) — PPF, ELSS, life insurance, home loan principal, etc.`, 'c80', 'Life insurance: only the premium up to 10% of sum assured (15% for certain disability/disease policies) actually qualifies here — premium beyond that isn\'t deductible even within the cap. Enter only the qualifying portion.')}</div>
          <div class="field-row">${field('80CCD(1B) — additional NPS self-contribution, cap ₹50,000, OVER AND ABOVE the 80C cap (₹)', 'ccd1b', 'Old regime only — a separate ₹50,000 allowance beyond the 80C ₹1.5L limit, one of the easiest additions if you\'re not already using it.')}</div>
          <div class="divider"></div>
          <h3>80D — Health insurance &amp; medical (self/family)</h3>
          <div class="field-row">
            <div class="field">
              <label>Are you 60+?</label>
              <select id="ded_selfsenior"><option value="no" ${!d.selfIsSenior?'selected':''}>No (cap ₹25,000)</option><option value="yes" ${d.selfIsSenior?'selected':''}>Yes (cap ₹50,000)</option></select>
            </div>
          </div>
          <div class="field-row">
            <div class="field"><label>Insurance premium — self/spouse/children, non-cash only (₹)</label><input id="ded_d80_self_premium" type="number" value="${d.d80_self_premium||0}"></div>
            <div class="field"><label>Preventive health checkup — self/family, cash OK, sub-capped ₹5,000 (₹)</label><input id="ded_d80_self_checkup" type="number" value="${d.d80_self_checkup||0}"></div>
          </div>
          ${d.selfIsSenior ? `<div class="field-row"><div class="field"><label>If NO insurance policy: actual medical expenditure, non-cash (₹)</label><input id="ded_d80_self_medexp" type="number" value="${d.d80_self_medexp||0}"></div></div>` : ''}
          <div class="divider"></div>
          <h3>80D — Health insurance &amp; medical (parents)</h3>
          <div class="field-row">
            <div class="field">
              <label>Are your parents 60+ AND resident (not NRI)?</label>
              <select id="ded_parentssenior"><option value="no" ${!d.parentsAreSenior?'selected':''}>No (cap ₹25,000)</option><option value="yes" ${d.parentsAreSenior?'selected':''}>Yes (cap ₹50,000)</option></select>
            </div>
          </div>
          <p class="helptext">The higher ₹50,000 senior-citizen limit only applies if your parent is a RESIDENT senior citizen — an NRI parent's age alone doesn't unlock it, worth double-checking if either parent lives abroad.</p>
          <div class="field-row">
            <div class="field"><label>Insurance premium — parents, non-cash only (₹)</label><input id="ded_d80_parents_premium" type="number" value="${d.d80_parents_premium||0}"></div>
            <div class="field"><label>Preventive health checkup — parents, cash OK, sub-capped ₹5,000 (₹)</label><input id="ded_d80_parents_checkup" type="number" value="${d.d80_parents_checkup||0}"></div>
          </div>
          ${d.parentsAreSenior ? `<div class="field-row"><div class="field"><label>If parents have NO insurance policy: actual medical expenditure, non-cash (₹)</label><input id="ded_d80_parents_medexp" type="number" value="${d.d80_parents_medexp||0}"></div></div>` : ''}
          <div class="divider"></div>
          <div class="field-row">${field('80TTA/80TTB — savings/FD interest deduction (₹)', 'tta_ttb', 'Non-senior: only savings a/c interest, cap ₹10,000 (80TTA). Senior citizen: all interest incl. FD, cap ₹50,000 (80TTB) — the two are mutually exclusive by age, not both.')}</div>
          <div class="field-row">${field('80G — donations (₹, already at the eligible % — 50%/100% varies by donee)', 'g80')}</div>
          <div class="field-row">${field('80E — education loan interest, no cap (₹)', 'e80')}</div>
          <div class="field-row">${field('80CCD(2) — employer NPS contribution, available in both regimes (₹)', 'ccd2')}</div>
        `;
        bodyWrap.appendChild(card);
        ['c80','ccd1b','d80_self_premium','d80_self_checkup','d80_self_medexp','d80_parents_premium','d80_parents_checkup','d80_parents_medexp','tta_ttb','g80','e80','ccd2'].forEach(k=>{
          const el = card.querySelector(`#ded_${k}`);
          if(el) el.onchange = (e)=>{ d[k] = +e.target.value||0; save(); renderResult(); };
        });
        card.querySelector('#ded_selfsenior').onchange = (e)=>{ d.selfIsSenior = e.target.value==='yes'; save(); renderBody(); };
        card.querySelector('#ded_parentssenior').onchange = (e)=>{ d.parentsAreSenior = e.target.value==='yes'; save(); renderBody(); };
      }
      renderResult();
    }

    const resultWrap = document.createElement('div');
    container.appendChild(resultWrap);

    function renderResult(){
      const rules = DeductionsModule.ruleSet;
      if(d.regime === 'new'){
        resultWrap.innerHTML = `<div class="result-box"><div class="verdict">Total deduction: ₹${(+d.ccd2||0).toLocaleString('en-IN')}</div><div class="basis">Just 80CCD(2) — everything else is disallowed under the new regime.</div></div>`;
        return;
      }
      if(d.regime === 'old'){
        const c80 = Math.min(+d.c80||0, rules.cap80C);
        const ccd1b = Math.min(+d.ccd1b||0, rules.cap80CCD1B);

        // 80D self: premium + checkup (checkup itself sub-capped at 5000) + no-insurance senior medical,
        // all sharing ONE overall cap (25k/50k) -- not additive on top of each other.
        const d80SelfCap = d.selfIsSenior ? rules.cap80D_self_senior : rules.cap80D_self_nonsenior;
        const selfCheckupCapped = Math.min(+d.d80_self_checkup||0, rules.cap80DCheckup);
        const d80SelfRaw = (+d.d80_self_premium||0) + selfCheckupCapped + (d.selfIsSenior ? (+d.d80_self_medexp||0) : 0);
        const d80Self = Math.min(d80SelfRaw, d80SelfCap);

        const d80ParentsCap = d.parentsAreSenior ? rules.cap80D_parents_senior : rules.cap80D_parents_nonsenior;
        const parentsCheckupCapped = Math.min(+d.d80_parents_checkup||0, rules.cap80DCheckup);
        const d80ParentsRaw = (+d.d80_parents_premium||0) + parentsCheckupCapped + (d.parentsAreSenior ? (+d.d80_parents_medexp||0) : 0);
        const d80Parents = Math.min(d80ParentsRaw, d80ParentsCap);

        const ttaTtbCap = d.selfIsSenior ? rules.cap80TTB : rules.cap80TTA;
        const ttaTtb = Math.min(+d.tta_ttb||0, ttaTtbCap);
        const total = c80 + ccd1b + d80Self + d80Parents + ttaTtb + (+d.g80||0) + (+d.e80||0) + (+d.ccd2||0);
        resultWrap.innerHTML = `
          <div class="result-box">
            <div class="verdict">Total deduction: ₹${total.toLocaleString('en-IN')}</div>
            <div class="basis">
              <div>80C: ₹${c80.toLocaleString('en-IN')} ${(+d.c80||0)>rules.cap80C ? '(capped — you entered more than the limit)' : ''}</div>
              <div>80CCD(1B) additional NPS: ₹${ccd1b.toLocaleString('en-IN')}</div>
              <div>80D self: ₹${d80Self.toLocaleString('en-IN')}${d80SelfRaw>d80SelfCap ? ' (capped)' : ''} · 80D parents: ₹${d80Parents.toLocaleString('en-IN')}${d80ParentsRaw>d80ParentsCap ? ' (capped)' : ''}</div>
              <div>80TTA/TTB: ₹${ttaTtb.toLocaleString('en-IN')}</div>
              <div>80G + 80E + 80CCD(2): ₹${((+d.g80||0)+(+d.e80||0)+(+d.ccd2||0)).toLocaleString('en-IN')}</div>
            </div>
          </div>
        `;
      }
    }
    renderBody();
  }
};
registerModule(DeductionsModule);

/* =========================================================================
   MODULE: Loss Set-off & Carry Forward (Schedules CYLA / BFLA / CFL)
   Pulls this year's actual figures from the other modules rather than
   asking for them again, applies the core set-off rules, and produces the
   "carry forward to next year" figures in the exact shape the Prior Years
   module expects -- closing the memory loop between filing years.
   Simplified relative to the full prescribed CYLA sequence in the actual
   ITR utility -- treat this as a working approximation to sanity-check
   against, not a replacement for the utility's own computation.
   ========================================================================= */
// Shared computation, used by both LossSetoffModule (display) and YearRolloverModule
// (archiving) -- kept as one function so the two can never compute different numbers.
function computeCarryForward(p, ruleSet){
  let eqST=0, eqLT=0;
  (p.cgEquityRows||[]).forEach(r=>{
    if(r.buyprice==null || r.buyprice==='') return;
    const calc = computeRowGain(r, {ltcgHoldingDays:365});
    if(calc.gain===null) return;
    if(calc.term==='LongTerm') eqLT += calc.gain; else eqST += calc.gain;
  });
  let mf112A=0, mf112=0;
  (p.cgMFRows||[]).forEach(r=>{
    if(r.type==='112A') mf112A += (+r.gain||0); else mf112 += (+r.gain||0);
  });
  const totalST = eqST;
  const totalLT = eqLT + mf112A + mf112;

  let hpNet = 0;
  (p.properties||[]).forEach(prop=>{
    if(prop.selfOccupied) return;
    const gav = (prop.rentRows||[]).reduce((s,r)=>s+(+r.amount||0),0);
    const nav = gav - (prop.municipalTax||0);
    const stdDed = nav * 0.30;
    hpNet += nav - stdDed - (prop.homeLoanInterest||0);
  });

  let bizNet = 0;
  if(p.businessIncome && p.businessIncome.mode === 'fno'){
    bizNet = (p.businessIncome.fnoTrades||[]).reduce((s,t)=>s+(+t.pl||0),0);
  } else if(p.businessIncome && p.businessIncome.mode === 'books'){
    const bk = p.businessIncome.books||{};
    bizNet = (+bk.gross||0) - (+bk.expenses||0);
  } else if(p.businessIncome && p.businessIncome.mode === 'presumptive'){
    const pr = p.businessIncome.presumptive||{};
    const turnover = +pr.turnover||0;
    if(pr.scheme==='44ADA') bizNet = turnover*0.5;
    else if(pr.scheme==='44AD'){
      const digital = Math.min(+pr.digital||0, turnover);
      bizNet = digital*0.06 + (turnover-digital)*0.08;
    }
  }

  let stAfter = totalST, ltAfter = totalLT;
  if(stAfter < 0 && ltAfter > 0){
    const u = Math.min(-stAfter, ltAfter);
    ltAfter -= u; stAfter += u;
  }

  const hpCap = (ruleSet && ruleSet.hpLossCap) || 200000;
  let hpCarry = 0;
  let stAfterHP = stAfter, ltAfterHP = ltAfter, bizAfterHP = bizNet;
  if(hpNet < 0){
    const totalHPLoss = -hpNet;
    const cappedForThisYear = Math.min(totalHPLoss, hpCap);
    const excessBeyondCap = totalHPLoss - cappedForThisYear;
    let remaining = cappedForThisYear;
    if(bizAfterHP > 0 && remaining > 0){ const use = Math.min(remaining, bizAfterHP); bizAfterHP -= use; remaining -= use; }
    if(ltAfterHP > 0 && remaining > 0){ const use = Math.min(remaining, ltAfterHP); ltAfterHP -= use; remaining -= use; }
    if(stAfterHP > 0 && remaining > 0){ const use = Math.min(remaining, stAfterHP); stAfterHP -= use; remaining -= use; }
    hpCarry = excessBeyondCap + remaining;
  }

  let bizCarry = 0;
  if(bizAfterHP < 0){
    let remaining = -bizAfterHP;
    if(ltAfterHP > 0){ const use = Math.min(remaining, ltAfterHP); ltAfterHP -= use; remaining -= use; }
    if(stAfterHP > 0 && remaining > 0){ const use = Math.min(remaining, stAfterHP); stAfterHP -= use; remaining -= use; }
    bizCarry = remaining;
    bizAfterHP = 0;
  }

  const stCarry = stAfterHP < 0 ? -stAfterHP : 0;
  const ltCarry = ltAfterHP < 0 ? -ltAfterHP : 0;

  return { totalST, totalLT, hpNet, bizNet, stAfterHP, ltAfterHP, bizAfterHP, hpCarry, bizCarry, stCarry, ltCarry };
}

        <tr><td>LTCG</td><td>₹${Math.max(0,ltAfterHP).toLocaleString('en-IN',{maximumFractionDigits:0})}</td><td>${ltCarry>0?'₹'+ltCarry.toLocaleString('en-IN',{maximumFractionDigits:0})+' (LT loss — usable only vs future LT gains)':'—'}</td></tr>
        <tr><td>House Property</td><td>—</td><td>${hpCarry>0?'₹'+hpCarry.toLocaleString('en-IN',{maximumFractionDigits:0})+' (usable only vs future HP income)':'—'}</td></tr>
        <tr><td>Business</td><td>₹${Math.max(0,bizAfterHP).toLocaleString('en-IN',{maximumFractionDigits:0})}</td><td>${bizCarry>0?'₹'+bizCarry.toLocaleString('en-IN',{maximumFractionDigits:0})+' (usable only vs future non-speculative business income)':'—'}</td></tr>
      </table>
      <p class="helptext" style="margin-top:10px;">Capital losses never offset salary, house property, business, or other-sources income — only other capital gains, in the same year or carried forward. House property loss is capped at ₹2,00,000 of inter-head set-off per year regardless of how large the loss is.</p>
