/* =========================================================================
   MODULE: Schedule AL — Assets & Liabilities
   Only required when total income exceeds Rs 50 lakh -- reuses the same
   derived income-total flag the Form Determination module already
   computes, rather than asking the threshold question a third time.
   ========================================================================= */
const AssetsLiabilitiesModule = {
  id: 'assets_liabilities',
  label: 'Assets & Liabilities (Schedule AL)',
  order: 4.8,
  ruleSet: {},
  isActive: (p) => !!(p.formWizard && p.formWizard.totalIncomeAbove50L),
  hasStarted: (p) => !!(p.assetsLiabilities && (p.assetsLiabilities.immovable||[]).length),
  isComplete: (p) => !!(p.assetsLiabilities && (p.assetsLiabilities.immovable||[]).length),
  requiredDocs: () => ([
    {id:'property_docs', name:'Property purchase deeds / valuation', note:'Cost, not market value, is what Schedule AL asks for.'},
    {id:'vehicle_jewellery', name:'Vehicle registration, jewellery valuation (if significant)', note:''},
    {id:'loan_statements', name:'Outstanding loan statements (liabilities side)', note:''}
  ]),
  fallbackDocs: () => ({}),
  render(container, p, save){
    p.assetsLiabilities = p.assetsLiabilities || {immovable:[], movable:[], liabilities:[]};
    const al = p.assetsLiabilities;

    const header = document.createElement('div');
    header.className = 'panel-header';
    header.innerHTML = `
      <div class="eyebrow">Module 04.8 · Active because your running income total crossed ₹50L</div>
      <h2>Assets &amp; Liabilities (Schedule AL)</h2>
      <p class="desc">At cost, not current market value. This became relevant automatically because the Form Determination module's income check crossed ₹50L — no separate question needed.</p>
    `;
    container.appendChild(header);

    function section(title, key, cols, placeholder){
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h3>${title}</h3>
        <p class="helptext" style="margin-bottom:8px;">One per line: <code>${cols.join(', ')}</code></p>
        <textarea id="al_paste_${key}" rows="2" style="width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:8px; border-radius:4px; font-family:var(--mono); font-size:12px;" placeholder="${placeholder}"></textarea>
        <button class="btn small" id="al_btn_${key}" style="margin-top:8px;">Parse &amp; add</button>
        <div id="al_feedback_${key}" class="helptext" style="margin:6px 0;"></div>
        <div id="al_rows_${key}"></div>
      `;
      container.appendChild(card);

      function renderRows(){
        const el = card.querySelector(`#al_rows_${key}`);
        const rows = al[key] || [];
        if(rows.length===0){
          el.innerHTML = `<div class="helptext" style="padding:8px 0;">None added yet.</div>`;
          return;
        }
        const table = document.createElement('table');
        table.className = 'day-table';
        table.innerHTML = `<tr>${cols.map(c=>`<th>${c}</th>`).join('')}<th></th></tr>`;
        rows.forEach((r,idx)=>{
          const tr = document.createElement('tr');
          tr.innerHTML = `${r.map(v=>`<td>${v}</td>`).join('')}<td><button class="btn small ghost" data-rm="${idx}">✕</button></td>`;
          table.appendChild(tr);
        });
        el.innerHTML = '';
        el.appendChild(table);
        el.querySelectorAll('[data-rm]').forEach(btn=>{
          btn.onclick = (e)=>{ al[key].splice(+e.target.dataset.rm,1); save(); renderRows(); };
        });
      }
      renderRows();

      card.querySelector(`#al_btn_${key}`).onclick = ()=>{
        const raw = card.querySelector(`#al_paste_${key}`).value;
        const rows = parsePastedRows(raw);
        al[key] = al[key] || [];
        let added=0, skipped=0;
        rows.forEach(cols_=>{
          if(cols_.length < cols.length){ skipped++; return; }
          const amountCol = cols_[cols.length-1]; // last column is always the amount (cost / outstanding)
          if(isNaN(+amountCol) || +amountCol < 0){ skipped++; return; }
          al[key].push(cols_.slice(0,cols.length));
          added++;
        });
        save(); renderRows();
        card.querySelector(`#al_feedback_${key}`).textContent = `Added ${added} row(s)${skipped>0?`, skipped ${skipped} (amount must be a non-negative number)`:''}.`;
        if(added>0) card.querySelector(`#al_paste_${key}`).value='';
      };
    }

    section('Immovable property', 'immovable', ['Description','Address','Cost (₹)'], 'Flat, Chennai, 4500000');
    section('Movable assets (vehicles, jewellery, deposits, shares above disclosure threshold)', 'movable', ['Description','Cost (₹)'], 'Car - Honda City, 1200000');
    section('Liabilities', 'liabilities', ['Description','Outstanding amount (₹)'], 'Home loan - HDFC, 3200000');
  }
};
registerModule(AssetsLiabilitiesModule);

/* =========================================================================
   MODULE: Old vs New Regime Comparison
   Capital gains special rates (111A/112/112A) apply identically under
   both regimes -- only slab-taxed income and Chapter VI-A deduction
   eligibility differ. Switching rules verified against current guidance
   (checked, not assumed) -- non-business taxpayers choose freely every
   year directly in the ITR; business/professional income taxpayers must
   file Form 10-IEA on/before the Sec 139(1) due date, and get only ONE
   lifetime switch back to new regime after opting into old.
   ========================================================================= */
const RegimeComparisonModule = {
  id: 'regime_comparison',
  label: 'Old vs New Regime',
  order: 4.9,
  ruleSet: {
    newSlabs: [[0,400000,0],[400000,800000,0.05],[800000,1200000,0.10],[1200000,1600000,0.15],[1600000,2000000,0.20],[2000000,2400000,0.25],[2400000,null,0.30]],
    oldSlabsRegular: [[0,250000,0],[250000,500000,0.05],[500000,1000000,0.20],[1000000,null,0.30]],
    oldSlabsSenior: [[0,300000,0],[300000,500000,0.05],[500000,1000000,0.20],[1000000,null,0.30]],
    oldSlabsSuperSenior: [[0,500000,0],[500000,1000000,0.20],[1000000,null,0.30]],
    newRebateLimit: 1200000, newRebateMax: 60000,
    oldRebateLimit: 500000, oldRebateMax: 12500,
  },
  isActive: () => true,
  hasStarted: () => true,
  isComplete: () => true,
  requiredDocs: () => ([]),
  fallbackDocs: () => ({}),
  render(container, p, save){
    const header = document.createElement('div');
    header.className = 'panel-header';
    header.innerHTML = `
      <div class="eyebrow">Module 04.9 · Computed from your other modules, both ways</div>
      <h2>Old vs New Regime Comparison</h2>
      <p class="desc">Capital gains tax (111A/112/112A rates) is identical either way — only slab-taxed income and Chapter VI-A deductions differ. Fill in old-regime figures in the Deductions module even if you plan to file new regime, to see the real comparison.</p>
    `;
    container.appendChild(header);

    // ---- Pull data from other modules (recomputed here, kept decoupled rather than sharing state) ----
    const isResident = profile.residencyResult ? profile.residencyResult.status.startsWith('Resident') : null;

    let salaryTaxable = 0;
    if(p.salaryIncome && !p.salaryIncome.foreignExempt){
      const totalGross = (p.salaryIncome.employers||[]).reduce((s,e)=>s+(+e.gross||0),0);
      const totalExempt = (p.salaryIncome.employers||[]).reduce((s,e)=>s+(+e.exempt||0),0);
      const totalProfTax = (p.salaryIncome.employers||[]).reduce((s,e)=>s+(+e.profTax||0),0);
      salaryTaxable = Math.max(0, totalGross - totalExempt - 50000 - totalProfTax);
    }

    let hpNet = 0;
    (p.properties||[]).forEach(prop=>{
      if(prop.selfOccupied) return;
      const gav = (prop.rentRows||[]).reduce((s,r)=>s+(+r.amount||0),0);
      const nav = gav - (prop.municipalTax||0);
      hpNet += nav - nav*0.30 - (prop.homeLoanInterest||0);
    });

    let bizNet = 0;
    if(p.businessIncome){
      if(p.businessIncome.mode === 'fno') bizNet = (p.businessIncome.fnoTrades||[]).reduce((s,t)=>s+(+t.pl||0),0);
      else if(p.businessIncome.mode === 'books'){ const bk=p.businessIncome.books||{}; bizNet = (+bk.gross||0)-(+bk.expenses||0); }
      else if(p.businessIncome.mode === 'presumptive'){
        const pr = p.businessIncome.presumptive||{}; const t = +pr.turnover||0;
        if(pr.scheme==='44ADA') bizNet = t*0.5;
        else if(pr.scheme==='44AD'){ const dig=Math.min(+pr.digital||0,t); bizNet = dig*0.06+(t-dig)*0.08; }
      }
    }

    const otherInterest = parseFloat((p.otherSources||{}).aisInterestTotal) || 0;

    // Foreign equity: LTCG (Sec 112, no exemption, 12.5%) adds to ltcg112; STCG (no STT, ordinary
    // asset) is taxed at SLAB rate, not the flat 20% Sec 111A rate -- added to slab base, not stcg.
    const foreignLTCG = p.hasForeignAssets ? (+p.foreignLTCG || 0) : 0;
    const foreignSTCG = p.hasForeignAssets ? (+p.foreignSTCG || 0) : 0;

    // VDA/crypto: flat 30% on positive-gain transactions only, completely separate from
    // everything else -- losses excluded entirely, never touching any other computation here.
    const vdaTaxableGains = (p.vdaTransactions||[]).reduce((s,t)=>{
      const g = t.saleValue - t.cost;
      return g > 0 ? s + g : s;
    }, 0);
    const vdaTax = vdaTaxableGains * 0.30;

    let eqST=0, eqLT=0;
    (p.cgEquityRows||[]).forEach(r=>{
      if(r.buyprice==null||r.buyprice==='') return;
      const calc = computeRowGain(r, {ltcgHoldingDays:365});
      if(calc.gain===null) return;
      if(calc.term==='LongTerm') eqLT += calc.gain; else eqST += calc.gain;
    });
    let mf112A=0, mf112=0;
    (p.cgMFRows||[]).forEach(r=>{ if(r.type==='112A') mf112A+=(+r.gain||0); else mf112+=(+r.gain||0); });
    let stcg = eqST, ltcg112a = eqLT+mf112A, ltcg112 = mf112 + foreignLTCG;
    // Intra-CG set-off (ST loss can offset LT gain)
    if(stcg<0 && ltcg112a>0){ const u=Math.min(-stcg,ltcg112a); ltcg112a-=u; stcg+=u; }

    const ltcg112aTaxable = Math.max(0, ltcg112a - 125000);
    const cgTaxClean = Math.max(0,stcg)*0.20 + ltcg112aTaxable*0.125 + Math.max(0,ltcg112)*0.125;

    const slabIncomeBase = salaryTaxable + Math.max(0,hpNet) + Math.max(0,bizNet) + otherInterest + Math.max(0,foreignSTCG);

    function taxFromSlabs(income, slabs){
      let tax = 0;
      for(const [lo,hi,rate] of slabs){
        if(income > lo){
          const upper = hi===null ? income : Math.min(income,hi);
          tax += Math.max(0, upper-lo) * rate;
        }
      }
      return tax;
    }

    const rules = RegimeComparisonModule.ruleSet;

    // Surcharge: correct brackets per regime, with the 15% cap on capital-gains-taxed-at-
    // special-rates (111A/112/112A) regardless of total income -- verified against current
    // guidance. VDA tax is NOT given the 15% cap here since that specific carve-out couldn't be
    // verified for Sec 115BBH income -- treated at the general rate instead, conservatively.
    // Marginal relief (which smooths the tax jump right at each threshold) is intentionally NOT
    // computed -- the formula gets genuinely ambiguous when income mixes slab and special-rate
    // portions, and an approximation here risks being confidently wrong on real money. If total
    // income sits within ~10% of a threshold, get the exact relief figure checked professionally.
    function computeSurcharge(totalIncome, normalTax, specialTax, brackets){
      let rate = 0;
      for(const [t, r] of brackets){ if(totalIncome > t) rate = r; }
      if(rate === 0) return 0;
      const specialRate = Math.min(rate, 0.15);
      return normalTax*rate + specialTax*specialRate;
    }
    const newSurchargeBrackets = [[5000000,0.10],[10000000,0.15],[20000000,0.25]]; // new regime caps at 25%
    const oldSurchargeBrackets = [[5000000,0.10],[10000000,0.15],[20000000,0.25],[50000000,0.37]];

    // New regime
    const newDeduction = +(p.deductions && p.deductions.ccd2) || 0;
    const newSlabIncome = Math.max(0, slabIncomeBase - newDeduction);
    let newSlabTax = taxFromSlabs(newSlabIncome, rules.newSlabs);
    let newRebate = 0;
    if(isResident && newSlabIncome <= rules.newRebateLimit){ newRebate = Math.min(newSlabTax, rules.newRebateMax); }
    const newTaxBeforeSurcharge = Math.max(0, newSlabTax - newRebate);
    const newTotalIncome = newSlabIncome + Math.max(0,stcg) + ltcg112aTaxable + Math.max(0,ltcg112) + vdaTaxableGains;
    const newSurcharge = computeSurcharge(newTotalIncome, newTaxBeforeSurcharge, cgTaxClean + vdaTax, newSurchargeBrackets);
    const newTotalTax = newTaxBeforeSurcharge + cgTaxClean + vdaTax + newSurcharge;
    const newTotalTaxWithCess = newTotalTax * 1.04;

    // Old regime
    const d = p.deductions || {};
    const oldC80 = Math.min(+d.c80||0, 150000);
    const oldCcd1b = Math.min(+d.ccd1b||0, 50000);
    const oldD80SelfRaw = (+d.d80_self_premium||0) + Math.min(+d.d80_self_checkup||0,5000) + (d.selfIsSenior ? (+d.d80_self_medexp||0) : 0);
    const oldD80Self = Math.min(oldD80SelfRaw, d.selfIsSenior?50000:25000);
    const oldD80ParentsRaw = (+d.d80_parents_premium||0) + Math.min(+d.d80_parents_checkup||0,5000) + (d.parentsAreSenior ? (+d.d80_parents_medexp||0) : 0);
    const oldD80Parents = Math.min(oldD80ParentsRaw, d.parentsAreSenior?50000:25000);
    const oldDedTotal = oldC80 + oldCcd1b + oldD80Self + oldD80Parents + Math.min(+d.tta_ttb||0, d.selfIsSenior?50000:10000)
      + (+d.g80||0) + (+d.e80||0) + (+d.ccd2||0);
    const oldSlabIncome = Math.max(0, slabIncomeBase - oldDedTotal);
    const oldSlabs = d.selfIsSenior ? (d.parentsAreSenior ? rules.oldSlabsSuperSenior : rules.oldSlabsSenior) : rules.oldSlabsRegular;
    let oldSlabTax = taxFromSlabs(oldSlabIncome, oldSlabs);
    let oldRebate = 0;
    if(isResident && oldSlabIncome <= rules.oldRebateLimit){ oldRebate = Math.min(oldSlabTax, rules.oldRebateMax); }
    const oldTaxBeforeSurcharge = Math.max(0, oldSlabTax - oldRebate);
    const oldTotalIncome = oldSlabIncome + Math.max(0,stcg) + ltcg112aTaxable + Math.max(0,ltcg112) + vdaTaxableGains;
    const oldSurcharge = computeSurcharge(oldTotalIncome, oldTaxBeforeSurcharge, cgTaxClean + vdaTax, oldSurchargeBrackets);
    const oldTotalTax = oldTaxBeforeSurcharge + cgTaxClean + vdaTax + oldSurcharge;
    const oldTotalTaxWithCess = oldTotalTax * 1.04;

    const compCard = document.createElement('div');
    compCard.className = 'card';
    compCard.innerHTML = `
      <h3>Side by side</h3>
      <table class="day-table">
        <tr><th></th><th>New regime</th><th>Old regime</th></tr>
        <tr><td>Slab-taxable income (after deductions)</td><td>₹${newSlabIncome.toLocaleString('en-IN',{maximumFractionDigits:0})}</td><td>₹${oldSlabIncome.toLocaleString('en-IN',{maximumFractionDigits:0})}</td></tr>
        <tr><td>Tax on slab income</td><td>₹${newSlabTax.toLocaleString('en-IN',{maximumFractionDigits:0})}</td><td>₹${oldSlabTax.toLocaleString('en-IN',{maximumFractionDigits:0})}</td></tr>
        <tr><td>87A rebate ${isResident?'':'(NOT available — non-resident)'}</td><td>₹${newRebate.toLocaleString('en-IN',{maximumFractionDigits:0})}</td><td>₹${oldRebate.toLocaleString('en-IN',{maximumFractionDigits:0})}</td></tr>
        <tr><td>+ Capital gains tax (same either way)</td><td>₹${cgTaxClean.toLocaleString('en-IN',{maximumFractionDigits:0})}</td><td>₹${cgTaxClean.toLocaleString('en-IN',{maximumFractionDigits:0})}</td></tr>
        ${vdaTax>0 ? `<tr><td>+ Crypto/VDA tax @ 30% (same either way)</td><td>₹${vdaTax.toLocaleString('en-IN',{maximumFractionDigits:0})}</td><td>₹${vdaTax.toLocaleString('en-IN',{maximumFractionDigits:0})}</td></tr>` : ''}
        ${(newSurcharge>0 || oldSurcharge>0) ? `<tr><td>+ Surcharge (no marginal relief applied — see note below)</td><td>₹${newSurcharge.toLocaleString('en-IN',{maximumFractionDigits:0})}</td><td>₹${oldSurcharge.toLocaleString('en-IN',{maximumFractionDigits:0})}</td></tr>` : ''}
        <tr><td><b>Total tax incl. 4% cess</b></td><td><b>₹${newTotalTaxWithCess.toLocaleString('en-IN',{maximumFractionDigits:0})}</b></td><td><b>₹${oldTotalTaxWithCess.toLocaleString('en-IN',{maximumFractionDigits:0})}</b></td></tr>
      </table>
      <div class="result-box" style="margin-top:14px; border-color:${newTotalTaxWithCess<=oldTotalTaxWithCess?'var(--green)':'var(--gold)'};">
        <div class="verdict">${newTotalTaxWithCess<=oldTotalTaxWithCess ? 'New regime looks cheaper' : 'Old regime looks cheaper'} — by ₹${Math.abs(newTotalTaxWithCess-oldTotalTaxWithCess).toLocaleString('en-IN',{maximumFractionDigits:0})}</div>
        <div class="verdict-detail">Based on figures currently entered across other modules. Fill in old-regime deductions in the Deductions module if this looks incomplete — a zero old-regime deduction total will always make new regime look artificially better.</div>
      </div>
    `;
    container.appendChild(compCard);

    // ---- Switching rules, conditional on business income ----
    const hasBiz = profile.formWizard && profile.formWizard.hasBusinessIncome === true;
    const rulesCard = document.createElement('div');
    rulesCard.className = 'card';
    if(hasBiz){
      rulesCard.innerHTML = `
        <h3>Switching rules — you have business/professional income</h3>
        <p class="helptext" style="line-height:1.7;">
        New regime is the default. To use the <b>old regime</b>, you must file <b>Form 10-IEA</b> online, on or before the ITR due date under Section 139(1) — a belated return can't validly elect old regime.<br><br>
        Once you've opted into old regime this way, it continues automatically in later years without refiling — you don't re-elect every year.<br><br>
        You can switch <b>back to new regime</b> later by filing Form 10-IEA again — but this switch-back is allowed <b>only once in your lifetime</b>. After you switch back to new regime, you can never opt for old regime again for as long as you have business/professional income.<br><br>
        <b>In effect: two Form 10-IEA filings total, ever</b> — one to opt out to old, one to opt back into new. Choose deliberately rather than switching opportunistically year to year.
        </p>
      `;
    } else {
      rulesCard.innerHTML = `
        <h3>Switching rules — no business/professional income</h3>
        <p class="helptext" style="line-height:1.7;">
        You can choose old or new regime <b>freely, every single year</b>, directly within the ITR itself when filing — no separate form, no lifetime restriction. The previous year's choice doesn't carry forward automatically; you actively pick again each time. If your Form Determination answers change (e.g. you start business income next year), the business-income switching rules above would apply going forward instead.
        </p>
      `;
    }
    container.appendChild(rulesCard);

    const noteCard = document.createElement('div');
    noteCard.className = 'card';
    noteCard.style.borderColor = 'var(--gold-dim)';
    noteCard.innerHTML = `<p class="helptext">Surcharge is now computed with correct brackets per regime, including the 15% cap on capital-gains-taxed-at-special-rates — but <b>marginal relief is NOT computed</b> (the formula gets genuinely ambiguous when income mixes slab and special-rate portions). If total income sits within ~10% of ₹50L, ₹1Cr, ₹2Cr, or ₹5Cr, get the exact relief figure checked professionally — it could meaningfully reduce the surcharge shown here. Senior/super-senior exemption thresholds only apply on the old-regime side (toggle "self senior" in the Deductions module).</p>`;
    container.appendChild(noteCard);
  }
};
registerModule(RegimeComparisonModule);

/* =========================================================================
   MODULE: Advance Tax & Interest (Sections 234A/234B/234C)
   Verified before building: 234A runs from due date to filing date on
   unpaid tax; 234B runs from 1-Apr of the AY if advance tax paid <90% of
   assessed tax; 234C checks cumulative advance tax against 15/45/75/100%
   thresholds at each quarterly due date (with a documented tolerance --
   trigger is actually <12%/<36%/<75%/<100%, not the raw 15/45/75/100
   figures). Senior citizens (60+) with no business/professional income
   are fully exempt from advance tax under Sec 207 -- modelled explicitly.
   The capital-gains/lottery-income timing exception to 234C is NOT
   modelled (needs per-quarter income timing) -- flagged rather than
   guessed at.
   ========================================================================= */
const AdvanceTaxModule = {
  id: 'advance_tax',
  label: 'Advance Tax & Interest (234A/B/C)',
  order: 4.95,
  ruleSet: {
    q1Pct: 0.15, q2Pct: 0.45, q3Pct: 0.75, q4Pct: 1.00,
    q1Trigger: 0.12, q2Trigger: 0.36, q3Trigger: 0.75, q4Trigger: 1.00,
    monthlyRate: 0.01
  },
  isActive: () => true,
  hasStarted: (p) => !!(p.advanceTax && p.advanceTax.totalTaxLiability),
  isComplete: (p) => !!(p.advanceTax && p.advanceTax.totalTaxLiability && p.advanceTax.filingDate),
  requiredDocs: () => ([
    {id:'tax_computation', name:'Final total tax liability figure (from the Regime Comparison module)', note:''},
    {id:'advance_tax_challans', name:'Advance tax payment challans, with dates', note:''}
  ]),
  fallbackDocs: () => ({}),
  render(container, p, save){
    p.advanceTax = p.advanceTax || {totalTaxLiability:'', tdsCredit:'', isSenior:false, hasBusinessIncome:null,
      q1paid:'', q2paid:'', q3paid:'', q4paid:'', filingDate:'', dueDate:'2026-07-31'};
    const at = p.advanceTax;

    const header = document.createElement('div');
    header.className = 'panel-header';
    header.innerHTML = `
      <div class="eyebrow">Module 04.95 · Sections 234A, 234B, 234C — verified thresholds, not guessed</div>
      <h2>Advance Tax &amp; Interest</h2>
      <p class="desc">Enter your final tax liability (from Regime Comparison) and what's been paid so far. The capital-gains/lottery timing exception to 234C isn't modelled here — if a large gain arose late in the year and you paid the tax on it in the next instalment, get that specific shortfall re-checked professionally rather than trusting the number below as final.</p>
    `;
    container.appendChild(header);

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <h3>Your figures</h3>
      <div class="field-row">
        <div class="field"><label>Total tax liability, incl. cess (₹)</label><input id="at_total" type="number" value="${at.totalTaxLiability}"></div>
        <div class="field"><label>TDS + TCS credit already deducted (₹)</label><input id="at_tds" type="number" value="${at.tdsCredit}"></div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Senior citizen (60+) with no business/professional income?</label>
          <select id="at_senior"><option value="no" ${!at.isSenior?'selected':''}>No</option><option value="yes" ${at.isSenior?'selected':''}>Yes — exempt from advance tax (Sec 207)</option></select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Advance tax paid by 15-Jun (₹)</label><input id="at_q1" type="number" value="${at.q1paid}"></div>
        <div class="field"><label>Cumulative paid by 15-Sep (₹)</label><input id="at_q2" type="number" value="${at.q2paid}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Cumulative paid by 15-Dec (₹)</label><input id="at_q3" type="number" value="${at.q3paid}"></div>
        <div class="field"><label>Cumulative paid by 15-Mar (₹)</label><input id="at_q4" type="number" value="${at.q4paid}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>ITR due date (Sec 139(1))</label><input id="at_duedate" type="date" value="${at.dueDate}"></div>
        <div class="field"><label>Actual/planned filing date</label><input id="at_filingdate" type="date" value="${at.filingDate}"></div>
      </div>
    `;
    container.appendChild(card);

    const resultWrap = document.createElement('div');
    container.appendChild(resultWrap);

    function monthsBetween(d1, d2){
      // 1% per month or PART thereof -- any partial month counts as a full month
      const a = new Date(d1), b = new Date(d2);
      if(b <= a) return 0;
      let months = (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth());
      if(b.getDate() > a.getDate()) months += 1; // part-month rounds up
      return Math.max(0, months);
    }
    function round100(x){ return Math.floor(x/100)*100; } // Rule 119A: round DOWN to nearest 100 (fraction ignored)

    function renderResult(){
      const rules = AdvanceTaxModule.ruleSet;
      const total = +at.totalTaxLiability || 0;
      const tds = +at.tdsCredit || 0;
      const assessedTax = Math.max(0, total - tds);

      if(at.isSenior){
        resultWrap.innerHTML = `<div class="result-box" style="border-color:var(--green);"><div class="verdict" style="color:var(--green);">Exempt from advance tax (Sec 207)</div><div class="verdict-detail">Senior citizen with no business/professional income — no 234B or 234C applies. Only 234A (late filing interest) can still apply if the return is filed after the due date.</div></div>`;
      }
      if(total === 0){ if(!at.isSenior) resultWrap.innerHTML=''; if(!at.isSenior) return; }

      // 234C -- per-quarter shortfall check against trigger thresholds
      const q1 = +at.q1paid||0, q2 = +at.q2paid||0, q3 = +at.q3paid||0, q4 = +at.q4paid||0;
      let c234C = 0;
      const c234CDetail = [];
      if(!at.isSenior && assessedTax > 0){
        const checks = [
          {label:'Q1 (15-Jun)', trigger:rules.q1Trigger, target:rules.q1Pct, paid:q1, months:3},
          {label:'Q2 (15-Sep)', trigger:rules.q2Trigger, target:rules.q2Pct, paid:q2, months:3},
          {label:'Q3 (15-Dec)', trigger:rules.q3Trigger, target:rules.q3Pct, paid:q3, months:3},
          {label:'Q4 (15-Mar)', trigger:rules.q4Trigger, target:rules.q4Pct, paid:q4, months:1},
        ];
        checks.forEach(ch=>{
          const requiredForTrigger = assessedTax * ch.trigger;
          if(ch.paid < requiredForTrigger){
            const shortfall = round100(Math.max(0, assessedTax*ch.target - ch.paid));
            const interest = shortfall * rules.monthlyRate * ch.months;
            if(interest > 0){
              c234C += interest;
              c234CDetail.push(`${ch.label}: shortfall ₹${shortfall.toLocaleString('en-IN')} × 1% × ${ch.months} month(s) = ₹${interest.toLocaleString('en-IN')}`);
            }
          }
        });
      }

      // 234B -- if total advance tax (q4 = cumulative by year end) < 90% of assessed tax
      let c234B = 0;
      if(!at.isSenior && assessedTax > 0 && q4 < assessedTax*0.90){
        const shortfall = round100(assessedTax - q4);
        const monthsB = at.filingDate ? monthsBetween('2026-04-01', at.filingDate) : 0;
        c234B = shortfall * rules.monthlyRate * monthsB;
      }

      // 234A -- unpaid tax at filing, from due date to filing date
      let c234A = 0;
      if(at.filingDate && at.dueDate && new Date(at.filingDate) > new Date(at.dueDate)){
        const unpaidAtFiling = round100(Math.max(0, assessedTax - q4));
        const monthsA = monthsBetween(at.dueDate, at.filingDate);
        c234A = unpaidAtFiling * rules.monthlyRate * monthsA;
      }

      const totalInterest = c234A + c234B + c234C;
      resultWrap.innerHTML = (at.isSenior ? resultWrap.innerHTML : '') + `
        <div class="result-box">
          <div class="verdict">Total interest: ₹${totalInterest.toLocaleString('en-IN',{maximumFractionDigits:0})}</div>
          <div class="basis">
            <div>234C (installment shortfall): ₹${c234C.toLocaleString('en-IN',{maximumFractionDigits:0})}</div>
            ${c234CDetail.map(d=>`<div style="padding-left:12px; font-size:11px; color:var(--muted);">• ${d}</div>`).join('')}
            <div style="margin-top:6px;">234B (advance tax <90% of assessed): ₹${c234B.toLocaleString('en-IN',{maximumFractionDigits:0})}</div>
            <div>234A (late filing, on unpaid balance): ₹${c234A.toLocaleString('en-IN',{maximumFractionDigits:0})}</div>
          </div>
          ${totalInterest>0 ? `<div class="basis" style="color:var(--gold); border-top:1px solid var(--line); margin-top:8px; padding-top:8px;">Every day this stays unpaid, 234A/234B keep accruing at 1%/month — paying the balance now stops further accrual even before the return is filed.</div>` : ''}
        </div>
      `;
    }
    renderResult();

    ['at_total','at_tds','at_q1','at_q2','at_q3','at_q4','at_duedate','at_filingdate'].forEach(id=>{
      const key = {at_total:'totalTaxLiability', at_tds:'tdsCredit', at_q1:'q1paid', at_q2:'q2paid', at_q3:'q3paid', at_q4:'q4paid', at_duedate:'dueDate', at_filingdate:'filingDate'}[id];
      card.querySelector('#'+id).onchange = (e)=>{ at[key] = e.target.value; save(); renderResult(); };
    });
    card.querySelector('#at_senior').onchange = (e)=>{ at.isSenior = e.target.value==='yes'; save(); renderResult(); };
  }
};
registerModule(AdvanceTaxModule);

/* =========================================================================
   MODULE: Year Rollover
   The piece that makes Prior Years actually useful instead of requiring
   manual re-entry: archives this year's residency status and carried-
   forward losses into the Prior Years module (same data shape, so next
   year's RNOR check picks it up automatically), then resets year-specific
   module data while preserving what should genuinely persist -- opening
   holdings, property definitions (not rent), foreign bank account list,
   and any under-construction pre-construction interest (which is
   deliberately cumulative across years, never reset).
   ========================================================================= */
const YearRolloverModule = {
  id: 'year_rollover',
  label: 'Close This Year & Start Next',
  order: 5.5,
  ruleSet: {},
  isActive: () => true,
  hasStarted: () => false,
  isComplete: () => false,
  requiredDocs: () => ([]),
  fallbackDocs: () => ({}),
  render(container, p, save){
    const header = document.createElement('div');
    header.className = 'panel-header';
    header.innerHTML = `
      <div class="eyebrow">Module 05.5 · One-time action per filing year, not an ongoing data entry screen</div>
      <h2>Close This Year &amp; Start Next</h2>
      <p class="desc">Archives this year's residency status and carried-forward losses into Prior Years (so next year's RNOR check and loss set-off pick them up automatically), then clears year-specific entries so you can start the next filing clean. Do this only after you've actually filed — it can't be undone from inside the tool (use Export first if unsure).</p>
    `;
    container.appendChild(header);

    const cf = computeCarryForward(p, {hpLossCap: 200000});
    const fyInput = document.createElement('div');
    fyInput.className = 'card';
    fyInput.innerHTML = `
      <h3>Which FY is being closed?</h3>
      <div class="field-row"><div class="field"><input id="yr_fy" type="text" placeholder="e.g. 2025-26" value="${p.fy||''}"></div></div>
    `;
    container.appendChild(fyInput);

    const previewCard = document.createElement('div');
    previewCard.className = 'card';
    previewCard.innerHTML = `
      <h3>What gets archived into Prior Years</h3>
      <table class="day-table">
        <tr><th>Item</th><th>Value</th></tr>
        <tr><td>Residency status</td><td>${p.residencyResult ? (p.residencyResult.rnorResult==='RNOR' ? 'RNOR' : p.residencyResult.status) : 'Not computed — go to Residency module first'}</td></tr>
        <tr><td>Days in India</td><td>${p.residencyResult ? p.residencyResult.daysInIndia : '—'}</td></tr>
        <tr><td>Carried-forward ST loss</td><td>₹${cf.stCarry.toLocaleString('en-IN',{maximumFractionDigits:0})}</td></tr>
        <tr><td>Carried-forward LT loss</td><td>₹${cf.ltCarry.toLocaleString('en-IN',{maximumFractionDigits:0})}</td></tr>
        <tr><td>House Property loss (usable only vs future HP income — not stored in Prior Years' fields, note separately)</td><td>₹${cf.hpCarry.toLocaleString('en-IN',{maximumFractionDigits:0})}</td></tr>
        <tr><td>Business loss carry-forward (same caveat)</td><td>₹${cf.bizCarry.toLocaleString('en-IN',{maximumFractionDigits:0})}</td></tr>
      </table>
    `;
    container.appendChild(previewCard);

    const keepResetCard = document.createElement('div');
    keepResetCard.className = 'card';
    keepResetCard.innerHTML = `
      <h3>What's kept vs reset</h3>
      <p class="helptext"><b>Kept:</b> Prior Years history, opening holdings, property addresses/tenant/loan details, foreign bank account list, under-construction pre-construction interest (keeps accumulating).</p>
      <p class="helptext"><b>Reset:</b> travel log, capital gains rows, salary employers, rent credits (property definitions stay), other-sources figures, business income entries, VDA/crypto transactions, real estate transactions, advance tax figures, this year's Form Determination answers.</p>
    `;
    container.appendChild(keepResetCard);

    const btnWrap = document.createElement('div');
    container.appendChild(btnWrap);
    function renderButton(){
      btnWrap.innerHTML = '';
      const btn = document.createElement('button');
      btn.className = 'btn primary';
      btn.textContent = 'Archive this year & reset for next year';
      btn.onclick = ()=>{
        if(!confirm('This clears year-specific data after archiving carry-forward figures. Have you already filed, or exported a backup? This cannot be undone from inside the tool.')) return;
        const fy = fyInput.querySelector('#yr_fy').value.trim() || p.fy || 'unlabeled-year';
        const cfNow = computeCarryForward(p, {hpLossCap: 200000});

        // Archive into Prior Years, same shape the module already uses
        p.priorYears = p.priorYears || {};
        p.priorYears[fy] = {
          residencyStatus: p.residencyResult ? (p.residencyResult.rnorResult==='RNOR' ? 'RNOR' : p.residencyResult.status.replace('Non-Resident (NRI)','NRI')) : 'Unknown',
          daysInIndia: p.residencyResult ? p.residencyResult.daysInIndia : null,
          carriedForwardLossST: cfNow.stCarry,
          carriedForwardLossLT: cfNow.ltCarry,
        };

        // Reset year-specific fields, preserve continuity data
        p.travelLog = [];
        p.residencyResult = null;
        p.cgEquityRows = [];
        p.cgBrokerReportedTotal = '';
        p.cgMFRows = [];
        p.salaryIncome = {employers:[], foreignExempt:false, exemptAmount:''};
        p.otherSources = {aisInterestTotal:'', interestRows:[], aisDividendTotal:'', dividendRows:[]};
        p.businessIncome = {mode:null, fnoTrades:[], presumptive:{}, books:{}};
        p.vdaTransactions = []; p.hasVDA = null;
        p.realEstateTransactions = []; p.hasRealEstateSale = null;
        p.advanceTax = {totalTaxLiability:'', tdsCredit:'', isSenior: p.advanceTax?.isSenior||false, hasBusinessIncome:null, q1paid:'', q2paid:'', q3paid:'', q4paid:'', filingDate:'', dueDate:''};
        p.formWizard = {};
        p.aisEntries = [];
        p.deductions = {regime: p.deductions?.regime||null, c80:0, d80_self:0, d80_parents:0,
          parentsAreSenior: p.deductions?.parentsAreSenior||false, selfIsSenior: p.deductions?.selfIsSenior||false,
          tta_ttb:0, g80:0, e80:0, ccd2:0};
        p.assetsLiabilities = {immovable:[], movable:[], liabilities:[]};
        (p.properties||[]).forEach(prop=>{
          prop.rentRows = [];
          prop.municipalTax = 0;
          if(!prop.underConstruction){ prop.homeLoanInterest = 0; }
          // preConstructionInterest deliberately left untouched -- cumulative by design
          prop.tenancyStart = '';
          prop.tenancyEnd = '';
        });

        save();
        alert(`FY ${fy} archived. Residency and loss carry-forward are now in Prior Years for next year's calculations. Year-specific modules have been reset.`);
        activeModuleId = '__dashboard__';
        renderRail(); renderContent();
      };
      btnWrap.appendChild(btn);
    }
    renderButton();
  }
};
registerModule(YearRolloverModule);

/* =========================================================================
   MODULE: Compliance Calendar
   Forward-looking deadline tracker -- the piece that turns this from a
   once-a-year filing tool into something that nudges you through the
   whole year. All dates derived from p.fy (format "YYYY-YY") so it stays
   correct on rollover rather than being hardcoded to one filing cycle.
   Standard due dates shown; audit/TP toggles shift the ITR due date per
   Sec 139(1) explanatory notes -- verify against the current year's CBDT
   notification since these are sometimes extended.
   ========================================================================= */
function parseFYBounds(fy){
  const m = /^(\d{4})-(\d{2})$/.exec((fy||'').trim());
  if(!m) return null;
  const start = parseInt(m[1],10);
  return {start, end: start+1};
}
function fmtDate(d){
  return d.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
}
const ComplianceCalendarModule = {
  id: 'compliance_calendar',
  label: 'Compliance Calendar',
  order: 5.7,
  ruleSet: {},
  isActive: () => true,
  hasStarted: () => true,
  isComplete: () => true,
  requiredDocs: () => ([]),
  fallbackDocs: () => ({}),
  render(container, p, save){
    p.complianceCalendar = p.complianceCalendar || {doneItems:{}, auditApplicable:false, tpApplicable:false, bizNoAudit:false};
    const cc = p.complianceCalendar;

    const header = document.createElement('div');
    header.className = 'panel-header';
    header.innerHTML = `
      <div class="eyebrow">Module 05.7 · Every date computed from your FY, not hardcoded to one year</div>
      <h2>Compliance Calendar</h2>
      <p class="desc">All statutory dates for FY ${p.fy || '(set your FY in the dashboard)'}, in order, with what's overdue vs upcoming. Advance tax dates apply within the FY itself; filing/verification dates apply after it ends. Confirm against the current CBDT notification before relying on any date that's been historically extended.</p>
    `;
    container.appendChild(header);

    const bounds = parseFYBounds(p.fy);
    if(!bounds){
      const warn = document.createElement('div');
      warn.className = 'card';
      warn.innerHTML = `<h3 style="color:var(--rust);">Set your FY first</h3><p class="helptext">This module reads p.fy in "2025-26" format from the dashboard/profile to compute every date below. Set it there and come back.</p>`;
      container.appendChild(warn);
      return;
    }
    const {start, end} = bounds;

    const toggleCard = document.createElement('div');
    toggleCard.className = 'card';
    toggleCard.innerHTML = `
      <h3>Which due date applies to you?</h3>
      <div class="field-row">
        <div class="field">
          <label>Business/professional income, ITR-3 or ITR-4 (no audit)?</label>
          <select id="cc_biz"><option value="no" ${!cc.bizNoAudit?'selected':''}>No</option><option value="yes" ${cc.bizNoAudit?'selected':''}>Yes</option></select>
        </div>
        <div class="field">
          <label>Tax audit applicable (Sec 44AB)?</label>
          <select id="cc_audit"><option value="no" ${!cc.auditApplicable?'selected':''}>No</option><option value="yes" ${cc.auditApplicable?'selected':''}>Yes</option></select>
        </div>
        <div class="field">
          <label>Transfer pricing report required (Form 3CEB)?</label>
          <select id="cc_tp"><option value="no" ${!cc.tpApplicable?'selected':''}>No</option><option value="yes" ${cc.tpApplicable?'selected':''}>Yes</option></select>
        </div>
      </div>
      <p class="helptext">Per Budget 2026: ITR-3/ITR-4 filers without audit now get until 31-Aug, not 31-Jul (was a common deadline for everyone before this year — don't assume last year's date still applies).</p>
    `;
    container.appendChild(toggleCard);
    toggleCard.querySelector('#cc_biz').onchange = (e)=>{ cc.bizNoAudit = e.target.value==='yes'; save(); renderList(); };
    toggleCard.querySelector('#cc_audit').onchange = (e)=>{ cc.auditApplicable = e.target.value==='yes'; save(); renderList(); };
    toggleCard.querySelector('#cc_tp').onchange = (e)=>{ cc.tpApplicable = e.target.value==='yes'; save(); renderList(); };

    const listWrap = document.createElement('div');
    container.appendChild(listWrap);

    function buildItems(){
      let itrDue = new Date(end, 6, 31); // 31-Jul
      let itrDueLabel = '31-Jul (ITR-1/ITR-2, no audit, no TP)';
      if(cc.tpApplicable){ itrDue = new Date(end, 10, 30); itrDueLabel = '30-Nov (transfer pricing report required)'; }
      else if(cc.auditApplicable){ itrDue = new Date(end, 9, 31); itrDueLabel = '31-Oct (tax audit applicable)'; }
      else if(cc.bizNoAudit){ itrDue = new Date(end, 7, 31); itrDueLabel = '31-Aug (ITR-3/ITR-4, no audit — Budget 2026 extension)'; }

      const items = [
        {id:'q1', label:'Advance tax — Q1 instalment (15% of liability)', date:new Date(start,5,15)},
        {id:'q2', label:'Advance tax — Q2 instalment (cumulative 45%)', date:new Date(start,8,15)},
        {id:'q3', label:'Advance tax — Q3 instalment (cumulative 75%)', date:new Date(start,11,15)},
        {id:'q4', label:'Advance tax — Q4 instalment (cumulative 100%)', date:new Date(end,2,15)},
        {id:'itr_due', label:`ITR filing due date — ${itrDueLabel}`, date:itrDue},
        {id:'everify', label:'E-verification — within 30 days of filing (compute from your actual filing date, not shown here)', date:null},
        {id:'belated', label:'Belated return deadline (Sec 139(4)) — separate from revised, see below', date:new Date(end,11,31)},
        {id:'revised', label:'Revised return deadline (Sec 139(5)) — extended to 31-Mar by Budget 2026, no longer same date as belated', date:new Date(end+1,2,31)},
        {id:'itr_u', label:'Updated return (ITR-U) outer limit — 48 months from end of AY', date:new Date(end+5,2,31)},
      ];
      return items;
    }

    function renderList(){
      listWrap.innerHTML = '';
      const items = buildItems();
      const today = new Date();
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<h3>Timeline</h3>`;
      const table = document.createElement('table');
      table.className = 'day-table';
      table.innerHTML = `<tr><th></th><th>Item</th><th>Date</th><th>Status</th></tr>`;
      items.forEach(it=>{
        const done = !!cc.doneItems[it.id];
        let status = '—', color = 'var(--muted)';
        if(it.date){
          if(done){ status = 'Done'; color = 'var(--green)'; }
          else if(it.date < today){ status = 'Overdue'; color = 'var(--rust)'; }
          else {
            const daysAway = Math.ceil((it.date - today)/86400000);
            status = daysAway <= 21 ? `In ${daysAway}d` : 'Upcoming';
            color = daysAway <= 21 ? 'var(--gold)' : 'var(--muted)';
          }
        }
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><input type="checkbox" data-id="${it.id}" ${done?'checked':''}></td>
          <td>${it.label}</td>
          <td>${it.date ? fmtDate(it.date) : '—'}</td>
          <td style="color:${color};">${status}</td>
        `;
        table.appendChild(tr);
      });
      card.appendChild(table);
      listWrap.appendChild(card);
      table.querySelectorAll('input[type=checkbox]').forEach(cb=>{
        cb.onchange = (e)=>{ cc.doneItems[e.target.dataset.id] = e.target.checked; save(); renderList(); };
      });

      const note = document.createElement('div');
      note.className = 'card';
      note.innerHTML = `<h3>A note on reliability</h3><p class="helptext">Advance tax and belated-return dates are fixed by statute and rarely move. The ITR filing due date has been extended by CBDT notification in multiple recent years — treat the date above as the statutory baseline, not a guarantee, and check the income tax portal close to the date.</p>`;
      listWrap.appendChild(note);
    }
    renderList();
  }
};
registerModule(ComplianceCalendarModule);

/* =========================================================================
   MODULE: AIS Reconciliation
   Generic version of the click-to-see-source pattern: add an AIS line item,
   then add the source-document rows that should back it up. Tool sums the
   sources and flags match / gap against the AIS figure automatically.
   ========================================================================= */
const AISReconciliationModule = {
  id: 'ais_reconciliation',
  label: 'AIS Reconciliation',
  order: 5,
  ruleSet: { toleranceRs: 50 },
  isActive: () => true,
  hasStarted: (p) => (p.aisEntries||[]).length > 0,
  isComplete: (p) => (p.aisEntries||[]).length > 0 && p.aisEntries.every(e => (e.sourceRows||[]).length > 0),
  requiredDocs: () => ([
    {id:'ais_download', name:'AIS (Annual Information Statement), downloaded from the income tax e-filing portal', note:'Compliance Portal → AIS/TIS → download for the relevant FY.'},
    {id:'source_docs', name:'Source documents matching each AIS category', note:'Broker capital gain statements, bank statements, Form 16/16A, mutual fund CAS — whatever backs each line.'}
  ]),
  fallbackDocs: () => ({}),
  render(container, p, save){
    p.aisEntries = p.aisEntries || [];

    const header = document.createElement('div');
    header.className = 'panel-header';
    header.innerHTML = `
      <div class="eyebrow">Module 05 · Every AIS line, checked against its own source</div>
      <h2>AIS Reconciliation</h2>
      <p class="desc">Add each AIS line item, then add the source-document rows that should sum up to it. The tool flags a match or a gap automatically — no category is trusted just because AIS says so.</p>
    `;
    container.appendChild(header);

    const addCard = document.createElement('div');
    addCard.className = 'card';
    addCard.innerHTML = `
      <h3>Add AIS line item</h3>
      <div class="field-row">
        <div class="field">
          <label>Category</label>
          <select id="ais_cat">
            <option>Capital Gains</option>
            <option>Dividends</option>
            <option>Interest</option>
            <option>TDS</option>
            <option>Rent / Other Info</option>
            <option>Other</option>
          </select>
        </div>
        <div class="field"><label>Description</label><input id="ais_desc" type="text" placeholder="e.g. Muthoot Finance LTCG"></div>
        <div class="field"><label>AIS value (₹)</label><input id="ais_val" type="number" step="0.01"></div>
      </div>
      <button class="btn small" id="ais_add_btn">+ Add AIS item</button>
    `;
    container.appendChild(addCard);

    const listWrap = document.createElement('div');
    container.appendChild(listWrap);

    function renderList(){
      listWrap.innerHTML = '';
      if(p.aisEntries.length === 0){
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'No AIS line items added yet.';
        listWrap.appendChild(empty);
        return;
      }
      p.aisEntries.forEach((entry, eIdx)=>{
        entry.sourceRows = entry.sourceRows || [];
        const sourceSum = entry.sourceRows.reduce((s,r)=>s+(+r.value||0),0);
        const diff = sourceSum - (+entry.aisValue||0);
        const matches = Math.abs(diff) <= AISReconciliationModule.ruleSet.toleranceRs;
        const hasSources = entry.sourceRows.length > 0;

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div>
              <h3 style="margin-bottom:2px;">${entry.description || '(untitled)'} <span class="tag gold">${entry.category}</span></h3>
              <div class="helptext">AIS value: ₹${(+entry.aisValue||0).toLocaleString('en-IN')}</div>
            </div>
            <button class="btn small ghost" data-rm-ais="${eIdx}">✕</button>
          </div>
          <div id="ais_sourcerows_${eIdx}" style="margin-top:10px;"></div>
          <div class="field-row" style="margin-top:8px;">
            <div class="field"><label>Source label</label><input id="ais_srclabel_${eIdx}" type="text" placeholder="e.g. Broker contract note"></div>
            <div class="field"><label>Value (₹)</label><input id="ais_srcval_${eIdx}" type="number" step="0.01"></div>
          </div>
          <button class="btn small" id="ais_addsrc_${eIdx}">+ Add source row</button>
          <div id="ais_verdict_${eIdx}" style="margin-top:12px;"></div>
        `;
        listWrap.appendChild(card);

        function renderSourceRows(){
          const el = card.querySelector(`#ais_sourcerows_${eIdx}`);
          if(entry.sourceRows.length === 0){
            el.innerHTML = `<div class="helptext">No source rows yet.</div>`;
          } else {
            const table = document.createElement('table');
            table.className = 'day-table';
            table.innerHTML = `<tr><th>Source</th><th>Value</th><th></th></tr>`;
            entry.sourceRows.forEach((sr, sIdx)=>{
              const tr = document.createElement('tr');
              tr.innerHTML = `<td>${sr.label}</td><td>₹${(+sr.value).toLocaleString('en-IN')}</td><td><button class="btn small ghost" data-rmsrc="${sIdx}">✕</button></td>`;
              table.appendChild(tr);
            });
            el.innerHTML = '';
            el.appendChild(table);
            el.querySelectorAll('[data-rmsrc]').forEach(btn=>{
              btn.onclick = (e)=>{ entry.sourceRows.splice(+e.target.dataset.rmsrc,1); save(); renderSourceRows(); renderVerdict(); };
            });
          }
        }
        function renderVerdict(){
          const el = card.querySelector(`#ais_verdict_${eIdx}`);
          const sSum = entry.sourceRows.reduce((s,r)=>s+(+r.value||0),0);
          const d = sSum - (+entry.aisValue||0);
          const ok = Math.abs(d) <= AISReconciliationModule.ruleSet.toleranceRs;
          if(entry.sourceRows.length === 0){
            el.innerHTML = '';
            return;
          }
          el.innerHTML = `
            <div class="result-box" style="border-color:${ok?'var(--green)':'var(--rust)'};">
              <div class="verdict" style="color:${ok?'var(--green)':'var(--rust)'};">${ok?'✓ Matches':'⚠ Gap: ₹'+d.toLocaleString('en-IN',{maximumFractionDigits:2})}</div>
              <div class="verdict-detail">Source total ₹${sSum.toLocaleString('en-IN')} vs AIS ₹${(+entry.aisValue).toLocaleString('en-IN')}</div>
            </div>
          `;
        }
        renderSourceRows();
        renderVerdict();

        card.querySelector(`[data-rm-ais="${eIdx}"]`).onclick = ()=>{ p.aisEntries.splice(eIdx,1); save(); renderList(); };
        card.querySelector(`#ais_addsrc_${eIdx}`).onclick = ()=>{
          const label = card.querySelector(`#ais_srclabel_${eIdx}`).value.trim();
          const val = card.querySelector(`#ais_srcval_${eIdx}`).value;
          if(!label || val===''){ alert('Source label and value are required.'); return; }
          entry.sourceRows.push({label, value:+val});
          save();
          renderSourceRows();
          renderVerdict();
          card.querySelector(`#ais_srclabel_${eIdx}`).value='';
          card.querySelector(`#ais_srcval_${eIdx}`).value='';
        };
      });
    }
    renderList();

    addCard.querySelector('#ais_add_btn').onclick = ()=>{
      const cat = addCard.querySelector('#ais_cat').value;
      const desc = addCard.querySelector('#ais_desc').value.trim();
      const val = addCard.querySelector('#ais_val').value;
      if(!desc || val===''){ alert('Description and AIS value are required.'); return; }
      p.aisEntries.push({category:cat, description:desc, aisValue:+val, sourceRows:[]});
      save();
      renderList();
      addCard.querySelector('#ais_desc').value='';
      addCard.querySelector('#ais_val').value='';
    };
  }
};
registerModule(AISReconciliationModule);

/* =========================================================================
   MODULE: Tax Saving Advisor
   Rule-based, not AI-generated per session — every tip is a function of
   actual profile data (residency, capital gains rows, house property),
   so it stays generic across users while being specific to what's in
   THIS profile. Covers this-year moves and forward-looking planning.
   ========================================================================= */
const TaxSavingModule = {
  id: 'tax_saving',
  label: 'Tax Saving Advisor',
  order: 6,
  ruleSet: { ltcgExemption: 125000, ltcgHoldingDays: 365 },
  isActive: () => true,
  hasStarted: () => true,
  isComplete: () => true,
  requiredDocs: () => ([]),
  fallbackDocs: () => ({}),
  render(container, p, save){
    const header = document.createElement('div');
    header.className = 'panel-header';
    header.innerHTML = `
      <div class="eyebrow">Module 06 · Computed from your actual profile data, not generic advice</div>
      <h2>Tax Saving Advisor</h2>
      <p class="desc">Every tip below is generated from what's actually in your profile so far — the more complete your other modules, the more specific this gets. General factual information, not personalised financial advice — confirm anything material with a professional before acting.</p>
    `;
    container.appendChild(header);

    const tips = [];

    // --- LTCG exemption headroom ---
    const rows = p.cgEquityRows || [];
    let ltUsed = 0;
    rows.forEach(r=>{
      if(r.buyprice==null || r.buyprice==='') return;
      const gain = (r.sellprice - r.buyprice) * r.qty;
      const days = (r.buydate && r.selldate) ? holdingPeriodDays(r.buydate, r.selldate) : 0;
      if(days > 365 && gain > 0) ltUsed += gain;
    });
    if(ltUsed > 0 && ltUsed < TaxSavingModule.ruleSet.ltcgExemption){
      const headroom = TaxSavingModule.ruleSet.ltcgExemption - ltUsed;
      tips.push({
        title: `₹${headroom.toLocaleString('en-IN')} of your ₹1,25,000 LTCG exemption is unused this FY`,
        body: `You've booked ₹${ltUsed.toLocaleString('en-IN')} in long-term equity gains so far. If you're holding other appreciated equity/equity-MF positions with no intention to sell soon, selling and immediately re-buying (a "bed and breakfast" harvest) up to this remaining headroom locks in tax-free gain and resets your cost basis higher — reducing tax on a future, larger sale. Do this before 31-Mar; the exemption doesn't carry forward.`,
        kind: 'this-year'
      });
    } else if(ltUsed >= TaxSavingModule.ruleSet.ltcgExemption){
      tips.push({
        title: `LTCG exemption already fully used (₹${ltUsed.toLocaleString('en-IN')} booked)`,
        body: `Further long-term equity gains this FY are taxed at 12.5% with no more headroom. If you have flexibility on timing, consider whether any planned sale could wait until the next FY to get a fresh ₹1,25,000 exemption instead.`,
        kind: 'this-year'
      });
    }

    // --- ST lots near the LT boundary ---
    const nearBoundary = rows.filter(r=>{
      if(!r.buydate || !r.selldate || r.buyprice==null || r.buyprice==='') return false;
      const days = holdingPeriodDays(r.buydate, r.selldate);
      return days <= 365 && days >= 335; // within ~1 month of crossing into LT (day 366+)
    });
    if(nearBoundary.length > 0){
      tips.push({
        title: `${nearBoundary.length} lot(s) are within a month of crossing into long-term`,
        body: `Short-term equity gains are taxed at 20% flat; long-term gets 12.5% plus exemption headroom. If a sale isn't urgent, waiting until day 366 on these specific lots could meaningfully cut the tax on that gain. Check the Capital Gains — Equity module for exact dates.`,
        kind: 'this-year'
      });
    }

    // --- Residency / RNOR planning ---
    if(p.residencyResult && p.residencyResult.status.includes('Non-Resident')){
      tips.push({
        title: `NRI status this FY — foreign income stays exempt while it lasts`,
        body: `If you're planning an eventual return to India, becoming Resident but Not Ordinarily Resident (RNOR) first — rather than jumping straight to full Resident — extends the exemption on foreign income for up to 2-3 more years. RNOR eligibility depends on your residency history in the preceding 10 years, so the timing of your return date is worth planning deliberately rather than incidentally.`,
        kind: 'future'
      });
      tips.push({
        title: `Section 87A rebate is not available to you as an NRI`,
        body: `Unlike resident taxpayers, NRIs pay slab-rate tax in full even on modest total income — there's no rebate to plan around. Advance tax and TDS accuracy matter more as a result, since there's no rebate cushion for small shortfalls.`,
        kind: 'this-year'
      });
    }

    // --- Advance tax reminder based on realised gains ---
    const totalGains = rows.reduce((s,r)=>{
      if(r.buyprice==null || r.buyprice==='') return s;
      return s + (r.sellprice - r.buyprice) * r.qty;
    }, 0);
    if(totalGains > 100000){
      tips.push({
        title: `Meaningful capital gains realised this FY — advance tax likely applies`,
        body: `Once total tax liability for the year crosses roughly ₹10,000, advance tax is due in quarterly instalments (15-Jun, 15-Sep, 15-Dec, 15-Mar). Gains realised late in the year still need the instalment due on or before the next date — missing this triggers interest under Sec 234B/234C, which is avoidable with a same-quarter payment.`,
        kind: 'this-year'
      });
    }

    // --- House property: home loan interest reminder ---
    (p.properties||[]).forEach(prop=>{
      if(!prop.selfOccupied && (!prop.homeLoanInterest || prop.homeLoanInterest===0) && (prop.rentRows||[]).length>0){
        tips.push({
          title: `${prop.address || 'A let-out property'}: home loan interest deduction shows ₹0`,
          body: `For a let-out property, Section 24(b) allows the FULL interest paid to be deducted against rental income — no cap, unlike self-occupied property. If there's an active home loan on this property, get the annual interest certificate from the lender; EMI debits in a bank statement don't tell you the interest/principal split, so this is easy to accidentally leave at zero.`,
          kind: 'this-year'
        });
      }
    });

    // --- Foreign assets / FTC ---
    if(p.hasForeignAssets){
      tips.push({
        title: `Foreign tax credit (Form 67) — a deadline-sensitive claim, not just a filing detail`,
        body: `Form 67 generally needs to be filed before the ITR itself (or on/before the extended due date) to validly claim credit for foreign tax already withheld — filing it late or skipping it means paying tax twice on the same income. Reconcile it against the broker's itemized statement line-by-line, not just the summary total.`,
        kind: 'this-year'
      });
    }

    // --- Carried-forward losses from Prior Years module ---
    const priorYears = p.priorYears || {};
    const cfTotalST = Object.values(priorYears).reduce((s,y)=>s+(y.carriedForwardLossST||0),0);
    const cfTotalLT = Object.values(priorYears).reduce((s,y)=>s+(y.carriedForwardLossLT||0),0);
    if(cfTotalST > 0 || cfTotalLT > 0){
      tips.push({
        title: `₹${(cfTotalST+cfTotalLT).toLocaleString('en-IN')} in carried-forward capital losses on file — use it before it expires`,
        body: `Short-term losses carried forward: ₹${cfTotalST.toLocaleString('en-IN')} (can offset both ST and LT gains). Long-term losses carried forward: ₹${cfTotalLT.toLocaleString('en-IN')} (can only offset LT gains). Capital losses can only be carried forward for 8 assessment years — check the Prior Years module for which year each loss originated, and prioritise using the oldest ones first before they lapse unused.`,
        kind: 'this-year'
      });
    }

    // --- RNOR status affecting foreign income ---
    if(p.residencyResult && p.residencyResult.rnorResult === 'RNOR'){
      tips.push({
        title: `RNOR status confirmed from your Prior Years data — foreign income stays exempt one more year`,
        body: `Unlike a plain Resident, RNOR still gets NRI-like treatment on foreign income (with the usual exception for income from an Indian business/profession). This typically doesn't last more than 2-3 years after return to India — worth tracking how many RNOR years you have left, since the exemption ends once you become Ordinarily Resident.`,
        kind: 'this-year'
      });
    }

    // Render
    if(tips.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'Fill in the other modules — Residency, Capital Gains, House Property, Foreign Assets — and tailored tips will appear here.';
      container.appendChild(empty);
      return;
    }

    ['this-year','future'].forEach(kind=>{
      const kindTips = tips.filter(t=>t.kind===kind);
      if(kindTips.length===0) return;
      const label = document.createElement('div');
      label.className = 'panel-header';
      label.style.marginTop = '20px';
      label.innerHTML = `<h2 style="font-size:16px;">${kind==='this-year' ? 'For this filing year' : 'Looking ahead'}</h2>`;
      container.appendChild(label);
      kindTips.forEach(t=>{
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<h3>${t.title}</h3><p style="font-size:12.5px; color:var(--text); line-height:1.6;">${t.body}</p>`;
        container.appendChild(card);
      });
    });
  }
};
registerModule(TaxSavingModule);

document.getElementById('exportBtn').onclick = ()=>{
  const blob = new Blob([JSON.stringify(profile, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `itrgenie-profile-${profile.fy}.json`;
  a.click();
  URL.revokeObjectURL(url);
};
document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();
document.getElementById('importFile').onchange = (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      profile = JSON.parse(ev.target.result);
      saveProfile();
      renderContent();
    }catch(err){ alert('Could not read that file — not valid JSON.'); }
  };
  reader.readAsText(file);
};

activeModuleId = '__dashboard__';
renderRail();
renderContent();
</script>
