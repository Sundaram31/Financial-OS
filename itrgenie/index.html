<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITRGenie — Ledger</title>
<style>
  :root{
    --bg:#0B0E11;
    --panel:#12161B;
    --panel-2:#171C22;
    --line:#242A31;
    --text:#E8E6E0;
    --muted:#8A8F98;
    --gold:#C9A227;
    --gold-dim:#8f7419;
    --green:#4A9B6E;
    --rust:#B5533C;
    --mono: 'IBM Plex Mono', 'Courier New', monospace;
    --serif: 'Source Serif 4', Georgia, serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:var(--mono); font-size:14px; line-height:1.5;
    min-height:100vh;
  }
  a{color:var(--gold);}

  /* ---- App shell ---- */
  .app{ display:flex; min-height:100vh; flex-direction:column; }
  header.topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .seal{
    width:28px; height:28px; border:1.5px solid var(--gold);
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-size:13px; color:var(--gold); font-weight:600;
  }
  .brand h1{ font-family:var(--serif); font-size:17px; font-weight:600; letter-spacing:0.2px;}
  .brand .sub{ font-size:11px; color:var(--muted); }
  .topbar-actions{ display:flex; gap:8px; }

  .body-flex{ display:flex; flex:1; min-height:0; }

  nav.rail{
    width:230px; flex-shrink:0; border-right:1px solid var(--line);
    background:var(--panel); padding:16px 0; overflow-y:auto;
  }
  nav.rail .rail-label{
    font-size:10px; text-transform:uppercase; letter-spacing:1.5px;
    color:var(--muted); padding:6px 18px; margin-top:10px;
  }
  nav.rail .rail-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 18px; cursor:pointer; font-size:13px; color:var(--text);
    border-left:2px solid transparent;
  }
  nav.rail .rail-item:hover{ background:var(--panel-2); }
  nav.rail .rail-item.active{ border-left:2px solid var(--gold); background:var(--panel-2); color:var(--gold); }
  nav.rail .rail-item .status-dot{
    width:7px; height:7px; border-radius:50%; background:var(--line); flex-shrink:0;
  }
  nav.rail .rail-item .status-dot.done{ background:var(--green); }
  nav.rail .rail-item .status-dot.missing{ background:var(--rust); }

  main.content{ flex:1; overflow-y:auto; padding:26px 32px; max-width:900px; }

  .panel-header{ margin-bottom:22px; }
  .panel-header .eyebrow{ font-size:11px; color:var(--gold); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:4px;}
  .panel-header h2{ font-family:var(--serif); font-size:24px; font-weight:600; }
  .panel-header p.desc{ color:var(--muted); font-size:13px; margin-top:6px; max-width:640px; }

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    padding:18px 20px; margin-bottom:16px;
  }
  .card h3{ font-family:var(--serif); font-size:15px; margin-bottom:12px; color:var(--text); }
  .field-row{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
  .field{ flex:1; min-width:180px; }
  .field label{ display:block; font-size:11px; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.6px;}
  .field input, .field select{
    width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text);
    padding:8px 10px; border-radius:4px; font-family:var(--mono); font-size:13px;
  }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--gold-dim); }
  .btn{
    background:transparent; border:1px solid var(--gold-dim); color:var(--gold);
    padding:8px 16px; border-radius:4px; font-family:var(--mono); font-size:12px;
    cursor:pointer; letter-spacing:0.3px;
  }
  .btn:hover{ background:rgba(201,162,39,0.08); border-color:var(--gold); }
  .btn.primary{ background:var(--gold); color:#141414; font-weight:600; border-color:var(--gold); }
  .btn.primary:hover{ background:#dab63a; }
  .btn.ghost{ border-color:var(--line); color:var(--muted); }
  .btn.small{ padding:5px 10px; font-size:11px; }

  table.day-table{ width:100%; border-collapse:collapse; margin-top:8px; font-size:12.5px; }
  table.day-table th{ text-align:left; color:var(--muted); font-weight:500; font-size:10.5px; text-transform:uppercase; letter-spacing:0.5px; padding:6px 8px; border-bottom:1px solid var(--line); }
  table.day-table td{ padding:7px 8px; border-bottom:1px solid var(--line); }
  table.day-table tr:last-child td{ border-bottom:none; }

  .result-box{
    border:1px solid var(--gold-dim); border-radius:6px; padding:18px 20px;
    background:linear-gradient(180deg, rgba(201,162,39,0.05), transparent);
    margin-top:16px;
  }
  .result-box .verdict{ font-family:var(--serif); font-size:19px; color:var(--gold); margin-bottom:4px; }
  .result-box .verdict-detail{ font-size:12.5px; color:var(--muted); margin-bottom:10px; }
  .result-box .basis{ font-size:12px; color:var(--text); border-top:1px solid var(--line); padding-top:10px; margin-top:10px;}
  .basis code{ color:var(--gold); font-size:11.5px; }

  .tag{
    display:inline-block; font-size:10px; padding:2px 8px; border-radius:10px;
    text-transform:uppercase; letter-spacing:0.5px; font-weight:600;
  }
  .tag.green{ background:rgba(74,155,110,0.15); color:var(--green); }
  .tag.rust{ background:rgba(181,83,60,0.15); color:var(--rust); }
  .tag.gold{ background:rgba(201,162,39,0.15); color:var(--gold); }

  .checklist-item{
    display:flex; align-items:flex-start; gap:10px; padding:11px 0;
    border-bottom:1px solid var(--line);
  }
  .checklist-item:last-child{ border-bottom:none; }
  .checklist-item .check-icon{ font-size:14px; margin-top:1px; width:16px; text-align:center; flex-shrink:0; }
  .checklist-item .check-icon.have{ color:var(--green); }
  .checklist-item .check-icon.missing{ color:var(--rust); }
  .checklist-item .check-body{ flex:1; }
  .checklist-item .doc-name{ font-size:13px; }
  .checklist-item .doc-fallback{ font-size:11.5px; color:var(--muted); margin-top:3px; }
  .checklist-item .doc-fallback b{ color:var(--gold); font-weight:500; }
  .checklist-item .doc-toggle{ font-size:11px; }

  .empty-state{ color:var(--muted); font-size:13px; padding:30px 0; text-align:center; }
  .helptext{ font-size:11.5px; color:var(--muted); margin-top:4px; }
  .divider{ height:1px; background:var(--line); margin:16px 0; }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }

  @media (max-width:760px){
    .body-flex{ flex-direction:column; }
    nav.rail{ width:100%; display:flex; overflow-x:auto; padding:8px; border-right:none; border-bottom:1px solid var(--line); }
    nav.rail .rail-label{ display:none; }
    nav.rail .rail-item{ border-left:none; border-bottom:2px solid transparent; white-space:nowrap; }
    nav.rail .rail-item.active{ border-left:none; border-bottom:2px solid var(--gold); }
    main.content{ padding:18px; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="seal">CA</div>
      <div>
        <h1>ITRGenie</h1>
        <div class="sub">Modular ledger · profile-driven checklist &amp; computation</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="btn small ghost" id="exportBtn">Export profile</button>
      <button class="btn small ghost" id="importBtn">Import profile</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </div>
  </header>

  <div class="body-flex">
    <nav class="rail" id="rail"></nav>
    <main class="content" id="content"></main>
  </div>

</div>

<script>
/* =========================================================================
   CORE ENGINE — generic, no tax logic lives here.
   Modules register themselves into ModuleRegistry with a fixed shape:
   {
     id, label, order,
     ruleSet: {...}                         // pure config, portable to Python later
     requiredDocs(profile) -> [{id,name,note}]
     fallbackDocs(profile) -> {docId: [alt1, alt2, ...]}
     isActive(profile) -> bool              // should this module show for this user?
     isComplete(profile) -> bool            // status dot in rail
     render(container, profile, save)       // draws its own UI into container
   }
   ========================================================================= */

const STORAGE_KEY = 'itr_advisor_profile_v1';

function loadProfile(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : defaultProfile();
  }catch(e){ return defaultProfile(); }
}
function defaultProfile(){
  return {
    fy: '2025-26',
    citizenship: 'Indian',
    employmentAbroad: true,
    travelLog: [],       // [{depart:'YYYY-MM-DD', arrive:'YYYY-MM-DD', purpose:'employment'}]
    priorYearsDaysInIndia: [], // last up to 4 FYs, for RNOR "729 day" test
    priorYearsResidentCount: null, // resident in how many of last 10 FYs
    residencyResult: null,
    incomeSources: { salarySeafarer:true, equityMF:true, rental:true, business:false },
    modulesDocStatus: {}, // {moduleId: {docId: true/false}}
    cgEquityRows: [],
    cgBrokerReportedTotal: '',
    cgMFRows: [],
    hasForeignAssets: false,
    faReconChecks: {},
    properties: [],  // [{id, address, tenantName, rentRows:[{date,amount,label}], gavSource:'', municipalTax:0, homeLoanInterest:0, selfOccupied:false}]
    aisEntries: [],  // [{category, description, aisValue, sourceRows:[{label,value}]}]
    formWizard: {},  // ITR form determination answers
    priorYears: {},  // {fy: {residencyStatus, daysInIndia, carriedForwardLossST, carriedForwardLossLT}}
    openingHoldings: [],  // [{stock, qty, buydate, buyprice, notes}] -- pre-tool holdings, for future FIFO
    otherSources: {aisInterestTotal:'', interestRows:[], aisDividendTotal:'', dividendRows:[]},
    businessIncome: {mode:null, fnoTrades:[], presumptive:{}, books:{}},
    salaryIncome: {employers:[], foreignExempt:false, exemptAmount:''},
    deductions: {regime:null, c80:0, ccd1b:0,
      d80_self_premium:0, d80_self_checkup:0, d80_self_medexp:0,
      d80_parents_premium:0, d80_parents_checkup:0, d80_parents_medexp:0,
      parentsAreSenior:false, selfIsSenior:false, tta_ttb:0, g80:0, e80:0, ccd2:0},
    assetsLiabilities: {immovable:[], movable:[], liabilities:[]},
    hasVDA: null, vdaTransactions: [],
    hasRealEstateSale: null, realEstateTransactions: [],
    foreignBankAccounts: [],
    advanceTax: {totalTaxLiability:'', tdsCredit:'', isSenior:false, hasBusinessIncome:null, q1paid:'', q2paid:'', q3paid:'', q4paid:'', filingDate:'', dueDate:'2026-07-31'},
    hraRows: [],
    clubbingMinor: [], clubbingSpouse: []
  };
}
let profile = loadProfile();
function saveProfile(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(profile));
  renderRail();
}

const ModuleRegistry = [];
function registerModule(mod){ ModuleRegistry.push(mod); }

let activeModuleId = null;

function renderRail(){
  const rail = document.getElementById('rail');
  rail.innerHTML = '';

  const label0 = document.createElement('div');
  label0.className = 'rail-label';
  label0.textContent = 'Start here';
  rail.appendChild(label0);
  const dashItem = document.createElement('div');
  dashItem.className = 'rail-item' + (activeModuleId==='__dashboard__' ? ' active' : '');
  dashItem.innerHTML = `<span>What's next?</span><span class="status-dot"></span>`;
  dashItem.onclick = () => { activeModuleId = '__dashboard__'; renderRail(); renderContent(); };
  rail.appendChild(dashItem);

  const label = document.createElement('div');
  label.className = 'rail-label';
  label.textContent = 'Modules';
  rail.appendChild(label);

  ModuleRegistry
    .filter(m => m.isActive(profile))
    .sort((a,b)=>a.order-b.order)
    .forEach(m=>{
      const item = document.createElement('div');
      item.className = 'rail-item' + (m.id===activeModuleId ? ' active' : '');
      const dotClass = m.isComplete(profile) ? 'done' : (m.hasStarted && m.hasStarted(profile) ? 'missing' : '');
      item.innerHTML = `<span>${m.label}</span><span class="status-dot ${dotClass}"></span>`;
      item.onclick = () => { activeModuleId = m.id; renderRail(); renderContent(); };
      rail.appendChild(item);
    });

  const label2 = document.createElement('div');
  label2.className = 'rail-label';
  label2.textContent = 'Summary';
  rail.appendChild(label2);
  const checklistItem = document.createElement('div');
  checklistItem.className = 'rail-item' + (activeModuleId==='__checklist__' ? ' active' : '');
  checklistItem.innerHTML = `<span>Document checklist</span><span class="status-dot"></span>`;
  checklistItem.onclick = () => { activeModuleId = '__checklist__'; renderRail(); renderContent(); };
  rail.appendChild(checklistItem);

  const helpItem = document.createElement('div');
  helpItem.className = 'rail-item' + (activeModuleId==='__help__' ? ' active' : '');
  helpItem.innerHTML = `<span>Help &amp; Glossary</span><span class="status-dot"></span>`;
  helpItem.onclick = () => { activeModuleId = '__help__'; renderRail(); renderContent(); };
  rail.appendChild(helpItem);
}

function renderContent(){
  const content = document.getElementById('content');
  content.innerHTML = '';
  if(activeModuleId === '__dashboard__'){
    renderDashboard(content);
    return;
  }
  if(activeModuleId === '__checklist__'){
    renderChecklist(content);
    return;
  }
  if(activeModuleId === '__help__'){
    renderHelp(content);
    return;
  }
  const mod = ModuleRegistry.find(m=>m.id===activeModuleId);
  if(!mod){
    content.innerHTML = `<div class="empty-state">Select a module from the left.</div>`;
    return;
  }
  mod.render(content, profile, saveProfile);
}

function renderDashboard(container){
  const header = document.createElement('div');
  header.className = 'panel-header';
  header.innerHTML = `
    <div class="eyebrow">Your filing, at a glance</div>
    <h2>What's next?</h2>
    <p class="desc">Every module's status in one place, with a single recommended next action — so you don't have to work out the order yourself.</p>
  `;
  container.appendChild(header);

  const activeMods = ModuleRegistry.filter(m=>m.isActive(profile)).sort((a,b)=>a.order-b.order);

  // Status overview card
  const overview = document.createElement('div');
  overview.className = 'card';
  overview.innerHTML = `<h3>Module status</h3>`;
  activeMods.forEach(m=>{
    const complete = m.isComplete(profile);
    const started = m.hasStarted && m.hasStarted(profile);
    const status = complete ? 'Complete' : (started ? 'In progress' : 'Not started');
    const tagClass = complete ? 'green' : (started ? 'gold' : 'rust');
    const row = document.createElement('div');
    row.className = 'checklist-item';
    row.innerHTML = `
      <div class="check-icon ${complete?'have':'missing'}">${complete?'✓':'○'}</div>
      <div class="check-body"><div class="doc-name">${m.label}</div></div>
      <div><span class="tag ${tagClass}">${status}</span></div>
    `;
    row.style.cursor = 'pointer';
    row.onclick = ()=>{ activeModuleId = m.id; renderRail(); renderContent(); };
    overview.appendChild(row);
  });
  container.appendChild(overview);

  // Recommended next action -- first not-started module in priority order,
  // else first in-progress-but-incomplete module, else all done.
  const notStarted = activeMods.find(m => !(m.hasStarted && m.hasStarted(profile)));
  const incomplete = activeMods.find(m => !m.isComplete(profile));
  const next = notStarted || incomplete;

  const nextCard = document.createElement('div');
  nextCard.className = 'result-box';
  if(next){
    nextCard.innerHTML = `
      <div class="verdict">Next: ${next.label}</div>
      <div class="verdict-detail">${notStarted ? "You haven't started this module yet — it's next in the recommended order." : "This module has some data but isn't complete yet."}</div>
      <div style="margin-top:10px;"><button class="btn primary" id="dash_go_next">Go to ${next.label}</button></div>
    `;
  } else {
    nextCard.innerHTML = `
      <div class="verdict" style="color:var(--green);">All active modules complete</div>
      <div class="verdict-detail">Check the Document checklist for anything still outstanding, and review the Tax Saving Advisor for final-week moves before filing.</div>
    `;
  }
  container.appendChild(nextCard);
  if(next){
    nextCard.querySelector('#dash_go_next').onclick = ()=>{ activeModuleId = next.id; renderRail(); renderContent(); };
  }

  // Quick profile-scope questions if income sources not yet set
  const scopeCard = document.createElement('div');
  scopeCard.className = 'card';
  scopeCard.innerHTML = `<h3>Does this cover everything?</h3><p class="helptext" style="margin-bottom:10px;">Tick anything that applies to you so the right modules show up above.</p>`;
  const sources = [
    ['equityMF','Equity shares / equity mutual funds'],
    ['rental','Rental income from property'],
    ['business','Business or professional income'],
  ];
  sources.forEach(([key,label])=>{
    const row = document.createElement('div');
    row.className = 'checklist-item';
    const checked = !!profile.incomeSources[key];
    row.innerHTML = `
      <div class="check-icon ${checked?'have':'missing'}">${checked?'✓':'○'}</div>
      <div class="check-body"><div class="doc-name">${label}</div></div>
      <div class="doc-toggle"><button class="btn small ${checked?'ghost':''}">${checked?'Yes':'No'}</button></div>
    `;
    row.querySelector('button').onclick = ()=>{
      profile.incomeSources[key] = !checked;
      saveProfile();
      renderDashboard(container);
    };
    scopeCard.appendChild(row);
  });
  const faRow = document.createElement('div');
  faRow.className = 'checklist-item';
  faRow.innerHTML = `
    <div class="check-icon ${profile.hasForeignAssets?'have':'missing'}">${profile.hasForeignAssets?'✓':'○'}</div>
    <div class="check-body"><div class="doc-name">Foreign shares / foreign bank accounts</div></div>
    <div class="doc-toggle"><button class="btn small ${profile.hasForeignAssets?'ghost':''}">${profile.hasForeignAssets?'Yes':'No'}</button></div>
  `;
  faRow.querySelector('button').onclick = ()=>{
    profile.hasForeignAssets = !profile.hasForeignAssets;
    saveProfile();
    renderDashboard(container);
  };
  scopeCard.appendChild(faRow);
  container.appendChild(scopeCard);

  if(!profile.residencyResult){
    const note = document.createElement('div');
    note.className = 'card';
    note.innerHTML = `<h3>One more thing</h3><p class="helptext">Residency status hasn't been calculated yet — it decides which of your income is even taxable in India. Start there before anything else.</p>`;
    container.appendChild(note);
  }
}

function renderHelp(container){
  const header = document.createElement('div');
  header.className = 'panel-header';
  header.innerHTML = `
    <div class="eyebrow">No jargon assumed</div>
    <h2>Help &amp; Glossary</h2>
    <p class="desc">A first-time walkthrough, plain-language definitions for the terms this tool uses, and answers to the questions people usually get stuck on.</p>
  `;
  container.appendChild(header);

  // ---- Walkthrough ----
  const walkCard = document.createElement('div');
  walkCard.className = 'card';
  walkCard.innerHTML = `
    <h3>First time here? Do these in order</h3>
    <div class="checklist-item"><div class="check-icon" style="color:var(--gold);">1</div><div class="check-body"><div class="doc-name">Open "What's next?"</div><div class="doc-fallback">The dashboard tells you exactly which module to fill in next — you never have to guess the order yourself.</div></div></div>
    <div class="checklist-item"><div class="check-icon" style="color:var(--gold);">2</div><div class="check-body"><div class="doc-name">Do Residency first, if it applies to you</div><div class="doc-fallback">Whether you're Resident, NRI, or RNOR decides what's even taxable — everything downstream depends on this being right.</div></div></div>
    <div class="checklist-item"><div class="check-icon" style="color:var(--gold);">3</div><div class="check-body"><div class="doc-name">Fill income modules as data becomes available</div><div class="doc-fallback">Don't force an order — if your capital gains statement arrives before your Form 16, do that module first. The Dashboard re-sorts itself as you go.</div></div></div>
    <div class="checklist-item"><div class="check-icon" style="color:var(--gold);">4</div><div class="check-body"><div class="doc-name">Paste, don't type, wherever you see a paste box</div><div class="doc-fallback">Copy rows straight from Excel, Sheets, or a broker PDF-to-text — one line per entry. Far faster than typing on mobile.</div></div></div>
    <div class="checklist-item"><div class="check-icon" style="color:var(--gold);">5</div><div class="check-body"><div class="doc-name">Check the Document checklist</div><div class="doc-fallback">Aggregates what every active module still needs, with a suggested alternative if the primary document isn't available.</div></div></div>
    <div class="checklist-item"><div class="check-icon" style="color:var(--gold);">6</div><div class="check-body"><div class="doc-name">Review Tax Saving Advisor and Regime Comparison last</div><div class="doc-fallback">These only get more accurate as the other modules fill in — check them once most of your data is in, not first.</div></div></div>
  `;
  container.appendChild(walkCard);

  // ---- Glossary ----
  const glossCard = document.createElement('div');
  glossCard.className = 'card';
  glossCard.innerHTML = `<h3>Glossary</h3><div id="gloss_rows"></div>`;
  container.appendChild(glossCard);
  const terms = [
    ['AIS', 'Annual Information Statement — a summary the tax department already has about your income (dividends, interest, stock sales, TDS), pulled from banks, brokers, and employers. Download it from the income tax portal.'],
    ['TDS', 'Tax Deducted at Source — tax already withheld before you received the money (by an employer, bank, or broker). This counts as a credit against what you owe.'],
    ['TCS', 'Tax Collected at Source — similar to TDS, but collected by the payee side (e.g. a travel agent on a foreign trip booking) rather than withheld from income.'],
    ['STCG / LTCG', 'Short-Term / Long-Term Capital Gains — profit from selling an asset. Which one applies depends on how long you held it before selling (365 days is the usual line for listed shares).'],
    ['GAV / NAV', 'Gross Annual Value / Net Annual Value — for a rented property, GAV is the rent actually received; NAV is GAV minus municipal taxes. Never a number you estimate — always the sum of actual rent credits.'],
    ['Section 24(b)', 'The tax law section allowing a deduction for home loan interest against rental income (unlimited for a let-out property, capped at ₹2,00,000 combined for self-occupied properties).'],
    ['Section 80C, 80D, etc. (Chapter VI-A)', 'A family of deductions (investments, insurance, etc.) mostly only available if you choose the old tax regime — the new regime disallows most of them.'],
    ['RNOR', 'Resident but Not Ordinarily Resident — a transitional status (usually for someone recently returned to India) that still gets NRI-like treatment on foreign income for a few years.'],
    ['Form 26AS', 'A tax credit statement showing TDS/TCS/advance tax already recorded against your PAN — cross-check this against AIS.'],
    ['Form 67', 'The form used to claim credit for foreign tax you already paid abroad, so the same income isn\'t taxed twice.'],
    ['Presumptive taxation (44AD/44ADA/44AE)', 'A simplified way to declare business/professional income as a fixed percentage of turnover, without maintaining detailed books.'],

    ['A document is missing or I can\'t find it', 'Check the Document checklist — most items have a suggested fallback document listed if the primary one isn\'t available.'],

    ['Old regime or new regime?', 'Fill in the Deductions module for both (the new-regime section only needs 80CCD(2); old-regime needs the rest), then check the Old vs New Regime Comparison module — it computes tax both ways from your actual figures.'],
    ['Is my data stored anywhere online?', 'No — everything stays in this browser\'s local storage on this device only. Nothing is uploaded. Use Export in the top bar to back up or move to another device.'],
  ];
  const faqEl = faqCard.querySelector('#faq_rows');
  faqs.forEach(([q,a])=>{
    const row = document.createElement('div');

  container.appendChild(disclaimerCard);
}

function renderChecklist(container){
  const header = document.createElement('div');
  header.className = 'panel-header';
  header.innerHTML = `
    <div class="eyebrow">Aggregated across active modules</div>
    <h2>Document checklist</h2>
    <p class="desc">Generated from your profile. Tick off what you have — if it's missing, an alternative is suggested where one exists.</p>
  `;
  container.appendChild(header);

  const cloudNote = document.createElement('div');
  cloudNote.className = 'card';
  cloudNote.style.borderColor = 'var(--gold-dim)';
  cloudNote.innerHTML = `
    <h3>Getting documents in</h3>
    <p class="helptext" style="margin-bottom:6px;">This tool runs entirely in your browser and can't reach Google Drive, Gmail, or any cloud account directly — that requires a connected assistant.</p>
    <p class="helptext" style="margin-bottom:6px;"><b>Local file:</b> use "Attach local file" below to record that you have a document on this device — for privacy, only the filename is remembered (the file itself is not uploaded or stored).</p>
    <p class="helptext"><b>Cloud drive / email:</b> if you're working with Claude in a chat, ask it to search your connected Google Drive or Gmail directly — that's a capability of the assistant, not this exported tool.</p>
  `;
  container.appendChild(cloudNote);

  const activeMods = ModuleRegistry.filter(m=>m.isActive(profile)).sort((a,b)=>a.order-b.order);
  if(activeMods.length===0){
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = 'No modules active yet for this profile.';
    container.appendChild(empty);
    return;
  }

  activeMods.forEach(mod=>{
    const docs = mod.requiredDocs(profile);
    const fallbacks = mod.fallbackDocs(profile);
    if(!docs || docs.length===0) return;

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h3>${mod.label}</h3>`;

    docs.forEach(doc=>{
      profile.modulesDocStatus[mod.id] = profile.modulesDocStatus[mod.id] || {};
      const have = !!profile.modulesDocStatus[mod.id][doc.id];
      const filename = profile.modulesDocStatus[mod.id][doc.id+'_filename'];
      const row = document.createElement('div');
      row.className = 'checklist-item';
      const alt = (fallbacks && fallbacks[doc.id]) ? fallbacks[doc.id] : null;
      const fileInputId = `file_${mod.id}_${doc.id}`.replace(/[^a-zA-Z0-9_]/g,'');
      row.innerHTML = `
        <div class="check-icon ${have?'have':'missing'}">${have?'✓':'○'}</div>
        <div class="check-body">
          <div class="doc-name">${doc.name}</div>
          ${doc.note ? `<div class="doc-fallback">${doc.note}</div>` : ''}
          ${filename ? `<div class="doc-fallback">📎 ${filename}</div>` : ''}
          ${(!have && alt) ? `<div class="doc-fallback"><b>If unavailable:</b> ${alt.join(' → ')}</div>` : ''}
        </div>
        <div class="doc-toggle" style="display:flex; flex-direction:column; gap:4px; align-items:flex-end;">
          <button class="btn small ${have?'ghost':''}" data-toggle-have>${have?'Have it':'Mark have'}</button>
          <button class="btn small ghost" data-attach-file>Attach local file</button>
          <input type="file" id="${fileInputId}" style="display:none;">
        </div>
      `;
      row.querySelector('[data-toggle-have]').onclick = ()=>{
        profile.modulesDocStatus[mod.id][doc.id] = !have;
        saveProfile();
        renderChecklist(container);
      };
      row.querySelector('[data-attach-file]').onclick = ()=>{
        row.querySelector(`#${fileInputId}`).click();
      };
      row.querySelector(`#${fileInputId}`).onchange = (e)=>{
        const f = e.target.files[0];
        if(!f) return;
        profile.modulesDocStatus[mod.id][doc.id+'_filename'] = f.name;
        profile.modulesDocStatus[mod.id][doc.id] = true;
        saveProfile();
        renderChecklist(container);
      };
      card.appendChild(row);
    });
    container.appendChild(card);
  });
}

/* =========================================================================
   MODULE: ITR Form Determination
   A short button-only wizard (no typing) that decides which ITR form
   applies, and syncs its answers directly into the same profile flags
   the other modules already key off (incomeSources.*, hasForeignAssets) --
   so answering here makes the right modules appear automatically instead
   of asking the same question twice.
   ========================================================================= */
function computeApplicableForm(w){
  // w = wizard answers. Returns {form, reasons: [...], caveats: [...]}
  const reasons = [];
  const caveats = [];
  const isResident = w.residency === 'resident';

  if(w.hasBusinessIncome === true){
    reasons.push('Business/profession income (including F&O trading) is present.');
    if(w.fno === true){
      caveats.push('F&O trading is treated as non-speculative business income. If turnover is within presumptive limits, ITR-4 with Sec 44AD may be usable instead of ITR-3 -- but most traders with F&O losses to carry forward, or turnover requiring audit, need ITR-3 with a proper P&L. Confirm turnover against the presumptive threshold before assuming ITR-4 applies.');
    }
    if(w.isPartner === true){
      reasons.push('Being a partner in a firm also requires ITR-3 (partnership share of profit can\'t go on ITR-1/2/4).');
    }
    if(isResident && w.presumptive === true && w.hasCapitalGains !== true && w.numHouseProperties !== '2+' && w.isDirectorOrUnlisted !== true && w.hasForeignAssets !== true && w.totalIncomeAbove50L !== true){
      return {form:'ITR-4 (Sugam)', reasons:['Resident with presumptive business income (Sec 44AD/44ADA/44AE), no capital gains, no foreign assets, income within limits.'], caveats};
    }
    return {form:'ITR-3', reasons, caveats};
  }
  if(w.isPartner === true){
    return {form:'ITR-3', reasons:['Partner in a partnership firm.'], caveats};
  }

  // No business/profession income beyond this point
  if(!isResident){
    reasons.push('Non-resident / RNOR status -- ITR-1 and ITR-4 are not available regardless of anything else.');
    return {form:'ITR-2', reasons, caveats};
  }
  if(w.hasCapitalGains === true){ reasons.push('Capital gains present -- not permitted on ITR-1 or ITR-4.'); return {form:'ITR-2', reasons, caveats}; }
  if(w.numHouseProperties === '2+'){ reasons.push('More than one house property -- not permitted on ITR-1 or ITR-4.'); return {form:'ITR-2', reasons, caveats}; }
  if(w.isDirectorOrUnlisted === true){ reasons.push('Company directorship or unlisted equity shareholding -- requires ITR-2.'); return {form:'ITR-2', reasons, caveats}; }
  if(w.hasForeignAssets === true){ reasons.push('Foreign income or foreign assets -- requires ITR-2 (Schedule FA).'); return {form:'ITR-2', reasons, caveats}; }
  if(w.hasAgriIncomeAbove5000 === true){ reasons.push('Agricultural income above Rs 5,000 -- not permitted on ITR-1.'); return {form:'ITR-2', reasons, caveats}; }
  if(w.totalIncomeAbove50L === true){ reasons.push('Total income above Rs 50 lakh -- not permitted on ITR-1 or ITR-4.'); return {form:'ITR-2', reasons, caveats}; }

  reasons.push('Resident, salary/pension and/or one house property, other sources, no capital gains, no business income, within Rs 50L.');
  return {form:'ITR-1 (Sahaj)', reasons, caveats};
}

const FormDeterminationModule = {
  id: 'form_determination',
  label: 'ITR Form Determination',
  order: 0,
  ruleSet: {},
  isActive: () => true,
  hasStarted: (p) => !!(p.formWizard && Object.keys(p.formWizard).length > 0),
  isComplete: (p) => !!(p.formWizard && p.formWizard.residency && (p.formWizard.hasBusinessIncome !== undefined)),
  requiredDocs: (p) => {
    const form = (p.formWizard && p.formWizard._result) ? p.formWizard._result.form : null;
    const base = [
      {id:'pan_aadhaar', name:'PAN and Aadhaar', note:'Needed for every ITR form.'},
      {id:'form26as', name:'Form 26AS / AIS / TIS', note:'Download from the income tax e-filing portal — cross-check against everything else.'},
    ];
    if(form === 'ITR-1 (Sahaj)'){
      return [...base,
        {id:'form16', name:'Form 16 from employer', note:''},
        {id:'bank_interest', name:'Bank interest certificates', note:''}
      ];
    }
    if(form === 'ITR-2'){
      return [...base,
        {id:'form16', name:'Form 16 (if any salary income)', note:''},
        {id:'cg_statements', name:'Capital gains statements (broker/CAMS)', note:'See Capital Gains modules.'},
        {id:'rent_docs', name:'Rent agreement + bank credits (if rental income)', note:'See House Property module.'},
        {id:'foreign_docs', name:'Foreign asset/income statements (if applicable)', note:'See Foreign Assets module.'},
      ];
    }
    if(form === 'ITR-3'){
      return [...base,
        {id:'books', name:'Books of accounts / P&L and Balance Sheet', note:'Required unless a presumptive scheme is validly used.'},
        {id:'tax_audit', name:'Tax audit report (if turnover exceeds the audit threshold)', note:'Confirm current threshold — it changes periodically and depends on cash transaction proportion.'},
        {id:'trading_statement', name:'F&O / trading P&L statement from broker', note:'Needed if trading income is present.'},
      ];
    }
    if(form === 'ITR-4 (Sugam)'){
      return [...base,
        {id:'presumptive_calc', name:'Turnover/receipts figure for presumptive computation', note:'Sec 44AD (business) / 44ADA (profession) / 44AE (transport).'},
      ];
    }
    return base;
  },
  fallbackDocs: () => ({}),
  render(container, p, save){
    p.formWizard = p.formWizard || {};
    const w = p.formWizard;

    const header = document.createElement('div');
    header.className = 'panel-header';
    header.innerHTML = `
      <div class="eyebrow">Module 00 · Derives what it can from your data; only asks what only you know</div>
      <h2>ITR Form Determination</h2>
      <p class="desc">"Do I have capital gains?" and "am I NRI?" aren't things to guess at — they're computed from the Capital Gains and Residency modules. Fill those in and this updates itself. The questions below are only the ones nobody but you can answer.</p>
    `;
    container.appendChild(header);

    // ---- Section 1: auto-derived facts, read-only, linked to their source module ----
    const derivedCard = document.createElement('div');
    derivedCard.className = 'card';
    derivedCard.innerHTML = `<h3>Auto-detected from your other modules</h3><div id="derived_rows"></div>`;
    container.appendChild(derivedCard);

    function renderDerived(){
      const el = derivedCard.querySelector('#derived_rows');
      el.innerHTML = '';

      // Residency -- derived from the Residency module's actual computation
      let residencyVal = null, residencyLabel;
      if(profile.residencyResult){
        const s = profile.residencyResult.status;
        if(s.startsWith('Resident') && profile.residencyResult.rnorResult === 'RNOR'){
          residencyVal = 'rnor';
          residencyLabel = `RNOR — ${s} by day-count, but qualifies as RNOR per Prior Years data (Residency module)`;
        } else {
          residencyVal = s.startsWith('Resident') ? 'resident' : 'nonresident';
          residencyLabel = `${s} — computed from ${profile.residencyResult.daysInIndia} days in India (Residency module)`;
        }
      } else {
        residencyLabel = 'Not yet computed — go to the Residency module and add your travel dates.';
      }
      w.residency = residencyVal || w.residency; // keep last-known if module reset, else null
      el.appendChild(makeDerivedRow('Residency status', residencyLabel, !!residencyVal, 'residency'));

      // Capital gains -- derived from actual rows entered, not asked
      const eqRows = (profile.cgEquityRows||[]).length;
      const mfRows = (profile.cgMFRows||[]).length;
      const hasCG = (eqRows + mfRows) > 0;
      w.hasCapitalGains = hasCG;
      const cgLabel = hasCG
        ? `Yes — ${eqRows} equity row(s) + ${mfRows} mutual fund row(s) entered`
        : 'None entered yet — if you\'re not sure whether you sold anything this year, check your broker/demat statements and add rows in the Capital Gains modules. Treated as "No" until you do.';
      el.appendChild(makeDerivedRow('Capital gains', cgLabel, true, 'capgains'));

      // House properties -- derived from the House Property module
      const numProps = (profile.properties||[]).length;
      w.numHouseProperties = numProps === 0 ? '0' : (numProps === 1 ? '1' : '2+');
      el.appendChild(makeDerivedRow('House properties', `${numProps} added in the House Property module`, true, 'houseprop'));

      // Rough total income -- derived where modules have data, flagged as partial
      let roughTotal = 0;
      (profile.cgEquityRows||[]).forEach(r=>{ if(r.buyprice!=null && r.buyprice!=='') roughTotal += (r.sellprice - r.buyprice) * r.qty; });
      (profile.cgMFRows||[]).forEach(r=>{ roughTotal += (+r.gain||0); });
      (profile.properties||[]).forEach(pr=>{ roughTotal += (pr.rentRows||[]).reduce((s,rr)=>s+(+rr.amount||0),0) * 0.7; });
      w.totalIncomeAbove50L = roughTotal > 5000000;
      el.appendChild(makeDerivedRow('Running income total (partial)',
        `~₹${roughTotal.toLocaleString('en-IN',{maximumFractionDigits:0})} from modules filled in so far — doesn't include salary/other sources not yet entered. Treat as a floor, not a final number.`,
        true, 'income'));
    }
    function makeDerivedRow(label, detail, computed, tag){
      const row = document.createElement('div');
      row.className = 'checklist-item';
      row.innerHTML = `
        <div class="check-icon ${computed?'have':'missing'}">${computed?'✓':'○'}</div>
        <div class="check-body"><div class="doc-name">${label}</div><div class="doc-fallback">${detail}</div></div>
      `;
      return row;
    }
    renderDerived();

    // ---- Section 2: genuinely self-known facts, button choices only ----
    const askCard = document.createElement('div');
    askCard.className = 'card';
    askCard.innerHTML = `<h3>Only you know these</h3>`;
    container.appendChild(askCard);

    function choiceRow(label, key, options, syncFn){
      const wrap = document.createElement('div');
      wrap.style.marginBottom = '16px';
      wrap.innerHTML = `<div style="font-size:13px; margin-bottom:6px;">${label}</div><div style="display:flex; flex-wrap:wrap; gap:8px;" id="choices_${key}"></div>`;
      askCard.appendChild(wrap);
      const choicesEl = wrap.querySelector(`#choices_${key}`);
      function renderChoices(){
        choicesEl.innerHTML = '';
        options.forEach(opt=>{
          const btn = document.createElement('button');
          const selected = w[key] === opt.value;
          btn.className = 'btn small' + (selected ? '' : ' ghost');
          if(selected) btn.classList.add('primary');
          btn.textContent = opt.label;
          btn.onclick = ()=>{
            w[key] = opt.value;
            if(syncFn) syncFn(opt.value);
            recompute();
            save();
            renderChoices();
          };
          choicesEl.appendChild(btn);
        });
      }
      renderChoices();
    }

    choiceRow('Business or professional income? (includes F&O/intraday trading)', 'hasBusinessIncome', [
      {label:'Yes', value:true}, {label:'No', value:false}
    ], (val)=>{ profile.incomeSources.business = val; });

    if(w.hasBusinessIncome === true){
      choiceRow('Is this F&O / derivatives trading specifically?', 'fno', [
        {label:'Yes', value:true}, {label:'No', value:false}
      ]);
      choiceRow('Using a presumptive scheme (44AD/44ADA/44AE)?', 'presumptive', [
        {label:'Yes', value:true}, {label:'No', value:false}, {label:'Not sure', value:'unknown'}
      ]);
    }

    choiceRow('Partner in a partnership firm?', 'isPartner', [
      {label:'Yes', value:true}, {label:'No', value:false}
    ]);

    choiceRow('Company director, or hold unlisted equity shares?', 'isDirectorOrUnlisted', [
      {label:'Yes', value:true}, {label:'No', value:false}
    ]);

    choiceRow('Foreign income or foreign assets (bank a/c, shares abroad)?', 'hasForeignAssets', [
      {label:'Yes', value:true}, {label:'No', value:false}
    ], (val)=>{ profile.hasForeignAssets = val; });

    choiceRow('Agricultural income above ₹5,000?', 'hasAgriIncomeAbove5000', [
      {label:'Yes', value:true}, {label:'No', value:false}
    ]);

    const resultWrap = document.createElement('div');
    container.appendChild(resultWrap);

    function recompute(){
      renderDerived();
      if(!w.residency || w.hasBusinessIncome === undefined){
        resultWrap.innerHTML = `<div class="empty-state">Complete Residency and the business-income question above for a determination.</div>`;
        return;
      }
      const result = computeApplicableForm(w);
      w._result = result;
      resultWrap.innerHTML = `
        <div class="result-box">
          <div class="verdict">${result.form}</div>
          <div class="basis">
            ${result.reasons.map(r=>`<div style="margin-bottom:4px;">• ${r}</div>`).join('')}
          </div>
          ${result.caveats.length>0 ? `<div class="basis" style="border-top:1px solid var(--rust); margin-top:10px; padding-top:10px; color:var(--rust);">${result.caveats.map(c=>`<div style="margin-bottom:4px;">⚠ ${c}</div>`).join('')}</div>` : ''}
        </div>
      `;
    }
    recompute();
  }
};
registerModule(FormDeterminationModule);

/* =========================================================================
   MODULE: Prior Years (memory across filings)
   The single place multi-year continuity lives: past residency status
   (needed for the RNOR 10-year/4-year lookback -- previously just a text
   reminder, now actually computed from this data), carried-forward capital
   losses, and opening holdings acquired before this tool was in use (so
   FIFO on a future sale has a real cost basis instead of "unknown source").
   Every other module that needs history reads from here rather than
   re-asking or re-deriving it.
   ========================================================================= */
const PriorYearsModule = {
  id: 'prior_years',
  label: 'Prior Years',
  order: 0.5,
  ruleSet: {},
  isActive: () => true,
  hasStarted: (p) => Object.keys(p.priorYears||{}).length>0 || (p.openingHoldings||[]).length>0,
  isComplete: (p) => Object.keys(p.priorYears||{}).length>0,
  requiredDocs: () => ([
    {id:'prior_computation', name:'Last 2-3 years\' ITR computation / acknowledgement', note:'Gives residency status and any carried-forward losses without re-deriving them from scratch.'},
    {id:'prior_holdings', name:'Demat holding statement from before you started using this tool', note:'Only needed for stocks/funds bought long ago whose original cost you don\'t already have logged.'}
  ]),
  fallbackDocs: () => ({}),
  render(container, p, save){
    p.priorYears = p.priorYears || {};
    p.openingHoldings = p.openingHoldings || [];

    const header = document.createElement('div');
    header.className = 'panel-header';
    header.innerHTML = `
      <div class="eyebrow">Module 00.5 · Makes the tool remember, instead of starting blank every year</div>
      <h2>Prior Years</h2>
      <p class="desc">This feeds two things automatically: the RNOR residency test (needs your status for the last 10 years) and future capital gains FIFO (needs the original cost of anything you already held before you started using this tool). Fill in what you can — partial data still helps.</p>
    `;
    container.appendChild(header);

    // ---- Residency history ----
    const resCard = document.createElement('div');
    resCard.className = 'card';
    resCard.innerHTML = `
      <h3>Residency status by year</h3>
      <p class="helptext" style="margin-bottom:8px;">Paste from memory or old computations: <code>FY, Status(Resident/RNOR/NRI), DaysInIndia(optional), CarriedForwardLossST(optional), CarriedForwardLossLT(optional)</code></p>
      <textarea id="py_paste" rows="3" style="width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:8px; border-radius:4px; font-family:var(--mono); font-size:12px;" placeholder="2024-25, NRI, 140&#10;2023-24, NRI, 95, 0, 15000"></textarea>
      <button class="btn small" id="py_paste_btn" style="margin-top:8px;">Parse &amp; add</button>
      <div id="py_paste_feedback" class="helptext" style="margin:6px 0;"></div>
      <div id="py_rows"></div>
    `;
    container.appendChild(resCard);

    function renderPYRows(){
      const el = resCard.querySelector('#py_rows');
      const fys = Object.keys(p.priorYears).sort().reverse();
      if(fys.length===0){
        el.innerHTML = `<div class="helptext" style="padding:8px 0;">No prior years recorded yet.</div>`;
        return;
      }
      const table = document.createElement('table');
      table.className = 'day-table';
      table.innerHTML = `<tr><th>FY</th><th>Status</th><th>Days in India</th><th>CF Loss ST</th><th>CF Loss LT</th><th></th></tr>`;
      fys.forEach(fy=>{
        const r = p.priorYears[fy];
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${fy}</td><td>${r.residencyStatus||'—'}</td><td>${r.daysInIndia??'—'}</td><td>₹${(r.carriedForwardLossST||0).toLocaleString('en-IN')}</td><td>₹${(r.carriedForwardLossLT||0).toLocaleString('en-IN')}</td><td><button class="btn small ghost" data-rm-py="${fy}">✕</button></td>`;
        table.appendChild(tr);
      });
      el.innerHTML = '';
      el.appendChild(table);
      el.querySelectorAll('[data-rm-py]').forEach(btn=>{
        btn.onclick = (e)=>{ delete p.priorYears[e.target.dataset.rmPy]; save(); renderPYRows(); };
      });
    }
    renderPYRows();

    resCard.querySelector('#py_paste_btn').onclick = ()=>{
      const raw = resCard.querySelector('#py_paste').value;
      const rows = parsePastedRows(raw);
      let added = 0, skipped = 0;
      rows.forEach(cols=>{
        if(cols.length < 2){ skipped++; return; }
        const [fy, status, days, cfST, cfLT] = cols;
        if(!fy || !status){ skipped++; return; }
        if((days && +days < 0) || (cfST && +cfST < 0) || (cfLT && +cfLT < 0)){ skipped++; return; }
        p.priorYears[fy.trim()] = {
          residencyStatus: status.trim(),
          daysInIndia: days ? +days : null,
          carriedForwardLossST: cfST ? +cfST : 0,
          carriedForwardLossLT: cfLT ? +cfLT : 0,
        };
        added++;
      });
      save();
      renderPYRows();
      resCard.querySelector('#py_paste_feedback').textContent = `Added/updated ${added} year(s)${skipped>0?`, skipped ${skipped}`:''}.`;
      if(added>0) resCard.querySelector('#py_paste').value = '';
    };

    // ---- Opening holdings ----
    const holdCard = document.createElement('div');
    holdCard.className = 'card';
    holdCard.innerHTML = `
      <h3>Opening holdings (bought before you started using this tool)</h3>
      <p class="helptext" style="margin-bottom:8px;">One per line: <code>Stock, Qty, BuyDate, BuyPrice, Notes(optional)</code></p>
      <textarea id="oh_paste" rows="3" style="width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:8px; border-radius:4px; font-family:var(--mono); font-size:12px;" placeholder="Infosys, 50, 15/06/2019, 720"></textarea>
      <button class="btn small" id="oh_paste_btn" style="margin-top:8px;">Parse &amp; add</button>
      <div id="oh_paste_feedback" class="helptext" style="margin:6px 0;"></div>
      <div id="oh_rows"></div>
    `;
    container.appendChild(holdCard);

    function renderOHRows(){
      const el = holdCard.querySelector('#oh_rows');
      if(p.openingHoldings.length===0){
        el.innerHTML = `<div class="helptext" style="padding:8px 0;">No opening holdings recorded yet.</div>`;
        return;
      }
      const table = document.createElement('table');
      table.className = 'day-table';
      table.innerHTML = `<tr><th>Stock</th><th>Qty</th><th>Buy Date</th><th>Buy Price</th><th></th></tr>`;
      p.openingHoldings.forEach((h, idx)=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${h.stock}</td><td>${h.qty}</td><td>${h.buydate}</td><td>₹${h.buyprice}</td><td><button class="btn small ghost" data-rm-oh="${idx}">✕</button></td>`;
        table.appendChild(tr);
      });
      el.innerHTML = '';
      el.appendChild(table);
      el.querySelectorAll('[data-rm-oh]').forEach(btn=>{
        btn.onclick = (e)=>{ p.openingHoldings.splice(+e.target.dataset.rmOh,1); save(); renderOHRows(); };
      });
    }
    renderOHRows();

    holdCard.querySelector('#oh_paste_btn').onclick = ()=>{
      const raw = holdCard.querySelector('#oh_paste').value;
      const rows = parsePastedRows(raw);
      let added = 0, skipped = 0;
      rows.forEach(cols=>{
        if(cols.length < 4){ skipped++; return; }
        const [stock, qty, buydateRaw, buyprice, notes] = cols;
        const buydate = parseFlexDate(buydateRaw);
        if(!stock || !qty || !buydate || buyprice===''){ skipped++; return; }
        if(+qty <= 0 || +buyprice < 0 || buydate.startsWith('INVALID:')){ skipped++; return; }
        p.openingHoldings.push({stock, qty:+qty, buydate, buyprice:+buyprice, notes: notes||''});
        added++;
      });
      save();
      renderOHRows();
      holdCard.querySelector('#oh_paste_feedback').textContent = `Added ${added} holding(s)${skipped>0?`, skipped ${skipped}`:''}.`;
      if(added>0) holdCard.querySelector('#oh_paste').value = '';
    };
  }
};

const ResidencyModule = {

  ]),

function daysBetween(d1, d2){
  const a = new Date(d1), b = new Date(d2);
  return Math.round((b-a)/(1000*60*60*24)) + 1; // inclusive of both end dates -- for TRAVEL/PRESENCE counting only
}

// Holding period for capital gains classification -- deliberately NOT the same as daysBetween().
// Sec 2(42A) requires the asset be held for MORE than 365 days to qualify long-term. This must be
// a raw calendar difference (no +1): a purchase on 13-Mar-2025 sold on 13-Mar-2026 is exactly one
// year later -- 365 days elapsed, which is NOT "more than 365" and must classify as short-term.
// Reusing the inclusive daysBetween() here previously caused exactly this boundary case to be
// misclassified as long-term -- caught by testing against a known real transaction, fixed here.
function holdingPeriodDays(d1, d2){
  const a = new Date(d1), b = new Date(d2);
  return Math.round((b-a)/(1000*60*60*24));
}

/* ---- Shared paste-import helpers: cuts down on-mobile typing across
   modules. User copies rows straight from Excel/Sheets/Notes (tab-
   separated) or types comma-separated -- either works. ---- */
function parsePastedRows(text){
  return text.split('\n').map(l=>l.trim()).filter(l=>l.length>0)
    .map(line=>{
      const sep = line.includes('\t') ? '\t' : ',';
      return line.split(sep).map(c=>c.trim());
    });
}
function parseFlexDate(s){
  if(!s) return '';
  s = s.trim();
  // Already ISO
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)){
    return isValidCalendarDate(s) ? s : s; // ISO input trusted as-is; validity checked below for slash formats
  }
  // DD/MM/YYYY, DD-MM-YYYY, or MM/DD/YYYY (US format, e.g. from Vested/US broker exports)
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m){
    let a = +m[1], b = +m[2], year = m[3];
    // If the first segment can't be a valid month (>12), it must be DD/MM. If the second
    // segment can't be a valid month (>12), it must be MM/DD (US format) -- unambiguous either
    // way. Only genuinely ambiguous when both segments are <=12, where DD/MM (Indian
    // convention) is assumed as the default -- this is a real, unavoidable limitation when the
    // source format isn't known, worth keeping in mind for US-sourced pastes (e.g. Vested).
    let day, month;
    if(a > 12 && b <= 12){ day = a; month = b; }
    else if(b > 12 && a <= 12){ day = b; month = a; } // MM/DD/YYYY input
    else { day = a; month = b; } // ambiguous -- default to DD/MM
    const iso = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    return isValidCalendarDate(iso) ? iso : `INVALID:${s}`;
  }
  return s; // leave as-is, will show as invalid date in the UI if unparseable
}
function isValidCalendarDate(iso){
  const [y,mo,d] = iso.split('-').map(Number);
  const dt = new Date(y, mo-1, d);
  return dt.getFullYear()===y && dt.getMonth()===mo-1 && dt.getDate()===d;
}

function computeResidency(p){
  const rules = ResidencyModule.ruleSet;
  let totalDaysAbroad = 0;
  p.travelLog.forEach(row=>{
    if(row.depart && row.arrive){
      totalDaysAbroad += daysBetween(row.depart, row.arrive);
    }
  });
  // days in India in the FY = 365 (approx, not adjusting leap year here) - days abroad
  const daysInIndia = Math.max(0, 365 - totalDaysAbroad);

  const secondaryThreshold = (p.citizenship==='Indian' && p.employmentAbroad)
    ? rules.citizenLeavingForEmploymentThreshold
    : rules.standardSecondaryThreshold;

  let status, basisLines = [];
  basisLines.push(`Days in India this FY (computed): <code>${daysInIndia}</code>`);
  basisLines.push(`Applicable secondary threshold: <code>${secondaryThreshold} days</code> (${p.citizenship==='Indian'&&p.employmentAbroad ? 'seafarer/citizen-leaving-for-employment exception applied' : 'standard test'})`);

  if(daysInIndia >= rules.standardDayThreshold){
    status = 'Resident';
  } else if (daysInIndia >= secondaryThreshold) {
    status = 'Resident (via secondary test)';
  } else {
    status = 'Non-Resident (NRI)';
  }

  basisLines.push(`Primary test: 182+ days in India → ${daysInIndia >= rules.standardDayThreshold ? 'MET' : 'not met'}`);
  basisLines.push(`Secondary test: ${secondaryThreshold}+ days in India (with 4-year lookback ≥365 days, not yet captured here) → ${daysInIndia >= secondaryThreshold ? 'MET' : 'not met'}`);

  let rnorNote = null;
  let rnorResult = null;
  if(status.startsWith('Resident')){
    const priorYears = p.priorYears || {};
    const fyKeys = Object.keys(priorYears).sort().reverse(); // most recent first
    if(fyKeys.length === 0){
      rnorNote = 'You may qualify as RNOR (taxed like NRI on foreign income) if you were Non-Resident in 9 of the last 10 FYs, or present in India ≤729 days over the last 4 FYs — but no prior-year data is on file yet. Fill in the Prior Years module to get an actual answer instead of this generic reminder.';
    } else {
      const last10 = fyKeys.slice(0, 10);
      const nonResidentCount = last10.filter(fy => !/^resident$/i.test((priorYears[fy].residencyStatus||'').trim())).length;
      const last4 = fyKeys.slice(0, 4);
      const daysLast4 = last4.reduce((s,fy)=> s + (priorYears[fy].daysInIndia || 0), 0) + daysInIndia;
      const has4YearData = last4.length >= 4;
      // Full 10-year window known, OR already found 2+ non-resident years (enough to conclusively
      // pass test1 regardless of how many more years are on file) -- otherwise the window is too
      // incomplete to rule the test OUT, only to rule it in.
      const has10YearData = last10.length >= 10;

      const test1Met = nonResidentCount >= 2;
      const test2Met = has4YearData && daysLast4 <= 729;

      if(test1Met || test2Met){
        rnorResult = 'RNOR';
        rnorNote = `Qualifies as RNOR: ${test1Met ? `Non-Resident in ${nonResidentCount} of the last ${last10.length} FY(s) on file (needs ≥2)` : `${daysLast4} days in India over the last 4 FYs + this one (needs ≤729)`}. RNOR income is taxed like NRI — foreign income generally stays exempt, with the usual exception for foreign income derived from an Indian business/profession.`;
      } else if(!has10YearData && !has4YearData){
        rnorResult = 'Insufficient data';
        rnorNote = `Can't be determined yet — only ${last10.length} of the last 10 years' residency history is on file (need either 2+ Non-Resident years among the full 10, or the full 4-year day count). The ${nonResidentCount} Non-Resident year(s) recorded so far don't rule RNOR in OR out — add more years to the Prior Years module for a real answer, rather than trusting a "does not qualify" verdict built on an incomplete window.`;
      } else {
        rnorResult = 'Ordinarily Resident';
        rnorNote = `Does not qualify as RNOR based on data on file: only ${nonResidentCount} Non-Resident year(s) in the last ${last10.length} on record (needs ≥2), and ${has4YearData ? daysLast4 + ' days in India over the last 4 FYs (needs ≤729)' : 'incomplete 4-year day data'}. Worldwide income is taxable as an Ordinarily Resident.`;
      }
    }
  }

  return {
    daysInIndia, totalDaysAbroad, status, basisLines, rnorNote, rnorResult,
    computedAt: new Date().toISOString()
  };
}

function renderResidencyResult(container, result){
  container.innerHTML = `
    <div class="result-box">
      <div class="verdict">${result.status}</div>
      <div class="verdict-detail">Based on ${result.daysInIndia} days in India during the financial year (from travel log entries).</div>
      ${result.rnorNote ? `<div class="verdict-detail" style="color:var(--gold);">⚠ ${result.rnorNote}</div>` : ''}
      <div class="basis">
        ${result.basisLines.map(l=>`<div style="margin-bottom:4px;">• ${l}</div>`).join('')}
      </div>
    </div>
  `;
}
