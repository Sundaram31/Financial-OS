/* =========================================================================
   MODULE: Schedule S — Salary
   Handles multiple employers correctly: standard deduction (Rs 50,000) is
   a single flat amount against TOTAL salary across all employers, not
   Rs 50,000 per employer — a common error when someone changed jobs
   mid-year.
   ========================================================================= */
const SalaryModule = {
  id: 'salary_income',
  label: 'Salary (Schedule S)',
  order: 1.5,
  ruleSet: { standardDeduction: 50000 },
  isActive: () => true,
  hasStarted: (p) => (p.salaryIncome && p.salaryIncome.employers && p.salaryIncome.employers.length>0),
  isComplete: (p) => (p.salaryIncome && p.salaryIncome.employers && p.salaryIncome.employers.length>0),
  requiredDocs: () => ([
    {id:'form16', name:'Form 16 from each employer this FY', note:'Part A (TDS) and Part B (salary breakup + exemptions).'},
    {id:'form12ba', name:'Form 12BA, if perquisites were provided', note:'Company car, accommodation, ESOPs, etc.'}
  ]),
  fallbackDocs: () => ({
    'form16': ['Monthly payslips totalled manually, cross-checked against bank credits and AIS TDS-192 entries']
  }),
  render(container, p, save){
    p.salaryIncome = p.salaryIncome || {employers:[], foreignExempt:false, exemptNote:''};
    const si = p.salaryIncome;

    const header = document.createElement('div');
    header.className = 'panel-header';
    header.innerHTML = `
      <div class="eyebrow">Module 01.5 · Standard deduction applies once, not per employer</div>
      <h2>Salary (Schedule S)</h2>
      <p class="desc">If your salary is foreign-sourced and exempt (e.g. seafarer NRE income under NRI status), mark that below instead of entering employer rows — it still needs disclosure as exempt income, just not taxed.</p>
    `;
    container.appendChild(header);

    const exemptCard = document.createElement('div');
    exemptCard.className = 'card';
    exemptCard.innerHTML = `
      <h3>Is your salary foreign-sourced and exempt?</h3>
      <div style="display:flex; gap:8px;" id="sal_exempt_choices"></div>
      <div id="sal_exempt_detail" style="margin-top:10px;"></div>
    `;
    container.appendChild(exemptCard);
    function renderExemptChoices(){
      const el = exemptCard.querySelector('#sal_exempt_choices');
      el.innerHTML = '';
      [[true,'Yes — exempt'],[false,'No — taxable in India']].forEach(([val,label])=>{
        const btn = document.createElement('button');
        const selected = si.foreignExempt === val;
        btn.className = 'btn small' + (selected?' primary':' ghost');
        btn.textContent = label;
        btn.onclick = ()=>{ si.foreignExempt = val; save(); renderExemptChoices(); renderExemptDetail(); };
        el.appendChild(btn);
      });
    }
    function renderExemptDetail(){
      const el = exemptCard.querySelector('#sal_exempt_detail');
      if(si.foreignExempt){
        el.innerHTML = `
          <div class="field-row">
            <div class="field"><label>Gross exempt salary (₹) — for disclosure in Schedule EI, not taxed</label><input id="sal_exempt_amt" type="number" value="${si.exemptAmount||''}"></div>
          </div>
          <p class="helptext">Still needs to be disclosed as exempt income even though it's not taxed — omitting it entirely from the return can itself look like unexplained funds when large bank credits show up.</p>
        `;
        el.querySelector('#sal_exempt_amt').onchange = (e)=>{ si.exemptAmount = e.target.value; save(); };
      } else {
        el.innerHTML = '';
      }
    }
    renderExemptChoices();
    renderExemptDetail();

    if(!si.foreignExempt){
      const addCard = document.createElement('div');
      addCard.className = 'card';
      addCard.innerHTML = `
        <h3>Employer(s) this FY</h3>
        <p class="helptext" style="margin-bottom:8px;">Paste one per line: <code>Employer, GrossSalary, ExemptAllowances, ProfessionalTax</code></p>
        <textarea id="sal_paste" rows="3" style="width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:8px; border-radius:4px; font-family:var(--mono); font-size:12px;" placeholder="Acme Corp, 1200000, 50000, 2400"></textarea>
        <button class="btn small" id="sal_paste_btn" style="margin-top:8px;">Parse &amp; add</button>
        <div id="sal_feedback" class="helptext" style="margin:6px 0;"></div>
        <div id="sal_rows"></div>
      `;
      container.appendChild(addCard);

      const resultWrap = document.createElement('div');
      container.appendChild(resultWrap);

      function renderRows(){
        const el = addCard.querySelector('#sal_rows');
        if(si.employers.length===0){
          el.innerHTML = `<div class="helptext" style="padding:8px 0;">No employers added yet.</div>`;
        } else {
          const table = document.createElement('table');
          table.className = 'day-table';
          table.innerHTML = `<tr><th>Employer</th><th>Gross</th><th>Exempt Allow.</th><th>Prof. Tax</th><th></th></tr>`;
          si.employers.forEach((e,idx)=>{
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${e.name}</td><td>₹${(+e.gross).toLocaleString('en-IN')}</td><td>₹${(+e.exempt||0).toLocaleString('en-IN')}</td><td>₹${(+e.profTax||0).toLocaleString('en-IN')}</td><td><button class="btn small ghost" data-rm-sal="${idx}">✕</button></td>`;
            table.appendChild(tr);
          });
          el.innerHTML = '';
          el.appendChild(table);
          el.querySelectorAll('[data-rm-sal]').forEach(btn=>{
            btn.onclick = (ev)=>{ si.employers.splice(+ev.target.dataset.rmSal,1); save(); renderRows(); renderSummary(); };
          });
        }
      }
      function renderSummary(){
        const totalGross = si.employers.reduce((s,e)=>s+(+e.gross||0),0);
        const totalExemptAllow = si.employers.reduce((s,e)=>s+(+e.exempt||0),0);
        const totalProfTax = si.employers.reduce((s,e)=>s+(+e.profTax||0),0);
        const rules = SalaryModule.ruleSet;
        const taxableSalary = Math.max(0, totalGross - totalExemptAllow - rules.standardDeduction - totalProfTax);
        resultWrap.innerHTML = si.employers.length>0 ? `
          <div class="result-box">
            <div class="verdict">Taxable salary: ₹${taxableSalary.toLocaleString('en-IN')}</div>
            <div class="basis">
              <div>Total gross across ${si.employers.length} employer(s): ₹${totalGross.toLocaleString('en-IN')}</div>
              <div>Less exempt allowances: ₹${totalExemptAllow.toLocaleString('en-IN')}</div>
              <div>Less standard deduction (₹${rules.standardDeduction.toLocaleString('en-IN')} — once, not per employer): ₹${rules.standardDeduction.toLocaleString('en-IN')}</div>
              <div>Less professional tax: ₹${totalProfTax.toLocaleString('en-IN')}</div>
            </div>
          </div>` : '';
      }
      renderRows();
      renderSummary();

      addCard.querySelector('#sal_paste_btn').onclick = ()=>{
        const raw = addCard.querySelector('#sal_paste').value;
        const rows = parsePastedRows(raw);
        let added=0, skipped=0;
        rows.forEach(cols=>{
          if(cols.length<2){ skipped++; return; }
          const [name, gross, exempt, profTax] = cols;
          if(!name || gross===''||isNaN(+gross)){ skipped++; return; }
          if(+gross < 0 || (exempt && +exempt < 0) || (profTax && +profTax < 0)){ skipped++; return; }
          si.employers.push({name, gross:+gross, exempt: exempt?+exempt:0, profTax: profTax?+profTax:0});
          added++;
        });
        save(); renderRows(); renderSummary();
        addCard.querySelector('#sal_feedback').textContent = `Added ${added} employer(s)${skipped>0?`, skipped ${skipped}`:''}.`;
        if(added>0) addCard.querySelector('#sal_paste').value='';
      };
    }
  }
};
registerModule(SalaryModule);

/* =========================================================================
   MODULE: HRA Exemption (Section 10(13A))
   Old-regime only -- new regime gives zero HRA exemption, verified before
   building. Metro list for THIS filing year is specifically Delhi, Mumbai,
   Kolkata, Chennai only -- Bengaluru/Pune/Hyderabad/Ahmedabad don't join
   the 50% rate until next FY, an easy thing to get wrong by using a
   current article's city list instead of this year's. Computed
   month-by-month since rent/HRA/city can change mid-year.
   ========================================================================= */
const HRAModule = {
  id: 'hra_exemption',
  label: 'HRA Exemption',
  order: 1.7,
  ruleSet: { metroRate: 0.50, nonMetroRate: 0.40, salaryPortion: 0.10,
    metroCities: ['delhi','mumbai','kolkata','chennai'], panThreshold: 100000 },
  isActive: () => true,
  hasStarted: (p) => (p.hraRows||[]).length > 0,
  isComplete: (p) => (p.hraRows||[]).length > 0,
  requiredDocs: () => ([
    {id:'rent_receipts', name:'Rent receipts / rent agreement', note:''},
    {id:'landlord_pan', name:'Landlord\'s PAN', note:'Mandatory if annual rent exceeds ₹1,00,000.'},
  ]),
  fallbackDocs: () => ({}),
  render(container, p, save){
    p.hraRows = p.hraRows || [];

    const header = document.createElement('div');
    header.className = 'panel-header';
    header.innerHTML = `
      <div class="eyebrow">Module 01.7 · Old regime only — new regime gives zero HRA exemption</div>
      <h2>HRA Exemption (Sec 10(13A))</h2>
      <p class="desc">Exempt amount each month is the LEAST of: actual HRA received, rent paid minus 10% of salary (Basic+DA), or 50%/40% of salary for metro/non-metro. Metro rate (50%) applies only to Delhi, Mumbai, Kolkata, Chennai this filing year — other cities, including Bengaluru/Hyderabad/Pune, are 40% until next FY.</p>
    `;
    container.appendChild(header);

    const regime = p.deductions && p.deductions.regime;
    if(regime === 'new'){
      const warn = document.createElement('div');
      warn.className = 'card';
      warn.style.borderColor = 'var(--rust);';
      warn.innerHTML = `<h3 style="color:var(--rust);">Not usable — new regime selected</h3><p class="helptext">HRA exemption under Sec 10(13A) is only available under the old regime. With new regime selected in the Deductions module, your entire HRA is taxable — this module's computation below is for comparison only, not something you can actually claim this year.</p>`;
      container.appendChild(warn);
    } else if(!regime){
      const note = document.createElement('div');
      note.className = 'card';
      note.style.borderColor = 'var(--gold-dim);';
      note.innerHTML = `<p class="helptext">Pick a regime in the Deductions module first — this only matters if you're on the old regime.</p>`;
      container.appendChild(note);
    }

    const addCard = document.createElement('div');
    addCard.className = 'card';
    addCard.innerHTML = `
      <h3>Monthly figures</h3>
      <p class="helptext" style="margin-bottom:8px;">One per line: <code>Month, Basic+DA, HRA received, Rent paid, City(metro/nonmetro)</code></p>
      <textarea id="hra_paste" rows="3" style="width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:8px; border-radius:4px; font-family:var(--mono); font-size:12px;" placeholder="Apr-2025, 55000, 25000, 22000, metro&#10;May-2025, 55000, 25000, 22000, metro"></textarea>
      <button class="btn small" id="hra_paste_btn" style="margin-top:8px;">Parse &amp; add</button>
      <div id="hra_feedback" class="helptext" style="margin:6px 0;"></div>
      <div id="hra_rows"></div>
    `;
    container.appendChild(addCard);

    const resultWrap = document.createElement('div');
    container.appendChild(resultWrap);

    function computeExempt(row){
      const rules = HRAModule.ruleSet;
      const rate = row.city==='metro' ? rules.metroRate : rules.nonMetroRate;
      const legB = row.rent - rules.salaryPortion*row.basicDA;
      const legC = rate * row.basicDA;
      return Math.max(0, Math.min(row.hra, Math.max(0,legB), legC));
    }

    function renderRows(){
      const el = addCard.querySelector('#hra_rows');
      if(p.hraRows.length===0){
        el.innerHTML = `<div class="helptext" style="padding:8px 0;">No months added yet.</div>`;
        return;
      }
      const table = document.createElement('table');
      table.className = 'day-table';
      table.innerHTML = `<tr><th>Month</th><th>Exempt</th><th></th></tr>`;
      p.hraRows.forEach((r,idx)=>{
        const exempt = computeExempt(r);
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${r.month}</td><td>₹${exempt.toLocaleString('en-IN',{maximumFractionDigits:0})}</td><td><button class="btn small ghost" data-rm-hra="${idx}">✕</button></td>`;
        table.appendChild(tr);
      });
      el.innerHTML = '';
      el.appendChild(table);
      el.querySelectorAll('[data-rm-hra]').forEach(btn=>{
        btn.onclick = (e)=>{ p.hraRows.splice(+e.target.dataset.rmHra,1); save(); renderRows(); renderSummary(); };
      });
    }
    function renderSummary(){
      const totalExempt = p.hraRows.reduce((s,r)=>s+computeExempt(r),0);
      const totalRent = p.hraRows.reduce((s,r)=>s+(+r.rent||0),0);
      const totalHRA = p.hraRows.reduce((s,r)=>s+(+r.hra||0),0);
      resultWrap.innerHTML = p.hraRows.length===0 ? '' : `
        <div class="result-box">
          <div class="verdict">Total exempt: ₹${totalExempt.toLocaleString('en-IN',{maximumFractionDigits:0})} of ₹${totalHRA.toLocaleString('en-IN',{maximumFractionDigits:0})} HRA received</div>
          <div class="basis">
            <div>Taxable HRA (goes into Salary module's gross, not exempt allowances): ₹${(totalHRA-totalExempt).toLocaleString('en-IN',{maximumFractionDigits:0})}</div>
            ${totalRent > HRAModule.ruleSet.panThreshold ? `<div style="color:var(--gold); margin-top:6px;">⚠ Total rent ₹${totalRent.toLocaleString('en-IN')} exceeds ₹1,00,000/year — landlord's PAN is mandatory for this claim.</div>` : ''}
            <div style="margin-top:6px;">Add ₹${totalExempt.toLocaleString('en-IN',{maximumFractionDigits:0})} to the relevant employer's "Exempt allowances" field in the Salary module.</div>
          </div>
        </div>
      `;
    }
    renderRows();
    renderSummary();

    addCard.querySelector('#hra_paste_btn').onclick = ()=>{
      const raw = addCard.querySelector('#hra_paste').value;
      const rows = parsePastedRows(raw);
      let added=0, skipped=0;
      rows.forEach(cols=>{
        if(cols.length<5){ skipped++; return; }
        const [month, basicDA, hra, rent, city] = cols;
        if(!month || isNaN(+basicDA) || isNaN(+hra) || isNaN(+rent)){ skipped++; return; }
        if(+basicDA<0 || +hra<0 || +rent<0){ skipped++; return; }
        const cityNorm = /metro/i.test(city) && !/non/i.test(city) ? 'metro' : 'nonmetro';
        p.hraRows.push({month, basicDA:+basicDA, hra:+hra, rent:+rent, city:cityNorm});
        added++;
      });
      save(); renderRows(); renderSummary();
      addCard.querySelector('#hra_feedback').textContent = `Added ${added} month(s)${skipped>0?`, skipped ${skipped}`:''}.`;
      if(added>0) addCard.querySelector('#hra_paste').value='';
    };
  }
};
registerModule(HRAModule);

/* =========================================================================
   MODULE: Clubbing of Income (Schedule SPI, Sec 64 / 10(32))
   Two separate mechanisms, verified before building: minor child income
   (Sec 64(1A)) clubs with whichever parent has higher income excluding
   the minor's, with a Rs 1,500-per-child exemption under Sec 10(32) --
   but income from the child's own skill/talent/manual work, or from a
   child with a Sec 80U disability, is excluded entirely, not just
   exempted. Spousal asset-transfer income (Sec 64(1)(iv)) has no
   threshold -- fully clubbed with the transferor, no exemption.
   ========================================================================= */
const ClubbingModule = {
  id: 'clubbing_spi',
  label: 'Clubbing of Income (Schedule SPI)',
  order: 3.4,
  ruleSet: { minorExemptionPerChild: 1500 },
  isActive: () => true,
  hasStarted: (p) => (p.clubbingMinor||[]).length>0 || (p.clubbingSpouse||[]).length>0,
  isComplete: (p) => (p.clubbingMinor||[]).length>0 || (p.clubbingSpouse||[]).length>0,
  requiredDocs: () => ([
    {id:'minor_income_proof', name:'Interest certificates / statements for investments in a minor child\'s name', note:''},
    {id:'transfer_deed', name:'Gift deed or transfer record, for assets transferred to spouse', note:'Needed to establish "without adequate consideration" — the trigger for clubbing.'}
  ]),
  fallbackDocs: () => ({}),
  render(container, p, save){
    p.clubbingMinor = p.clubbingMinor || [];
    p.clubbingSpouse = p.clubbingSpouse || [];

    const header = document.createElement('div');
    header.className = 'panel-header';
    header.innerHTML = `
      <div class="eyebrow">Module 03.4 · Two different mechanisms, verified rules for each</div>
      <h2>Clubbing of Income (Schedule SPI)</h2>
      <p class="desc">Only applies if you've put investments in a minor child's name, or transferred an income-generating asset to your spouse without adequate consideration. If neither applies to you, skip this module entirely.</p>
    `;
    container.appendChild(header);

    // ---- Minor children ----
    const minorCard = document.createElement('div');
    minorCard.className = 'card';
    minorCard.innerHTML = `
      <h3>Minor child investment income</h3>
      <p class="helptext" style="margin-bottom:8px;">One per line: <code>ChildName, IncomeType(investment/skill/disabled), Amount</code>. "Skill" (manual work, talent, specialised knowledge) and "disabled" (Sec 80U) are excluded entirely, not clubbed — logged here just so nothing gets missed by accident, not added to your tax.</p>
      <textarea id="cl_minor_paste" rows="2" style="width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:8px; border-radius:4px; font-family:var(--mono); font-size:12px;" placeholder="Ananya, investment, 20000&#10;Aarav, skill, 50000"></textarea>
      <button class="btn small" id="cl_minor_btn" style="margin-top:8px;">Parse &amp; add</button>
      <div id="cl_minor_feedback" class="helptext" style="margin:6px 0;"></div>
      <div id="cl_minor_rows"></div>
    `;
    container.appendChild(minorCard);

    function renderMinorRows(){
      const el = minorCard.querySelector('#cl_minor_rows');
      if(p.clubbingMinor.length===0){
        el.innerHTML = `<div class="helptext" style="padding:8px 0;">None added yet.</div>`;
        return;
      }
      // Group by child for per-child exemption
      const byChild = {};
      p.clubbingMinor.forEach(r=>{ byChild[r.name] = byChild[r.name] || []; byChild[r.name].push(r); });
      const table = document.createElement('table');
      table.className = 'day-table';
      table.innerHTML = `<tr><th>Child</th><th>Type</th><th>Amount</th><th></th></tr>`;
      p.clubbingMinor.forEach((r,idx)=>{
        const tr = document.createElement('tr');
        const excluded = r.type!=='investment';
        tr.innerHTML = `<td>${r.name}</td><td>${r.type}${excluded?' <span class="tag gold">not clubbed</span>':''}</td><td>₹${(+r.amount).toLocaleString('en-IN')}</td><td><button class="btn small ghost" data-rm-minor="${idx}">✕</button></td>`;
        table.appendChild(tr);
      });
      el.innerHTML = '';
      el.appendChild(table);
      el.querySelectorAll('[data-rm-minor]').forEach(btn=>{
        btn.onclick = (e)=>{ p.clubbingMinor.splice(+e.target.dataset.rmMinor,1); save(); renderMinorRows(); renderSummary(); };
      });
    }

    // ---- Spouse ----
    const spouseCard = document.createElement('div');
    spouseCard.className = 'card';
    spouseCard.innerHTML = `
      <h3>Asset transferred to spouse (without adequate consideration)</h3>
      <p class="helptext" style="margin-bottom:8px;">One per line: <code>Description, IncomeGenerated</code>. Doesn't apply to assets transferred as part of a divorce settlement, or before marriage.</p>
      <textarea id="cl_spouse_paste" rows="2" style="width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:8px; border-radius:4px; font-family:var(--mono); font-size:12px;" placeholder="FD gifted to spouse, 45000"></textarea>
      <button class="btn small" id="cl_spouse_btn" style="margin-top:8px;">Parse &amp; add</button>
      <div id="cl_spouse_feedback" class="helptext" style="margin:6px 0;"></div>
      <div id="cl_spouse_rows"></div>
    `;
    container.appendChild(spouseCard);

    function renderSpouseRows(){
      const el = spouseCard.querySelector('#cl_spouse_rows');
      if(p.clubbingSpouse.length===0){
        el.innerHTML = `<div class="helptext" style="padding:8px 0;">None added yet.</div>`;
        return;
      }
      const table = document.createElement('table');
      table.className = 'day-table';
      table.innerHTML = `<tr><th>Description</th><th>Income</th><th></th></tr>`;
      p.clubbingSpouse.forEach((r,idx)=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${r.desc}</td><td>₹${(+r.amount).toLocaleString('en-IN')}</td><td><button class="btn small ghost" data-rm-spouse="${idx}">✕</button></td>`;
        table.appendChild(tr);
      });
      el.innerHTML = '';
      el.appendChild(table);
      el.querySelectorAll('[data-rm-spouse]').forEach(btn=>{
        btn.onclick = (e)=>{ p.clubbingSpouse.splice(+e.target.dataset.rmSpouse,1); save(); renderSpouseRows(); renderSummary(); };
      });
    }

    const resultWrap = document.createElement('div');
    container.appendChild(resultWrap);

    function renderSummary(){
      const rules = ClubbingModule.ruleSet;
      // Per-child exemption of Rs 1500 OR actual clubbable income, whichever is lower
      const byChild = {};
      p.clubbingMinor.filter(r=>r.type==='investment').forEach(r=>{
        byChild[r.name] = (byChild[r.name]||0) + (+r.amount||0);
      });
      let totalMinorClubbed = 0, totalMinorExemption = 0;
      Object.values(byChild).forEach(childTotal=>{
        const exemption = Math.min(rules.minorExemptionPerChild, childTotal);
        totalMinorExemption += exemption;
        totalMinorClubbed += Math.max(0, childTotal - exemption);
      });
      const totalSpouseClubbed = p.clubbingSpouse.reduce((s,r)=>s+(+r.amount||0),0);
      const grandTotal = totalMinorClubbed + totalSpouseClubbed;

      resultWrap.innerHTML = (p.clubbingMinor.length===0 && p.clubbingSpouse.length===0) ? '' : `
        <div class="result-box">
          <div class="verdict">Total to club into your income: ₹${grandTotal.toLocaleString('en-IN',{maximumFractionDigits:0})}</div>
          <div class="basis">
            <div>Minor children: ₹${totalMinorClubbed.toLocaleString('en-IN',{maximumFractionDigits:0})} (after ₹${totalMinorExemption.toLocaleString('en-IN')} in Sec 10(32) exemptions across ${Object.keys(byChild).length} child(ren))</div>
            <div>Spousal transfers: ₹${totalSpouseClubbed.toLocaleString('en-IN',{maximumFractionDigits:0})} (no exemption threshold)</div>
            <div style="margin-top:6px;">Minor's income clubs with whichever parent has the HIGHER income excluding the minor's own — not automatically the father. Add this total to the appropriate income head (usually Other Sources) for that parent.</div>
          </div>
        </div>
      `;
    }
    renderMinorRows();
    renderSpouseRows();
    renderSummary();

    minorCard.querySelector('#cl_minor_btn').onclick = ()=>{
      const raw = minorCard.querySelector('#cl_minor_paste').value;
      const rows = parsePastedRows(raw);
      let added=0, skipped=0;
      rows.forEach(cols=>{
        if(cols.length<3){ skipped++; return; }
        const [name, type, amount] = cols;
        const typeNorm = /skill/i.test(type) ? 'skill' : (/disab/i.test(type) ? 'disabled' : 'investment');
        if(!name || isNaN(+amount) || +amount<0){ skipped++; return; }
        p.clubbingMinor.push({name, type:typeNorm, amount:+amount});
        added++;
      });
      save(); renderMinorRows(); renderSummary();
      minorCard.querySelector('#cl_minor_feedback').textContent = `Added ${added}${skipped>0?`, skipped ${skipped}`:''}.`;
      if(added>0) minorCard.querySelector('#cl_minor_paste').value='';
    };

    spouseCard.querySelector('#cl_spouse_btn').onclick = ()=>{
      const raw = spouseCard.querySelector('#cl_spouse_paste').value;
      const rows = parsePastedRows(raw);
      let added=0, skipped=0;
      rows.forEach(cols=>{
        if(cols.length<2){ skipped++; return; }
        const [desc, amount] = cols;
        if(!desc || isNaN(+amount) || +amount<0){ skipped++; return; }
        p.clubbingSpouse.push({desc, amount:+amount});
        added++;
      });
      save(); renderSpouseRows(); renderSummary();
      spouseCard.querySelector('#cl_spouse_feedback').textContent = `Added ${added}${skipped>0?`, skipped ${skipped}`:''}.`;
      if(added>0) spouseCard.querySelector('#cl_spouse_paste').value='';
    };
  }
};
registerModule(ClubbingModule);

/* =========================================================================
   MODULE: Capital Gains — Equity (Domestic)
   Ingests raw transaction rows (paste from broker CG statement or contract
   notes — same shape either way). Runs its own FIFO, tags source for lots
   with missing cost (transfer/gift/bonus/split), and cross-checks against
   a broker-reported total if one is available (your reconciler pattern).
   ========================================================================= */
const CapitalGainsEquityModule = {
  id: 'cg_equity',
  label: 'Capital gains — Equity',
  order: 2,
  ruleSet: {
    ltcgHoldingDays: 365,
    ltcgExemptionPerFY: 125000,   // Section 112A, FY25-26 onwards
    grandfatherDate: '2018-01-31'
  },
  isActive: (p) => p.incomeSources.equityMF,
  hasStarted: (p) => (p.cgEquityRows && p.cgEquityRows.length>0),
  isComplete: (p) => (p.cgEquityRows && p.cgEquityRows.length>0 && p.cgEquityValidated),
  requiredDocs: () => ([
    {id:'cg_statement', name:'Broker capital gains statement (all brokers used in the FY)', note:'Gives pre-computed FIFO gains — fastest path if available and trustworthy.'},
    {id:'contract_notes', name:'Contract notes / transaction statement', note:'Buy & sell rows with date, qty, price — used to independently compute FIFO if the CG statement is missing or disputed.'},
    {id:'demat_statement', name:'Demat statement (CDSL/NSDL) covering the FY', note:'Needed to catch bonus/split/merger corporate actions and off-market transfers.'},
    {id:'transferor_cost_proof', name:'Original cost proof for transferred-in/gifted holdings', note:'Only needed for lots flagged "unknown source" below.'}
  ]),
  fallbackDocs: () => ({
    'cg_statement': ['Contract notes + demat statement (compute FIFO independently)'],
    'transferor_cost_proof': ['Transferor\'s original contract note', 'Gift deed + donor\'s cost (Sec 49(1) carryover)', 'FMV as on 31-Jan-2018 for pre-2018 holdings (grandfathering)']
  }),
  render(container, p, save){
    p.cgEquityRows = p.cgEquityRows || [];
    p.cgBrokerReportedTotal = p.cgBrokerReportedTotal || '';

    const header = document.createElement('div');
    header.className = 'panel-header';
    header.innerHTML = `
      <div class="eyebrow">Module 02 · FIFO engine, source-tagged</div>
      <h2>Capital gains — Equity</h2>
      <p class="desc">Add transaction rows (works whether they come from a broker's CG statement, raw contract notes, or a demat transfer). Rows missing a buy price are flagged so you can tag their source before the FIFO gain is trusted.</p>
    `;
    container.appendChild(header);

    const pasteCard = document.createElement('div');
    pasteCard.className = 'card';
    pasteCard.innerHTML = `
      <h3>Paste rows (fastest on mobile)</h3>
      <p class="helptext" style="margin-bottom:8px;">Copy rows straight from Excel/Sheets/your broker's PDF-to-text and paste below. One transaction per line: <code>Stock, Qty, BuyDate, BuyPrice, SellDate, SellPrice</code> — leave BuyDate/BuyPrice blank if unknown. Works with tabs (from Excel) or commas.</p>
      <textarea id="cg_paste_area" rows="4" style="width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:8px; border-radius:4px; font-family:var(--mono); font-size:12px;" placeholder="Muthoot Finance, 275, 21/07/2022, 105.14, 21/05/2025, 207.14"></textarea>
      <button class="btn small" id="cg_paste_btn" style="margin-top:8px;">Parse &amp; add rows</button>
      <div id="cg_paste_feedback" class="helptext" style="margin-top:6px;"></div>
    `;
    container.appendChild(pasteCard);

    const addCard = document.createElement('div');
    addCard.className = 'card';
    addCard.innerHTML = `
      <h3>Or add one row manually</h3>
      <div class="field-row">
        <div class="field"><label>Stock name</label><input id="cg_stock" type="text" placeholder="e.g. Muthoot Finance Ltd"></div>
        <div class="field"><label>Quantity</label><input id="cg_qty" type="number"></div>
        <div class="field"><label>Sell date</label><input id="cg_selldate" type="date"></div>
        <div class="field"><label>Sell price</label><input id="cg_sellprice" type="number" step="0.01"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Buy date</label><input id="cg_buydate" type="date"></div>
        <div class="field"><label>Buy price (leave blank if unknown)</label><input id="cg_buyprice" type="number" step="0.01"></div>
        <div class="field">
          <label>Source (only if buy price unknown)</label>
          <select id="cg_source">
            <option value="">—</option>
            <option value="transfer">Demat transfer (same owner)</option>
            <option value="gift">Gift from family</option>
            <option value="bonus">Bonus shares</option>
            <option value="split">Split/merger</option>
          </select>
        </div>
      </div>
      <button class="btn small" id="addCgRowBtn">+ Add row</button>
      <div class="divider"></div>
      <h3>Broker-reported total (optional, for cross-check)</h3>
      <div class="field-row">
        <div class="field"><label>Broker's stated total gain/loss (₹)</label><input id="cg_broker_total" type="number" step="0.01" value="${p.cgBrokerReportedTotal}"></div>
      </div>
    `;
    container.appendChild(addCard);

    const rowsCard = document.createElement('div');
    rowsCard.className = 'card';
    rowsCard.innerHTML = `<h3>Transaction rows</h3><div id="cgRowsTable"></div>`;
    container.appendChild(rowsCard);

    const resultWrap = document.createElement('div');
    container.appendChild(resultWrap);

    function renderRows(){
      const el = rowsCard.querySelector('#cgRowsTable');
      if(p.cgEquityRows.length===0){
        el.innerHTML = `<div class="helptext" style="padding:10px 0;">No rows yet.</div>`;
        return;
      }
      const table = document.createElement('table');
      table.className = 'day-table';
      table.innerHTML = `<tr><th>Stock</th><th>Qty</th><th>Buy</th><th>Sell</th><th>Term</th><th>Gain/Loss</th><th></th></tr>`;
      p.cgEquityRows.forEach((r, idx)=>{
        const calc = computeRowGain(r, CapitalGainsEquityModule.ruleSet);
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.stock} ${r.source ? `<span class="tag gold">${r.source}</span>` : (r.buyprice==null||r.buyprice==='' ? '<span class="tag rust">unknown cost</span>' : '')}</td>
          <td>${r.qty}</td>
          <td>${r.buydate||'—'} @ ${r.buyprice!==''&&r.buyprice!=null?r.buyprice:'?'}</td>

        `;
        table.appendChild(tr);
      });
      el.innerHTML = '';
      el.appendChild(table);
      el.querySelectorAll('[data-remove]').forEach(btn=>{
        btn.onclick = (e)=>{ p.cgEquityRows.splice(+e.target.dataset.remove,1); save(); renderRows(); renderSummary(); };
      });
    }

    function renderSummary(){
      const validRows = p.cgEquityRows.filter(r => r.buyprice!==''&&r.buyprice!=null);
      const flaggedRows = p.cgEquityRows.filter(r => r.buyprice===''||r.buyprice==null);
      const incompleteDateRows = validRows.filter(r => !r.buydate); // has cost but no buy date -- can't classify
      let stcg=0, ltcg=0;
      validRows.forEach(r=>{
        if(!r.buydate) return; // excluded -- can't classify without a buy date, not silently defaulted to ST
        const calc = computeRowGain(r, CapitalGainsEquityModule.ruleSet);
        if(calc.gain===null || calc.term===null) return;
        if(calc.term==='LongTerm') ltcg += calc.gain; else stcg += calc.gain;
      });
      const computedTotal = stcg + ltcg;
      const brokerTotal = parseFloat(p.cgBrokerReportedTotal);
      const hasBrokerTotal = !isNaN(brokerTotal) && p.cgBrokerReportedTotal !== '';
      const diff = hasBrokerTotal ? (computedTotal - brokerTotal) : null;
      const matches = hasBrokerTotal && Math.abs(diff) < 1;

      p.cgEquityValidated = flaggedRows.length===0 && incompleteDateRows.length===0 && (!hasBrokerTotal || matches);
      save();

      resultWrap.innerHTML = `
        <div class="result-box">
          <div class="verdict">STCG ₹${stcg.toFixed(2)} · LTCG ₹${ltcg.toFixed(2)}</div>
          <div class="verdict-detail">Computed independently from the rows above (FIFO, per-row).</div>
          ${flaggedRows.length>0 ? `<div class="verdict-detail" style="color:var(--rust);">⚠ ${flaggedRows.length} row(s) have unknown cost basis — tag their source and get the original cost before this total can be trusted.</div>` : ''}
          ${incompleteDateRows.length>0 ? `<div class="verdict-detail" style="color:var(--rust);">⚠ ${incompleteDateRows.length} row(s) have a cost but no buy date — excluded from the totals above (not guessed as short-term) until the buy date is added.</div>` : ''}
          ${hasBrokerTotal ? `
            <div class="basis">
              Broker-reported total: <code>₹${brokerTotal.toFixed(2)}</code> ·
              ${matches ? '<span class="tag green">MATCHES</span>' : `<span class="tag rust">MISMATCH — diff ₹${diff.toFixed(2)}</span>`}
            </div>` : ''}
          <div class="basis">LTCG exemption available: ₹1,25,000 per FY (Section 112A) — apply against LTCG above before computing tax.</div>
        </div>
      `;
    }

    addCard.querySelector('#addCgRowBtn').onclick = ()=>{
      const stock = addCard.querySelector('#cg_stock').value.trim();
      const qty = addCard.querySelector('#cg_qty').value;
      const selldate = addCard.querySelector('#cg_selldate').value;
      const sellprice = addCard.querySelector('#cg_sellprice').value;
      let buydate = addCard.querySelector('#cg_buydate').value;
      let buyprice = addCard.querySelector('#cg_buyprice').value;
      const source = addCard.querySelector('#cg_source').value;
      if(!stock || !qty || !selldate || !sellprice){ alert('Stock, quantity, sell date and sell price are required.'); return; }
      if(+qty <= 0){ alert('Quantity must be a positive number.'); return; }
      if(+sellprice < 0){ alert('Sell price can\'t be negative.'); return; }
      if(buyprice!=='' && +buyprice < 0){ alert('Buy price can\'t be negative.'); return; }
      if(new Date(selldate) < new Date(buydate || selldate)){ alert('Sell date is before the buy date — check the dates.'); return; }
      let autoFilled = false;
      if(buyprice===''){
        const match = (profile.openingHoldings||[]).find(h => h.stock.trim().toLowerCase() === stock.toLowerCase());
        if(match){
          buydate = buydate || match.buydate;
          buyprice = match.buyprice;
          autoFilled = true;
        }
      }
      if(buyprice!=='' && !buydate){
        alert('You entered a buy price without a buy date — add the buy date too, or leave both blank to flag this as an unknown-cost row for source-tagging.');
        return;
      }
      p.cgEquityRows.push({stock, qty:+qty, selldate, sellprice:+sellprice, buydate, buyprice: buyprice===''?null:+buyprice, source: buyprice===''?source:''});
      save();
      renderRows(); renderSummary();
      ['cg_stock','cg_qty','cg_selldate','cg_sellprice','cg_buydate','cg_buyprice'].forEach(id=>addCard.querySelector('#'+id).value='');
      if(autoFilled){
        alert(`Cost basis auto-filled from your Prior Years opening holdings: bought ${buydate} @ ₹${buyprice}. Check the Prior Years module if this looks wrong.`);
      }
    };
    addCard.querySelector('#cg_broker_total').onchange = (e)=>{ p.cgBrokerReportedTotal = e.target.value; save(); renderSummary(); };

    pasteCard.querySelector('#cg_paste_btn').onclick = ()=>{
      const raw = pasteCard.querySelector('#cg_paste_area').value;
      const rows = parsePastedRows(raw);
      let added = 0, skipped = 0;
      rows.forEach(cols=>{
        if(cols.length < 4) { skipped++; return; }
        const [stock, qty, buydateRaw, buypriceRaw, selldateRaw, sellpriceRaw] = cols;
        // Flexible: allow either (stock,qty,buydate,buyprice,selldate,sellprice) full,
        // or shorter forms where selldate/sellprice are actually in positions 3/4 (buy unknown).
        let entry;
        if(cols.length >= 6){
          entry = {
            stock, qty:+qty,
            buydate: parseFlexDate(buydateRaw), buyprice: buypriceRaw==='' ? null : +buypriceRaw,
            selldate: parseFlexDate(selldateRaw), sellprice: sellpriceRaw==='' ? null : +sellpriceRaw,
            source: ''
          };
        } else {
          skipped++; return;
        }
        if(!entry.stock || !entry.qty || !entry.selldate || entry.sellprice===null){ skipped++; return; }
        if(entry.qty <= 0){ skipped++; return; }
        if(entry.sellprice < 0 || (entry.buyprice!==null && entry.buyprice < 0)){ skipped++; return; }
        if(entry.buydate && entry.buydate.startsWith('INVALID:')){ skipped++; return; }
        if(entry.selldate && entry.selldate.startsWith('INVALID:')){ skipped++; return; }
        if(entry.buyprice!==null && !entry.buydate){ skipped++; return; } // buyprice without buydate -- can't classify, reject rather than silently default to ST
        if(entry.buydate && new Date(entry.selldate) < new Date(entry.buydate)){ skipped++; return; }
        p.cgEquityRows.push(entry);
        added++;
      });
      save();
      renderRows(); renderSummary();
      pasteCard.querySelector('#cg_paste_feedback').textContent = `Added ${added} row(s)${skipped>0 ? `, skipped ${skipped} (need 6 columns: Stock, Qty, BuyDate, BuyPrice, SellDate, SellPrice; qty/prices must be positive; sell date can't be before buy date; a buy price needs a buy date too)` : ''}.`;
      if(added>0) pasteCard.querySelector('#cg_paste_area').value = '';
    };

    renderRows();
    renderSummary();
  }
};

function computeRowGain(row, rules){
  if(row.buyprice===null || row.buyprice===undefined || row.buyprice==='') return {gain:null, term:null};
  const gain = (row.sellprice - row.buyprice) * row.qty;
  let term = null;
  if(row.buydate && row.selldate){
    const days = holdingPeriodDays(row.buydate, row.selldate);
    // Sec 2(42A): long-term requires MORE than 365 days -- exactly 365 is short-term.
    term = days > rules.ltcgHoldingDays ? 'LongTerm' : 'ShortTerm';
  }
  return {gain, term};
}

        <div class="field"><label>Redemption date</label><input id="mf_rdate" type="date"></div>

      </div>
      <button class="btn small" id="mf_add_btn">+ Add redemption</button>
    `;

    const rowsCard = document.createElement('div');
    rowsCard.className = 'card';
    rowsCard.innerHTML = `<h3>Redemptions</h3><div id="mfRowsTable"></div>`;
    container.appendChild(rowsCard);

      const g112 = p.cgMFRows.filter(r=>r.type==='112').reduce((s,r)=>s+(+r.gain||0),0);

      renderRows(); renderSummary();

    renderSummary();
  }

/* =========================================================================
   MODULE: Virtual Digital Assets (Crypto / NFTs)
   A completely separate tax regime from every other module here (Sec
   115BBH) -- verified against current guidance before building: flat 30%
   on each transaction's gain, no deduction except cost of acquisition
   (no fees, no other expenses), and losses CANNOT be set off against
   gains from other VDAs, any other income, or carried forward -- ever.
   Each transaction is computed and taxed independently; losses are shown
   for awareness only, not usable anywhere.
   ========================================================================= */
const VDAModule = {
  id: 'vda_crypto',
  label: 'Crypto / VDA (Schedule VDA)',
  order: 2.8,
  ruleSet: { taxRate: 0.30, tdsRate: 0.01 },
  isActive: (p) => !!p.hasVDA,
  hasStarted: (p) => (p.vdaTransactions||[]).length > 0,
  isComplete: (p) => (p.vdaTransactions||[]).length > 0,
  requiredDocs: () => ([
    {id:'vda_statement', name:'Exchange transaction statement (Indian or foreign exchange)', note:'Every transaction is taxed independently — need cost and sale value per transaction, not just a net P&L summary.'},
    {id:'vda_tds', name:'TDS certificates from Indian exchanges (Sec 194S, 1% on transaction value)', note:'This is 1% of the SALE VALUE, not the gain — a much bigger number than you might expect for high-turnover trading.'}
  ]),
  fallbackDocs: () => ({}),
  render(container, p, save){
    p.vdaTransactions = p.vdaTransactions || [];

    const header = document.createElement('div');
    header.className = 'panel-header';
    header.innerHTML = `
      <div class="eyebrow">Module 02.8 · Section 115BBH — nothing here works like ordinary capital gains</div>
      <h2>Crypto / Virtual Digital Assets</h2>
      <p class="desc">Flat 30% on each transaction's gain. No deduction for anything except what you paid for the asset — not exchange fees, not internet costs. A loss on one coin can NEVER reduce tax on a gain from another coin, or any other income, and can't be carried forward. Held on a foreign exchange? It also needs Schedule FA disclosure — see the Foreign Assets module.</p>
    `;
    container.appendChild(header);

    const toggleCard = document.createElement('div');
    toggleCard.className = 'card';
    toggleCard.innerHTML = `<h3>Do you hold or trade crypto/NFTs?</h3><div style="display:flex; gap:8px;" id="vda_toggle"></div>`;
    container.appendChild(toggleCard);
    function renderToggle(){
      const el = toggleCard.querySelector('#vda_toggle');
      el.innerHTML = '';
      [[true,'Yes'],[false,'No']].forEach(([val,label])=>{
        const btn = document.createElement('button');
        btn.className = 'btn small' + (p.hasVDA===val ? ' primary' : ' ghost');
        btn.textContent = label;
        btn.onclick = ()=>{ p.hasVDA = val; save(); renderToggle(); renderRail(); if(val) renderBody(); else bodyWrap.innerHTML=''; };
        el.appendChild(btn);
      });
    }
    renderToggle();

    const bodyWrap = document.createElement('div');
    container.appendChild(bodyWrap);

    function renderBody(){
      bodyWrap.innerHTML = '';
      const pasteCard = document.createElement('div');
      pasteCard.className = 'card';
      pasteCard.innerHTML = `
        <h3>Transactions</h3>
        <p class="helptext" style="margin-bottom:8px;">One per line: <code>Asset, SellDate, CostOfAcquisition, SaleValue</code></p>
        <textarea id="vda_paste" rows="3" style="width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:8px; border-radius:4px; font-family:var(--mono); font-size:12px;" placeholder="Bitcoin, 15/06/2025, 100000, 150000&#10;Ethereum, 20/07/2025, 50000, 35000"></textarea>
        <button class="btn small" id="vda_paste_btn" style="margin-top:8px;">Parse &amp; add</button>
        <div id="vda_feedback" class="helptext" style="margin:6px 0;"></div>
        <div id="vda_rows"></div>
      `;
      bodyWrap.appendChild(pasteCard);

      const resultWrap = document.createElement('div');
      bodyWrap.appendChild(resultWrap);

      function renderRows(){
        const el = pasteCard.querySelector('#vda_rows');
        if(p.vdaTransactions.length===0){
          el.innerHTML = `<div class="helptext" style="padding:8px 0;">No transactions yet.</div>`;
          return;
        }
        const table = document.createElement('table');
        table.className = 'day-table';
        table.innerHTML = `<tr><th>Asset</th><th>Sell Date</th><th>Cost</th><th>Sale Value</th><th>Gain/Loss</th><th></th></tr>`;
        p.vdaTransactions.forEach((t,idx)=>{
          const gain = t.saleValue - t.cost;
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${t.asset}</td><td>${t.selldate}</td><td>₹${t.cost.toLocaleString('en-IN')}</td><td>₹${t.saleValue.toLocaleString('en-IN')}</td><td style="color:${gain>=0?'var(--green)':'var(--rust)'};">₹${gain.toLocaleString('en-IN')}${gain<0?' (not usable)':''}</td><td><button class="btn small ghost" data-rm-vda="${idx}">✕</button></td>`;
          table.appendChild(tr);
        });
        el.innerHTML = '';
        el.appendChild(table);
        el.querySelectorAll('[data-rm-vda]').forEach(btn=>{
          btn.onclick = (e)=>{ p.vdaTransactions.splice(+e.target.dataset.rmVda,1); save(); renderRows(); renderSummary(); };
        });
      }
      function renderSummary(){
        const rules = VDAModule.ruleSet;
        let taxableGains = 0, ignoredLosses = 0, totalSaleValue = 0;
        p.vdaTransactions.forEach(t=>{
          const gain = t.saleValue - t.cost;
          if(gain > 0) taxableGains += gain; else ignoredLosses += gain;
          totalSaleValue += t.saleValue;
        });
        const tax = taxableGains * rules.taxRate;
        const estimatedTDS = totalSaleValue * rules.tdsRate;
        resultWrap.innerHTML = `
          <div class="result-box">
            <div class="verdict">Taxable VDA income: ₹${taxableGains.toLocaleString('en-IN')} → Tax @ 30%: ₹${tax.toLocaleString('en-IN')}</div>
            <div class="basis">
              <div>Losses excluded (not usable anywhere): ₹${Math.abs(ignoredLosses).toLocaleString('en-IN')} — this is real money lost, but it cannot reduce tax on anything, including other crypto gains.</div>
              <div>Estimated TDS already withheld on Indian exchanges (1% of ₹${totalSaleValue.toLocaleString('en-IN')} total sale value): ₹${estimatedTDS.toLocaleString('en-IN')} — check your actual TDS certificates, this is only an estimate based on sale values entered.</div>
              <div style="margin-top:6px;">Plus applicable surcharge and 4% cess on the ₹${tax.toLocaleString('en-IN')} tax figure.</div>
            </div>
          </div>
        `;
      }
      renderRows();
      renderSummary();

      pasteCard.querySelector('#vda_paste_btn').onclick = ()=>{
        const raw = pasteCard.querySelector('#vda_paste').value;
        const rows = parsePastedRows(raw);
        let added=0, skipped=0;
        rows.forEach(cols=>{
          if(cols.length<4){ skipped++; return; }
          const [asset, selldateRaw, cost, saleValue] = cols;
          const selldate = parseFlexDate(selldateRaw);
          if(!asset || !selldate || cost===''||saleValue===''|| isNaN(+cost) || isNaN(+saleValue)){ skipped++; return; }
          if(+cost < 0 || +saleValue < 0 || selldate.startsWith('INVALID:')){ skipped++; return; }
          p.vdaTransactions.push({asset, selldate, cost:+cost, saleValue:+saleValue});
          added++;
        });
        save(); renderRows(); renderSummary();
        pasteCard.querySelector('#vda_feedback').textContent = `Added ${added} transaction(s)${skipped>0?`, skipped ${skipped}`:''}.`;
        if(added>0) pasteCard.querySelector('#vda_paste').value='';
      };
    }
    if(p.hasVDA) renderBody();
  }
};
registerModule(VDAModule);

/* =========================================================================
   MODULE: Real Estate / Immovable Property
   Different rules from equity throughout: 24-month holding period (not
   12), STCG taxed at slab rate (no flat rate like equity STCG), and
   resident individuals get a choice between 12.5% flat (no indexation)
   and 20% with indexation for property acquired before 23-Jul-2024 --
   NRIs don't get that choice, only the flat 12.5%. Also covers Sec
   54/54EC reinvestment exemptions.
   ========================================================================= */
const RealEstateModule = {
  id: 'real_estate',
  label: 'Real Estate (Property Sale)',
  order: 2.9,
  ruleSet: { ltcgHoldingDays: 730, flatRate: 0.125, indexedRate: 0.20, sec54ECCap: 5000000 },
  isActive: (p) => !!p.hasRealEstateSale,
  hasStarted: (p) => (p.realEstateTransactions||[]).length > 0,
  isComplete: (p) => (p.realEstateTransactions||[]).length > 0,
  requiredDocs: () => ([
    {id:'sale_deed', name:'Sale deed', note:''},
    {id:'purchase_deed', name:'Original purchase deed (or gift/inheritance deed, if applicable)', note:'For gifted/inherited property, the PREVIOUS owner\'s purchase date and cost carry over — not the date you received it.'},
    {id:'improvement_receipts', name:'Cost of improvement receipts, if any renovation was done', note:'Adds to cost base, reducing taxable gain.'},
    {id:'reinvestment_proof', name:'Proof of reinvestment (new property purchase, or Sec 54EC bonds), if claiming exemption', note:''}
  ]),
  fallbackDocs: () => ({}),
  render(container, p, save){
    p.realEstateTransactions = p.realEstateTransactions || [];

    const header = document.createElement('div');
    header.className = 'panel-header';
    header.innerHTML = `
      <div class="eyebrow">Module 02.9 · 24-month threshold, not 12 — different rule from equity</div>
      <h2>Real Estate (Property Sale)</h2>
      <p class="desc">Property held over 24 months is long-term (equity's line is 12 months — don't reuse that mental model here). Short-term gains here are taxed at your slab rate, not a flat rate. Resident individuals who bought before 23-Jul-2024 can choose the lower of 12.5% flat or 20% with indexation — NRIs only get the flat 12.5%.</p>
    `;
    container.appendChild(header);

    const toggleCard = document.createElement('div');
    toggleCard.className = 'card';
    toggleCard.innerHTML = `<h3>Did you sell any property this FY?</h3><div style="display:flex; gap:8px;" id="re_toggle"></div>`;
    container.appendChild(toggleCard);
    function renderToggle(){
      const el = toggleCard.querySelector('#re_toggle');
      el.innerHTML = '';
      [[true,'Yes'],[false,'No']].forEach(([val,label])=>{
        const btn = document.createElement('button');
        btn.className = 'btn small' + (p.hasRealEstateSale===val ? ' primary' : ' ghost');
        btn.textContent = label;
        btn.onclick = ()=>{ p.hasRealEstateSale = val; save(); renderToggle(); renderRail(); if(val) renderBody(); else bodyWrap.innerHTML=''; };
        el.appendChild(btn);
      });
    }
    renderToggle();

    const bodyWrap = document.createElement('div');
    container.appendChild(bodyWrap);
    const isResident = profile.residencyResult ? profile.residencyResult.status.startsWith('Resident') : null;

    function renderBody(){
      bodyWrap.innerHTML = '';
      const addCard = document.createElement('div');
      addCard.className = 'card';
      addCard.innerHTML = `
        <h3>Add a property sale</h3>
        <div class="field-row">
          <div class="field"><label>Description / address</label><input id="re_desc" type="text" placeholder="e.g. Flat in Bangalore"></div>
          <div class="field"><label>Foreign property?</label>
            <select id="re_foreign"><option value="no">No — India</option><option value="yes">Yes — also needs Schedule FA</option></select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>Purchase date</label><input id="re_pdate" type="date"></div>
          <div class="field"><label>Purchase cost + improvement (₹)</label><input id="re_pcost" type="number"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Sale date</label><input id="re_sdate" type="date"></div>
          <div class="field"><label>Sale value (₹)</label><input id="re_sval" type="number"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Reinvested in new residential property, Sec 54 (₹)</label><input id="re_sec54" type="number" value="0"></div>
          <div class="field"><label>Invested in Sec 54EC bonds, cap ₹50L (₹)</label><input id="re_sec54ec" type="number" value="0"></div>
        </div>
        <button class="btn small" id="re_add_btn">+ Add</button>
      `;
      bodyWrap.appendChild(addCard);

      const rowsWrap = document.createElement('div');
      bodyWrap.appendChild(rowsWrap);

      function renderRows(){
        rowsWrap.innerHTML = '';
        p.realEstateTransactions.forEach((t,idx)=>{
          const days = holdingPeriodDays(t.pdate, t.sdate);
          const isLT = days > RealEstateModule.ruleSet.ltcgHoldingDays;
          const rawGain = t.sval - t.pcost;
          const reinvested = (+t.sec54||0) + (+t.sec54ec||0);
          const exemptAmount = isLT ? Math.min(rawGain, reinvested) : 0; // Sec54/54EC only apply to LTCG
          const taxableGain = Math.max(0, rawGain - exemptAmount);
          let taxNote;
          if(!isLT){
            taxNote = `Short-term — taxed at your slab rate (add ₹${taxableGain.toLocaleString('en-IN')} to slab income, not a flat rate).`;
          } else if(isResident===false){
            taxNote = `Long-term, NRI — 12.5% flat, no indexation choice: ₹${(taxableGain*RealEstateModule.ruleSet.flatRate).toLocaleString('en-IN')} tax.`;
          } else if(isResident===true && t.pdate < '2024-07-23'){
            taxNote = `Long-term, resident, bought before 23-Jul-2024 — you can choose the LOWER of 12.5% flat (₹${(taxableGain*RealEstateModule.ruleSet.flatRate).toLocaleString('en-IN')}) or 20% with indexation (indexation not computed here — get the Cost Inflation Index figure from a professional and compare both).`;
          } else {
            taxNote = `Long-term — 12.5% flat: ₹${(taxableGain*RealEstateModule.ruleSet.flatRate).toLocaleString('en-IN')} tax.`;
          }
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div style="display:flex; justify-content:space-between;">
              <h3>${t.desc || 'Property'} ${t.isForeign?'<span class="tag gold">FOREIGN</span>':''}</h3>
              <button class="btn small ghost" data-rm-re="${idx}">✕</button>
            </div>
            <div class="basis">
              <div>Held ${days} days (${isLT?'Long-term':'Short-term'}, threshold 730 days / 24 months)</div>
              <div>Raw gain: ₹${rawGain.toLocaleString('en-IN')}${exemptAmount>0?` · Sec 54/54EC exemption: ₹${exemptAmount.toLocaleString('en-IN')}`:''}</div>
              <div style="margin-top:6px;">${taxNote}</div>
            </div>
          `;
          rowsWrap.appendChild(card);
          card.querySelector('[data-rm-re]').onclick = ()=>{ p.realEstateTransactions.splice(idx,1); save(); renderRows(); };
        });
      }
      renderRows();

      addCard.querySelector('#re_add_btn').onclick = ()=>{
        const desc = addCard.querySelector('#re_desc').value.trim();
        const isForeign = addCard.querySelector('#re_foreign').value==='yes';
        const pdate = addCard.querySelector('#re_pdate').value;
        const pcost = addCard.querySelector('#re_pcost').value;
        const sdate = addCard.querySelector('#re_sdate').value;
        const sval = addCard.querySelector('#re_sval').value;
        const sec54 = addCard.querySelector('#re_sec54').value;
        const sec54ec = addCard.querySelector('#re_sec54ec').value;
        if(!pdate || !pcost || !sdate || !sval){ alert('Purchase/sale dates and amounts are required.'); return; }
        if(+pcost<0 || +sval<0){ alert('Amounts can\'t be negative.'); return; }
        if(new Date(sdate) < new Date(pdate)){ alert('Sale date is before purchase date.'); return; }
        if(+sec54ec > RealEstateModule.ruleSet.sec54ECCap){ alert('Sec 54EC bonds are capped at ₹50,00,000 — check the figure.'); return; }
        p.realEstateTransactions.push({desc, isForeign, pdate, pcost:+pcost, sdate, sval:+sval, sec54:+sec54||0, sec54ec:+sec54ec||0});
        save(); renderRows();
        if(isForeign){ alert('Foreign property noted — also add this to the Foreign Assets module for Schedule FA disclosure.'); }
      };
    }
    if(p.hasRealEstateSale) renderBody();
  }
};
registerModule(RealEstateModule);

/* =========================================================================
   MODULE: Other Sources (Dividends + Interest)
   Design lesson: nobody remembers every FD across every bank. Rather than
   asking for an itemised list up front, the fast path is "enter the AIS
   total" -- banks already report all interest (FD, RD, SB, NSC...) to AIS,
   so that single number is more complete than most people's memory.
   Itemising is optional, offered as a cross-check, not a requirement.
   ========================================================================= */
const OtherSourcesModule = {
  id: 'other_sources',
  label: 'Other Sources',
  order: 3,
  ruleSet: {},
  isActive: () => true,
  hasStarted: (p) => !!(p.otherSources && (p.otherSources.aisInterestTotal || p.otherSources.aisDividendTotal || (p.otherSources.interestRows||[]).length || (p.otherSources.dividendRows||[]).length)),
  isComplete: (p) => !!(p.otherSources && (p.otherSources.aisInterestTotal !== '' || (p.otherSources.interestRows||[]).length > 0)),
  requiredDocs: () => ([
    {id:'ais_interest', name:'AIS — "Interest on Deposits" and "Interest on Savings account" sections', note:'This is the fast, complete path — covers every bank/FD that reported to AIS, so you don\'t need to remember each one individually.'},
    {id:'ais_dividend', name:'AIS — "Dividends" section', note:'Same idea — one total instead of tracking each company.'},
    {id:'fd_certificates', name:'FD interest certificates (only if itemising)', note:'Only needed if you want a bank-by-bank breakdown to cross-check against the AIS total.'}
  ]),
  fallbackDocs: () => ({}),
  render(container, p, save){
    p.otherSources = p.otherSources || {aisInterestTotal:'', interestRows:[], aisDividendTotal:'', dividendRows:[]};
    const os = p.otherSources;

    const header = document.createElement('div');
    header.className = 'panel-header';
    header.innerHTML = `
      <div class="eyebrow">Module 03.5 · Built for "I don't remember all my FDs"</div>
      <h2>Other Sources — Dividends &amp; Interest</h2>
      <p class="desc">You don't need to recall every fixed deposit across every bank. Banks report all of it to AIS already — enter that one total below and move on. Itemising is only there if you want to double-check the AIS figure against your own records.</p>
    `;
    container.appendChild(header);

    // ---- Interest ----
    const intCard = document.createElement('div');
    intCard.className = 'card';
    intCard.innerHTML = `
      <h3>Interest income — fastest path</h3>
      <div class="field-row">
        <div class="field"><label>Total interest per AIS/Form 26AS (all banks/FDs/SB combined)</label><input id="os_ais_int" type="number" step="0.01" value="${os.aisInterestTotal}"></div>
      </div>
      <p class="helptext" style="margin-top:4px;">If you're an NRI, exclude NRE savings/FD interest here — that's exempt under Sec 10(4)(ii). Only NRO and any taxable domestic interest belongs in this figure.</p>
      <div class="divider"></div>
      <h3>Itemise instead (optional, for cross-checking)</h3>
      <p class="helptext" style="margin-bottom:8px;">One per line: <code>Bank/Source, Type(FD/SB/RD/NSC/Other), Amount</code></p>
      <textarea id="os_int_paste" rows="3" style="width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:8px; border-radius:4px; font-family:var(--mono); font-size:12px;" placeholder="Axis Bank NRO, SB, 1811&#10;HDFC Bank FD 4521, FD, 12500"></textarea>
      <button class="btn small" id="os_int_paste_btn" style="margin-top:8px;">Parse &amp; add</button>
      <div id="os_int_feedback" class="helptext" style="margin:6px 0;"></div>
      <div id="os_int_rows"></div>
      <div id="os_int_compare"></div>
    `;
    container.appendChild(intCard);

    function renderIntRows(){
      const el = intCard.querySelector('#os_int_rows');
      if(os.interestRows.length===0){
        el.innerHTML = `<div class="helptext" style="padding:8px 0;">No itemised rows yet.</div>`;
      } else {
        const table = document.createElement('table');
        table.className = 'day-table';
        table.innerHTML = `<tr><th>Source</th><th>Type</th><th>Amount</th><th></th></tr>`;
        os.interestRows.forEach((r, idx)=>{
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${r.source}</td><td>${r.type}</td><td>₹${(+r.amount).toLocaleString('en-IN')}</td><td><button class="btn small ghost" data-rm-int="${idx}">✕</button></td>`;
          table.appendChild(tr);
        });
        el.innerHTML = '';
        el.appendChild(table);
        el.querySelectorAll('[data-rm-int]').forEach(btn=>{
          btn.onclick = (e)=>{ os.interestRows.splice(+e.target.dataset.rmInt,1); save(); renderIntRows(); };
        });
      }
      const itemizedSum = os.interestRows.reduce((s,r)=>s+(+r.amount||0),0);
      const aisVal = parseFloat(os.aisInterestTotal);
      const cmp = intCard.querySelector('#os_int_compare');
      if(os.interestRows.length>0 && !isNaN(aisVal) && os.aisInterestTotal !== ''){
        const diff = itemizedSum - aisVal;
        const ok = Math.abs(diff) <= 10;
        cmp.innerHTML = `<div class="helptext" style="margin-top:6px; color:${ok?'var(--green)':'var(--rust)'};">${ok?'✓ Itemised total matches AIS':'⚠ Itemised total ₹'+itemizedSum.toLocaleString('en-IN')+' vs AIS ₹'+aisVal.toLocaleString('en-IN')+' — diff ₹'+diff.toLocaleString('en-IN')}</div>`;
      } else {
        cmp.innerHTML = '';
      }
    }
    renderIntRows();

    intCard.querySelector('#os_ais_int').onchange = (e)=>{ os.aisInterestTotal = e.target.value; save(); renderIntRows(); };
    intCard.querySelector('#os_int_paste_btn').onclick = ()=>{
      const raw = intCard.querySelector('#os_int_paste').value;
      const rows = parsePastedRows(raw);
      let added=0, skipped=0;
      rows.forEach(cols=>{
        if(cols.length<3){ skipped++; return; }
        const [source, type, amount] = cols;
        if(!source || amount==='' || isNaN(+amount)){ skipped++; return; }
        if(+amount < 0){ skipped++; return; }
        os.interestRows.push({source, type: type||'Other', amount:+amount});
        added++;
      });
      save(); renderIntRows();
      intCard.querySelector('#os_int_feedback').textContent = `Added ${added} row(s)${skipped>0?`, skipped ${skipped}`:''}.`;
      if(added>0) intCard.querySelector('#os_int_paste').value='';
    };

    // ---- Dividends ----
    const divCard = document.createElement('div');
    divCard.className = 'card';
    divCard.innerHTML = `
      <h3>Dividend income — fastest path</h3>
      <div class="field-row">
        <div class="field"><label>Total dividends per AIS (all companies combined)</label><input id="os_ais_div" type="number" step="0.01" value="${os.aisDividendTotal}"></div>
      </div>
      <div class="divider"></div>
      <h3>Itemise instead (optional)</h3>
      <p class="helptext" style="margin-bottom:8px;">One per line: <code>Company, Amount</code></p>
      <textarea id="os_div_paste" rows="3" style="width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:8px; border-radius:4px; font-family:var(--mono); font-size:12px;" placeholder="ITC Limited, 49888&#10;HDFC Bank, 18900"></textarea>
      <button class="btn small" id="os_div_paste_btn" style="margin-top:8px;">Parse &amp; add</button>
      <div id="os_div_feedback" class="helptext" style="margin:6px 0;"></div>
      <div id="os_div_rows"></div>
      <div id="os_div_compare"></div>
    `;
    container.appendChild(divCard);

    function renderDivRows(){
      const el = divCard.querySelector('#os_div_rows');
      if(os.dividendRows.length===0){
        el.innerHTML = `<div class="helptext" style="padding:8px 0;">No itemised rows yet.</div>`;
      } else {
        const table = document.createElement('table');
        table.className = 'day-table';
        table.innerHTML = `<tr><th>Company</th><th>Amount</th><th></th></tr>`;
        os.dividendRows.forEach((r, idx)=>{
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${r.company}</td><td>₹${(+r.amount).toLocaleString('en-IN')}</td><td><button class="btn small ghost" data-rm-div="${idx}">✕</button></td>`;
          table.appendChild(tr);
        });
        el.innerHTML = '';
        el.appendChild(table);
        el.querySelectorAll('[data-rm-div]').forEach(btn=>{
          btn.onclick = (e)=>{ os.dividendRows.splice(+e.target.dataset.rmDiv,1); save(); renderDivRows(); };
        });
      }
      const itemizedSum = os.dividendRows.reduce((s,r)=>s+(+r.amount||0),0);
      const aisVal = parseFloat(os.aisDividendTotal);
      const cmp = divCard.querySelector('#os_div_compare');
      if(os.dividendRows.length>0 && !isNaN(aisVal) && os.aisDividendTotal !== ''){
        const diff = itemizedSum - aisVal;
        const ok = Math.abs(diff) <= 10;
        cmp.innerHTML = `<div class="helptext" style="margin-top:6px; color:${ok?'var(--green)':'var(--rust)'};">${ok?'✓ Itemised total matches AIS':'⚠ Itemised total ₹'+itemizedSum.toLocaleString('en-IN')+' vs AIS ₹'+aisVal.toLocaleString('en-IN')+' — diff ₹'+diff.toLocaleString('en-IN')}</div>`;
      } else {
        cmp.innerHTML = '';
      }
    }
    renderDivRows();

    divCard.querySelector('#os_ais_div').onchange = (e)=>{ os.aisDividendTotal = e.target.value; save(); renderDivRows(); };
    divCard.querySelector('#os_div_paste_btn').onclick = ()=>{
      const raw = divCard.querySelector('#os_div_paste').value;
      const rows = parsePastedRows(raw);
      let added=0, skipped=0;
      rows.forEach(cols=>{
        if(cols.length<2){ skipped++; return; }
        const [company, amount] = cols;
        if(!company || amount==='' || isNaN(+amount)){ skipped++; return; }
        if(+amount < 0){ skipped++; return; }
        os.dividendRows.push({company, amount:+amount});
        added++;
      });
      save(); renderDivRows();
      divCard.querySelector('#os_div_feedback').textContent = `Added ${added} row(s)${skipped>0?`, skipped ${skipped}`:''}.`;
      if(added>0) divCard.querySelector('#os_div_paste').value='';
    };
  }
};
registerModule(OtherSourcesModule);

/* =========================================================================
   MODULE: Business & Professional Income
   Three modes: F&O/trading turnover (the ICAI-style "sum of absolute
   profit/loss" method, not gross transaction value -- a common source of
   confusion), presumptive (44AD/44ADA/44AE), and regular books. Thresholds
   for audit/presumptive limits are legislated figures that move -- shown
   with an explicit "verify current limit" caveat rather than asserted as
   permanently fixed.
   ========================================================================= */
const BusinessIncomeModule = {
  id: 'business_income',
  label: 'Business & Professional Income',
  order: 2.7,
  ruleSet: {
    auditThresholdCash: 10000000,      // Rs 1 crore -- verify current limit
    auditThresholdDigital: 100000000,  // Rs 10 crore if cash receipts/payments <=5% -- verify current limit
    presumptive44ADLimit: 20000000,    // Rs 2 crore -- verify current limit
    presumptive44ADRateDigital: 0.06,
    presumptive44ADRateCash: 0.08,
    presumptive44ADARate: 0.50
  },
  isActive: (p) => p.incomeSources.business,
  hasStarted: (p) => !!(p.businessIncome && p.businessIncome.mode),
  isComplete: (p) => !!(p.businessIncome && p.businessIncome.mode),
  requiredDocs: (p) => {
    const mode = p.businessIncome && p.businessIncome.mode;
    const base = [{id:'pan_biz', name:'PAN', note:''}];
    if(mode === 'fno'){
      return [...base,
        {id:'fno_pl', name:'F&O / trading P&L statement from broker (contract-level)', note:'Needed to compute turnover correctly — not the same as gross buy+sell value.'},
        {id:'bank_biz', name:'Bank statement covering the trading account', note:'Cross-check settlement amounts.'}
      ];
    }
    if(mode === 'presumptive'){
      return [...base,
        {id:'gross_receipts', name:'Gross receipts / turnover figure', note:'Bank statements or sales records — exact books not required under presumptive scheme.'}
      ];
    }
    if(mode === 'books'){
      return [...base,
        {id:'pl_bs', name:'Profit & Loss account and Balance Sheet', note:''},
        {id:'audit_report', name:'Tax audit report, if turnover exceeds the threshold', note:'Confirm current threshold — it depends on cash transaction proportion and changes periodically.'}
      ];
    }
    return base;
  },
  fallbackDocs: () => ({}),
  render(container, p, save){
    p.businessIncome = p.businessIncome || {mode:null, fnoTrades:[], presumptive:{}, books:{}};
    const bi = p.businessIncome;

    const header = document.createElement('div');
    header.className = 'panel-header';
    header.innerHTML = `
      <div class="eyebrow">Module 02.7 · F&amp;O turnover, presumptive, or regular books</div>
      <h2>Business &amp; Professional Income</h2>
      <p class="desc">Pick the mode that fits. F&amp;O has its own turnover rule that trips people up — it's the sum of each trade's absolute profit/loss, not the total value bought and sold.</p>
    `;
    container.appendChild(header);

    const modeCard = document.createElement('div');
    modeCard.className = 'card';
    modeCard.innerHTML = `<h3>Which applies?</h3><div style="display:flex; flex-wrap:wrap; gap:8px;" id="bi_mode_choices"></div>`;
    container.appendChild(modeCard);
    const modeChoices = modeCard.querySelector('#bi_mode_choices');
    function renderModeChoices(){
      modeChoices.innerHTML = '';
      [['fno','F&O / Trading'],['presumptive','Presumptive (44AD/44ADA/44AE)'],['books','Regular books']].forEach(([val,label])=>{
        const btn = document.createElement('button');
        const selected = bi.mode === val;
        btn.className = 'btn small' + (selected ? ' primary' : ' ghost');
        btn.textContent = label;
        btn.onclick = ()=>{ bi.mode = val; save(); renderModeChoices(); renderBody(); };
        modeChoices.appendChild(btn);
      });
    }
    renderModeChoices();

    const bodyWrap = document.createElement('div');
    container.appendChild(bodyWrap);

    function renderBody(){
      bodyWrap.innerHTML = '';
      if(bi.mode === 'fno') renderFNO();
      else if(bi.mode === 'presumptive') renderPresumptive();
      else if(bi.mode === 'books') renderBooks();
    }

    function renderFNO(){
      bi.fnoTrades = bi.fnoTrades || [];
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h3>F&amp;O trades</h3>
        <p class="helptext" style="margin-bottom:8px;">Paste from your broker's P&L statement: <code>Contract, Profit/Loss</code> — one trade per line. Turnover is computed as the sum of absolute values, per standard F&O turnover convention (this simplified method doesn't separately add options premium — check with a professional if you have significant options selling activity, where premium received is sometimes added on top).</p>
        <textarea id="bi_fno_paste" rows="4" style="width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:8px; border-radius:4px; font-family:var(--mono); font-size:12px;" placeholder="AARTIIND-FUTSTK-23Feb2023, -30599.62&#10;BHARTIARTL-FUTSTK-23Feb2023, 5717.24"></textarea>
        <button class="btn small" id="bi_fno_paste_btn" style="margin-top:8px;">Parse &amp; add</button>
        <div id="bi_fno_feedback" class="helptext" style="margin:6px 0;"></div>
        <div id="bi_fno_rows"></div>
      `;
      bodyWrap.appendChild(card);

      const resultWrap = document.createElement('div');
      bodyWrap.appendChild(resultWrap);

      function renderFNORows(){
        const el = card.querySelector('#bi_fno_rows');
        if(bi.fnoTrades.length===0){
          el.innerHTML = `<div class="helptext" style="padding:8px 0;">No trades added yet.</div>`;
        } else {
          const table = document.createElement('table');
          table.className = 'day-table';
          table.innerHTML = `<tr><th>Contract</th><th>P/L</th><th></th></tr>`;
          bi.fnoTrades.forEach((t,idx)=>{
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${t.contract}</td><td>₹${(+t.pl).toLocaleString('en-IN')}</td><td><button class="btn small ghost" data-rm-fno="${idx}">✕</button></td>`;
            table.appendChild(tr);
          });
          el.innerHTML = '';
          el.appendChild(table);
          el.querySelectorAll('[data-rm-fno]').forEach(btn=>{
            btn.onclick = (e)=>{ bi.fnoTrades.splice(+e.target.dataset.rmFno,1); save(); renderFNORows(); renderFNOSummary(); };
          });
        }
      }
      function renderFNOSummary(){
        const turnover = bi.fnoTrades.reduce((s,t)=>s+Math.abs(+t.pl||0),0);
        const netResult = bi.fnoTrades.reduce((s,t)=>s+(+t.pl||0),0);
        const rules = BusinessIncomeModule.ruleSet;
        const auditLikely = turnover > rules.auditThresholdCash;
        resultWrap.innerHTML = `
          <div class="result-box">
            <div class="verdict">Turnover: ₹${turnover.toLocaleString('en-IN')} · Net ${netResult>=0?'profit':'loss'}: ₹${Math.abs(netResult).toLocaleString('en-IN')}</div>
            <div class="basis">
              <div>This is non-speculative business income (Sec 43(5) proviso) — losses can be set off against most other income (not salary) and carried forward 8 years against future non-speculative business income.</div>
              ${auditLikely ? `<div style="color:var(--rust); margin-top:6px;">⚠ Turnover exceeds ₹1 crore — tax audit may apply (extends to ₹10 crore if cash receipts/payments are ≤5% of total, which is typical for F&O). Verify the current threshold and your cash-transaction ratio with a professional before assuming either way.</div>` : `<div style="margin-top:6px;">Turnover is under the base ₹1 crore audit threshold — audit is unlikely to apply, but confirm the current limit since it's periodically revised.</div>`}
            </div>
          </div>
        `;
      }
      renderFNORows();
      renderFNOSummary();

      card.querySelector('#bi_fno_paste_btn').onclick = ()=>{
        const raw = card.querySelector('#bi_fno_paste').value;
        const rows = parsePastedRows(raw);
        let added=0, skipped=0;
        rows.forEach(cols=>{
          if(cols.length<2){ skipped++; return; }
          const [contract, pl] = cols;
          if(!contract || pl===''||isNaN(+pl)){ skipped++; return; }
          bi.fnoTrades.push({contract, pl:+pl});
          added++;
        });
        save(); renderFNORows(); renderFNOSummary();
        card.querySelector('#bi_fno_feedback').textContent = `Added ${added} trade(s)${skipped>0?`, skipped ${skipped}`:''}.`;
        if(added>0) card.querySelector('#bi_fno_paste').value='';
      };
    }

    function renderPresumptive(){
      bi.presumptive = bi.presumptive || {};
      const pr = bi.presumptive;
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h3>Presumptive computation</h3>
        <div class="field-row">
          <div class="field">
            <label>Scheme</label>
            <select id="bi_pr_scheme">
              <option value="44AD" ${pr.scheme==='44AD'?'selected':''}>44AD — Business (6%/8% of turnover)</option>
              <option value="44ADA" ${pr.scheme==='44ADA'?'selected':''}>44ADA — Profession (50% of gross receipts)</option>
              <option value="44AE" ${pr.scheme==='44AE'?'selected':''}>44AE — Goods transport (per-vehicle)</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>Turnover / gross receipts (₹)</label><input id="bi_pr_turnover" type="number" value="${pr.turnover||''}"></div>
          <div class="field"><label>Of which, received digitally (₹) — rest assumed cash</label><input id="bi_pr_digital" type="number" value="${pr.digital||''}"></div>
        </div>
        <div id="bi_pr_result" style="margin-top:12px;"></div>
      `;
      bodyWrap.appendChild(card);

      function renderResult(){
        const rules = BusinessIncomeModule.ruleSet;
        const el = card.querySelector('#bi_pr_result');
        const turnoverRaw = +pr.turnover || 0;
        if(turnoverRaw < 0){
          el.innerHTML = `<div class="result-box" style="border-color:var(--rust);"><div class="verdict" style="color:var(--rust);">Turnover can't be negative</div><div class="basis">Check the figure entered — presumptive income is always a percentage of turnover, so it can never come out negative.</div></div>`;
          return;
        }
        const turnover = turnoverRaw;
        if(turnover === 0){ el.innerHTML=''; return; }
        if(pr.scheme === '44ADA'){
          const income = turnover * rules.presumptive44ADARate;
          el.innerHTML = `<div class="result-box"><div class="verdict">Presumptive income: ₹${income.toLocaleString('en-IN')}</div><div class="basis">50% of gross receipts, flat — no digital/cash distinction for 44ADA.</div></div>`;
        } else if(pr.scheme === '44AD'){
          const digital = Math.min(+pr.digital||0, turnover);
          const cashPortion = turnover - digital;
          const income = digital*rules.presumptive44ADRateDigital + cashPortion*rules.presumptive44ADRateCash;
          const overLimit = turnover > rules.presumptive44ADLimit;
          el.innerHTML = `<div class="result-box"><div class="verdict">Presumptive income: ₹${income.toLocaleString('en-IN')}</div><div class="basis">
            <div>Digital portion (₹${digital.toLocaleString('en-IN')}) @ 6% + cash portion (₹${cashPortion.toLocaleString('en-IN')}) @ 8%.</div>
            ${overLimit ? `<div style="color:var(--rust); margin-top:6px;">⚠ Turnover exceeds the presumptive scheme's turnover limit — 44AD may not be available; regular books/audit could be required. Verify the current limit.</div>` : ''}
          </div></div>`;
        } else {
          el.innerHTML = `<div class="result-box"><div class="verdict">44AE — per-vehicle computation</div><div class="basis">Presumptive income here is a fixed amount per vehicle per month (heavy/other goods vehicles have different rates that are periodically revised) rather than a percentage of turnover — this module doesn't compute it automatically. Check the current per-vehicle rate before filing.</div></div>`;
        }
      }
      renderResult();

      card.querySelector('#bi_pr_scheme').onchange = (e)=>{ pr.scheme=e.target.value; save(); renderResult(); };
      card.querySelector('#bi_pr_turnover').onchange = (e)=>{ pr.turnover=e.target.value; save(); renderResult(); };
      card.querySelector('#bi_pr_digital').onchange = (e)=>{ pr.digital=e.target.value; save(); renderResult(); };
    }

    function renderBooks(){
      bi.books = bi.books || {};
      const bk = bi.books;
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h3>Regular books</h3>
        <div class="field-row">
