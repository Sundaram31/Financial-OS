<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debt &amp; Loan Tracker — Financial OS</title>
<style>
  :root{
    --bg:#0B0E11; --panel:#12161B; --panel-2:#171C22; --line:#242A31;
    --text:#E8E6E0; --muted:#9BA0A8; --gold:#C9A227; --gold-dim:#8f7419;
    --green:#4A9B6E; --rust:#B5533C;
    --mono: 'IBM Plex Mono', 'Courier New', monospace;
    --serif: 'Source Serif 4', Georgia, serif;
  }
  body[data-theme="light"]{
    --bg:#F7F5F0; --panel:#FFFFFF; --panel-2:#F1EEE7; --line:#DCD7CC;
    --text:#242220; --muted:#6B6660; --gold:#96741A; --gold-dim:#7a5f15;
    --green:#2F7A50; --rust:#9B3F2A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:var(--mono); font-size:15.5px; line-height:1.6; min-height:100vh; }
  a{color:var(--gold);}
  .app{ display:flex; min-height:100vh; flex-direction:column; }
  header.topbar{ display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; gap:10px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .seal{ width:28px; height:28px; border:1.5px solid var(--gold); border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-size:13px; color:var(--gold); font-weight:600; }
  .brand h1{ font-family:var(--serif); font-size:17px; font-weight:600; }
  .brand .sub{ font-size:11px; color:var(--muted); }
  .topbar-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  main.content{ flex:1; overflow-y:auto; padding:26px 32px; max-width:900px; margin:0 auto; width:100%; }
  .panel-header{ margin-bottom:22px; }
  .panel-header .eyebrow{ font-size:11px; color:var(--gold); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:4px;}
  .panel-header h2{ font-family:var(--serif); font-size:24px; font-weight:600; }
  .panel-header p.desc{ color:var(--muted); font-size:14px; margin-top:6px; max-width:640px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:18px 20px; margin-bottom:16px; }
  .card h3{ font-family:var(--serif); font-size:16px; margin-bottom:12px; }
  .field-row{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
  .field{ flex:1; min-width:160px; }
  .field label{ display:block; font-size:11px; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.6px;}
  .field input, .field select, textarea{ width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:8px 10px; border-radius:4px; font-family:var(--mono); font-size:14px; }
  .field input:focus, textarea:focus{ outline:none; border-color:var(--gold-dim); }
  .btn{ background:transparent; border:1px solid var(--gold-dim); color:var(--gold); padding:8px 16px; border-radius:4px; font-family:var(--mono); font-size:12px; cursor:pointer; }
  .btn:hover{ background:rgba(201,162,39,0.08); border-color:var(--gold); }
  .btn.primary{ background:var(--gold); color:#141414; font-weight:600; border-color:var(--gold); }
  .btn.ghost{ border-color:var(--line); color:var(--muted); }
  .btn.small{ padding:5px 10px; font-size:11px; }
  table.day-table{ width:100%; border-collapse:collapse; margin-top:8px; font-size:13.5px; }
  table.day-table th{ text-align:left; color:var(--muted); font-weight:500; font-size:11.5px; text-transform:uppercase; padding:6px 8px; border-bottom:1px solid var(--line); }
  table.day-table td{ padding:7px 8px; border-bottom:1px solid var(--line); }
  .result-box{ border:1px solid var(--gold-dim); border-radius:6px; padding:18px 20px; background:linear-gradient(180deg, rgba(201,162,39,0.05), transparent); margin-top:12px; }
  .result-box .verdict{ font-family:var(--serif); font-size:19px; color:var(--gold); margin-bottom:4px; }
  .result-box .verdict-detail{ font-size:13px; color:var(--muted); }
  .helptext{ font-size:12.5px; color:var(--muted); margin-top:4px; }
  .progress-track{ height:14px; background:var(--bg); border:1px solid var(--line); border-radius:7px; overflow:hidden; margin:10px 0; }
  .progress-fill{ height:100%; background:var(--green); }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  @media (max-width:760px){ main.content{ padding:18px; } }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="seal">₹</div>
      <div>
        <h1>Debt &amp; Loan Tracker</h1>
        <div class="sub">Financial OS · auto-detects EMI/prepayment from a bank statement</div>
      </div>
    </div>
    <div class="topbar-actions">
      <a class="btn small ghost" href="../">← Financial OS</a>
      <button class="btn small ghost" id="themeToggleBtn">☀ Light mode</button>
      <button class="btn small ghost" id="exportBtn">Export</button>
      <button class="btn small ghost" id="importBtn">Import</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </div>
  </header>
  <main class="content" id="content"></main>
</div>

<script>
const STORAGE_KEY = 'loans_data_v1';
function loadData(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : {loans:[]}; }
  catch(e){ return {loans:[]}; }
}
let data = loadData();
function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function newId(){ return 'loan_' + Date.now() + '_' + Math.floor(Math.random()*1000); }
let expandedId = null;

// Bank-statement classifier -- validated 98.7% accurate against ground truth on a real
// 394-transaction account (see project notes). Deliberately uses ONLY the transaction
// description text, not any bank-provided category column, since most real statements
// don't have one. Only EMI/prepayment patterns are used here (loan-specific subset).
function classifyLoanTxn(desc){
  if(/_EMI_/i.test(desc)) return 'emi';
  if(/ACH-DR-TP ACH|NACH.*LOAN|LOAN.*NACH/i.test(desc)) return 'emi';
  if(/BRN-CLG-CHQ PAID TO.*(BANK|ICICI|HDFC|AXIS|SBI)/i.test(desc)) return 'prepayment';
  if(/PREPAY|PART.?PAY|FORECLOS/i.test(desc)) return 'prepayment';
  return null;
}
function parsePastedRows(text){
  return text.split('\n').map(l=>l.trim()).filter(l=>l.length>0)
    .map(line=>{ const sep = line.includes('\t') ? '\t' : ','; return line.split(sep).map(c=>c.trim()); });
}
function wireFileUpload(fileInputEl, onText){
  fileInputEl.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{ onText(ev.target.result); fileInputEl.value=''; };
    reader.readAsText(file);
  };
}

function amortizationSummary(loan){
  const principal = +loan.principal || 0;
  const rate = (+loan.annualRate || 0) / 100 / 12;
  const emi = +loan.emiAmount || 0;
  const paid = (loan.payments||[]).reduce((s,p)=>s + (+p.amount||0), 0);
  const outstanding = Math.max(0, principal - paid);
  // Rough months-remaining estimate from outstanding balance and current EMI, standard
  // amortization formula -- approximate since it doesn't re-amortize after each prepayment.
  let monthsLeft = null;
  if(emi > 0 && rate > 0 && outstanding > 0){
    const ratio = (emi) / (emi - outstanding*rate);
    if(ratio > 0) monthsLeft = Math.log(ratio) / Math.log(1+rate);
  } else if(emi > 0 && outstanding > 0){
    monthsLeft = outstanding / emi;
  }
  return { principal, paid, outstanding, monthsLeft: monthsLeft && isFinite(monthsLeft) ? Math.ceil(monthsLeft) : null };
}

function renderLoanCard(container, loan){
  const s = amortizationSummary(loan);
  const pctPaid = s.principal>0 ? Math.min(100, (s.paid/s.principal)*100) : 0;
  const isExpanded = expandedId === loan.id;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:flex-start; cursor:pointer;" data-toggle>
      <div>
        <h3 style="margin-bottom:2px;">${loan.lender || 'Unnamed loan'} — ${loan.type||'Loan'}</h3>
        <div class="helptext">₹${s.outstanding.toLocaleString('en-IN',{maximumFractionDigits:0})} outstanding of ₹${s.principal.toLocaleString('en-IN')}${s.monthsLeft ? ` · ~${s.monthsLeft} months to payoff at current EMI` : ''}</div>
      </div>
      <button class="btn small ghost" data-del>✕</button>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pctPaid.toFixed(1)}%;"></div></div>
    <div id="loan_body_${loan.id}" style="display:${isExpanded?'block':'none'}; margin-top:14px;"></div>
  `;
  container.appendChild(card);
  card.querySelector('[data-toggle]').onclick = ()=>{ expandedId = isExpanded ? null : loan.id; render(); };
  card.querySelector('[data-del]').onclick = (e)=>{
    e.stopPropagation();
    if(!confirm(`Delete "${loan.lender}"? This can't be undone.`)) return;
    data.loans = data.loans.filter(l=>l.id!==loan.id);
    saveData(); render();
  };
  if(isExpanded) renderLoanBody(card.querySelector(`#loan_body_${loan.id}`), loan);
}

function renderLoanBody(container, loan){
  const paramsCard = document.createElement('div');
  paramsCard.innerHTML = `
    <div class="field-row">
      <div class="field"><label>Lender</label><input id="l_lender" value="${loan.lender||''}"></div>
      <div class="field"><label>Type</label>
        <select id="l_type">
          ${['Home Loan','Personal Loan','Vehicle Loan','Education Loan','Other'].map(t=>`<option value="${t}" ${loan.type===t?'selected':''}>${t}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>Original principal (₹)</label><input id="l_principal" type="number" value="${loan.principal||''}"></div>
      <div class="field"><label>Annual interest rate (%)</label><input id="l_rate" type="number" step="0.01" value="${loan.annualRate||''}"></div>
      <div class="field"><label>Current EMI (₹/month)</label><input id="l_emi" type="number" value="${loan.emiAmount||''}"></div>
    </div>
  `;
  container.appendChild(paramsCard);
  ['l_lender','l_type','l_principal','l_rate','l_emi'].forEach(id=>{
    paramsCard.querySelector('#'+id).onchange = (e)=>{
      const map = {l_lender:'lender', l_type:'type', l_principal:'principal', l_rate:'annualRate', l_emi:'emiAmount'};
      loan[map[id]] = e.target.value; saveData(); render();
    };
  });

  const importCard = document.createElement('div');
  importCard.className = 'card';
  importCard.style.marginTop = '14px';
  importCard.innerHTML = `
    <h3>Auto-detect EMI/prepayment from a bank statement</h3>
    <p class="helptext" style="margin-bottom:8px;">Paste raw statement text (or upload CSV/TXT) — classifies from the transaction description only, same validated approach as the AIS Reconciliation module. One per line: <code>Date, Description, Amount</code> works too if pre-extracted.</p>
    <textarea id="l_import_paste" rows="3" placeholder="Paste statement rows here"></textarea>
    <div style="display:flex; gap:8px; align-items:center; margin-top:8px;">
      <button class="btn small primary" id="l_import_btn">Scan &amp; add detected payments</button>
      <span class="helptext" style="margin:0;">or</span>
      <button class="btn small ghost" id="l_file_btn">Choose file</button>
      <input type="file" id="l_file" accept=".csv,.txt" style="display:none">
    </div>
    <div id="l_import_feedback" class="helptext" style="margin:6px 0;"></div>
    <div id="l_payment_rows"></div>
  `;
  container.appendChild(importCard);
  importCard.querySelector('#l_file_btn').onclick = ()=> importCard.querySelector('#l_file').click();
  wireFileUpload(importCard.querySelector('#l_file'), (txt)=>{ importCard.querySelector('#l_import_paste').value = txt; });

  loan.payments = loan.payments || [];
  function renderPayments(){
    const el = importCard.querySelector('#l_payment_rows');
    if(loan.payments.length===0){ el.innerHTML = `<div class="helptext" style="padding:6px 0;">No payments recorded yet.</div>`; return; }
    const table = document.createElement('table');
    table.className = 'day-table';
    table.innerHTML = `<tr><th>Date</th><th>Type</th><th>Amount</th><th></th></tr>`;
    loan.payments.sort((a,b)=>a.date.localeCompare(b.date)).forEach((p,idx)=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${p.date}</td><td>${p.type}</td><td>₹${(+p.amount||0).toLocaleString('en-IN')}</td><td><button class="btn small ghost" data-rmpay="${idx}">✕</button></td>`;
      table.appendChild(tr);
    });
    el.innerHTML = ''; el.appendChild(table);
    el.querySelectorAll('[data-rmpay]').forEach(btn=>{
      btn.onclick = (e)=>{ loan.payments.splice(+e.target.dataset.rmpay,1); saveData(); render(); };
    });
  }
  renderPayments();

  importCard.querySelector('#l_import_btn').onclick = ()=>{
    const raw = importCard.querySelector('#l_import_paste').value;
    const dateRe = /(\d{2}[-\/]\d{2}[-\/]\d{4}|\d{4}[-\/]\d{2}[-\/]\d{2})/;
    const amtRe = /([\d,]+\.\d{2}|\b[\d,]{4,}\b)/g;
    let added = 0;
    raw.split('\n').forEach(line=>{
      const kind = classifyLoanTxn(line);
      if(!kind) return;
      const dateMatch = line.match(dateRe);
      const amounts = [...line.matchAll(amtRe)].map(m=>parseFloat(m[1].replace(/,/g,''))).filter(n=>n>100);
      if(!dateMatch || amounts.length===0) return;
      const amount = kind==='emi' ? Math.min(...amounts) : Math.max(...amounts); // EMI is usually the smaller recurring figure; prepayment the larger lump sum
      loan.payments.push({date: dateMatch[1], type: kind, amount});
      added++;
    });
    saveData(); render();
    importCard.querySelector('#l_import_feedback').textContent = `Detected and added ${added} payment(s). Review the list below — this is pattern-based, not perfect; remove anything wrong.`;
  };
}

function render(){
  const content = document.getElementById('content');
  content.innerHTML = '';
  const header = document.createElement('div');
  header.className = 'panel-header';
  header.innerHTML = `
    <div class="eyebrow">Financial OS · the most bank-derivable piece of the Financial Events vision</div>
    <h2>Debt &amp; Loan Tracker</h2>
    <p class="desc">Set up each loan's terms once, then paste a bank statement to auto-detect EMI and prepayment history — same validated description-based classifier used elsewhere, not a guess.</p>
  `;
  content.appendChild(header);

  const addCard = document.createElement('div');
  addCard.className = 'card';
  addCard.innerHTML = `<button class="btn primary" id="add_loan_btn">+ Add a loan</button>`;
  content.appendChild(addCard);
  addCard.querySelector('#add_loan_btn').onclick = ()=>{
    const l = {id:newId(), lender:'', type:'Home Loan', principal:'', annualRate:'', emiAmount:'', payments:[]};
    data.loans.push(l); expandedId = l.id; saveData(); render();
  };

  if(data.loans.length===0){
    const empty = document.createElement('div');
    empty.className = 'card';
    empty.innerHTML = `<div class="helptext">No loans added yet.</div>`;
    content.appendChild(empty);
  } else {
    data.loans.forEach(l=>renderLoanCard(content, l));
  }

  const noteCard = document.createElement('div');
  noteCard.className = 'card';
  noteCard.style.borderColor = 'var(--gold-dim)';
  noteCard.innerHTML = `<p class="helptext">Payoff projection is a standard amortization estimate from outstanding balance and current EMI — it doesn't re-amortize after each prepayment, so treat it as directionally right, not exact. For Section 24(b) interest deduction figures, use the actual bank-issued interest certificate, not this estimate.</p>`;
  content.appendChild(noteCard);
}

const THEME_KEY = 'itrgenie_theme';
function applyTheme(theme){
  document.body.dataset.theme = theme;
  document.getElementById('themeToggleBtn').textContent = theme==='light' ? '● Dark mode' : '☀ Light mode';
  localStorage.setItem(THEME_KEY, theme);
}
document.getElementById('themeToggleBtn').onclick = ()=>{
  const current = document.body.dataset.theme === 'light' ? 'light' : 'dark';
  applyTheme(current==='light' ? 'dark' : 'light');
};
applyTheme(localStorage.getItem(THEME_KEY) || 'dark');

document.getElementById('exportBtn').onclick = ()=>{
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `loans-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
};
document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();
document.getElementById('importFile').onchange = (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{ data = JSON.parse(ev.target.result); saveData(); render(); }
    catch(err){ alert('Could not read that file — not valid JSON.'); }
  };
  reader.readAsText(file);
};

render();
</script>
</body>
</html>
